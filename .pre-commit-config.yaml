# .pre-commit-config.yaml
minimum_pre_commit_version: "3.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=10240"]
        exclude: ^src/dnadesign/opal/campaigns/demo/records\.parquet$
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=auto"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock (check)
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (locked)
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format (locked)
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-files"
          - >-
            (?x)^(
              \\.secrets\\.baseline$|
              \\.venv/|
              \\.pixi/|
              \\.cruncher/|
              \\.tmp/|
              dist/|
              build/|
              src/dnadesign/archived/|
              src/dnadesign/prototypes/|
              src/dnadesign/usr/datasets/|
              src/dnadesign/opal/campaigns/.*/outputs/|
              src/dnadesign/cruncher/workspaces/.*/\\.cruncher/|
              src/dnadesign/cruncher/workspaces/.*/runs/|
              src/dnadesign/cruncher/workspaces/.*/results/|
              src/dnadesign/cruncher/workspaces/.*/outputs/|
              src/dnadesign/densegen/workspaces/.*/inputs/motif_artifacts/
            )
        exclude: >-
          (?x)^(
            \\.secrets\\.baseline$|
            \\.venv/|
            \\.pixi/|
            \\.cruncher/|
            \\.tmp/|
            dist/|
            build/|
            src/dnadesign/archived/|
            src/dnadesign/prototypes/|
            src/dnadesign/usr/datasets/|
            src/dnadesign/opal/campaigns/.*/outputs/|
            src/dnadesign/cruncher/workspaces/.*/\\.cruncher/|
            src/dnadesign/cruncher/workspaces/.*/runs/|
            src/dnadesign/cruncher/workspaces/.*/results/|
            src/dnadesign/cruncher/workspaces/.*/outputs/
          )
