schema_id: chimerax_control_session_v1
required_fields:
  - schema_version
  - control_session_id
  - pause_point
  - started_at_utc
  - chimerax_executable
  - chimerax_pid
  - source_structure_path
  - source_structure_sha256
  - opened_model_id
  - command_log_path
  - control
  - port
control_required_fields:
  - host
  - port
  - rest_stopped
  - gui_left_open
allowed_pause_points:
  - session-ready
  - user-steering
  - agent-action
  - capture-ready
  - stop-or-continue
notes:
  - The control-session manifest is the shared handle for a live ChimeraX session.
  - It records start-time state, not mutable current liveness.
  - Use chimerax-session-status.sh for current process and REST status.
  - Use chimerax-session-stop.sh to stop REST control after collaboration.
