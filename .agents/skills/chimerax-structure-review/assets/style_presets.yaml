schema_version: chimerax_style_presets_v3
presets:
  white_cartoon_reference:
    description: Clean single-model cartoon view on a white background.
    command_keys:
      - set_background
      - camera_mode
      - lighting
      - silhouettes
      - color_selection
      - cartoon_style
  faint_surface_shield:
    description: Slightly translucent molecular surface around a declared selection.
    command_keys:
      - surface_selection
      - surface_transparency
      - color_selection
    defaults:
      transparency_percent: 35
      target: s
  evidence_surface_with_cartoon:
    description: Translucent evidence surface with the protein cartoon and selected side chains visible.
    command_keys:
      - surface_selection
      - color_selection
      - surface_transparency
      - show_selection
    defaults:
      transparency_percent: 55
      atom_class: sidechain
      apply_transparency_after_color: true
      target: s
  opaque_coulombic_surface:
    description: Opaque Coulombic surface with one declared potential scale and units.
    command_keys:
      - surface_selection
      - coulombic_surface
      - surface_transparency
    defaults:
      transparency_percent: 0
      require_scale_title: true
      require_scale_units: true
      target: s
  chain_role_colors:
    description: Distinct colors for explicitly declared chains or roles.
    command_keys:
      - color_selection
      - show_selection
  transparent_comparison_model:
    description: Transparent overlay for a query model compared with a reference model.
    command_keys:
      - cartoon_transparency
      - color_selection
    defaults:
      transparency_percent: 45
      target: r
  role_aware_protein_nucleic_complex:
    description: Protein surface at 65 percent alpha with chain-colored DNA and RNA ladders on native cartoons.
    command_keys:
      - rename_model
      - name_role
      - nucleotide_ladder
      - cartoon_backbone_suppression
      - cartoon_style
      - cartoon_tether
      - surface_selection
      - surface_transparency
      - color_selection
      - fit_view
    defaults:
      protein_surface_transparency_percent: 35
      nucleic_cross_section: oval
      nucleic_width: 1.35
      nucleic_thickness: 0.28
      view_padding: 0.02
      protein_color: "#E8E4DA"
      dna_color: "#B97700"
      rna_color: "#C84C5A"
