[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.48.0", "pyyaml>=6"]
build-backend = "setuptools.build_meta"

[project]
name            = "dnadesign-tools"
version         = "0.3.0rc1"
description     = "DNA sequence design pipelines and bioinformatics helpers."
authors         = [{ name = "Eric South" }]
dynamic         = ["readme"]
requires-python = ">=3.12,<3.13"

dependencies = ["numpy"]

[project.scripts]
seqledger = "dnadesign._entrypoints:seqledger"
seqledger-sync-audit-drill = "dnadesign._entrypoints:seqledger_sync_audit_drill"
opal       = "dnadesign._entrypoints:opal"
dense      = "dnadesign._entrypoints:dense"
notify     = "dnadesign._entrypoints:notify"
infer      = "dnadesign._entrypoints:infer"
construct  = "dnadesign._entrypoints:construct"
folding    = "dnadesign._entrypoints:folding"
cluster    = "dnadesign._entrypoints:cluster"
latentdna  = "dnadesign._entrypoints:latentdna"
permuter   = "dnadesign._entrypoints:permuter"
baserender = "dnadesign._entrypoints:baserender"
cruncher   = "dnadesign._entrypoints:cruncher"
junction = "dnadesign._entrypoints:junction"
ops        = "dnadesign._entrypoints:ops"
dnadesign-storage = "dnadesign.contracts.storage_objects.cli:main"

[project.optional-dependencies]
seqledger = [
  "biopython>=1.87", "duckdb>=1.5.5,<2", "pandas", "pyarrow>=23.0.1",
  "pydantic>=2.12.5,<3", "pyyaml", "rich", "typer", "psutil>=7.2.1",
]
infer = ["dnadesign-tools[seqledger]", "tqdm"]
ops = ["pydantic>=2.12.5,<3", "pyyaml", "typer", "pyarrow>=23.0.1", "click>=8.3.3"]
notify = ["typer", "click>=8.3.3", "keyring>=25.6.0", "certifi>=2026.10.19"]
folding = ["pydantic>=2.12.5,<3", "pyyaml", "typer", "psutil>=7.2.1", "viennarna>=2.7.2"]
construct = ["dnadesign-tools[seqledger,folding]", "vl-convert-python>=1.9.0"]
baserender = ["pydantic>=2.12.5,<3", "pyyaml", "typer", "pyarrow>=23.0.1", "matplotlib", "pillow>=13.0.0", "psutil>=7.2.1"]
junction = ["pydantic>=2.12.5,<3", "pyyaml", "typer", "matplotlib", "psutil>=7.2.1"]
cluster = [
  "dnadesign-tools[seqledger]", "scanpy==1.10.3", "igraph", "leidenalg",
  "scikit-learn>=1.8,<2", "scipy>=1.17.0", "seaborn", "matplotlib",
  "umap-learn>=0.5.11", "python-levenshtein", "click>=8.3.3",
]
latentdna = [
  "dnadesign-tools[seqledger]", "anndata", "igraph", "leidenalg", "pynndescent",
  "scipy>=1.17.0", "scikit-learn>=1.8,<2", "matplotlib", "umap-learn>=0.5.11",
]
latentdna-notebook = ["dnadesign-tools[latentdna]", "marimo>=0.23.16"]
cruncher = [
  "dnadesign-tools[baserender]", "biopython>=1.87", "python-levenshtein",
  "arviz>=0.23.0", "certifi>=2026.10.19", "click>=8.3.3", "logomaker",
  "numba", "pandas", "pysam>=0.23.3", "rich", "tqdm",
]
cruncher-notebook = ["dnadesign-tools[cruncher]", "marimo>=0.23.16"]
permuter = [
  "pandas", "pyarrow>=23.0.1", "pydantic>=2.12.5,<3", "pyyaml", "rich", "typer",
  "matplotlib", "seaborn", "psutil>=7.2.1",
]
opal = [
  "pandas",
  "pyarrow>=23.0.1",
  "polars>=1.36.1",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17.0",
  "joblib",
  "pydantic>=2.12.5,<3",
  "pyyaml",
  "rich",
  "typer",
  "typing-extensions",
  "matplotlib",
  "openpyxl",
]
opal-notebook = [
  "dnadesign-tools[opal]",
  "marimo>=0.23.16",
  "altair>=6.0.0",
  "plotly>=6.9.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0",
  "pillow>=13.0.0",
]

# Complete runtime composes the tool profiles and adds shared optional backends.
full = [
  "dnadesign-tools[seqledger,infer,permuter,opal-notebook,ops,notify,folding,construct,baserender,junction,cluster,latentdna-notebook,cruncher-notebook]",
  "anyio>=4.14.2",
  "markdown-it-py>=4.0.0,<5",
  "ortools>=9.9,<9.10",
  "pygments>=2.20.0",
  "xlrd",
  "torch>=2.13,<2.14; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "dense-arrays==0.2.0",
  "netcdf4>=1.7.3",
  "fastparquet>=2025.12.0",
  "filelock>=4.2.4,<5",
  "zstd>=1.5.7.2,!=1.5.7.3",
  "py3dmol==2.5.5",
]

# GPU stack (Linux x86_64 only)
infer-evo2 = [
  "dnadesign-tools[infer]",
  # --- torch (GPU wheels via uv sources below)
  "torch>=2.13,<2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- build helpers (required because we disable build isolation for flash-attn + TE-torch)
  "pip>=26.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "setuptools>=84.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "wheel>=0.48.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "packaging; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "ninja; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cmake>=3.18; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- kernels
  # flash-attn commonly requires building against the torch in the env; install it w/o build isolation.
  "flash-attn>=2.8.0.post2,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Transformer Engine: let it float within major=2.
  # (TE is a prereq for Evo2; Evo2 requires TE>=2.0.0)
  "transformer-engine[pytorch]>=2.0,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "evo2>=0.5.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx>=1.22.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
# A checkout keeps the existing full tool environment; installed libraries opt in.
tools = ["dnadesign-tools[full]"]
test = ["pytest>=9.0.3", "pytest-cov", "hypothesis>=6.100", "filelock>=4.2.4,<5"]
lint = ["ruff>=0.4", "pre-commit>=3.7"]
dev = [
  { include-group = "test" }, { include-group = "lint" },
  "html5lib>=1.1,<2", "markdown-it-py>=4.0.0,<5", "upa-url>=1.1.0,<2",
]
ci-docs = [
  { include-group = "dev" },
  "pyyaml", "pydantic>=2.12.5,<3",
]

[tool.setuptools]
# Runtime resources are explicit so Git checkouts and exported source build alike.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "dnadesign.usr",
  "dnadesign.usr.*",
  "dnadesign.devtools",
  "dnadesign.devtools.*",
  "dnadesign.*.devtools",
  "dnadesign.*.devtools.*",
  "dnadesign.*.tests",
  "dnadesign.*.tests.*",
  "dnadesign.*.prototypes",
  "dnadesign.*.prototypes.*",
  "dnadesign.*.archived",
  "dnadesign.*.archived.*",
  "dnadesign.archived",
