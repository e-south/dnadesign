[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name            = "dnadesign-tools"
version         = "0.2.0"
description     = "DNA sequence design pipelines and bioinformatics helpers."
authors         = [{ name = "Eric South" }]
dynamic         = ["readme"]
requires-python = ">=3.12,<3.13"

dependencies = ["numpy"]

[project.scripts]
usr        = "dnadesign.devtools.package.entrypoints:usr"
usr-sync-audit-drill = "dnadesign.devtools.package.entrypoints:usr_sync_audit_drill"
opal       = "dnadesign.devtools.package.entrypoints:opal"
dense      = "dnadesign.devtools.package.entrypoints:dense"
notify     = "dnadesign.devtools.package.entrypoints:notify"
infer      = "dnadesign.devtools.package.entrypoints:infer"
construct  = "dnadesign.devtools.package.entrypoints:construct"
folding    = "dnadesign.devtools.package.entrypoints:folding"
cluster    = "dnadesign.devtools.package.entrypoints:cluster"
latentdna  = "dnadesign.devtools.package.entrypoints:latentdna"
permuter   = "dnadesign.devtools.package.entrypoints:permuter"
baserender = "dnadesign.devtools.package.entrypoints:baserender"
cruncher   = "dnadesign.devtools.package.entrypoints:cruncher"
junction = "dnadesign.devtools.package.entrypoints:junction"
ops        = "dnadesign.devtools.package.entrypoints:ops"
dnadesign-storage = "dnadesign.contracts.storage_objects.cli:main"

[project.optional-dependencies]
usr = [
  "biopython>=1.87", "duckdb>=1.5.5,<2", "pandas", "pyarrow>=23.0.1",
  "pydantic", "pyyaml", "rich", "typer", "psutil>=7.2.1",
]
infer = ["dnadesign-tools[usr]", "tqdm"]
permuter = [
  "pandas", "pyarrow>=23.0.1", "pydantic", "pyyaml", "rich", "typer",
  "matplotlib", "seaborn", "psutil>=7.2.1",
]
opal = [
  "pandas",
  "pyarrow>=23.0.1",
  "polars>=1.36.1",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17.0",
  "joblib",
  "pydantic",
  "pyyaml",
  "rich",
  "typer",
  "typing-extensions",
  "matplotlib",
  "openpyxl",
]
opal-notebook = [
  "dnadesign-tools[opal]",
  "marimo>=0.23.16",
  "altair>=6.0.0",
  "plotly>=6.9.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0",
  "pillow>=13.0.0",
]

# Preserve the complete tool runtime separately from the NumPy-only scoring API.
full = [
  "anyio>=4.14.2",
  "arviz>=0.23.0",
  "biopython>=1.87",
  "click>=8.3.3",
  "html5lib>=1.1,<2",
  "igraph",
  "leidenalg",
  "logomaker",
  "markdown-it-py>=4.0.0,<5",
  "matplotlib",
  "openpyxl",
  "ortools>=9.9,<9.10",
  "pandas",
  "pillow>=13.0.0",
  "pyarrow>=23.0.1",
  "pydantic",
  "pygments>=2.20.0",
  "python-levenshtein",
  "pyyaml",
  "rich",
  "scanpy==1.10.3",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17.0",
  "seaborn",
  "tqdm",
  "typer",
  "umap-learn>=0.5.11",
  "upa-url>=1.1.0,<2",
  "duckdb>=1.5.5,<2",
  "xlrd",
  # Keep the full and optional Evo2 environments on one supported Torch family.
  "torch>=2.13,<2.14; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  # Qualified registry release; historical study runtimes keep their separate pins.
  "dense-arrays==0.2.0",
  "polars>=1.36.1",
  "altair>=6.0.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0",
  "pysam>=0.23.3",
  "netcdf4>=1.7.3",
  "certifi>=2026.10.19",
  "keyring>=25.6.0",
  "fastparquet>=2025.12.0",
  # Torch also depends on filelock; publish its security floor for non-uv installs.
  "filelock>=4.2.4,<5",
  "marimo>=0.23.16",
  "viennarna>=2.7.2",
  # 1.5.7.3 is yanked for a thread-safety regression.
  "zstd>=1.5.7.2,!=1.5.7.3",
  "py3dmol==2.5.5",
  "plotly>=6.9.0",
  "psutil>=7.2.1",
]

# GPU stack (Linux x86_64 only)
infer-evo2 = [
  "dnadesign-tools[infer]",
  # --- torch (GPU wheels via uv sources below)
  "torch>=2.13,<2.14; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- build helpers (required because we disable build isolation for flash-attn + TE-torch)
  "pip>=26.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "setuptools>=84.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "wheel>=0.48.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "packaging; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "ninja; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cmake>=3.18; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- kernels
  # flash-attn commonly requires building against the torch in the env; install it w/o build isolation.
  "flash-attn>=2.8.0.post2,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Transformer Engine: let it float within major=2.
  # (TE is a prereq for Evo2; Evo2 requires TE>=2.0.0)
  "transformer-engine[pytorch]>=2.0,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "evo2>=0.5.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx>=1.22.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
# A checkout keeps the existing full tool environment; installed libraries opt in.
tools = ["dnadesign-tools[full]"]
test = ["pytest>=9.0.3", "pytest-cov", "hypothesis>=6.100", "filelock>=4.2.4,<5"]
lint = ["ruff>=0.4", "pre-commit>=3.7"]
dev  = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools]
# Runtime resources are explicit so Git checkouts and exported source build alike.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "dnadesign.*.tests",
  "dnadesign.*.tests.*",
  "dnadesign.*.prototypes",
  "dnadesign.*.prototypes.*",
  "dnadesign.*.archived",
  "dnadesign.*.archived.*",
  "dnadesign.archived",
  "dnadesign.archived.*",
  "dnadesign.prototypes",
  "dnadesign.prototypes.*",
  "dnadesign.studies",
  "dnadesign.studies.*",
  "dnadesign.usr.archived",
  "dnadesign.usr.archived.*",
  "dnadesign.usr.datasets.usr_regulondb_native_promoters",
  "dnadesign.usr.datasets.usr_regulondb_native_promoters.*",
  "dnadesign.opal.campaigns.*.notebooks",
  "dnadesign.opal.campaigns.*.notebooks.*",
  "dnadesign.densegen.workspaces.*.outputs.notebooks",
  "dnadesign.densegen.workspaces.*.outputs.notebooks.*",
  "dnadesign.latentdna.workspaces.*.outputs.notebooks",
  "dnadesign.latentdna.workspaces.*.outputs.notebooks.*",
]

[tool.setuptools.package-data]
"dnadesign.baserender" = [
  "assets/overlays/*.json",
  "assets/overlays/*.png",
  "assets/overlays/*.svg",
  "styles/*/*.yaml",
  "workspaces/*/.baserender-workspace",
  "workspaces/*/job.yaml",
  "workspaces/*/inputs/*.parquet",
]
"dnadesign.cruncher" = [
  "resources/cassette/catalogs/*.yaml",
  "src/ingest/certs/*.pem",
  "workspaces/*/configs/*.yaml",
  "workspaces/*/configs/*/*.yaml",
  "workspaces/*/inputs/local_motifs/*",
]
"dnadesign.cluster" = [
  "ops/status.registry.yaml",
  "presets/*/*.yaml",
  "workspaces/*/config.yaml",
]
"dnadesign.construct" = [
  "src/seeds/*.yaml",
  "workspaces/*.md",
  "workspaces/*/*",
  "workspaces/*/inputs/*",
]
"dnadesign.densegen" = [
  "workspaces/_shared/*.sh",
  "workspaces/*/*.md",
  "workspaces/*/*.sh",
  "workspaces/*/*.yaml",
  "workspaces/*/inputs/*",
]
"dnadesign.infer" = [
  "docs/operations/examples/*.yaml",
  "src/presets/*/*.yaml",
  "workspaces/*.md",
  "workspaces/*/*.md",
  "workspaces/*/*.yaml",
  "workspaces/*/inputs/*",
]
"dnadesign.junction" = [
  "docs/assets/*.svg",
  "economics/data/*.yaml",
  "examples/*/*.yaml",
  "examples/*/jobs/*.yaml",
]
"dnadesign.latentdna" = [
  "ops/status.registry.yaml",
  "workspaces/templates/*/*.yaml",
  "workspaces/templates/*/*.md",
]
"dnadesign.opal" = [
  "campaigns/*/configs/*.yaml",
  "campaigns/_fixtures/scalar-regression/records.parquet",
  "campaigns/_fixtures/scalar-regression/labels.csv",
  "src/ops/status.registry.yaml",
]
"dnadesign.permuter" = [
  "src/resources/codon_tables/*.csv",
  "workspaces/_shared/inputs/*.csv",
  "workspaces/*/config.yaml",
]
"dnadesign.ops" = [
  "providers/*/status.registry.yaml",
  "runbooks/init_presets.yaml",
  "runbooks/templates/*.qsub",
]
"dnadesign.usr" = [
  "assets/demo_material/*.csv",
  "remotes.example.yaml",
  "datasets/registry.yaml",
  "ops/status.registry.yaml",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "reader_spop_*.parquet",
  "remotes.yaml",
]
"dnadesign.densegen" = [
  "workspaces/*/config.probe.*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["src/dnadesign"]
pythonpath = ["src"]
# Do not collect tests from generated artifacts or the ignored local safety
# copy retained during external study migration. Architecture checks still
# reject any tracked src/dnadesign/studies package.
norecursedirs = [
  "*/archived/*",
  ".venv",
  "venv",
  "build",
  "dist",
  "*.egg-info",
  ".hypothesis",
  ".pytest_cache",
  "outputs",
  "batch_results",
  "runs",
  "studies",
]
markers = [
  "slow: sampling-heavy tests (>10 s)",
  "fimo: tests requiring MEME/FIMO external tooling",
  "integration: cross-component integration tests",
]
filterwarnings = [
  "ignore:ArviZ is undergoing a major refactor.*:FutureWarning",
  "ignore::FutureWarning:arviz.*",
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dnadesign"]

[tool.uv]
required-version = ">=0.12.3,<0.13"
default-groups = ["tools"]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
  "filelock>=4.2.4",
  "setuptools>=84.1.0",
  "virtualenv>=21.14.9",
  "cryptography>=50.0.0",
  "click>=8.3.3",
  "idna>=3.15",
  "onnx>=1.22.0",
  "pillow>=13.0.0",
  "pymdown-extensions>=11.0.1",
  "starlette>=1.3.1",
]

# flash-attn + TE-torch must build against the same torch as the runtime env
# uv supports this directly and will do a two-phase install so deps (torch, pip, etc.) land first
no-build-isolation-package = ["flash-attn", "transformer-engine-torch"]

# Help uv resolve flash-attn without trying to build it during the resolution step.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# When infer-evo2 is enabled, use CUDA 13.0 wheels for the Torch family.
torch = [
  { index = "pytorch-cu130", extra = "infer-evo2", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
