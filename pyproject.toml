[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name            = "dnadesign"
version         = "0.1.0"
description     = "DNA sequence design pipelines and bioinformatics helpers."
authors         = [{ name = "Eric South" }]
readme          = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "arviz>=0.23.0",
  "biopython>=1.87",
  "click>=8.3.3",
  "igraph",
  "leidenalg",
  "logomaker",
  "markdown-it-py>=4.0.0",
  "matplotlib",
  "numpy",
  "openpyxl",
  "ortools>=9.9,<9.10",
  "pandas",
  "pillow>=12.3.0",
  "pyarrow>=23.0.1",
  "pydantic",
  "pygments>=2.20.0",
  "pymc",
  "python-levenshtein",
  "pyyaml",
  "rich",
  "scanpy==1.10.3",
  "scipy>=1.17.0",
  "seaborn",
  "tqdm",
  "typer",
  "umap-learn>=0.5.11",
  "duckdb>=0.10.0",
  "xlrd",
  # Compatibility-pinned for the Evo2/CUDA stack; the bounded security exception is documented in SECURITY.md.
  "torch>=2.10,<2.11; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "dense-arrays",
  "polars>=1.36.1",
  "altair>=6.0.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0",
  "pysam>=0.23.3",
  "netcdf4>=1.7.3",
  "certifi>=2025.11.12",
  "keyring>=25.6.0",
  "fastparquet>=2025.12.0",
  "marimo>=0.23.16",
  "openai>=2.14.0",
  "viennarna>=2.7.2",
  # 1.5.7.3 is yanked for a thread-safety regression.
  "zstd>=1.5.7.2,!=1.5.7.3",
  "py3dmol==2.5.5",
  "plotly>=6.9.0",
  "psutil>=7.2.1",
]

[project.scripts]
usr        = "dnadesign.usr:main"
usr-sync-audit-drill = "dnadesign.usr.ops.sync_audit_drill:main"
opal       = "dnadesign.opal:main"
dense      = "dnadesign.densegen:app"
notify     = "dnadesign.notify.cli:app"
infer      = "dnadesign.infer.cli:app"
construct  = "dnadesign.construct:main"
folding    = "dnadesign.folding.cli:main"
cluster    = "dnadesign.cluster.cli:main"
latentdna  = "dnadesign.latentdna.src:main"
permuter   = "dnadesign.permuter:main"
baserender = "dnadesign.baserender:app"
cruncher   = "dnadesign.cruncher.cli.app:app"
junction = "dnadesign.junction.cli:main"
ops        = "dnadesign.ops.cli:main"
rt-lnrna-reporter-metastudy = "dnadesign.studies.units.rt_lnrna_sponging_construct_triage.reporter_response.metastudy.operator:main"

[project.entry-points."dnadesign.opal.reader_evidence_artifacts"]
stress-promoter-response = "dnadesign.studies.units.stress_ethanol_cipro_growth.decision.opal.reader_promoter_evidence.notebook_adapter:register_notebook_adapter"

[project.optional-dependencies]
# GPU stack (Linux x86_64 only)
infer-evo2 = [
  # --- torch (GPU wheels via uv sources below)
  "torch>=2.10,<2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision>=0.25,<0.26; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio>=2.10,<2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- build helpers (required because we disable build isolation for flash-attn + TE-torch)
  "pip>=26.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "setuptools>=83.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "wheel>=0.46.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "packaging; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "ninja; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cmake>=3.18; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # --- kernels
  # flash-attn commonly requires building against the torch in the env; install it w/o build isolation.
  "flash-attn>=2.8.0.post2,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Transformer Engine: let it float within major=2.
  # (TE is a prereq for Evo2; Evo2 requires TE>=2.0.0)
  "transformer-engine[pytorch]>=2.0,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "evo2>=0.5.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx>=1.22.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
test = ["pytest>=9.0.3", "pytest-cov", "hypothesis>=6.100"]
lint = ["ruff>=0.4", "pre-commit>=3.7"]
dev  = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dnadesign.cruncher" = [
  "resources/cassette/catalogs/*.yaml",
]
"dnadesign.cluster" = [
  "ops/status.registry.yaml",
  "presets/*/*.yaml",
  "workspaces/*/config.yaml",
]
"dnadesign.construct" = [
  "src/seeds/*.yaml",
  "workspaces/*.md",
  "workspaces/*/*",
  "workspaces/*/inputs/*",
]
"dnadesign.cruncher.ingest.certs" = ["*.pem"]
"dnadesign.densegen" = [
  "workspaces/_shared/*.sh",
  "workspaces/*/*.md",
  "workspaces/*/*.sh",
  "workspaces/*/*.yaml",
  "workspaces/*/inputs/*",
]
"dnadesign.infer" = [
  "docs/operations/examples/*.yaml",
  "src/presets/*/*.yaml",
  "workspaces/*.md",
  "workspaces/*/*.md",
  "workspaces/*/*.yaml",
  "workspaces/*/inputs/*",
]
"dnadesign.latentdna" = [
  "ops/status.registry.yaml",
  "workspaces/templates/*/*.yaml",
  "workspaces/templates/*/*.md",
]
"dnadesign.opal" = [
  "src/ops/status.registry.yaml",
]
"dnadesign.permuter" = [
  "src/resources/codon_tables/*.csv",
  "workspaces/_shared/inputs/*.csv",
  "workspaces/*/config.yaml",
]
"dnadesign.ops" = [
  "providers/*/status.registry.yaml",
  "runbooks/init_presets.yaml",
  "runbooks/presets/*.yaml",
  "runbooks/templates/*.qsub",
]
"dnadesign.studies" = [
  "units/eco1_rt_repack/operations/materialization/review_deliverables/notebook_template.py.txt",
  "units/retron_hairpin_design/status/ops/status.registry.yaml",
  "units/stress_ethanol_cipro_growth/operations/status/ops/status.registry.yaml",
  "units/stress_ethanol_cipro_growth/decision/opal/batch0/sampling.yaml",
  "units/stress_ethanol_cipro_growth/decision/opal/multistate_response_behavior/*.yaml",
  "units/stress_ethanol_cipro_growth/decision/opal/multistate_response_behavior/*.json",
  "units/stress_ethanol_cipro_growth/response_window_observations/config/*.yaml",
  "units/stress_ethanol_cipro_growth/response_window_observations/config/evidence/*.json",
  "units/stress_ethanol_cipro_growth/decision/opal/response_metastudy/config/*.yaml",
  "units/stress_ethanol_cipro_growth/decision/opal/response_metastudy/config/*.json",
  "units/stress_ethanol_cipro_growth/decision/opal/response_metastudy/config/evidence/*.json",
  "units/stress_ethanol_cipro_growth/decision/opal/sfxi_reference_overlay/reader_records.json",
  "units/stress_ethanol_cipro_growth/decision/opal/synthesis_handoff/configs/*.yaml",
]
"dnadesign.usr" = [
  "ops/status.registry.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["src/dnadesign"]
pythonpath = ["src"]
# Do not collect tests from generated workspace/runtime artifacts.
norecursedirs = [
  "*/archived/*",
  ".venv",
  "venv",
  "build",
  "dist",
  "*.egg-info",
  ".hypothesis",
  ".pytest_cache",
  "outputs",
  "batch_results",
  "runs",
]
markers = [
  "slow: sampling-heavy tests (>10 s)",
  "fimo: tests requiring MEME/FIMO external tooling",
  "integration: cross-component integration tests",
]
filterwarnings = [
  "ignore:ArviZ is undergoing a major refactor.*:FutureWarning",
  "ignore::FutureWarning:arviz.*",
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dnadesign"]

[tool.uv]
required-version = ">=0.9.18,<0.10"
default-groups = []
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
  "cryptography>=48.0.1",
  "click>=8.3.3",
  "idna>=3.15",
  "onnx>=1.22.0",
  "pillow>=12.3.0",
  "pymdown-extensions>=11.0.1",
  "starlette>=1.3.1",
]

# flash-attn + TE-torch must build against the same torch as the runtime env
# uv supports this directly and will do a two-phase install so deps (torch, pip, etc.) land first
no-build-isolation-package = ["flash-attn", "transformer-engine-torch"]

# Help uv resolve flash-attn without trying to build it during the resolution step.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
dense-arrays = { git = "https://github.com/e-south/dense-arrays" }

# When infer-evo2 is enabled, use CUDA 12.8 wheels for torch-family from PyTorch's CUDA index.
torch = [
  { index = "pytorch-cu128", extra = "infer-evo2", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cu128", extra = "infer-evo2", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
  { index = "pytorch-cu128", extra = "infer-evo2", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
