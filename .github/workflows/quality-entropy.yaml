name: Quality entropy

on:
  workflow_dispatch:
  schedule:
    - cron: "15 07 * * 1"

concurrency:
  group: quality-entropy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Quality entropy report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Build quality entropy report
        id: entropy
        continue-on-error: true
        run: |
          PYTHONPATH=src python3 -S -m dnadesign.devtools.quality.entropy \
            --repo-root . \
            --review-age-advisory-days 180 \
            --report-file quality-entropy-report.md

      - name: Upload quality entropy artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-entropy-report
          path: quality-entropy-report.md

      - name: Enforce quality entropy checks
        if: steps.entropy.outcome == 'failure'
        run: exit 1
