plot_defaults:
  output:
    format: png
    dpi: 300
    save_data: true

plot_presets:
  rmf_candidate_frontier:
    kind: response_magnitude_feasibility_frontier
    round_selector: latest
    tags: [decision, rmf]
    params:
      title: "RMF candidate constraint landscape"
      response_label: 'Response separation, $d_R$ · $\log_2(\mathrm{YFP}/\mathrm{CFP})$'
      magnitude_label: 'ON fluorescence floor, $f_{\mathrm{ON}}$'
      off_constraint_label: 'OFF fluorescence clearance, $q_{\mathrm{OFF}}$'
      caption: "Each point is one campaign candidate. Rightward response separation, upward ON fluorescence, and red OFF-state clearance are favorable; dashed lines mark the configured boundaries. The ON fluorescence floor is the minimum same-state pDual-10-relative log2(YFP/OD600) value across target-ON states. Diamonds are allocated candidates; outlined symbols are observed batches."
      state_labels:
        "00": "No stress"
        "10": "EtOH"
        "01": "Cipro"
        "11": "EtOH + Cipro"
      surface_label: "RMF candidate frontier"

plots:
  - name: rmf_candidate_frontier
    preset: rmf_candidate_frontier

  - name: rmf_score_vs_rank
    kind: scatter_score_vs_rank
    round_selector: latest
    tags: [diagnostic, rmf, selection]
    params:
      title: "RMF score by active-view rank"
      score_field: view__selection_score
      score_label: 'Predicted feasibility margin, $S_{\mathrm{RMF}}$'
      rank_mode: competition
      rank_scale: log
      rank_label: 'Active-view competition rank, $k$ (rank 1 at right; log scale)'
      show_selection_view: true
      title_location: center
      legend_location: below
      rasterize_at: 10000
      caption: "Predicted RMF score versus active-view competition rank. Open diamonds mark candidates allocated to this view; zero is the configured feasibility boundary. Rank 1 is at the right on a reversed logarithmic axis."
      y_axis:
        reference_lines:
          - value: 0.0
            label: "Feasibility boundary"

  - name: rmf_selected_constraints
    kind: response_magnitude_feasibility_constraint_decomposition
    round_selector: latest
    tags: [decision, rmf, selection]
    params:
      title: "Allocated RMF requirement margins"
      candidate_label_mode: alias
      caption: "Each row is a model prediction for a candidate allocated to this selection view. Columns show the three standardized requirement margins and their maximin RMF score; zero is the configured feasibility boundary. Ranks are active-view competition ranks, so skipped ranks were allocated to another view."
      state_labels:
        "00": "No stress"
        "10": "EtOH"
        "01": "Cipro"
        "11": "EtOH + Cipro"
