schema_version: opal.campaign.v3

campaign:
  name: "SECG RMF greedy active learning"
  slug: "secg_rmf_greedy"
  description: "Shared response-window prediction with ethanol, ciprofloxacin, and AND RMF selection views."
  workdir: "."
  metadata:
    study_id: stress_ethanol_cipro_growth
    response_reduction: event_logmean_6_12h_post

plot_config: "plots.yaml"

ownership:
  owner_scope: study_campaign
  study_id: stress_ethanol_cipro_growth
  dataset_id: usr_prom_eth_cip_opal_candidates
  portable: false

data:
  location:
    kind: usr
    path: "../../../usr/datasets"
    dataset: usr_prom_eth_cip_opal_candidates
  x_column_name: "latentdna__evo2_7b__context_anchor_mean_bidir_concat"
  y_column_name: "opal__secg_rmf_greedy__response_window_y"
  y_expected_length: 8

candidate_eligibility:
  rules:
    - name: restriction_site_exclusion
      params:
        sequence_column: sequence
        scan_space: final_assembled_insert
        assembly_strategy_ref: stress_promoter_insert:v1
        left_flank: accgggatcctgcag
        right_flank: tgagggaattcgcga
        expected_core_length: 60
        min_remaining_candidates: 1000
        exclude_rows_where:
          - column: id
            equals: 2fe51277935496ce8f02932e2866143258c80d55  # pragma: allowlist secret
          - column: id
            equals: 97b4ac8535ae8c1f67c079b0644e87777d29e1d1  # pragma: allowlist secret
        forbidden_sites:
          - enzyme: BamHI
            motif: GGATCC
            allowed_regions: [left_flank]
          - enzyme: EcoRI
            motif: GAATTC
            allowed_regions: [right_flank]

labels:
  source:
    kind: usr_sidecar
    dataset: usr_prom_eth_cip_opal_candidates
    path: "_opal/response_window_observed_labels.parquet"
    manifest_path: "_opal/response_window_observed_labels.manifest.json"
  y_space: reader_response_window_vector_v1
  id_column: id
  round_column: observed_round
  batch_column: batch_id
  dedup_policy: latest_by_round

writeback:
  prediction_records: ledger_only

ingest:
  duplicate_policy: "error"

training:
  policy:
    cumulative_training: true
    label_cross_round_deduplication_policy: "latest_only"
    allow_resuggesting_candidates_until_labeled: true

transforms_x: { name: identity, params: {} }
transforms_y:
  name: vector_from_table_v1
  params:
    id_column: id
    value_columns: [r00, r10, r01, r11, b00, b10, b01, b11]

model:
  name: random_forest
  params:
    n_estimators: 100
    criterion: "friedman_mse"
    bootstrap: true
    oob_score: true
    random_state: 7
    n_jobs: -1
    emit_feature_importance: true

selection_views:
  - id: ethanol
    objective:
      name: response_magnitude_feasibility_v1
      params:
        state_ids: ["00", "10", "01", "11"]
        target_mask: [0, 1, 0, 1]
        calibration:
          response_separation_min: 0.0
          on_magnitude_min: 0.0
          off_magnitude_max: 0.0
          response_separation_scale: 0.509639
          on_magnitude_scale: 0.626835
          off_magnitude_scale: 0.420265
    selection:
      name: top_n
      params:
        top_k: 6
        score_ref: feasibility_margin
        tie_handling: competition_rank
        objective_mode: maximize
        require_exact_top_k: true

  - id: ciprofloxacin
    objective:
      name: response_magnitude_feasibility_v1
      params:
        state_ids: ["00", "10", "01", "11"]
        target_mask: [0, 0, 1, 1]
        calibration:
          response_separation_min: 0.0
          on_magnitude_min: 0.0
          off_magnitude_max: 0.0
          response_separation_scale: 0.390695
          on_magnitude_scale: 0.337692
          off_magnitude_scale: 0.504743
    selection:
      name: top_n
      params:
        top_k: 6
        score_ref: feasibility_margin
        tie_handling: competition_rank
        objective_mode: maximize
        require_exact_top_k: true

  - id: and
    objective:
      name: response_magnitude_feasibility_v1
      params:
        state_ids: ["00", "10", "01", "11"]
        target_mask: [0, 0, 0, 1]
        calibration:
          response_separation_min: 0.0
          on_magnitude_min: 0.0
          off_magnitude_max: 0.0
          response_separation_scale: 0.491307
          on_magnitude_scale: 0.371660
          off_magnitude_scale: 0.424453
    selection:
      name: top_n
      params:
        top_k: 6
        score_ref: feasibility_margin
        tie_handling: competition_rank
        objective_mode: maximize
        require_exact_top_k: true

selection_batch:
  deduplicate_by: sequence
  expected_unique_count: 18

scoring:
  score_batch_size: 1000

safety:
  fail_on_mixed_biotype_or_alphabet: true
  require_biotype_and_alphabet_on_init: true
  conflict_policy_on_duplicate_ids: "error"
  write_back_requires_columns_present: true
  accept_x_mismatch: false
