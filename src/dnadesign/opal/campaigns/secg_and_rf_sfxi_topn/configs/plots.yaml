plot_defaults:
  output:
    format: "png"
    dpi: 300
    save_data: true

plots:
  - name: score_selected_over_rounds
    kind: metric_over_rounds
    round_selector: all
    tags: [rounds, selection]
    params:
      metric: "pred__score_selected"
      cohort: selected
      summaries: [median, q25, q75, count]
      band: iqr
      highlight_round: latest
      title: "AND objective: RF top-N selected score over rounds"

  - name: score_vs_rank_over_rounds
    kind: scatter_score_vs_rank
    round_selector: all
    tags: [rounds, selection]
    params:
      rank_mode: competition
      alpha: 0.45
      multi_round_alpha: 0.24
      round_cmap: "round_progression"
      rasterize_at: 20000
      title: "AND objective: RF score vs selection rank by round"

  - name: score_threshold_over_rounds
    kind: percent_high_activity_over_rounds
    round_selector: all
    tags: [rounds, selection, threshold]
    params:
      metric: "pred__score_selected"
      threshold_quantile: 0.9
      mode: line
      title: "AND objective: RF score enrichment above fixed P90 over rounds"

  - name: feature_importance_heatmap
    kind: feature_importance_heatmap
    round_selector: all
    tags: [rounds, model]
    params:
      order_policy: sort_index
      cluster: false
      figsize_in: [14.0, 4.4]
      cmap: "opal_importance"
      colorbar_label: "rf_feature_importance"
      rasterized: true
      max_xticks: 16
      contrast_gamma: 0.55
      title: "AND objective: random forest feature importance over rounds"

  - name: feature_importance_bars
    kind: feature_importance_bars
    round_selector: all
    tags: [rounds, model]
    params:
      order_policy: sort_index
      alpha: 0.40
      figsize_in: [14.0, 4.4]
      bar_width: 1.05
      cmap: "round_progression"
      max_xticks: 16
      title: "AND objective: random forest feature importance by round"

  - name: selected_vec8_summary
    kind: vector_summary_heatmap
    round_selector: all
    tags: [rounds, sfxi, vector]
    params:
      vector_field: "pred__y_hat_model"
      cohort: selected
      include_reference_vector: true
      reference_vector: [0, 0, 0, 1, 0, 0, 0, 1]
      reference_label: "Target vec8"
      channel_labels: [v00, v10, v01, v11, y00_star, y10_star, y01_star, y11_star]
      reference_mse_panel: true
      cmap: "opal_seafoam"
      value_label: "Mean predicted response"
      title: "AND objective: selected response vector vs target"

  - name: fold_change_vs_logic_fidelity_latest
    kind: fold_change_vs_logic_fidelity
    round_selector: latest
    round_variants: each
    tags: [sfxi, selection, overlay, single-round]
    params:
      y_axis: score
      hue: effect_scaled
      size_by: logic_fidelity
      alpha: 0.35
      rasterize_at: 20000
      title: "AND objective: SFXI score vs logic fidelity by round"

  - name: effect_scaled_vs_logic_fidelity_latest
    kind: fold_change_vs_logic_fidelity
    round_selector: latest
    round_variants: each
    tags: [sfxi, selection, overlay, single-round, eda]
    params:
      y_axis: effect_scaled
      hue: score
      size_by: score
      alpha: 0.35
      rasterize_at: 20000
      title: "AND objective: SFXI effect scaled vs logic fidelity by round"

  - name: sfxi_observed_logic_closeness_over_rounds
    kind: sfxi_logic_fidelity_closeness
    round_selector: all
    tags: [sfxi, labels, overlay, rounds]
    params:
      on_violin_invalid: line
      violin_min_points: 3
      cmap: "opal_seafoam"

  - name: sfxi_factorial_effects_latest
    kind: sfxi_factorial_effects
    round_selector: latest
    round_variants: each
    tags: [sfxi, labels, overlay, single-round]
    params:
      size_by: obj__effect_scaled
      include_labels: true
      rasterize_at: 20000
      title: "AND objective: SFXI factorial effects by round"

  - name: sfxi_setpoint_sweep_latest
    kind: sfxi_setpoint_sweep
    round_selector: latest
    round_variants: each
    tags: [sfxi, labels, single-round]
    params:
      min_n: 5
      title: "AND objective: SFXI setpoint sweep by round"

  - name: sfxi_support_diagnostics_latest
    kind: sfxi_support_diagnostics
    round_selector: latest
    round_variants: each
    tags: [sfxi, labels, overlay, single-round]
    params:
      y_axis: score
      hue: effect_scaled
      batch_size: 2048
      title: "AND objective: SFXI support diagnostics by round"

  - name: sfxi_uncertainty_latest
    kind: sfxi_uncertainty
    round_selector: latest
    round_variants: each
    tags: [sfxi, model, single-round]
    params:
      kind: score
      y_axis: score
      hue: logic_fidelity
      sample_n: 1024
      seed: 0
      batch_size: 2048
      title: "AND objective: SFXI score uncertainty by round"

  - name: sfxi_intensity_scaling_latest
    kind: sfxi_intensity_scaling
    round_selector: latest
    round_variants: each
    tags: [sfxi, labels, single-round]
    params:
      min_n: 5
      include_pool: true
      title: "AND objective: SFXI intensity scaling by round"
