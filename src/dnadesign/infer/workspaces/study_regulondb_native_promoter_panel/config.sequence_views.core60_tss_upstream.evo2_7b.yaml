model:
  id: evo2_7b
  device: cuda:0
  precision: bf16
  alphabet: dna
  batch_size: 128

jobs:
  - id: regulondb_core60_tss_upstream_core60_mean_7b
    operation: extract
    ingest:
      source: records
      field: sequence
    feature_bundle:
      intermediate_block: 26
      collect_log_likelihood: true
      collect_output_layer_mean: true
      collect_intermediate_embedding: true
      sequence_view_inputs:
        - dataset: usr_regulondb_native_promoter_core60
          root: ../../../usr/datasets
          view_selector:
            product_kind: analysis_window
            orientation: forward
          pooling:
            operation: core60_mean
    io:
      write_back: false
      overwrite: false
