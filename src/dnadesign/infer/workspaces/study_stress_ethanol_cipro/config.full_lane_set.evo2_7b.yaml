model:
  id: evo2_7b
  device: cuda:0
  precision: bf16
  alphabet: dna
  batch_size: 16

jobs:
  - id: anchor_only_7b_features
    operation: extract
    ingest:
      source: usr
      dataset: promoter/stress_ethanol_cipro_anchor_set
      root: ../../../usr/datasets
      field: sequence
    feature_bundle:
      intermediate_block: 26
      context:
        kind: anchor_only
      pooling:
        seq_mean: true
        anchor_mean_for_templated: true
    io:
      write_back: true
      overwrite: false

  - id: template_1kb_7b_features
    operation: extract
    ingest:
      source: usr
      dataset: promoter/stress_ethanol_cipro_construct_contexts
      root: ../../../usr/datasets
      field: sequence
    feature_bundle:
      intermediate_block: 26
      context:
        kind: template_1kb
      pooling:
        seq_mean: true
        anchor_mean_for_templated: true
    io:
      write_back: true
      overwrite: false
