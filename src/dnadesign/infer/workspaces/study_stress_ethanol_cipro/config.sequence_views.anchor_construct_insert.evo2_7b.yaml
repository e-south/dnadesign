model:
  id: evo2_7b
  device: cuda:0
  precision: bf16
  alphabet: dna
  batch_size: 128

jobs:
  - id: anchor_construct_insert_seq_mean_7b
    operation: extract
    ingest:
      source: records
      field: sequence
    feature_bundle:
      intermediate_block: 26
      collect_log_likelihood: true
      collect_output_layer_mean: true
      collect_intermediate_embedding: true
      sequence_view_inputs:
        - dataset: usr_prom_eth_cip_anchor
          root: ../../../usr/datasets
          view_selector:
            product_kind: construct_insert
            orientation: forward
          pooling:
            operation: seq_mean
    io:
      write_back: false
      overwrite: false
