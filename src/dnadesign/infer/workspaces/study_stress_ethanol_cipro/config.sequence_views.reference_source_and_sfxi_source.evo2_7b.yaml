model:
  id: evo2_7b
  device: cuda:0
  precision: bf16
  alphabet: dna
  batch_size: 128

jobs:
  - id: reference_source_and_sfxi_source_seq_mean_7b
    operation: extract
    ingest:
      source: records
      field: sequence
    feature_bundle:
      intermediate_block: 26
      collect_log_likelihood: true
      collect_output_layer_mean: true
      collect_intermediate_embedding: true
      sequence_view_inputs:
        - dataset: usr_promoter_references
          root: ../../../usr/datasets
          view_selector:
            product_kind: selected_region
            orientation: forward
          pooling:
            operation: seq_mean
        - dataset: usr_sfxi_pdual10_densegen_promoters
          root: ../../../usr/datasets
          view_selector:
            product_kind: source_record
            orientation: unknown
          pooling:
            operation: seq_mean
    io:
      write_back: false
      overwrite: false
