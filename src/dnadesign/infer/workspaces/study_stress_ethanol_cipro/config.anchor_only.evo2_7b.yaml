model:
  id: evo2_7b
  device: cuda:0
  precision: bf16
  alphabet: dna
  batch_size: 1024

jobs:
  - id: anchor_only_7b_features
    operation: extract
    ingest:
      source: usr
      dataset: usr_prom_eth_cip_anchor
      root: ../../../usr/datasets
      field: sequence
    feature_bundle:
      intermediate_block: 26
      context:
        kind: anchor_only
      pooling:
        seq_mean: true
        anchor_mean_for_templated: true
    io:
      write_back: true
      overwrite: false
