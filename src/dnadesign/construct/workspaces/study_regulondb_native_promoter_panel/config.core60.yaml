job:
  id: construct_regulondb_native_promoter_core60_tss_upstream
  mode: normalize_anchor
  input:
    source:
      kind: usr
      dataset: usr_regulondb_native_promoters
      root: ../../../usr/datasets
    field: sequence
  normalize_anchor:
    product_kind: analysis_window
    target_length: 60
    focal_selector:
      kind: chain
      selectors:
        - kind: sequence_offset
          offset_0: 60
          label: tss_offset_0
          confidence: high
    over_length_policy:
      kind: trim
      target_length: 60
      require_focal_inside: false
      window_anchor: upstream_of_focal
    feature_retention_policy:
      fail_if_loses_roles: []
      warn_if_clips_roles: []
    fallback_policy:
      allow_low_confidence: false
      mark_low_confidence_rows: false
    emit_feature_retention_report: true
    output_sequence_view:
      create: true
      recommended_pooling: core60_mean
  output:
    on_conflict: ignore
    target:
      kind: usr
      dataset: usr_regulondb_native_promoter_core60
      root: ../../../usr/datasets
