          path: config.forward_anchor.window.yaml
          job_id: stress_ethanol_cipro_pdual10_forward_anchor_window_1kb
      contract:
        input_dataset: usr_prom_eth_cip_anchor
        template:
          id: pdual10_forward_anchor_window
          dataset: usr_pdual10_plasmid_template
          record_id: c4f17db3c2dbc17c5cb32c5eec785ea4f091e51d
