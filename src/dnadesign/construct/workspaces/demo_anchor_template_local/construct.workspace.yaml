workspace:
  id: demo_anchor_template_local
  profile: anchor-template-demo
  description: >
    Construct workspace registry for the packaged anchor-into-template demo.
    Each project entry maps one audited config to its intended
    input/template/output contract.
  roots:
    shared_usr_root: src/dnadesign/usr/datasets
    workspace_usr_root: outputs/usr_datasets
  projects:
    - id: slot_a_window
      config: config.slot_a.window.yaml
      flow: replace-anchor-in-template
      input_dataset: anchor_parts_demo
      template_id: template_backbone_dual_slot
      template_dataset: template_parts_demo
      template_record_id: c4f17db3c2dbc17c5cb32c5eec785ea4f091e51d
      output_dataset: anchor_template_slot_a_window_1kb_demo
      notes: 1 kb centered context window around the slot_a incumbent segment.
    - id: slot_a_full
      config: config.slot_a.full.yaml
      flow: replace-anchor-in-template
      input_dataset: anchor_parts_demo
      template_id: template_backbone_dual_slot
      template_dataset: template_parts_demo
      template_record_id: c4f17db3c2dbc17c5cb32c5eec785ea4f091e51d
      output_dataset: anchor_template_slot_a_full_context_demo
      notes: Full template realization for the slot_a incumbent segment.
    - id: slot_b_window
      config: config.slot_b.window.yaml
      flow: replace-anchor-in-template
      input_dataset: anchor_parts_demo
      template_id: template_backbone_dual_slot
      template_dataset: template_parts_demo
      template_record_id: c4f17db3c2dbc17c5cb32c5eec785ea4f091e51d
      output_dataset: anchor_template_slot_b_window_1kb_demo
      notes: 1 kb centered context window around the slot_b incumbent segment.
    - id: slot_b_full
      config: config.slot_b.full.yaml
      flow: replace-anchor-in-template
      input_dataset: anchor_parts_demo
      template_id: template_backbone_dual_slot
      template_dataset: template_parts_demo
      template_record_id: c4f17db3c2dbc17c5cb32c5eec785ea4f091e51d
      output_dataset: anchor_template_slot_b_full_context_demo
      notes: Full template realization for the slot_b incumbent segment.
