schema_version: stress_ethanol_cipro_growth.reader_response_projection.v5
study_id: stress_ethanol_cipro_growth
projection_id: stress_ethanol_cipro_growth.response_window.primary_v1
reader_experiment_id: 20260717_stress_response_window_aggregate
source_experiment_ids:
  - 20260117_sfxi_ref-pDual10
  - 20260121_sfxi_ref-pDual10
  - 20260619_sfxi_sensor-panel-m9-glu-1-10
  - 20260620_sfxi_sensor-panel-m9-glu-12-19
  - 20260621_sfxi_sensors-opal-20-28
  - 20260622_sfxi_sensor-panel-m9-glu-29-30-sulAp-spyp
  - 20260706_sfxi_sensor-panel-m9-glu-secg
  - 20260707_sfxi_sensor-panel-m9-glu-secg
reference_design_id: pDual-10
primary_reduction_id: event_logmean_4_8h_post
state_order: ["00", "10", "01", "11"]

source:
  response_channel: YFP/CFP
  magnitude_channel: YFP/OD600
  growth_channel: OD600
  reference_design_id: pDual-10
  state_column: treatment_alias
  state_values:
    "00": EtOH 0%, 0 nM cipro
    "10": EtOH 3%, 0 nM cipro
    "01": EtOH 0%, 100 nM cipro
    "11": EtOH 3%, 100 nM cipro
  state_values_case_sensitive: true

event:
  event_id: stress_induction
  event_kind: perturbation_addition
  segment_column: sheet_index
  pre_segment_index: 0
  post_segment_index: 1
  estimate_method: segment_gap_midpoint
  declaration: The named experiments added ethanol and/or ciprofloxacin between acquisition segments 0 and 1.

aggregation:
  observation_stat: median
  descriptive_resampling_draws: 500
  descriptive_interval_mass: 0.9
  random_seed: 1729
  quality:
    positive_floor: 1.0e-12
    allowed_max_interior_gap_h: 0.75
    required_min_observations_per_state: 2

reductions:
  - id: event_logmean_0_6h_post
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
    window_start_event_h: 0.0
    window_end_event_h: 6.0
    pre_window_duration_h: null
  - id: event_logmean_6_12h_post
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    pre_window_duration_h: null
  - id: event_logmean_4_8h_post
    method: geometric_time_mean
    response_basis: post_window
    role: primary
    window_start_event_h: 4.0
    window_end_event_h: 8.0
    pre_window_duration_h: null
  - id: event_logmean_8_12h_post
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
    window_start_event_h: 8.0
    window_end_event_h: 12.0
    pre_window_duration_h: null
  - id: event_logmean_0_12h_post
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
    window_start_event_h: 0.0
    window_end_event_h: 12.0
    pre_window_duration_h: null
  - id: event_linear_auc_6_12h_post
    method: integrated_linear_mean
    response_basis: post_window
    role: sensitivity
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    pre_window_duration_h: null
  - id: event_logmean_6_12h_delta_pre1h
    method: geometric_time_mean
    response_basis: post_minus_pre
    role: sensitivity
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    pre_window_duration_h: 1.0

records:
  wells:
    record_id: four_state_event_window/wells
    contract_id: plate_reader.four_state_event_window.wells.v3
  designs:
    record_id: four_state_event_window/designs
    contract_id: plate_reader.four_state_event_window.designs.v4
  descriptive_resampling_draws:
    record_id: four_state_event_window/descriptive_resampling_draws
    contract_id: plate_reader.four_state_event_window.descriptive_resampling_draws.v3
  traces:
    record_id: four_state_event_window/traces
    contract_id: plate_reader.four_state_event_window.traces.v3
  events:
    record_id: four_state_event_window/events
    contract_id: plate_reader.four_state_event_window.events.v2

display:
  schema_version: stress_ethanol_cipro_growth.reader_response_display.v1
  study_label: Ethanol and ciprofloxacin promoter response
  event_label: Stress addition
  state_labels:
    "00": No stress
    "10": Ethanol
    "01": Ciprofloxacin
    "11": Ethanol + ciprofloxacin
  channels:
    response_ratio: YFP/CFP
    magnitude_ratio: YFP/OD600
    growth: OD600
    reference_design_id: pDual-10
  examples:
    - design_id: pDual-10
      label: pDual-10 fluorescence anchor
      role: reference_anchor
    - design_id: pDual-10-spyp
      label: SpyP measured ethanol-response example
      role: response_example
    - design_id: pDual-10-sulAp
      label: sulAp measured ciprofloxacin-response example
      role: response_example

display_artifact: null
