schema_version: reader.response_window.request.v2
request_id: stress_ethanol_cipro_growth.response_window.v2

experiment_ids:
  - 20260117_sfxi_ref-pDual10
  - 20260121_sfxi_ref-pDual10
  - 20260619_sfxi_sensor-panel-m9-glu-1-10
  - 20260620_sfxi_sensor-panel-m9-glu-12-19
  - 20260621_sfxi_sensors-opal-20-28
  - 20260622_sfxi_sensor-panel-m9-glu-29-30-sulAp-spyp
  - 20260706_sfxi_sensor-panel-m9-glu-secg
  - 20260707_sfxi_sensor-panel-m9-glu-secg

state_order: ["00", "10", "01", "11"]

display:
  study_label: Ethanol and ciprofloxacin promoter response
  event_label: Stress addition
  state_labels:
    "00": No stress
    "10": Ethanol
    "01": Ciprofloxacin
    "11": Ethanol + ciprofloxacin
  examples:
    - design_id: pDual-10
      label: pDual-10 fluorescence anchor
      role: reference_anchor
    - design_id: pDual-10-spyp
      label: SpyP measured ethanol-response example
      role: response_example
    - design_id: pDual-10-sulAp
      label: sulAp measured ciprofloxacin-response example
      role: response_example

source:
  response_record_id: ratio_yfp_cfp/df
  magnitude_record_id: ratio_yfp_od600/df
  trajectory_record_id: promote_to_tidy_plus_map/df
  reference_authority_record_id: sfxi_vec8/vec8
  reference_authority_contract_id: sfxi.vec8.v3
  response_channel: YFP/CFP
  magnitude_channel: YFP/OD600
  growth_channel: OD600
  reference_design_id: pDual-10
  state_map_ref: induction_logic

event:
  event_id: stress_induction
  event_kind: perturbation_addition
  segment_column: sheet_index
  pre_segment_index: 0
  post_segment_index: 1
  estimate_method: segment_gap_midpoint
  declaration: The named experiments added ethanol and/or ciprofloxacin between acquisition segments 0 and 1.

reductions:
  - id: event_logmean_6_12h_post
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    method: geometric_time_mean
    response_basis: post_window
    role: primary
  - id: event_logmean_4_8h_post
    window_start_event_h: 4.0
    window_end_event_h: 8.0
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
  - id: event_logmean_8_12h_post
    window_start_event_h: 8.0
    window_end_event_h: 12.0
    method: geometric_time_mean
    response_basis: post_window
    role: sensitivity
  - id: event_linear_auc_6_12h_post
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    method: integrated_linear_mean
    response_basis: post_window
    role: sensitivity
  - id: event_logmean_6_12h_delta_pre1h
    window_start_event_h: 6.0
    window_end_event_h: 12.0
    method: geometric_time_mean
    response_basis: post_minus_pre
    pre_window_duration_h: 1.0
    role: sensitivity

aggregation:
  replicate_stat: median
  bootstrap_samples: 500
  confidence_level: 0.90
  random_seed: 1729

quality:
  positive_floor: 1.0e-12
  max_interior_gap_h: 0.75
  min_replicates_per_state: 2
