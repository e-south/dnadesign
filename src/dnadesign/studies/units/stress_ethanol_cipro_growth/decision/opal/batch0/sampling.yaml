version: 1
study_id: stress_ethanol_cipro_growth
state_order: ["00", "10", "01", "11"]
seed: 7
allow_duplicate_ids: false

candidate_feature_table:
  dataset_id: usr_prom_eth_cip_opal_candidates
  role: opal_candidate_feature_table
  records_path: src/dnadesign/usr/datasets/usr_prom_eth_cip_opal_candidates/records.parquet
  expected_rows: 157160
  required_columns: ["id", "bio_type", "sequence", "alphabet"]
  x_column: latentdna__evo2_7b__context_anchor_mean_bidir_concat
  x_source:
    view_id: intermediate_embedding_7b_context_anchor_mean_bidir_concat
    rows_path: src/dnadesign/latentdna/workspaces/stress_ethanol_cipro_growth/outputs/views/intermediate_embedding_7b_context_anchor_mean_bidir_concat/rows.parquet
    matrix_path: src/dnadesign/latentdna/workspaces/stress_ethanol_cipro_growth/outputs/views/intermediate_embedding_7b_context_anchor_mean_bidir_concat/matrix.npy
    meaning: fixed-length block-normalized Fwd+RC 1 kb context-anchor Evo2 7B intermediate embedding vector
    not: ["UMAP coordinate", "centroid distance", "assay label", "phenotype claim"]
  materialization:
    source_records_path: src/dnadesign/usr/datasets/usr_prom_eth_cip_anchor/records.parquet
    densegen_sidecar_path: src/dnadesign/usr/datasets/usr_prom_eth_cip_anchor/_derived/densegen.parquet
    densegen_sidecar_columns:
      - densegen__plan
      - densegen__run_id
      - densegen__sampling_library_hash
    view_row_id_column: construct__anchor_id
    include_source_class: ["densegen"]
    allowed_design_families: ["background_only", "ethanol", "ciprofloxacin", "ethanol_ciprofloxacin"]
    exclude_non_null_columns: ["sfxi_ref__collection_id"]
    expected_rows_note: roughly 157k current generated promoter rows; excludes reference, native, archive SFXI, and control rows in the broader LatentDNA view

provenance:
  densegen_source_records_path: src/dnadesign/usr/datasets/densegen_prom_eth_cip_source/records.parquet
  densegen_source_sidecar_path: src/dnadesign/usr/datasets/densegen_prom_eth_cip_source/_derived/densegen.parquet
  anchor_densegen_sidecar_path: src/dnadesign/usr/datasets/usr_prom_eth_cip_anchor/_derived/densegen.parquet
  construct_sequence_views_path: src/dnadesign/usr/datasets/construct_prom_eth_cip_context/_views/sequence_views.parquet
  infer_feature_aliases_path: src/dnadesign/usr/datasets/construct_prom_eth_cip_context/_derived/infer/feature_aliases.parquet
  infer_feature_vectors_path: src/dnadesign/usr/datasets/construct_prom_eth_cip_context/_derived/infer/feature_vectors.parquet
  infer_alias_filter:
    provider: evo2
    model_name: evo2_7b
    layer_name: block26_mlp_out
    representation_kind: intermediate_embedding
    pooling_operation: anchor_mean

source_artifacts:
  latentdna_margins: src/dnadesign/latentdna/workspaces/stress_ethanol_cipro_growth/outputs/scalars/balanced_design_family_margins_intermediate_embedding_7b_context_anchor_mean_bidir_concat/table.parquet
  latentdna_sigma35_stress_margins: src/dnadesign/latentdna/workspaces/stress_ethanol_cipro_growth/outputs/scalars/sigma35_stress_margins_intermediate_embedding_7b_context_anchor_mean_bidir_concat/table.parquet
  densegen_anchor_records: src/dnadesign/usr/datasets/usr_prom_eth_cip_anchor/records.parquet

filters:
  require_positive_target_margin: true
  include_source_class: ["densegen"]
  exclude_non_null_columns: ["sfxi_ref__collection_id"]
  allowed_sigma35_variants: ["f", "e", "d", "c"]
  allowed_spacer_lengths: [16, 17, 18, 19]
  preferred_sigma35_variants: ["f", "e"]
  exploratory_sigma35_variants: ["d", "c"]
  note: LatentDNA margins are pre-assay priors only; do not treat them as phenotype claims.

synthesis_eligibility:
  strategy_yaml: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/synthesis_handoff/configs/sfxi_promoter_insert_v1.yaml
  sequence_column: sequence
  min_remaining_candidates: 1000

diversity:
  keys:
    - regulator_composition
    - spacer_length
    - tfbs_offset_summary
    - tfbs_orientation_summary
    - motif_tier_summary
  note: Do not select directly by centroid-nearest rank or UMAP position.

outputs:
  review_csv: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/batch0/outputs/batch0_review.csv
  review_parquet: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/batch0/outputs/batch0_review.parquet

campaigns:
  - slug: stress_eth_cip_ethanol_rf_sfxi_topn
    name: Stress ethanol/ciprofloxacin ethanol-factor RF SFXI top-n
    objective: ethanol_factor
    setpoint_vector: [0, 1, 0, 1]
    target_margin_column: synthetic_margin_ethanol_vs_background
    off_target_margin_columns:
      - synthetic_margin_cipro_vs_background
      - synthetic_margin_dual_vs_background
    slots:
      - name: ethanol_baer_middle_only
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["background", "baeR", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        sigma35_mode: strong
      - name: ethanol_baer_upstream_only
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["baeR", "background", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        sigma35_mode: strong
      - name: ethanol_baer_dense
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        signal_tfbs_count:
          min: 2
        allowed_sigma35_variants: ["f", "e"]
        sigma35_mode: strong
      - name: ethanol_baer_exploratory_low_copy
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["d", "c"]
        sigma35_mode: exploratory
      - name: ethanol_cpxr_middle_only
        count: 1
        plan: ethanol
        regulator_compositions: ["cpxR"]
        require_tfbs_regulators_all: ["cpxR"]
        exclude_tfbs_regulators: ["baeR", "lexA"]
        slot_regulator_pattern: ["background", "cpxR", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        sigma35_mode: strong
      - name: ethanol_cpxr_upstream_only
        count: 1
        plan: ethanol
        regulator_compositions: ["cpxR"]
        require_tfbs_regulators_all: ["cpxR"]
        exclude_tfbs_regulators: ["baeR", "lexA"]
