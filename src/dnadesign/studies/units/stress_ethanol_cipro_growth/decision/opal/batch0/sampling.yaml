filters:
  require_positive_target_margin: true
  include_source_class: ["densegen"]
  exclude_non_null_columns: ["sfxi_ref__collection_id"]
  allowed_sigma35_variants: ["f", "e", "d", "c"]
  allowed_spacer_lengths: [16, 17, 18, 19]
  preferred_sigma35_variants: ["f", "e"]
  exploratory_sigma35_variants: ["d", "c"]
  note: LatentDNA margins are pre-assay priors only; do not treat them as phenotype claims.

synthesis_eligibility:
  strategy_yaml: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/synthesis_handoff/configs/stress_promoter_insert_v1.yaml
  sequence_column: sequence
  min_remaining_candidates: 1000

diversity:
  keys:
    - regulator_composition
    - spacer_length
    - tfbs_offset_summary
    - tfbs_orientation_summary
    - motif_tier_summary
  note: Do not select directly by centroid-nearest rank or UMAP position.

outputs:
  review_csv: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/batch0/outputs/batch0_review.csv
  review_parquet: src/dnadesign/studies/units/stress_ethanol_cipro_growth/decision/opal/batch0/outputs/batch0_review.parquet

campaigns:
  - slug: secg_ethanol_rf_sfxi_topn
    name: SECG ethanol-responsive RF SFXI top-n
    objective: ethanol_factor
    setpoint_vector: [0, 1, 0, 1]
    target_margin_column: synthetic_margin_ethanol_vs_background
    off_target_margin_columns:
      - synthetic_margin_cipro_vs_background
      - synthetic_margin_dual_vs_background
    slots:
      - name: ethanol_baer_middle_only
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["background", "baeR", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [17]
        sigma35_mode: strong
        design_hypothesis: "BaeR middle-slot single site tests activator-dependent -35-side RNAP access in a fixed TATAAT -10 context."
        primary_comparison: ethanol_baer_upstream_only
        geometry_hypothesis: functional_realignment_not_literal_shortening
        interpretation_limit: "This is a batch0 placement contrast, not a -10-strength test or causal geometry proof."
      - name: ethanol_baer_upstream_only
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["baeR", "background", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "BaeR upstream single site tests whether left-shifted activator placement still supports ethanol ON-state margin."
        primary_comparison: ethanol_baer_middle_only
        geometry_hypothesis: activator_position_contrast
        interpretation_limit: "Spacer and slot are intentionally paired for a compact contrast; do not infer a full spacing curve."
      - name: ethanol_baer_dense
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["baeR", "baeR", "baeR"]
        signal_tfbs_count: 3
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [19]
        sigma35_mode: strong
        design_hypothesis: "BaeR dense row is a copy-number stress-test comparator at a longer spacer."
        primary_comparison: ethanol_baer_middle_only
        geometry_hypothesis: copy_number_stress_test
        interpretation_limit: "Dense rows are not clean count-only contrasts because motif occupancy changes multiple slots."
      - name: ethanol_baer_exploratory_low_copy
        count: 1
        plan: ethanol
        regulator_compositions: ["baeR"]
        require_tfbs_regulators_all: ["baeR"]
        exclude_tfbs_regulators: ["cpxR", "lexA"]
        slot_regulator_pattern: ["background", "baeR", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["d", "c"]
        allowed_spacer_lengths: [18]
        sigma35_mode: exploratory
        design_hypothesis: "BaeR exploratory row reuses the middle-slot pattern under weaker sigma and longer spacer threshold pressure."
        primary_comparison: ethanol_baer_middle_only
        geometry_hypothesis: threshold_sensitivity_probe
        interpretation_limit: "Exploratory margin may be weaker; interpret as dynamic-range scouting, not a guaranteed ON design."
      - name: ethanol_cpxr_middle_only
        count: 1
        plan: ethanol
        regulator_compositions: ["cpxR"]
        require_tfbs_regulators_all: ["cpxR"]
        exclude_tfbs_regulators: ["baeR", "lexA"]
        slot_regulator_pattern: ["background", "cpxR", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [17]
        sigma35_mode: strong
        design_hypothesis: "CpxR middle-slot single site tests alternate activator identity under the same middle-slot spacer class."
        primary_comparison: ethanol_baer_middle_only
        geometry_hypothesis: activator_identity_comparator
        interpretation_limit: "CpxR is a limited comparator, not a full regulator-identity factor."
      - name: ethanol_cpxr_upstream_only
        count: 1
        plan: ethanol
        regulator_compositions: ["cpxR"]
        require_tfbs_regulators_all: ["cpxR"]
        exclude_tfbs_regulators: ["baeR", "lexA"]
        slot_regulator_pattern: ["cpxR", "background", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "CpxR upstream single site tests alternate activator placement matched to the BaeR upstream spacer class."
        primary_comparison: ethanol_cpxr_middle_only
        geometry_hypothesis: activator_position_comparator
        interpretation_limit: "CpxR rows preserve comparator value but do not make ethanol a balanced BaeR-vs-CpxR DOE."

  - slug: secg_cipro_rf_sfxi_topn
    name: SECG ciprofloxacin-responsive RF SFXI top-n
    objective: cipro_factor
    setpoint_vector: [0, 0, 1, 1]
    target_margin_column: synthetic_margin_cipro_vs_background
    off_target_margin_columns:
      - synthetic_margin_ethanol_vs_background
      - synthetic_margin_dual_vs_background
    slots:
      - name: cipro_lexa_slot0
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["lexA", "background", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "LexA slot0 single site tests upstream repression/derepression architecture."
        primary_comparison: cipro_lexa_slot1
        geometry_hypothesis: lexa_position_contrast
        interpretation_limit: "This is a fixed LexA-only generated promoter contrast, not a LexA-present/absent repression proof."
      - name: cipro_lexa_slot1
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["background", "lexA", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "LexA slot1 single site tests middle-slot RNAP interference/derepression in the matched f/16 single-site set."
        primary_comparison: cipro_lexa_slot0
        geometry_hypothesis: lexa_position_contrast
        interpretation_limit: "Fixed TATAAT -10 context; cipro rows test LexA architecture rather than activator realignment."
      - name: cipro_lexa_slot2
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["background", "background", "lexA"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "LexA slot2 single site tests downstream/-10-proximal placement in the matched f/16 single-site set."
        primary_comparison: cipro_lexa_slot1
        geometry_hypothesis: lexa_position_contrast
        interpretation_limit: "Placement effects remain model-prior hypotheses until measured cipro labels exist."
      - name: cipro_lexa_dense
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["lexA", "lexA", "lexA"]
        signal_tfbs_count: 3
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [18]
        sigma35_mode: strong
        design_hypothesis: "LexA dense row is a saturation comparator for cipro response strength."
        primary_comparison: cipro_lexa_two_site
        geometry_hypothesis: repression_site_density_stress_test
        interpretation_limit: "Dense rows are less placement-interpretable than the matched single-site trio."
      - name: cipro_lexa_two_site
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["background", "lexA", "lexA"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [18]
        sigma35_mode: strong
        design_hypothesis: "LexA two-site row tests intermediate repression architecture between single-site and dense rows."
        primary_comparison: cipro_lexa_dense
        geometry_hypothesis: repression_site_count_comparator
        interpretation_limit: "Two-site row is a representative architecture, not a complete two-site placement matrix."
      - name: cipro_lexa_exploratory_single
        count: 1
        plan: ciprofloxacin
        regulator_compositions: ["lexA"]
        require_tfbs_regulators_all: ["lexA"]
        exclude_tfbs_regulators: ["baeR", "cpxR"]
        slot_regulator_pattern: ["background", "lexA", "background"]
        signal_tfbs_count: 1
        allowed_sigma35_variants: ["d", "c"]
        allowed_spacer_lengths: [18]
        sigma35_mode: exploratory
        design_hypothesis: "LexA exploratory row reuses the middle single-site pattern under weaker sigma and longer spacer threshold pressure."
        primary_comparison: cipro_lexa_slot1
        geometry_hypothesis: derepression_threshold_probe
        interpretation_limit: "Exploratory row probes threshold sensitivity and should not be treated as a strong-control design."

  - slug: secg_and_rf_sfxi_topn
    name: SECG AND-responsive RF SFXI top-n
    objective: and
    setpoint_vector: [0, 0, 0, 1]
    target_margin_column: synthetic_margin_dual_vs_background
    off_target_margin_columns:
      - synthetic_margin_ethanol_vs_background
      - synthetic_margin_cipro_vs_background
    target_margin_min: 0.2
    off_target_margin_constraints:
      max_each: 0.3
    slots:
      - name: and_baer_lexa_baer_before_lexa
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["baeR+lexA"]
        require_tfbs_regulators_all: ["baeR", "lexA"]
        exclude_tfbs_regulators: ["cpxR"]
        slot_regulator_pattern: ["baeR", "lexA", "background"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "BaeR before LexA tests activator-first dual logic with single-stress margins capped for batch0 specificity."
        primary_comparison: and_baer_lexa_lexa_before_baer
        geometry_hypothesis: dual_order_contrast
        interpretation_limit: "AND rows are pre-assay dual-logic probes, not proof of strict Boolean AND behavior."
      - name: and_baer_lexa_lexa_before_baer
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["baeR+lexA"]
        require_tfbs_regulators_all: ["baeR", "lexA"]
        exclude_tfbs_regulators: ["cpxR"]
        slot_regulator_pattern: ["lexA", "baeR", "background"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "LexA before BaeR tests order-swapped BaeR/LexA gating under the same f/16 spacer class."
        primary_comparison: and_baer_lexa_baer_before_lexa
        geometry_hypothesis: dual_order_contrast
        interpretation_limit: "Off-target prior caps reduce generic dual-positive bias but do not replace measured single-stress labels."
      - name: and_baer_lexa_dense
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["baeR+lexA"]
        require_tfbs_regulators_all: ["baeR", "lexA"]
        exclude_tfbs_regulators: ["cpxR"]
        slot_regulator_pattern: ["lexA", "baeR", "baeR"]
        signal_tfbs_count: 3
        allowed_sigma35_variants: ["f", "e"]
        allowed_spacer_lengths: [18]
        sigma35_mode: strong
        design_hypothesis: "BaeR+LexA dense row stress-tests whether higher dual composition improves dual margin without excessive single-stress prior margins."
        primary_comparison: and_baer_lexa_baer_before_lexa
        geometry_hypothesis: dual_density_stress_test
        interpretation_limit: "Dense dual rows are composition stress tests, not clean order-only comparisons."
      - name: and_baer_lexa_exploratory
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["baeR+lexA"]
        require_tfbs_regulators_all: ["baeR", "lexA"]
        exclude_tfbs_regulators: ["cpxR"]
        slot_regulator_pattern: ["baeR", "lexA", "background"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["d", "c"]
        allowed_spacer_lengths: [19]
        sigma35_mode: exploratory
        design_hypothesis: "BaeR+LexA exploratory row tests weak-sigma long-spacer dual threshold behavior under the same order as the strong BaeR-leading row."
        primary_comparison: and_baer_lexa_baer_before_lexa
        geometry_hypothesis: dual_threshold_sensitivity_probe
        interpretation_limit: "This row may be lower margin by design; interpret as threshold scouting."
      - name: and_cpxr_lexa_cpxr_before_lexa
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["cpxR+lexA"]
        require_tfbs_regulators_all: ["cpxR", "lexA"]
        exclude_tfbs_regulators: ["baeR"]
        slot_regulator_pattern: ["cpxR", "lexA", "background"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "CpxR before LexA tests alternate activator dual logic under matched f/16 order-comparison constraints."
        primary_comparison: and_cpxr_lexa_lexa_before_cpxr
        geometry_hypothesis: alternate_activator_dual_order_contrast
        interpretation_limit: "CpxR+LexA rows are limited comparators; they do not rebalance the AND set away from BaeR."
      - name: and_cpxr_lexa_lexa_before_cpxr
        count: 1
        plan: ethanol_ciprofloxacin
        regulator_compositions: ["cpxR+lexA"]
        require_tfbs_regulators_all: ["cpxR", "lexA"]
        exclude_tfbs_regulators: ["baeR"]
        slot_regulator_pattern: ["lexA", "cpxR", "background"]
        signal_tfbs_count: 2
        allowed_sigma35_variants: ["f"]
        allowed_spacer_lengths: [16]
        sigma35_mode: strong
        design_hypothesis: "LexA before CpxR tests order-swapped alternate activator gating under matched f/16 constraints."
        primary_comparison: and_cpxr_lexa_cpxr_before_lexa
        geometry_hypothesis: alternate_activator_dual_order_contrast
        interpretation_limit: "Off-target caps are prior filters only; measured labels decide actual AND specificity."
