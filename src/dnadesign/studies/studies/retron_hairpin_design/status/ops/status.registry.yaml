version: 1
provider_id: study.retron_hairpin_design
entries:
  - status_kind: retron-hairpin-design-status
    owner_boundary: studies
    observes_plane: record
    provider_ref: dnadesign.studies.studies.retron_hairpin_design.status.ops.provider:provide_retron_hairpin_design_status
    description: Read the retron_hairpin_design checked-in record and summarize its declared track, command groups, and native-agent bootstrap context.
    surface_type: study_snapshot
    cost_class: cheap
    summary_scope: repo
    input_schema:
      - name: study_dir
        manifest_key: study_dir
        cli_flag: --study-dir
        placeholder: docs/studies/retron_hairpin_design
        summary: Checked-in retron_hairpin_design record directory containing record/campaign.yaml, record/datasets.yaml, record/status.md, operations/ops.study.yaml, routes/README.md, and operations/runtime/command-groups/pipeline.yaml.
        type: path
        required: false
        path_base: repo
    notes:
      - Use --study-dir only to pin docs/studies/retron_hairpin_design from outside the repo checkout.
      - Use this route to recover Retron context and intent before opening workspaces or running Cruncher commands.
  - status_kind: retron-hairpin-design-preflight
    owner_boundary: studies
    observes_plane: execution_readiness
    provider_ref: dnadesign.studies.studies.retron_hairpin_design.status.ops.provider:provide_retron_hairpin_design_preflight
    description: Run the retron_hairpin_design read-only preflight suite across declared workspace-layout and command-validation surfaces.
    surface_type: study_preflight
    cost_class: deep
    summary_scope: host
    input_schema:
      - name: study_dir
        manifest_key: study_dir
        cli_flag: --study-dir
        placeholder: docs/studies/retron_hairpin_design
        summary: Checked-in retron_hairpin_design record directory containing record/campaign.yaml, record/datasets.yaml, record/status.md, operations/ops.study.yaml, routes/README.md, and operations/runtime/command-groups/pipeline.yaml.
        type: path
        required: false
        path_base: repo
      - name: scope
        manifest_key: scope
        cli_flag: --scope
        placeholder: next
        summary: >-
          Preflight scope for retron-hairpin-design-preflight surfaces: `full` runs
          the whole suite; `next` focuses the current actionable route, track,
          or phase declared by the study contract.
        type: enum
        required: false
        default: next
        choices: [next, full]
    notes:
      - This route composes read-only command preflights. Use it after the cheaper `studies.retron-hairpin-design.status` snapshot when you need command-level blockers.
      - Use --study-dir only to pin docs/studies/retron_hairpin_design from outside the repo checkout.
