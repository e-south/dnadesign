version: 4
contract:
  kind: usr_genbank_annotation_render_v1
bundle:
  path: outputs/render-v1
input:
  kind: parquet
  path: inputs/input.parquet
  adapter:
    kind: usr_genbank_annotations_v1
    columns:
      sequence: sequence
      annotations: seq_annot__features
      id: id
      overlay_text: usr_label__primary
      source_file: seq_annot__source_file
      product_kind: derived__product_kind
    policies:
      on_invalid_row: error
      require_non_empty: true
      min_per_record: 3
      include_untyped_features: true
      overlay_text_template: "{overlay_text} · {id}"
  alphabet: DNA
render:
  renderer: sequence_rows
  style:
    preset: presentation_default
    overrides:
      figure_scale: 1.5
      padding_y: 12.0
      overlay_align: center
      overlay_title_gap_reduction_px: 96.0
      balance_content_radius: false
      layout:
        outer_pad_cells: 0.62
      sequence:
        strand_gap_cells: 0.18
        to_kmer_gap_cells: 0.38
        bold_consensus_bases: false
        non_consensus_color: "#9CA3AF"
      palette:
        promoter:sigma70_core:upstream: "#4F7CAC"
        promoter:sigma70_core:downstream: "#C46BAE"
        genbank:promoter_region: "#B8C2CC"
        genbank:source_fragment: "#CBD5E1"
        genbank:operator_site: "#D97706"
        genbank:misc_annotation: "#94A3B8"
        tf:LexA: "#4F9FE3"
        tf:CpxR: "#2D9B66"
        tf:BaeR: "#E58A2B"
        tf:SoxR: "#9B5DE5"
        tf:SoxS: "#D94F70"
        tf:CRP: "#7A8B2E"
      connectors: true
      legend: true
      legend_mode: bottom
      legend_height_px: 44.0
      legend_pad_px: 4.0
      legend_content_gap_px: 12.0
      legend_patch_w: 32.0
      legend_patch_h: 14.0
      legend_font_size: 11
      legend_gap_patch_text: 6.0
      legend_gap_x: 14.0
      legend_vertical_align: 1.0
      font_size_seq: 22
      font_size_label: 22
      span_link_line_width: 3.0
      span_link_tick_line_width: 2.6
      uniform_display_font_size: true
      kmer:
        box_height_cells: 1.12
        fill_alpha: 0.94
        text_y_nudge_cells: 0.0
        to_logo_gap_cells: 0.12
outputs:
  - kind: images
    dir: plots
    fmt: png
  - kind: video
    path: promoter_references_genbank.mp4
    fmt: mp4
    fps: 2
    frames_per_record: 2
    width_px: 1920
    height_px: 160
    content_fit: fill_width_per_frame
run:
  strict: true
  fail_on_skips: true
