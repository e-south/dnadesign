# DenseGen demo: binding-site baseline plus sigma70-constrained variant.
densegen:
  schema_version: "2.9"
  run:
    id: demo_tfbs_baseline
    root: "."

  inputs:
    - name: basic_sites
      type: binding_sites
      path: inputs/sites.csv

  output:
    targets: [parquet]
    schema:
      bio_type: dna
      alphabet: dna_4
    parquet:
      path: outputs/tables/records.parquet
      deduplicate: true
      chunk_size: 64

  generation:
    sequence_length: 100
    sampling:
      pool_strategy: iterative_subsample
      library_size: 10
      cover_all_regulators: true
      unique_binding_sites: true
      unique_binding_cores: true
      iterative_max_libraries: 200
    plan:
      - name: baseline
        sequences: 50
        sampling:
          include_inputs: [basic_sites]
        regulator_constraints:
          min_total_sites: 0
          groups: []
      - name: baseline_sigma70
        sequences: 50
        sampling:
          include_inputs: [basic_sites]
        fixed_elements:
          promoter_constraints:
            - name: sigma70_consensus
              upstream: TTGACA
              downstream: TATAAT
              spacer_length: [16, 18]
        regulator_constraints:
          min_total_sites: 0
          groups: []

  solver:
    backend: CBC
    strategy: iterate
    solver_attempt_timeout_seconds: 10

  runtime:
    round_robin: true
    max_accepted_per_library: 10
    min_count_per_tf: 0
    max_duplicate_solutions: 3
    no_progress_seconds_before_resample: 10
    max_consecutive_no_progress_resamples: 60
    max_failed_solutions: 0
    random_seed: 42

  postprocess:
    pad:
      mode: adaptive
      end: 5prime
      gc:
        mode: range
        min: 0.40
        max: 0.60
        target: 0.50
        tolerance: 0.10
        min_pad_length: 0
      max_tries: 2000

  logging:
    log_dir: outputs/logs
    level: INFO
    progress_style: summary

plots:
  source: parquet
  out_dir: outputs/plots
  format: pdf
  default:
    [
      source_cohort_concentration,
      stage_a_sampling_yield,
      stage_a_pool_diversity,
      plan_regulator_deployment_heatmap,
      placement_occupancy_map,
      retained_pool_coverage_by_regulator,
      attempt_outcome_timeline,
      solve_pressure_and_progress,
      background_sequence_logo,
      compression_ratio_by_plan,
      dense_array_showcase_video,
      retained_vs_deployed_length_mix_by_regulator,
      retained_vs_deployed_tier_mix_by_regulator,
      score_strata_and_deployed_length_bridge,
      source_plan_input_heatmap,
      stage_a_pool_score_strata,
      tfbs_concentration_profile,
      upstream_motif_supply_and_pwm_strength,
    ]
  # Optional Stage-B showcase video configuration (single all-plan MP4 when selected).
  video:
    enabled: true
    mode: all_plans_round_robin_single_video
    sampling:
      stride: 5
      max_source_rows: 20000
      max_snapshots: 140
    playback:
      target_duration_sec: 14
      fps: 12
