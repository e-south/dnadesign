  show_legend: false
  graph_detail: full
  graph_fraction: 0.35
  show_edge_costs: false
  seconds_per_step: 0.22
  hold_seconds: 1.80
  lead_seconds: 0.10
  scene_transition_seconds: 0.24
  show_distance_bracket: never
  collection_order:
