runbook:
  schema_version: 1
  id: study_stress_ethanol_cipro_infer_anchor_plus_template_7b_batch_with_notify
  workflow_id: infer_batch_with_notify
  project: dunlop
  workspace_root: ../../../infer/workspaces/study_stress_ethanol_cipro
  logging:
    stdout_dir: ../../../infer/workspaces/study_stress_ethanol_cipro/outputs/logs/ops/sge/study_stress_ethanol_cipro_infer_anchor_plus_template_7b_batch_with_notify
  infer:
    config: ../../../infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_7b.yaml
    qsub_template: docs/bu-scc/jobs/evo2-gpu-infer.qsub
    cuda_module: cuda/12.8
    gcc_module: gcc/13.2.0
  notify:
    tool: infer
    policy: infer
    profile: ../../../infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_plus_template_7b/profile.json
    cursor: ../../../infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_plus_template_7b/cursor
    spool_dir: ../../../infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_plus_template_7b/spool
    webhook_env: NOTIFY_WEBHOOK
    qsub_template: docs/bu-scc/jobs/notify-watch.qsub
