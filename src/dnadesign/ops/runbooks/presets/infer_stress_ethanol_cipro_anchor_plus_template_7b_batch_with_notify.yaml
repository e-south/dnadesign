  resources:
    pe_omp: 4
    h_rt: "12:00:00"
    mem_per_core: 8G
    gpus: 1
    gpu_capability: "8.9"
    gpu_memory_gib: 45.0
  mode_policy:
    default: auto
    on_active_job: hold_jid
