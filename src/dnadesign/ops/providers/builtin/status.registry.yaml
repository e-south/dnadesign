version: 1
provider_id: builtin.ops
entries:
  - status_kind: ops-audit-json
    owner_boundary: ops
    observes_plane: control
    provider_ref: dnadesign.ops.providers.builtin.status_provider:provide_ops_audit_status
    description: Read one workspace-scoped orchestration audit JSON emitted by `ops runbook execute`.
    surface_type: orchestration_audit
    cost_class: cheap
    summary_scope: workspace
    input_schema:
      - name: audit_json
        manifest_key: audit_json
        cli_flag: --audit-json
        placeholder: <workspace-root>/outputs/logs/ops/audit/latest.json
        summary: Workspace-scoped orchestration audit JSON emitted by ops runbook execute.
        type: path
    notes:
      - >-
        Smallest positive control-plane demo: run `uv run ops runbook execute
        ... --no-submit --audit-json
        <workspace-root>/outputs/logs/ops/audit/<file>.json`, then pass the
        same audit path to `ops progress show`.
      - On workstations without `qstat`, add `--allow-missing-qstat` so the queue probe stays explicit but non-fatal during a dry-run demo.
      - If `plan.runtime_visibility.active_job_resolution_state=unknown`, submit stays blocked by default unless the operator explicitly passes `--allow-unknown-active-jobs`.
