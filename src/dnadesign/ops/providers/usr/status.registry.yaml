version: 1
provider_id: builtin.usr
entries:
  - progress_kind: usr-sync-audit
    provider_ref: dnadesign.ops.progress_usr_provider:provide_usr_sync_audit_status
    description: Read one USR sync audit JSON emitted by `usr diff`, `usr pull`, or `usr push`.
    surface_type: sync_audit
    cost_class: cheap
    summary_scope: workspace
    input_schema:
      - name: sync_audit_json
        manifest_key: sync_audit_json
        cli_flag: --sync-audit-json
        placeholder: <audit-dir>/pull.json
        summary: Machine-readable USR sync audit JSON from usr diff, pull, or push.
        type: path
  - progress_kind: usr-dataset-state
    provider_ref: dnadesign.ops.progress_usr_provider:provide_usr_dataset_state_status
    description: Read one USR dataset directory, its records.parquet, and related overlay sidecars.
    surface_type: dataset_snapshot
    cost_class: cheap
    summary_scope: workspace
    input_schema:
      - name: usr_root
        manifest_key: usr_root
        cli_flag: --usr-root
        placeholder: <usr-root>
        summary: USR root containing the target dataset directory.
        type: path
      - name: dataset
        manifest_key: dataset
        cli_flag: --dataset
        placeholder: <dataset>
        summary: USR dataset id to summarize.
        type: str
