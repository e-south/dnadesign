version: 1
provider_id: builtin.cluster
entries:
  - progress_kind: cluster-run-index
    provider_ref: dnadesign.ops.progress_cluster_provider:provide_cluster_run_index_status
    description: Read one cluster results root and summarize the run index for that workspace.
    surface_type: run_index
    cost_class: cheap
    summary_scope: workspace
    input_schema:
      - name: cluster_results_root
        manifest_key: cluster_results_root
        cli_flag: --cluster-results-root
        placeholder: <cluster-results-root>
        summary: Cluster results root containing index.parquet and run outputs.
        type: path
