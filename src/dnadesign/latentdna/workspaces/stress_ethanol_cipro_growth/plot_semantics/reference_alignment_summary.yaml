plot_id: reference_alignment_summary
question: Do the promoted candidate spaces retain interpretable reference-promoter landmarks, and how collapsed are the available reference collections?
decision_role: appendix
encoding: Candidate-by-metric bar panels for legacy stress-reference alignment plus config-declared reference-set size and within-group cosine-distance summaries.
scope: Anchor and forward 1 kb anchor-mean candidate samples carrying native references, derived core60 rows, SFXI controls, Anderson iGEM standards, and the T7/W collection where available.
guardrails:
  - Use this panel as an appendix landmark and collapse check, not as the primary candidate ranking surface.
  - Interpret spyP/sulAp stress-reference alignment separately from collection-aware Anderson iGEM, W Collection, and Native MG1655 group summaries.
  - Compare strength-annotated collections within their own collection before making biological claims.
caption: Reference landmark and collection-collapse summary for the promoted candidate spaces.
alt_text: Bar-panel summary showing legacy stress-reference alignment and selector-backed reference-set size, median distance, and distance spread for promoted candidate spaces.
preprocessing_md: Reference metrics use the same view-level standardization and row L2 normalization contract as the other cosine-based plots. Named reference collections are resolved through workspace reference_sets so absent or incomplete collections remain explicit status rows.
math_md: |
  Legacy stress-reference alignment remains:
  $$
  a_{\mathrm{eth}} = \cos(c_{\mathrm{eth}}, r_{\mathrm{spyP}}) - \cos(c_{\mathrm{bg}}, r_{\mathrm{spyP}})
  $$
  and
  $$
  a_{\mathrm{cipro}} = \cos(c_{\mathrm{cipro}}, r_{\mathrm{sulAp}}) - \cos(c_{\mathrm{bg}}, r_{\mathrm{sulAp}}).
  $$
  Collection-collapse panels report group size, median pairwise cosine distance, and pairwise cosine-distance IQR within each configured reference set after the same normalization contract.
rationale_md: Keeps named reference landmarks and collection-level collapse visible after the reference inventory expanded beyond the original spyP/sulAp check.
limitations_md: UMAP and cosine summaries are diagnostics, not assay-era evidence. Some reference groups mix source semantics or strength scales, and small groups can make distance summaries unstable.
failure_modes_md: Missing labels, mixed collection scales, repeated source rows, or context dilution can make reference groups look more collapsed or separated than the underlying biology supports.
