plot_id: sigma35_centroid_distance_gallery
question: Do the Sigma-35 variants form a coherent centroid ladder inside each candidate space?
decision_role: appendix
encoding: Multi-panel heatmap gallery of pairwise Sigma-35 centroid cosine distances for the study-facing 7B intermediate candidates, with a shared sequential sea-green color scale.
scope: The declared Sigma-35 f/e/d/c/b audit categories for the active study. The gallery focuses on the active study-facing 7B intermediate candidates rather than the full appendix inventory.
guardrails:
  - Use this gallery as appendix-only support for the Sigma-35 ordinal audit, not as a standalone ranking rule.
  - The ordered row and column layout reflects the declared Sigma-35 ladder; it does not prove promoter activity.
caption: Pairwise Sigma-35 centroid-distance gallery across the main 7B intermediate candidates.
alt_text: Heatmap gallery showing pairwise cosine distances between Sigma-35 variant centroids across anchor-source, context-anchor, reverse-complement, and bidirectional-summary 7B intermediate candidates.
preprocessing_md: Variant centroids are computed after view-level standardization and row L2 normalization. The rendered matrix is restricted to the configured f/e/d/c/b DenseGen audit axis even when source/reference rows carry additional annotated Sigma-35 sequences. Distances are cosine distances between those normalized centroids in each stored candidate view.
math_md: |
  For each variant \(g\), the centroid is
  $$
  c_g = \mathrm{normalize}\left(\frac{1}{|g|}\sum_{i \in g} z_i\right),
  $$
  and each heatmap entry is
  $$
  d_{\mathrm{emb}}(g, h) = 1 - \cos(c_g, c_h).
  $$
  The diagonal compares each centroid to itself, so it should be near zero. Off-diagonal cells compare one variant centroid against another variant centroid. Smaller values mean two Sigma-35 variant centroids stay close in the representation; larger values mean they are farther apart.
rationale_md: This is appendix support for the ordinal audit. A better candidate tends to keep nearby ladder neighbors relatively close and farther-apart variants more separated, but the heatmap is still only a secondary consistency check rather than a primary selector.
plot_details_md: |
  Read this as a group-level audit, not a row-level scatter. For a variant such
  as `B`, the code gathers rows with `sig35_variant == b`, averages their
  normalized vectors, and L2-normalizes that average to produce \(c_b\). It does
  the same for `C`, `D`, `E`, and `F`. A heatmap square then asks how far two of
  those group summaries are from each other in cosine distance.

  So \(c_g\) and \(c_h\) are not individual promoters. They are centroids:
  representative vectors for all rows in variant group \(g\) and variant group
  \(h\). The diagonal is each group compared with itself. The off-diagonal
  entries are the substantive comparisons, for example `B` versus `F` or `D`
  versus `E`.

  A coherent ladder does not require a perfect linear gradient in every panel.
  The intended sanity check is simpler: adjacent ladder groups should not be
  completely indistinguishable, distant ladder groups should often be farther
  apart than neighbors, and candidate views should not collapse all B-F
  centroids into one tight block.
limitations_md: Heatmaps remain pairwise summaries of centroid geometry and do not capture within-variant dispersion or higher-order manifold structure.
failure_modes_md: Small-cohort instability, confounding by non-Sigma-35 design features, or accidentally reintroducing non-audit reference categories can exaggerate apparent ordinal structure.
