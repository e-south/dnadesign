plot_id: candidate_decision_frontier
question: Which candidate best balances design structure and ordered Sigma-35 signal after the health and context checks?
decision_role: primary
encoding: Single-panel representation tradeoff plot over the healthy 7B study-facing candidates, where x is balanced design-family separation, y is Sigma-35 ordinal Spearman, point size reflects retained-component effective rank, and shape indicates the candidate family.
scope: >-
  The healthy 7B study-facing candidates summarized from the persisted health,
  design-structure, and Sigma-35 scalar tables. The plotted candidates are
  row-level summaries produced from causal Evo 2 token states: anchor-source
  `seq_mean`, forward 1 kb context `anchor_mean`, and equal-block forward/RC
  context `anchor_mean` concat. Context rows are joined for provenance in the
  scalar artifact, but context retention is not a visible encoding in this
  two-axis plot. Gate-failed output-layer-mean candidates are adjudicated in the
  preceding health gate rather than repeated here.
guardrails:
  - Read this figure as a synthesis of the healthy-candidate review path, not a replacement for the health gate or the direct context comparison.
  - Read the row-level bridge plots before treating small point-to-point differences as meaningful.
caption: Representation tradeoff across the first-class candidate views.
alt_text: >-
  Scatter plot comparing balanced design-family separation and Sigma-35 ordinal
  Spearman across the healthy study-facing candidate summaries: anchor-source
  causal mean, forward context anchor-span mean, and equal-block
  forward/reverse-complement anchor-span concat.
preprocessing_md: >-
  This plot reuses persisted scalar summaries rather than recomputing row-level
  geometry. Each contributing summary already follows the study contract of
  view-level standardization plus row L2 normalization before cosine-based
  metrics are formed. The plotted candidate names refer to stored row vectors,
  not raw sequences: `seq_mean` averages all emitted token positions,
  `anchor_mean` averages the emitted anchor span, and the bidirectional
  candidate is a block-standardized, block-L2-normalized concat of forward and
  reverse-complement anchor-span summaries along the feature axis.
math_md: |
  Point size is the retained-component effective rank from the sampled PCA reducer summary
  $$
  r_{\mathrm{eff}} = \exp\!\left(-\sum_i p_i \log p_i\right),
  \qquad
  p_i = \frac{\lambda_i}{\sum_j \lambda_j},
  $$
  where the $\lambda_i$ values are the positive explained-variance ratios among retained PCA components. In plain language: if retained variance is spread across many retained directions, $r_{\mathrm{eff}}$ is larger; if one retained direction dominates, $r_{\mathrm{eff}}$ moves toward 1.

  The x axis is the balanced design-family separation ratio
  $$
  S_{\mathrm{design}}^{\mathrm{balanced}}
  =
  \frac{\operatorname{mean}\!\left(d_{\mathrm{between}}\right)}
       {\operatorname{mean}\!\left(d_{\mathrm{within}}\right)},
  $$
  where between-family centroid distances are divided by within-family distances after balancing the synthetic cohorts by Sigma-35 variant and spacer length. In plain language: higher means design families stay farther apart than their internal spread even after controlling the easy design imbalances.

  The y axis is the Sigma-35 ordinal Spearman
  $$
  \rho_{\mathrm{sig35}}
  =
  \operatorname{Spearman}\!\left(\Delta_{\mathrm{expected}}, \Delta_{\mathrm{observed}}\right),
  $$
  the rank correlation between the expected Sigma-35 ladder gaps and the observed centroid-distance gaps in the embedding. In plain language: higher means the space preserves the intended $f \gt e \gt d \gt c \gt b$ ordering more faithfully; values near 0 mean weak ordinal structure, and negative values would mean the ordering is inverted or confused.
rationale_md: |
  This plot is a synthesis, not a new selector. A candidate is more attractive when it sits farther right and higher up without having failed the prior health gate, because that means it preserves both balanced design-family structure and the intended Sigma-35 order.

  Effective rank is kept as point size rather than a third axis. It is a secondary tie-breaker: among candidates that already look good on the two main decision axes, a larger point suggests the representation is less collapsed and spreads variance across more usable directions.
plot_details_md: |
  Read the axes in this order:

  - **Balanced design-family separation ratio:** how cleanly the family structure survives after balancing away the easy Sigma-35 and spacer imbalances.
  - **Sigma-35 ordinal Spearman:** how faithfully the candidate respects the intended Sigma-35 strength ladder.
  - **Effective-rank point size:** how distributed the retained PCA variance remains once the space is centered.

  A point is not “better” just because it is larger. Larger size only strengthens the case when the candidate is already competitive on the x and y axes.
limitations_md: A two-axis synthesis still compresses a multi-panel decision process and cannot express every tradeoff, uncertainty interval, or context-specific caveat.
failure_modes_md: If the bridge plots and direct context comparison are skipped, the healthy candidates can still look closer than they really are for the actual decision.
