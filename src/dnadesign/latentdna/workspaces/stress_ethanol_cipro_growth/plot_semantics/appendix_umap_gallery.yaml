plot_id: appendix_umap_gallery
question: How does the shared promoter population distribute in the persisted UMAP for each candidate space?
decision_role: appendix
encoding: Multi-panel persisted UMAP scatter gallery with hue-only recoloring across the canonical candidate inventory.
scope: Persisted projection artifacts for the shared promoter population.
guardrails:
  - Use the persisted layout for orientation only. Candidate ranking stays on the scalar summaries.
  - Hue changes recolor fixed coordinates. They do not change the fit.
caption: Appendix UMAP scatter orientation gallery for the canonical candidate inventory.
alt_text: Multi-panel UMAP projection gallery for the shared promoter population across the candidate representation spaces, with fixed coordinates and metadata recoloring.
preprocessing_md: Uses persisted projection artifacts and their recorded fit metadata. UMAP uses the stored view matrices unless the projection manifest says otherwise.
math_md: |
  The plotted coordinates are the persisted UMAP embedding coordinates for each candidate representation space.
  Fit parameters live in the stored projection manifest, and recoloring changes only the metadata overlay, not the UMAP coordinates.
rationale_md: Keeps a projection view available for inspection while the review path stays on explicit scalar summaries.
limitations_md: Projection geometry is distorted, is not directly comparable to the primary cosine summaries, and can hide or invent apparent neighborhood structure.
failure_modes_md: Visual separation or density artifacts can look stronger than the underlying high-dimensional structure.
