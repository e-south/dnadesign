plot_id: context_robustness_summary
question: Does added construct context preserve the anchor-level design geometry or dilute it?
decision_role: primary
encoding: Candidate-by-metric bar panels for anchor-vs-context self cosine and cohort-distance retention across design family, regulator composition, and Sigma-35.
scope: A 4,096-row design-family-stratified sample of aligned anchor/context pairs for the canonical representation families, with one construct context per promoter anchor.
guardrails:
  - Use this panel to judge anchor-to-context geometry retention for matched promoters.
  - Reference-promoter alignment belongs in the appendix reference panel.
caption: Context-robustness summary across aligned anchor and construct-context representations.
alt_text: Bar-panel summary showing how much 1 kb context-derived sequence means and anchor-span means preserve the anchor-source geometry across design-family, regulator-composition, and Sigma-35 cohorts.
preprocessing_md: Anchor and context vectors are each standardized by view and row-normalized before self-cosine or centroid-distance retention is computed on the persisted 4,096-row design-family-stratified sample. The anchor vector is a causal mean over the source insert; context vectors are causal means from full 1 kb emitted sequences, either over the whole emitted context or over the Construct-provided anchor span. Zero-variance columns are set to 0.0 after scaling and zero-norm rows remain 0.0.
math_md: |
  Row-level stability uses
  $$
  \mathrm{self\_cos}_i = \cos\left(z_i^{\mathrm{anchor}}, z_i^{\mathrm{context}}\right).
  $$
  For each annotation axis \(A\), retention uses
  $$
  \mathrm{retention}_A =
  \rho_{\mathrm{Pearson}}\left(
    \mathrm{upper}(D_A^{\mathrm{anchor}}),
    \mathrm{upper}(D_A^{\mathrm{context}})
  \right),
  $$
  where each \(D_A\) is the cohort centroid-distance matrix for that view.
rationale_md: Answers whether adding a full 1 kb causal Evo2 pass preserves anchor-level design geometry, and whether whole-sequence `seq_mean` dilutes anchor-local structure relative to bounded `anchor_mean`.
limitations_md: This panel reports a sample estimate rather than the full aligned population, and high agreement can still preserve nuisance structure.
failure_modes_md: The summary fails fast if anchor and context do not retain the same non-degenerate cohort pairs for a reported annotation axis. A family can still look stable overall while context preserves nuisance structure.
