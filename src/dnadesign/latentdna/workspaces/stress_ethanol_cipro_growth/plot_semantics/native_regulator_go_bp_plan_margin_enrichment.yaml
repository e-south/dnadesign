plot_id: native_regulator_go_bp_plan_margin_enrichment
question: Which BioCyc GO biological-process terms attached to RegulonDB regulators are enriched among native promoter-core60 rows with high synthetic-plan margins?
decision_role: appendix
scope: Parent-resolved native RegulonDB core60 promoters transferred into the study pDual10 1 kb context, with BioCyc KB 29.6 GO biological-process terms projected through associated regulators.
encoding: Four plan panels show top GO biological-process terms in the 10% native margin tail after support filters; bar length is enrichment ratio over native-background prevalence and the dashed line marks no enrichment.
guardrails:
  - Treat this as exploratory source-backed term enrichment, not as a candidate-selection rule.
  - Do not treat GO terms attached to native regulators as mechanistic labels for synthetic promoters.
  - Interpret broad terms through enrichment over background prevalence, not raw counts.
caption: BioCyc GO biological-process enrichment among fixed synthetic-plan margin tails.
alt_text: Four-panel bar chart showing background, ethanol, ciprofloxacin, and dual synthetic-plan margin tails. Each panel lists top BioCyc GO biological-process terms associated with native RegulonDB regulators, with bar length indicating enrichment ratio over native background prevalence.
preprocessing_md: >-
  The table reuses the persisted native plan-margin score and tail-membership
  artifact, then joins BioCyc KB 29.6 SmartTable GO biological-process terms
  from the USR `promoter_regulator_go_terms` sidecar. Each native promoter
  counts at most once per GO term even when multiple regulator rows carry that
  term.
math_md: |
  The tail sets come from the regulator plan-margin scalar:

  $$
  \mathrm{margin}(i,p)=\mathrm{sim}(i,p)-\max_{q \neq p}\mathrm{sim}(i,q)
  $$

  For each plan-tail set and GO term, enrichment uses a promoter-level 2x2
  table. A promoter is term-positive when at least one associated regulator has
  that source-backed BioCyc GO biological-process term.

  Let \(T_p\) be the fixed tail for plan \(p\), \(U\) be all parent-resolved
  native promoters, and \(G\) be the set of promoters whose associated
  regulators carry a GO biological-process term. The plotted count table is:

  $$
  a=|T_p \cap G|,\quad b=|G \setminus T_p|,\quad
  c=|T_p \setminus G|,\quad d=|U|-a-b-c
  $$

  $$
  \mathrm{tail\_fraction}=\frac{a}{|T_p|},\quad
  \mathrm{background\_fraction}=\frac{|G|}{|U|}
  $$

  $$
  \mathrm{enrichment\_ratio}=
  \frac{\mathrm{tail\_fraction}}{\mathrm{background\_fraction}}
  $$

  The one-sided hypergeometric p-value asks how surprising \(a\) or more
  term-positive promoters would be in a tail of size \(|T_p|\), given \(|G|\)
  term-positive promoters in \(U\).
rationale_md: >-
  Regulator names are useful but terse. This companion plot gives a
  biology-facing, source-backed summary of the same latent tails by asking which
  BioCyc biological-process annotations are overrepresented among the native
  promoters in each plan-specific margin tail. Biological-process terms are
  shown separately from regulator names so the reader can distinguish source
  association structure from ontology-level interpretation.
plot_details_md: >-
  The plotted surface uses `tail_mode == margin_top_quantile`,
  `threshold == 0.10`, `passes_min_support == true`, and
  `passes_min_tail_hits == true`. GO terms whose source names begin with
  `obsolete ` are excluded by config and counted in scalar stats. Each label
  includes tail hits over total native promoter support. Text annotations report
  q-values where available.
limitations_md: >-
  BioCyc GO terms annotate regulators or regulator genes, not the transferred
  pDual10 core60 sequence directly. Broad or redundant GO terms may appear
  because many regulators share common biological-process annotations. The
  result supports cautious interpretation of native landmark tails, not
  validated causal biology.
failure_modes_md: >-
  Missing BioCyc sidecars, sparse term coverage, duplicate or blank term IDs,
  row-level rather than promoter-level term counting, threshold tuning after
  inspection, or using the term plot as OPAL input would invalidate the
  appendix claim.
