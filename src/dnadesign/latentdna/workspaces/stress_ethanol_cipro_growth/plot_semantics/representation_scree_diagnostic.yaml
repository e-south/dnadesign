plot_id: representation_scree_diagnostic
question: How concentrated is the retained variance spectrum for each candidate representation after sampled reduction?
decision_role: appendix
encoding: Multi-panel explained-variance and cumulative-variance scree curves for the candidate reducer summaries.
scope: Sample-based PCA reducer summaries for the canonical candidate inventory.
guardrails:
  - Use this as a diagnostic companion to the health summary.
  - Visual variance decay does not say which directions matter for later modeling.
caption: PCA scree diagnostic for the canonical candidate inventory.
alt_text: Multi-panel scree curves showing explained and cumulative retained variance for each stored candidate representation, including mean-pooled and concat-derived views.
preprocessing_md: Uses the persisted sampled PCA reducer summaries for each candidate representation. The curves describe variance in stored row-level summaries after the view has already been mean-pooled or derived; they do not expose the original Evo2 token grid.
math_md: |
  Each scree panel shows the retained variance ratios
  $$
  p_i = \frac{\lambda_i}{\sum_j \lambda_j}
  $$
  together with the cumulative sum
  $$
  \sum_{k \le i} p_k.
  $$
rationale_md: Provides a transparent appendix diagnostic behind the condensed representation-health gate.
limitations_md: Reducer summaries are sample-based and low-dimensional, so they do not expose the full original spectrum.
failure_modes_md: Visually smooth decay can hide collapse when variance is dominated by one nuisance direction.
