plot_id: context_pair_summary
question: "How much do the 1 kb context views change the anchor-source insert geometry?"
decision_role: primary
encoding: Two-panel metric summary showing median self-cosine and median L2 shift for aligned anchor-source insert -> 1 kb anchor-span mean and full-sequence mean pairs in the 7B intermediate family.
scope: Densegen-only aligned 7B intermediate row-level context-delta scalars aggregated to pair medians for the retained context comparisons.
guardrails:
  - Read this as the direct anchor-vs-context delta; the broader context-robustness panel remains the cohort-retention summary.
  - Higher self cosine and lower shift L2 indicate less destructive contextualization, not promoter activity.
caption: Anchor vs 1 kb context shift.
alt_text: Two bar panels reporting median context self-cosine and median context-shift L2 for aligned comparisons between the anchor-source mean and 1 kb context-derived sequence or anchor-span means.
preprocessing_md: The source row-level scalars reuse persisted aligned anchor/context pairs after view-level standardization and row L2 normalization. The anchor-source view is a causal `seq_mean` over the emitted insert. The context views come from full 1 kb causal passes and then either average all emitted positions (`seq_mean`) or only the Construct-provided anchor span (`anchor_mean`). This plot only aggregates those persisted rows to medians.
math_md: |
  The two summary metrics are
  $$
  \mathrm{median}_i\ \cos\left(z_i^{\mathrm{anchor}}, z_i^{\mathrm{context}}\right)
  $$
  and
  $$
  \mathrm{median}_i\ \left\|z_i^{\mathrm{anchor}} - z_i^{\mathrm{context}}\right\|_2.
  $$
rationale_md: This is the compact check for whether adding 1 kb context preserves anchor-local geometry, and whether bounded anchor-span pooling inside the 1 kb causal pass stays closer to the mixed-length anchor-source insert representation than whole-sequence pooling. A high self-cosine means the contextualized row remains close to its anchor-source counterpart; it does not mean the representation is phenotype-correct.
limitations_md: Median summaries intentionally suppress subgroup shape and tail behavior. Use the main context-robustness summary or the underlying row-level scalars when subgroup diagnostics are needed.
failure_modes_md: If the two comparisons are read without the surrounding retention panel, a modest median win can be mistaken for a complete context argument.
