plot_id: sigma35_ordinal_audit
question: Do the candidate spaces preserve a coherent ordered metadata axis before assay data exists?
decision_role: primary
encoding: >-
  Candidate-by-metric bar panels with bootstrap intervals for the Spearman
  summary rows, plus Kendall and permutation support for the DenseGen Sigma-35
  audit group. These Spearman and Kendall values are centroid-distance-gap
  statistics, not the row-level endpoint-margin annotations shown in the
  ordinal swarm gallery.
scope: >-
  This scalar panel audits the DenseGen synthetic Sigma-35 f/e/d/c/b design
  ladder on the stratified candidate samples. It uses the same declared order
  as the ordinal swarm gallery, but asks a different question: whether
  farther-apart Sigma-35 classes are farther apart as class centroids in
  embedding space. W collection and Anderson iGEM standards are audited
  separately as collection-specific strength standards, and can also be
  inspected in the ordinal swarm gallery selector; their numeric scales are not
  pooled with Sigma-35.
guardrails:
  - Read this panel as an ordered metadata-axis check, not as an activity estimate.
  - Do not interpret these Spearman and Kendall values as the same quantities annotated on the ordinal swarm gallery; the shared order file is the same, but the measured geometry differs.
  - Do not mix categorical ordinal labels and numeric strength metadata in one pooled score; use one selected group at a time.
caption: Sigma-35 ordinal audit across candidate representations.
alt_text: Bar-panel summary showing Sigma-35 ordinal correlation statistics and permutation support for each candidate representation, with the declared DenseGen f/e/d/c/b ladder kept separate from reference-standard strength scales.
preprocessing_md: Sigma-35 centroid distances are computed after view-level standardization and row L2 normalization on the sampled candidate rows; zero-variance columns are set to 0.0 after scaling and zero-norm rows remain 0.0. The candidate rows are already stored summaries from causal Evo 2 token states or block-standardized forward/RC concat blocks, so the ordinal audit evaluates row-level latent geometry rather than tokenwise motifs.
math_md: |
  The audit compares expected rank gaps
  $$
  \Delta_{\mathrm{rank}}(g, h) = |r_g - r_h|
  $$
  to observed centroid distances
  $$
  d_{\mathrm{emb}}(g, h) = 1 - \cos(c_g, c_h).
  $$
  It reports global Spearman and Kendall correlations, a balanced Spearman, within-family and within-regulator mean Spearman summaries, and a shuffled-label permutation null for the global Spearman. The ordinal swarm gallery uses the same Sigma-35 order file but computes a row-level endpoint margin,
  $$
  m_{\mathrm{ord}}(x) =
  \cos(z_x,c_F) -
  \cos(z_x,c_B),
  $$
  then annotates rank correlation between row plot order and that margin. Thus this panel asks whether all pairwise class-centroid distances respect ordinal spacing; the swarm asks whether individual rows slide from B-like to F-like along the strong/weak endpoint axis.
rationale_md: >-
  Provides a focused pre-assay check for ordered metadata signal in the
  engineered Sigma-35 ladder. The scalar audit is stricter than the swarm in a
  different way because it checks all pairwise class-centroid gaps instead of a
  single F-vs-B row projection. Anderson and W strength metadata require
  collection-specific audits rather than a pooled ordinal scale.
limitations_md: >-
  This panel is Sigma-35-specific. Its Spearman and Kendall values should be
  compared with the ordinal swarm annotations as complementary evidence, not as
  matching numbers: both use the f/e/d/c/b order, but one summarizes
  centroid-distance gaps and the other summarizes row-level endpoint margins.
  Reference-standard ordinal groups with numeric strength metadata use the same
  broad metric family elsewhere, but should be selected explicitly so Anderson,
  W collection, and DenseGen priors are not pooled.
failure_modes_md: Uncertain rank order, mixed strength scales, family-specific confounding, or weak sample coverage for particular variants can make ordinal structure appear stronger or weaker than it is.
