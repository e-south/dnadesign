plot_id: design_centroid_margin_gallery
question: How does the full promoter population shift relative to ethanol, ciprofloxacin, and background centroids in each candidate space?
decision_role: appendix
encoding: Multi-panel scatter gallery of background-relative ethanol and ciprofloxacin centroid margins across the candidate inventory; the x-axis is ethanol-vs-background margin and the y-axis is ciprofloxacin-vs-background margin.
scope: The shared promoter population, including study controls and leakage-safe cohort margins.
guardrails:
  - Use this gallery for study-internal orientation across the full promoter population.
  - Judge candidate ranking from the design-structure and Sigma-35 summaries first.
caption: Internal design-centroid margin gallery across the candidate inventory.
alt_text: Scatter-panel gallery showing background-relative ethanol and ciprofloxacin centroid margins for the full promoter population in each candidate representation; panels include anchor-source, context-derived, reverse-complement, and bidirectional-summary views.
preprocessing_md: >-
  Margins are computed after view-level standardization and row L2
  normalization, using leave-one-out centroids for rows that belong to the target
  or control cohorts. The plotted views are stored row summaries: `seq_mean`
  averages all emitted token positions, `anchor_mean` averages a bounded emitted
  anchor span, and the bidirectional panel concatenates normalized forward and
  reverse-complement anchor-span summaries.
math_md: |
  The two plotted margins are
  $$
  m_{\mathrm{eth}}(x) = \cos(z_x, c_{\mathrm{eth}}) - \cos(z_x, c_{\mathrm{bg}})
  $$
  and
  $$
  m_{\mathrm{cipro}}(x) = \cos(z_x, c_{\mathrm{cipro}}) - \cos(z_x, c_{\mathrm{bg}}).
  $$
  Cohort centroids come from the study-internal design families, and leave-one-out centroids are used when a row belongs to the target or control cohort.
rationale_md: Gives an intuitive, length-matched orientation surface without letting reference promoters or neighborhood heuristics drive candidate selection.
limitations_md: Two-dimensional margins are still a projection of higher-dimensional geometry and cannot substitute for the summary metrics.
failure_modes_md: Extreme density can visually hide small subcohorts, and centroid leakage would still bias rows if leave-one-out handling regressed.
