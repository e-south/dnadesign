plot_id: reference_core60_pca_scree
question: How concentrated is variance in the reference promoter core60 Evo 2 7B intermediate embedding space?
decision_role: appendix
encoding: PCA scree curve showing per-component and cumulative explained variance for the reference core60 view.
scope: Reference promoter core60 Evo 2 7B intermediate embeddings reduced with the persisted PCA reducer.
guardrails:
  - Interpret PCA variance as a representation diagnostic, not as promoter strength evidence.
  - Use the reducer summary for exact explained-variance values.
  - Small sample size can make component structure unstable.
caption: PCA scree diagnostic for reference promoter core60 embeddings.
alt_text: Line chart of PCA explained variance for 48 reference promoter core60 embeddings, showing that the first principal component explains most variance.
preprocessing_md: Uses the persisted PCA reducer fit on the reference core60 intermediate embedding matrix.
math_md: |
  The curve plots the PCA explained variance ratio for each retained component and the cumulative sum across components.
  Component values are stored in the reducer summary manifest.
rationale_md: Checks whether the reference embedding space is low-rank or dominated by one component before interpreting correlations against annotations.
limitations_md: The diagnostic is sample-size limited and does not identify which sequence features drive each component.
failure_modes_md: Stale reducer artifacts, too few records, or interpreting PC axes without loadings can lead to unsupported conclusions.
docs_refs:
  - src/dnadesign/latentdna/docs/concepts/coordinate-spaces.md
  - src/dnadesign/latentdna/docs/reference/artifact-manifests.md
