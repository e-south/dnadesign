plot_id: balanced_design_family_margin_gallery
question: Does design-family separation remain visible across the full promoter population when the balanced centroid directions behind the scalar metric are used?
decision_role: primary
encoding: Two-panel scatter gallery of full-population ethanol-vs-background and ciprofloxacin-vs-background centroid margins across the active 7B intermediate candidates, with the family centroids derived from balanced study subsets.
scope: The full shared promoter population in the active 7B intermediate candidates, while the family centroid directions are computed from balanced synthetic subsets so the explanatory axes are not driven by Sigma-35 or spacer imbalance.
guardrails:
  - Use this gallery as the row-level bridge for the balanced design-family separation metric, not as a replacement for the scalar summary.
  - Treat the axes as study-internal design-family directions, not phenotype evidence.
  - Judge candidate ranking from the metric summary first and use this gallery to explain the score.
caption: Balanced design-family margin gallery across the main 7B intermediate candidates.
alt_text: Scatter-panel gallery showing ethanol-versus-background and ciprofloxacin-versus-background centroid margins for the full promoter population in the 60 bp anchor and 1 kb context anchor-mean intermediate spaces, with balanced study-internal family directions.
preprocessing_md: Rows are first standardized within view and L2-normalized. The plotted population stays full, while the underlying design-family centroid directions are computed from balanced synthetic subsets over `design_family`, `sig35_variant`, and `spacer_length`, with leave-one-out handling for in-cohort rows that participate in those balanced centroids.
math_md: |
  The plotted margins are
  $$
  m_{\mathrm{eth}}(x) = \cos(z_x, c_{\mathrm{eth}}) - \cos(z_x, c_{\mathrm{bg}})
  $$
  and
  $$
  m_{\mathrm{cipro}}(x) = \cos(z_x, c_{\mathrm{cipro}}) - \cos(z_x, c_{\mathrm{bg}}).
  $$
  Positive values mean the row is closer to the target family centroid than to background on that axis. The centroids are computed on the balanced synthetic subset, with leave-one-out handling when a row belongs to a scored cohort.
rationale_md: This gallery is the row-level witness for the balanced design-family separation ratio. A better candidate keeps the family clouds more directionally separated even though the plotted population is still the full library, so the balanced scalar score is not just a small-sample artifact.
limitations_md: This gallery is still a two-axis projection of higher-dimensional geometry. The balanced centroid directions make the axes fairer, but the scalar metric still governs adjudication.
failure_modes_md: If balanced-centroid construction or leave-one-out handling regresses, the family quadrants can look cleaner than they really are.
