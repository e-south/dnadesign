plot_id: reference_core60_strength_umap
question: Where do annotated reference promoter standards fall in the core60 Evo 2 7B intermediate UMAP, and is numeric strength visibly organized?
decision_role: appendix
encoding: UMAP scatter of reference core60 embeddings colored by numeric promoter-standard strength, with missing numeric values rendered as neutral points.
scope: Reference promoter core60 records with completed Evo 2 7B intermediate embedding sidecars and available promoter-standard metadata.
guardrails:
  - Numeric strength annotations may come from different collections or measurement conventions; compare within collection before making biological claims.
  - UMAP coordinates are exploratory and should not be treated as calibrated axes.
  - Missing numeric strengths remain uncolored or neutral depending on renderer behavior and should be counted in the manifest or sidecar summary.
caption: Reference promoter core60 UMAP colored by numeric annotation strength.
alt_text: Scatter plot of 48 reference promoter core60 causal mean-pooled embeddings projected with UMAP, colored by numeric promoter strength where available, with a continuous colorbar for annotated records.
preprocessing_md: >-
  Uses the materialized reference core60 intermediate embedding view and
  persisted UMAP projection. Each core60 vector is an Infer `core60_mean`: an
  exact 60 bp forward sequence passed through Evo2, then mean-pooled over its
  token positions. Metadata are carried from USR reference promoter records
  through Construct and Infer sidecars.
math_md: |
  UMAP is fit on Evo 2 7B block26 intermediate embedding vectors mean-pooled
  over token positions in each reference core60 sequence. Because Evo2 is
  causal, each token state is prefix-conditioned in the emitted forward
  orientation.
  Color encodes `promoter_standard__strength_value_numeric` as a continuous hue; display names remain row metadata for interactive inspection rather than dense static labels.
rationale_md: Gives a compact inspection surface for whether known reference standards occupy sensible neighborhoods before using their metadata as plot hues or landmarks.
limitations_md: Strength values are sparse and may not share one scale across reference collections. UMAP geometry is non-linear and not a substitute for explicit correlation or distance statistics.
failure_modes_md: Mixed strength scales, missing numeric annotations, stale reference metadata, or overinterpreted UMAP axes can make visual trends look stronger than the underlying evidence.
