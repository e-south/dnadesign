plot_id: native_tf_axis_orientation_audit
question: Do native BaeR/CpxR- and LexA-associated promoters point in the DenseGen ethanol and cipro/SOS directions?
decision_role: appendix
scope: Planned native RegulonDB core60 promoters appended through the existing study pDual10 1 kb context handoff and embedded with the same forward/RC anchor-mean bidirectional view used for candidate-X triage.
encoding: Scatter of native promoter rows by ethanolness and ciproness, colored by the small TF bin used for the orientation audit.
guardrails:
  - Use this only as a pre-assay axis-orientation check.
  - Do not treat RegulonDB regulatory associations as assay labels or OPAL inputs.
  - Keep the TF set limited to BaeR, CpxR, and LexA for this stress-study audit.
caption: Native TF-axis orientation audit for the DenseGen ethanol and cipro/SOS directions.
alt_text: Scatter plot of pDual10-embedded native promoter rows with ethanolness on the x-axis and ciproness on the y-axis, colored by BaeR or CpxR, LexA, mixed, or neither TF association.
preprocessing_md: >-
  Synthetic DenseGen centroids are computed from the selected bidirectional
  1 kb anchor-mean representation. Native audit rows are filtered from the same
  view after `usr_regulondb_native_promoter_core60` has been appended through
  the shared anchor/context handoff. BaeR, CpxR, and LexA flags are joined from
  the USR regulatory-interaction sidecar instead of copied into the DenseGen
  candidate surface.
math_md: |
  The plotted margins are
  $$
  m_{\mathrm{eth}}(x)=\cos(z_x,c_{\mathrm{eth}})-\cos(z_x,c_{\mathrm{bg}})
  $$
  and
  $$
  m_{\mathrm{cipro}}(x)=\cos(z_x,c_{\mathrm{cipro}})-\cos(z_x,c_{\mathrm{bg}}).
  $$
  The companion test table runs one-sided Mann-Whitney checks for BaeR/CpxR
  rows on \(m_{\mathrm{eth}}\) and LexA rows on \(m_{\mathrm{cipro}}\), reporting
  medians, median differences, rank-biserial effect size, p-value method, and
  tie count.
rationale_md: >-
  This plot asks whether the pre-assay DenseGen axis names have any directional
  support from native promoters associated with the same regulators that
  motivated the synthetic designs. It does not broaden the study into a native
  promoter EDA project.
limitations_md: >-
  The RegulonDB native core60 rows and matching pDual10 context 7B sidecars must
  exist before this plot can render. The audit checks latent orientation only;
  it cannot validate ethanol or ciprofloxacin activity without measured
  condition-dependent promoter labels.
failure_modes_md: >-
  Missing regulatory-interaction sidecars, missing derived parent IDs,
  mismatched native-parent joins, mixed TF rows in the primary comparison, a
  separate native context dataset, or using native genomic context instead of
  the study pDual10 context handoff would invalidate the audit contract.
