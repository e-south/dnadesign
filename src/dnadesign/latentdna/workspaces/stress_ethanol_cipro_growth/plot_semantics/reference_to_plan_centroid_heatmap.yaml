plot_id: reference_to_plan_centroid_heatmap
question: Do native and synthetic reference landmarks map plausibly to DenseGen plan centroids when represented on comparable candidate-X manifolds?
decision_role: primary
scope: Configured reference rows or reference-set centroids compared with background, ethanol, ciprofloxacin, and dual-stress DenseGen centroids in high-dimensional cosine space.
encoding: Heatmap panels by candidate representation; cells are cosine similarities between reference entities and DenseGen plan centroids.
guardrails:
  - Use nearest-centroid margin from the scalar table as the evidence, not only heatmap color contrast.
  - Compare native-length and core60 reference entities separately; do not pool their sequence-scope contracts.
  - Treat diffuse margins as evidence that the references are weak landmarks under this representation, not as assay failure.
caption: Reference-to-DenseGen-plan centroid similarities for candidate-X views.
alt_text: Heatmap grid showing native, core60, and synthetic reference entities as rows, DenseGen plan centroids as columns, and high-dimensional cosine similarity as color for each candidate-X view.
preprocessing_md: >-
  Candidate matrices are standardized and row-normalized before DenseGen plan
  centroids and reference similarities are computed. Reference entities keep
  their sequence-scope identity: native-length rows, 60 bp core windows, and
  context-derived rows are not silently merged before nearest-plan margins are
  interpreted.
math_md: |
  For each reference vector \(z_r\) and plan centroid \(c_g\), the cell value is \(\cos(z_r, c_g)\). The scalar table also records the nearest plan and the margin between the best and second-best plan similarity.
rationale_md: Tests the length/core60 reference-normalization hypothesis without fitting a shared UMAP between Stress and ReguloDB. The useful question is whether same-scope reference summaries become more plan-specific, not whether every natural promoter must sit near a synthetic centroid.
limitations_md: The heatmap does not prove stress responsiveness. It tests whether selected reference landmarks have interpretable latent-space proximity to synthetic plan centroids.
failure_modes_md: Small reference sets, missing rows in a candidate sample, native-vs-core60 mismatch, or context orientation effects can make margins unstable.
