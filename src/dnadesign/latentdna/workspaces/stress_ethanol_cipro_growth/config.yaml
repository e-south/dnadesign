    section: Calibration
    question: Do BaeR/CpxR- and LexA-associated native promoters point in the DenseGen ethanol and cipro/SOS directions before batch-zero selection?
    summary: Optional overlay of native RegulonDB core60 rows appended to the existing pDual10 context handoff; it checks DenseGen axis orientation and is not an OPAL input.
