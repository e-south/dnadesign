    - kind: require_reference_set_in_every_panel
      value: true
  drag_qc:
    title: Drag QC
    summary: 20B expanded-context drag scalar that measures how much the 1 kb context window departs from anchor-aware pooling.
    question: Does full 1 kb context add drag beyond anchor-aware context in the primary 20B lane?
    section: QC
    recipe: drag_qc_recipe
