recipes:
  dataset_overview_recipe:
    steps:
      - &build_dataset_overview_counts
        id: build_dataset_overview_counts
        op: scalar.build
        params:
          scalar: dataset_overview_counts
          kind: dataset_overview
          source_ids: [anchor_60bp]
          reference_set_id: promoter_wildtype_primary
      - &render_dataset_overview
        id: render_dataset_overview
        op: plot.render
        depends_on: [build_dataset_overview_counts]
        params: {plot_id: dataset_overview}
  pre_assay_representation_triage_recipe:
    steps:
      - &materialize_ie7_anchor {id: materialize_intermediate_embedding_7b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_7b_anchor_60bp}}
      - &materialize_ie7_anchor_mean {id: materialize_intermediate_embedding_7b_full_context_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_full_context_anchor_mean}}
      - &align_ie7_anchor_mean {id: build_alignment_intermediate_embedding_7b_anchor_to_anchor_mean, op: alignment.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp, materialize_intermediate_embedding_7b_full_context_anchor_mean], params: {alignment: intermediate_embedding_7b_anchor_to_anchor_mean}}
      - &score_sample_ie7_anchor {id: build_scorecard_sample_intermediate_embedding_7b_anchor_60bp, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp], params: {sample: scorecard_sample_intermediate_embedding_7b_anchor_60bp, view: intermediate_embedding_7b_anchor_60bp, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_ie7_anchor_mean {id: build_scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_full_context_anchor_mean], params: {sample: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean, view: intermediate_embedding_7b_full_context_anchor_mean, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &pca_ie7_anchor {id: reduce_pca_intermediate_embedding_7b_anchor_60bp, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_7b_anchor_60bp], params: {view: intermediate_embedding_7b_anchor_60bp, run_id: pca_intermediate_embedding_7b_anchor_60bp, reduced_view_id: intermediate_embedding_7b_anchor_60bp_reduced, sample: scorecard_sample_intermediate_embedding_7b_anchor_60bp, dims: 16}}
      - &pca_ie7_anchor_mean {id: reduce_pca_intermediate_embedding_7b_full_context_anchor_mean, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean], params: {view: intermediate_embedding_7b_full_context_anchor_mean, run_id: pca_intermediate_embedding_7b_full_context_anchor_mean, reduced_view_id: intermediate_embedding_7b_full_context_anchor_mean_reduced, sample: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean, dims: 16}}
      - &design_margin_ie7_anchor
        id: build_design_centroid_margins_intermediate_embedding_7b_anchor_60bp
        op: scalar.build
        depends_on: [materialize_intermediate_embedding_7b_anchor_60bp]
        params:
          scalar: design_centroid_margins_intermediate_embedding_7b_anchor_60bp
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_anchor_60bp
          cohort_column: design_family
          leave_one_out: true
          margin_pairs:
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
            - {target_values: [ethanol_ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_dual_vs_background}
      - &design_margin_ie7_anchor_mean
        id: build_design_centroid_margins_intermediate_embedding_7b_full_context_anchor_mean
        op: scalar.build
        depends_on: [materialize_intermediate_embedding_7b_full_context_anchor_mean]
        params:
          scalar: design_centroid_margins_intermediate_embedding_7b_full_context_anchor_mean
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_full_context_anchor_mean
          cohort_column: design_family
          leave_one_out: true
          margin_pairs:
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
            - {target_values: [ethanol_ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_dual_vs_background}
      - &balanced_design_margin_ie7_anchor
        id: build_balanced_design_family_margins_intermediate_embedding_7b_anchor_60bp
        op: scalar.build
        params:
          scalar: balanced_design_family_margins_intermediate_embedding_7b_anchor_60bp
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_anchor_60bp
          cohort_column: design_family
          leave_one_out: true
          balance_group_column: design_family
          balance_columns: [sig35_variant, spacer_length]
          balance_reference_only: true
          required_group_values: [background_only, ethanol, ciprofloxacin, ethanol_ciprofloxacin]
          exclude_group_values: [control]
          seed: 17
          margin_pairs:
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
            - {target_values: [ethanol_ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_dual_vs_background}
      - &balanced_design_margin_ie7_anchor_mean
        id: build_balanced_design_family_margins_intermediate_embedding_7b_full_context_anchor_mean
        op: scalar.build
        params:
          scalar: balanced_design_family_margins_intermediate_embedding_7b_full_context_anchor_mean
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_full_context_anchor_mean
          cohort_column: design_family
          leave_one_out: true
          balance_group_column: design_family
          balance_columns: [sig35_variant, spacer_length]
          balance_reference_only: true
          required_group_values: [background_only, ethanol, ciprofloxacin, ethanol_ciprofloxacin]
          exclude_group_values: [control]
          seed: 17
          margin_pairs:
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
            - {target_values: [ethanol_ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_dual_vs_background}
      - &sigma35_stress_margins_ie7_anchor
        id: build_sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
        op: scalar.build
        params:
          scalar: sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_anchor_60bp
          cohort_column: design_family
          leave_one_out: true
          margin_pairs:
            - {cohort_column: sig35_variant, target_values: [f], control_values: [b], output_column: sig35_margin_f_vs_b}
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
      - &sigma35_stress_margins_ie7_anchor_mean
        id: build_sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
        op: scalar.build
        params:
          scalar: sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
          kind: cohort_similarity_margin
          view_id: intermediate_embedding_7b_full_context_anchor_mean
          cohort_column: design_family
          leave_one_out: true
          margin_pairs:
            - {cohort_column: sig35_variant, target_values: [f], control_values: [b], output_column: sig35_margin_f_vs_b}
            - {target_values: [ethanol], control_values: [background_only], output_column: synthetic_margin_ethanol_vs_background}
            - {target_values: [ciprofloxacin], control_values: [background_only], output_column: synthetic_margin_cipro_vs_background}
      - &build_representation_health_summary_metrics
        id: build_representation_health_summary_metrics
        op: scalar.build
        depends_on:
          - reduce_pca_intermediate_embedding_7b_anchor_60bp
          - reduce_pca_intermediate_embedding_7b_full_context_anchor_mean
        params:
          scalar: representation_health_summary_metrics
          kind: representation_health_summary
          collapse_rules:
            effective_rank_min: 2.0
            pc1_fraction_max: 0.80
            pairwise_distance_iqr_min: 0.01
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp, sample_id: scorecard_sample_intermediate_embedding_7b_anchor_60bp, reducer_id: pca_intermediate_embedding_7b_anchor_60bp}
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean, sample_id: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean, reducer_id: pca_intermediate_embedding_7b_full_context_anchor_mean}
      - &build_design_structure_summary_metrics
        id: build_design_structure_summary_metrics
        op: scalar.build
        depends_on:
          - build_scorecard_sample_intermediate_embedding_7b_anchor_60bp
          - build_scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean
        params:
          scalar: design_structure_summary_metrics
          kind: design_structure_summary
          bootstrap_iterations: 100
          seed: 17
          balance_columns: [sig35_variant, spacer_length]
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp, sample_id: scorecard_sample_intermediate_embedding_7b_anchor_60bp}
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean, sample_id: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean}
      - &build_sigma35_ordinal_audit_metrics
        id: build_sigma35_ordinal_audit_metrics
        op: scalar.build
        depends_on:
          - build_scorecard_sample_intermediate_embedding_7b_anchor_60bp
          - build_scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean
        params:
          scalar: sigma35_ordinal_audit_metrics
          kind: sigma35_ordinal_audit
          sig35_order_path: study_inputs/sig35_order.yaml
          bootstrap_iterations: 100
          permutations: 100
          seed: 17
          balance_columns: [design_family, spacer_length]
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp, sample_id: scorecard_sample_intermediate_embedding_7b_anchor_60bp}
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean, sample_id: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean}
      - &build_sigma35_centroid_distance_ie7_anchor
        id: build_sigma35_centroid_distance_intermediate_embedding_7b_anchor_60bp
        op: scalar.build
        params:
          scalar: sigma35_centroid_distance_intermediate_embedding_7b_anchor_60bp
          kind: sigma35_centroid_distance
          sig35_order_path: study_inputs/sig35_order.yaml
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp}
      - &build_sigma35_centroid_distance_ie7_anchor_mean
        id: build_sigma35_centroid_distance_intermediate_embedding_7b_full_context_anchor_mean
        op: scalar.build
        params:
          scalar: sigma35_centroid_distance_intermediate_embedding_7b_full_context_anchor_mean
          kind: sigma35_centroid_distance
          sig35_order_path: study_inputs/sig35_order.yaml
          candidates:
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean}
      - &context_delta_ie7_anchor_mean
        id: build_context_delta_distribution_intermediate_embedding_7b_anchor_mean
        op: scalar.build
        depends_on: [build_alignment_intermediate_embedding_7b_anchor_to_anchor_mean]
        params:
          scalar: context_delta_distribution_intermediate_embedding_7b_anchor_mean
          kind: alignment_metrics
          alignment_id: intermediate_embedding_7b_anchor_to_anchor_mean
          left_view_id: intermediate_embedding_7b_full_context_anchor_mean
          right_view_id: intermediate_embedding_7b_anchor_60bp
          metadata_view_id: intermediate_embedding_7b_full_context_anchor_mean
          left_margin_source: null
          right_margin_source: null
          margin_deltas: []
          sample_size: 512
          sample_group_column: design_family
          where: {column: source_class, equals: densegen}
          table_sample_only: true
          seed: 17
      - &build_context_robustness_summary_metrics
        id: build_context_robustness_summary_metrics
        op: scalar.build
        depends_on:
          - build_alignment_intermediate_embedding_7b_anchor_to_anchor_mean
        params:
          scalar: context_robustness_summary_metrics
          kind: context_robustness_summary
          sample_size: 4096
          sample_group_column: design_family
          seed: 17
          pairs:
            - {pair_id: intermediate_embedding_7b_anchor_vs_anchor_mean, label: "7B intermediate: anchor vs context anchor mean", alignment_id: intermediate_embedding_7b_anchor_to_anchor_mean, anchor_view_id: intermediate_embedding_7b_anchor_60bp, context_view_id: intermediate_embedding_7b_full_context_anchor_mean}
      - &build_reference_alignment_summary_metrics
        id: build_reference_alignment_summary_metrics
        op: scalar.build
        depends_on:
          - build_scorecard_sample_intermediate_embedding_7b_anchor_60bp
          - build_scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean
        params:
          scalar: reference_alignment_summary_metrics
          kind: reference_alignment_summary
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp, sample_id: scorecard_sample_intermediate_embedding_7b_anchor_60bp}
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean, sample_id: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean}
      - &build_candidate_decision_frontier_metrics
        id: build_candidate_decision_frontier_metrics
        op: scalar.build
        depends_on:
          - build_representation_health_summary_metrics
          - build_design_structure_summary_metrics
          - build_sigma35_ordinal_audit_metrics
          - build_context_robustness_summary_metrics
        params:
          scalar: candidate_decision_frontier_metrics
          kind: candidate_decision_frontier
          health_scalar: representation_health_summary_metrics
          design_scalar: design_structure_summary_metrics
          sigma35_scalar: sigma35_ordinal_audit_metrics
          context_scalar: context_robustness_summary_metrics
          candidate_ids:
            - intermediate_embedding_7b_anchor_60bp
            - intermediate_embedding_7b_full_context_anchor_mean
          context_pairs:
            - {candidate_id: intermediate_embedding_7b_anchor_60bp, pair_id: intermediate_embedding_7b_anchor_vs_anchor_mean}
            - {candidate_id: intermediate_embedding_7b_full_context_anchor_mean, pair_id: intermediate_embedding_7b_anchor_vs_anchor_mean}
          annotation_labels:
            - {candidate_id: intermediate_embedding_7b_anchor_60bp, label: "60 bp anchor"}
            - {candidate_id: intermediate_embedding_7b_full_context_anchor_mean, label: "1 kb anchor mean"}
      - &build_context_pair_summary_metrics
        id: build_context_pair_summary_metrics
        op: scalar.build
        depends_on:
          - build_context_delta_distribution_intermediate_embedding_7b_anchor_mean
        params:
          scalar: context_pair_summary_metrics
          kind: context_pair_summary
          comparisons:
            - {scalar_id: context_delta_distribution_intermediate_embedding_7b_anchor_mean, comparison_id: intermediate_embedding_7b_anchor_vs_anchor_mean, comparison_label: "1 kb anchor mean", comparison_role: context_anchor_mean}
      - &render_representation_health_summary
        id: render_representation_health_summary
        op: plot.render
        depends_on: [build_representation_health_summary_metrics]
        params: {plot_id: representation_health_summary}
      - &render_design_structure_summary
        id: render_design_structure_summary
        op: plot.render
        depends_on: [build_design_structure_summary_metrics]
        params: {plot_id: design_structure_summary}
      - &render_balanced_design_family_margin_gallery
        id: render_balanced_design_family_margin_gallery
        op: plot.render
        depends_on:
          - build_balanced_design_family_margins_intermediate_embedding_7b_anchor_60bp
          - build_balanced_design_family_margins_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: balanced_design_family_margin_gallery}
      - &render_sigma35_ordinal_audit
        id: render_sigma35_ordinal_audit
        op: plot.render
        depends_on: [build_sigma35_ordinal_audit_metrics]
        params: {plot_id: sigma35_ordinal_audit}
      - &render_sigma35_margin_ladder_gallery
        id: render_sigma35_margin_ladder_gallery
        op: plot.render
        depends_on:
          - build_sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
          - build_sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: sigma35_margin_ladder_gallery}
      - &render_sigma35_centroid_distance_gallery
        id: render_sigma35_centroid_distance_gallery
        op: plot.render
        depends_on:
          - build_sigma35_centroid_distance_intermediate_embedding_7b_anchor_60bp
          - build_sigma35_centroid_distance_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: sigma35_centroid_distance_gallery}
      - &render_sigma35_stress_margin_gallery
        id: render_sigma35_stress_margin_gallery
        op: plot.render
        depends_on:
          - build_sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
          - build_sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: sigma35_stress_margin_gallery}
      - &render_context_robustness_summary
        id: render_context_robustness_summary
        op: plot.render
        depends_on: [build_context_robustness_summary_metrics]
        params: {plot_id: context_robustness_summary}
      - &render_design_centroid_margin_gallery
        id: render_design_centroid_margin_gallery
        op: plot.render
        depends_on:
          - build_design_centroid_margins_intermediate_embedding_7b_anchor_60bp
          - build_design_centroid_margins_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: design_centroid_margin_gallery}
      - &render_reference_alignment_summary
        id: render_reference_alignment_summary
        op: plot.render
        depends_on: [build_reference_alignment_summary_metrics]
        params: {plot_id: reference_alignment_summary}
      - &render_context_pair_summary
        id: render_context_pair_summary
        op: plot.render
        depends_on:
          - build_context_pair_summary_metrics
        params: {plot_id: context_pair_summary}
      - &render_candidate_decision_frontier
        id: render_candidate_decision_frontier
        op: plot.render
        depends_on: [build_candidate_decision_frontier_metrics]
        params: {plot_id: candidate_decision_frontier}
      - &render_representation_scree_diagnostic
        id: render_representation_scree_diagnostic
        op: plot.render
        depends_on:
          - reduce_pca_intermediate_embedding_7b_anchor_60bp
          - reduce_pca_intermediate_embedding_7b_full_context_anchor_mean
        params: {plot_id: representation_scree_diagnostic}
  appendix_umap_gallery_recipe:
    steps:
      - *build_dataset_overview_counts
      - *render_dataset_overview
      - *materialize_ie7_anchor
      - *materialize_ie7_anchor_mean
      - *align_ie7_anchor_mean
      - *score_sample_ie7_anchor
      - *score_sample_ie7_anchor_mean
      - *pca_ie7_anchor
      - *pca_ie7_anchor_mean
      - *design_margin_ie7_anchor
      - *design_margin_ie7_anchor_mean
      - *balanced_design_margin_ie7_anchor
      - *balanced_design_margin_ie7_anchor_mean
      - *sigma35_stress_margins_ie7_anchor
      - *sigma35_stress_margins_ie7_anchor_mean
      - *build_representation_health_summary_metrics
      - *build_design_structure_summary_metrics
      - *build_sigma35_ordinal_audit_metrics
      - *build_sigma35_centroid_distance_ie7_anchor
      - *build_sigma35_centroid_distance_ie7_anchor_mean
      - *context_delta_ie7_anchor_mean
      - *build_context_robustness_summary_metrics
      - *build_context_pair_summary_metrics
      - *build_reference_alignment_summary_metrics
      - *build_candidate_decision_frontier_metrics
      - *render_representation_health_summary
      - *render_design_structure_summary
      - *render_balanced_design_family_margin_gallery
      - *render_sigma35_ordinal_audit
      - *render_sigma35_margin_ladder_gallery
      - *render_sigma35_stress_margin_gallery
      - *render_sigma35_centroid_distance_gallery
      - *render_context_robustness_summary
      - *render_context_pair_summary
      - *render_candidate_decision_frontier
      - *render_design_centroid_margin_gallery
      - *render_reference_alignment_summary
      - *render_representation_scree_diagnostic
      - &umap_sample_ie7_anchor {id: build_umap_sample_intermediate_embedding_7b_anchor_60bp, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp], params: {sample: umap_sample_intermediate_embedding_7b_anchor_60bp, view: intermediate_embedding_7b_anchor_60bp, strategy: all, seed: 17}}
      - &umap_sample_ie7_anchor_mean {id: build_umap_sample_intermediate_embedding_7b_full_context_anchor_mean, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_full_context_anchor_mean], params: {sample: umap_sample_intermediate_embedding_7b_full_context_anchor_mean, view: intermediate_embedding_7b_full_context_anchor_mean, strategy: all, seed: 17}}
      - &umap_ie7_anchor {id: fit_umap_intermediate_embedding_7b_anchor_60bp, op: projection.fit, depends_on: [build_umap_sample_intermediate_embedding_7b_anchor_60bp], params: {view: intermediate_embedding_7b_anchor_60bp, sample: umap_sample_intermediate_embedding_7b_anchor_60bp, run_id: umap_intermediate_embedding_7b_anchor_60bp, seed: 17}}
      - &umap_ie7_anchor_mean {id: fit_umap_intermediate_embedding_7b_full_context_anchor_mean, op: projection.fit, depends_on: [build_umap_sample_intermediate_embedding_7b_full_context_anchor_mean], params: {view: intermediate_embedding_7b_full_context_anchor_mean, sample: umap_sample_intermediate_embedding_7b_full_context_anchor_mean, run_id: umap_intermediate_embedding_7b_full_context_anchor_mean, seed: 17}}
