schema_version: latentdna.workspace.v1
workspace:
  id: stress_ethanol_cipro_growth
  title: Stress / ethanol / ciprofloxacin growth promoter study
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
  - svg
  - pdf
  - png
  neighbor_backend: auto
  memory_policy:
    warn_fraction_of_system_ram: 0.5
    fail_fraction_of_system_ram: 0.75
    require_override_above_fail: true
sources:
  anchor60:
    kind: usr
    root: ../../../usr/datasets
    dataset: promoter/stress_ethanol_cipro_anchor_set
    record_key: id
    subject_key: id
  ctx1k:
    kind: usr
    root: ../../../usr/datasets
    dataset: promoter/stress_ethanol_cipro_construct_contexts
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id
metadata:
  include:
  - usr_label__primary
  - densegen__plan
  - densegen__required_regulators
  - construct__template_id
  - template_id
  - construct__template_id
  - infer__evo2_7b__anchor_only_7b_features__log_likelihood__mean_per_token
  - infer__evo2_7b__template_1kb_7b_features__log_likelihood__mean_per_token
  - infer__evo2_20b__anchor_only_20b_features__log_likelihood__mean_per_token
  - infer__evo2_20b__template_1kb_20b_features__log_likelihood__mean_per_token
alignments:
  anchor_ctx_20b:
    left: z20_1k_anchor
    right: z20_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
  anchor_ctx_7b:
    left: z7_1k_anchor
    right: z7_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
  anchor_seq_20b:
    left: z20_1k_seq
    right: z20_1k_anchor
    "on": subject_key
    support: intersection
  anchor_seq_7b:
    left: z7_1k_seq
    right: z7_1k_anchor
    "on": subject_key
    support: intersection
  anchor_ctx_seq_20b:
    left: z20_1k_seq
    right: z20_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
  anchor_ctx_seq_7b:
    left: z7_1k_seq
    right: z7_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
  anchor_ctx_seq_logits20:
    left: logits20_1k_seq
    right: logits20_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
  anchor_ctx_seq_logits7:
    left: logits7_1k_seq
    right: logits7_60
    left_on:
    - construct__anchor_id
    right_on:
    - id
    support: intersection
views:
  z7_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 60bp
    role: committee_member
  z20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 60bp
    role: primary
  z7_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__anchor_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 1kb_anchor
    role: challenger
  z20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__anchor_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_anchor
    role: challenger
  z20_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_seq
    role: primary
  z7_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 1kb_seq
    role: committee_member
  logits20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 60bp
    role: challenger
  logits7_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      context: 60bp
    role: challenger
  logits20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__anchor_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 1kb_anchor
    role: challenger
  logits7_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__anchor_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      context: 1kb_anchor
    role: challenger
  logits20_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 1kb_seq
    role: challenger
  logits7_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      context: 1kb_seq
    role: challenger
  z20_60_l2:
    derive:
      kind: normalize
      view: z20_60
      method: l2
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 60bp
      normalization: l2
    role: appendix
  z20_1k_seq_l2:
    derive:
      kind: normalize
      view: z20_1k_seq
      method: l2
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_seq
      normalization: l2
    role: appendix
  delta20:
    derive:
      kind: vector_difference
      left: z20_1k_anchor
      right: z20_60
      alignment: anchor_ctx_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: primary
  delta7:
    derive:
      kind: vector_difference
      left: z7_1k_anchor
      right: z7_60
      alignment: anchor_ctx_7b
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: committee_member
  drag20:
    derive:
      kind: vector_difference
      left: z20_1k_seq
      right: z20_1k_anchor
      alignment: anchor_seq_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 1kb_drag
    role: challenger
  drag7:
    derive:
      kind: vector_difference
      left: z7_1k_seq
      right: z7_1k_anchor
      alignment: anchor_seq_7b
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 1kb_drag
    role: challenger
  construct_shift20:
    derive:
      kind: vector_difference
      left: z20_1k_seq
      right: z20_60
      alignment: anchor_ctx_seq_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 60bp_to_1kb_seq
    role: primary
  construct_shift20_unit:
    derive:
      kind: vector_difference
      left: z20_1k_seq_l2
      right: z20_60_l2
      alignment: anchor_ctx_seq_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 60bp_to_1kb_seq
      normalization: l2
    role: appendix
scalars:
  delta7_norm:
    derive:
      kind: vector_norm
      view: delta7
      norm: l2
  delta20_norm:
    derive:
      kind: vector_norm
      view: delta20
      norm: l2
  drag7_norm:
    derive:
      kind: vector_norm
      view: drag7
      norm: l2
  drag20_norm:
    derive:
      kind: vector_norm
      view: drag20
      norm: l2
  construct_shift20_norm:
    derive:
      kind: vector_norm
      view: construct_shift20
      norm: l2
  construct_shift20_unit_norm:
    derive:
      kind: vector_norm
      view: construct_shift20_unit
      norm: l2
  construct_self_cosine20:
    derive:
      kind: column_expression
      source: construct_shift20_unit_norm
      expression: 1 - (construct_shift20_unit_norm * construct_shift20_unit_norm) / 2
      output_column: construct_self_cosine20
  construct_self_cosine20_context_meta:
    derive:
      kind: select_columns
      source: construct_self_cosine20
      columns:
      - construct__anchor_id
      - usr_label__primary
      - design_family
      - design_regulator_composition
      - sigma70_variant
      - campaign_prior
      - source_class
      - infer__evo2_20b__anchor_only_20b_features__log_likelihood__mean_per_token
      - infer__evo2_20b__template_1kb_20b_features__log_likelihood__mean_per_token
      - construct_self_cosine20
  construct_shift20_norm_for_context_audit:
    derive:
      kind: select_columns
      source: construct_shift20_norm
      columns:
      - construct__anchor_id
      - construct_shift20_norm
  drag20_norm_for_context_audit:
    derive:
      kind: select_columns
      source: drag20_norm
      columns:
      - construct__anchor_id
      - drag20_norm
  context_audit_20b:
    derive:
      kind: join_tables
      sources:
      - construct_self_cosine20_context_meta
      - construct_shift20_norm_for_context_audit
      "on":
      - construct__anchor_id
  anchor20_ref_margins_spyp:
    derive:
      kind: column_expression
      source: anchor20_reference_distances
      expression: d_spyp - d_j23105
      output_column: d_spyp_centered
  anchor20_ref_margins_sulap:
    derive:
      kind: column_expression
      source: anchor20_ref_margins_spyp
      expression: d_sulap - d_j23105
      output_column: d_sulap_centered
  anchor20_ref_margins:
    derive:
      kind: column_expression
      source: anchor20_ref_margins_sulap
      expression: d_soxsp - d_j23105
      output_column: d_soxsp_centered
  anchor20_ref_margins_export_select:
    derive:
      kind: select_columns
      source: anchor20_ref_margins
      columns:
      - id
      - d_spyp_centered
      - d_sulap_centered
      - d_soxsp_centered
  anchor20_ref_margins_export:
    derive:
      kind: rename_columns
      source: anchor20_ref_margins_export_select
      renames:
        id: construct__anchor_id
  seq20_ref_margins_spyp:
    derive:
      kind: column_expression
      source: seq20_reference_distances
      expression: d_spyp - d_j23105
      output_column: d_spyp_centered
  seq20_ref_margins_sulap:
    derive:
      kind: column_expression
      source: seq20_ref_margins_spyp
      expression: d_sulap - d_j23105
      output_column: d_sulap_centered
  seq20_ref_margins:
    derive:
      kind: column_expression
      source: seq20_ref_margins_sulap
      expression: d_soxsp - d_j23105
      output_column: d_soxsp_centered
  seq20_ref_margins_export:
    derive:
      kind: select_columns
      source: seq20_ref_margins
      columns:
      - construct__anchor_id
      - d_spyp_centered
      - d_sulap_centered
      - d_soxsp_centered
  ethanol_vs_cipro:
    derive:
      kind: column_expression
      source: anchor20_ref_margins
      expression: d_sulap_centered - d_spyp_centered
      output_column: ethanol_vs_cipro
landmarks:
  spyp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: spyp
    representation:
      mode: centroid
  sulap:
    source: anchor60
    where:
      column: usr_label__primary
      equals: sulAp
    representation:
      mode: centroid
  soxsp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: soxSp
    representation:
      mode: centroid
  j23105:
    source: anchor60
    where:
      column: usr_label__primary
      equals: J23105
    representation:
      mode: centroid
cohorts:
  plan:
    kind: column
    source: anchor60
    column: densegen__plan
  design_family:
    kind: promoter_metadata
    source: anchor60
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: anchor60
    derive: design_regulator_composition
  sigma70_variant:
    kind: promoter_metadata
    source: anchor60
    derive: sigma70_variant
  campaign_prior:
    kind: promoter_metadata
    source: anchor60
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: anchor60
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: anchor60
    derive: source_class
reference_sets:
  promoter_wt_core:
    ids:
    - spyp
    - sulAp
    - soxSp
    - J23105
    match_column: usr_label__primary
    label_column: usr_label__primary
    label_mode: label_and_highlight
plots:
  atlas_2x2_intermediate_main:
    kind: projection_grid
    projections:
    - umap_z7_60
    - umap_z20_60
    - umap_z7_1k_seq
    - umap_z20_1k_seq
    panel_titles:
    - 7B anchor-only (60 bp)
    - 20B anchor-only (60 bp)
    - 7B expanded-context (1 kb)
    - 20B expanded-context (1 kb)
    color_column: design_family
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  atlas_2x3_model_family:
    kind: projection_grid
    projections:
    - umap_z7_60
    - umap_z20_60
    - umap_z7_1k_seq
    - umap_z20_1k_seq
    - umap_logits7_1k_seq
    - umap_logits20_1k_seq
    panel_titles:
    - 7B anchor-only intermediate
    - 20B anchor-only intermediate
    - 7B expanded-context intermediate
    - 20B expanded-context intermediate
    - 7B expanded-context pooled logits
    - 20B expanded-context pooled logits
    color_column: design_family
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  control_pca_explained_variance_curve:
    kind: curve
    reducer: z20_60_pca
  cluster_correspondence_primary:
    kind: correspondence_heatmap
    left_cluster: leiden_z20_60
    right_cluster: leiden_z20_1k_anchor
  agreement_7b_vs_20b_summary:
    kind: agreement_summary
    agreement: agreement_7b_vs_20b
  reference_alignment_anchor20b:
    kind: xy_scatter
    scalar: anchor20_ref_margins
    x_column: d_spyp_centered
    y_column: d_sulap_centered
    color_column: design_family
    render_mode: points
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  reference_alignment_seq20b:
    kind: xy_scatter
    scalar: seq20_ref_margins
    x_column: d_spyp_centered
    y_column: d_sulap_centered
    color_column: design_family
    render_mode: points
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  context_shift_primary_distribution:
    kind: distribution
    scalar: construct_shift20_norm
    value_column: construct_shift20_norm
    color_column: design_family
    render_mode: ecdf
  context_shift_self_cosine_primary:
    kind: distribution
    scalar: context_audit_20b
    value_column: construct_self_cosine20
    color_column: design_family
    render_mode: violin_box
  drag_qc_distribution:
    kind: distribution
    scalar: drag20_norm
    value_column: drag20_norm
    color_column: design_family
    render_mode: ecdf
  context_geometry_primary_summary:
    kind: agreement_summary
    agreement: context_geometry_primary_20b
  context_shift_vs_drag_primary:
    kind: xy_scatter
    scalar: context_audit_20b
    x_column: construct_shift20_norm
    y_column: construct_self_cosine20
    color_column: design_family
    render_mode: points
exports:
  x0_primary_20b:
    row_basis: z20_60_pc32
    blocks:
    - kind: reduced_view
      block_id: z20_60_pc
      source: z20_60_pc32
      feature_prefix: z20_60
    - kind: table_columns
      block_id: landmark_distances
      source: anchor20_ref_margins
      columns:
      - d_spyp_centered
      - d_sulap_centered
      - d_soxsp_centered
  x1_primary_20b:
    row_basis: construct_shift20_pc32
    blocks:
    - kind: reduced_view
      block_id: construct_shift20_pc
      source: construct_shift20_pc32
      feature_prefix: construct_shift20
    - kind: table_columns
      block_id: construct_shift20_scalars
      source: construct_shift20_norm
      columns:
      - construct_shift20_norm
  x2_primary_20b:
    row_basis: anchor_ctx_seq_20b
    blocks:
    - kind: reduced_view
      block_id: z20_60_pc
      source: z20_60_anchor_ctx_seq_pc32
      feature_prefix: z20_60
    - kind: reduced_view
      block_id: z20_1k_seq_pc
      source: z20_1k_seq_anchor_ctx_seq_pc32
      feature_prefix: z20_1k_seq
    - kind: table_columns
      block_id: anchor_ref_margins
      source: anchor20_ref_margins_export
      columns:
      - d_spyp_centered
      - d_sulap_centered
      - d_soxsp_centered
      feature_prefix: anchor_ref
      alignment: anchor_ctx_seq_20b
    - kind: table_columns
      block_id: seq_ref_margins
      source: seq20_ref_margins_export
      columns:
      - d_spyp_centered
      - d_sulap_centered
      - d_soxsp_centered
      feature_prefix: seq_ref
      alignment: anchor_ctx_seq_20b
    - kind: table_columns
      block_id: context_metrics
      source: context_audit_20b
      columns:
      - infer__evo2_20b__anchor_only_20b_features__log_likelihood__mean_per_token
      - infer__evo2_20b__template_1kb_20b_features__log_likelihood__mean_per_token
      alignment: anchor_ctx_seq_20b
  x3_ablation_7b:
    row_basis: anchor_ctx_seq_7b
    blocks:
    - kind: reduced_view
      block_id: z7_60_pc
      source: z7_60_anchor_ctx_seq_pc32
      feature_prefix: z7_60
    - kind: reduced_view
      block_id: z7_1k_seq_pc
      source: z7_1k_seq_anchor_ctx_seq_pc32
      feature_prefix: z7_1k_seq
notebooks:
  browser:
    kind: workspace
    title: Expanded-context browser
    description: Consolidated read-only browser for reference alignment, context shift, benchmark export, and appendix QC artifacts.
    default_deliverable: reference_alignment_primary_20b
recipes:
  atlas_2x2_recipe:
    steps:
    - id: materialize_z7_60
      op: view.materialize
      params:
        view: z7_60
    - id: materialize_z20_60
      op: view.materialize
      params:
        view: z20_60
    - id: materialize_z7_1k_seq
      op: view.materialize
      params:
        view: z7_1k_seq
    - id: materialize_z20_1k_seq
      op: view.materialize
      params:
        view: z20_1k_seq
    - id: sample_anchor_atlas
      op: sample.build
      depends_on:
      - materialize_z7_60
      - materialize_z20_60
      params:
        sample: atlas_anchor_sample
        view: z20_60
        strategy: stratified
        group_by: design_family
        n: 20000
        seed: 17
        reference_set: promoter_wt_core
    - id: sample_context_atlas
      op: sample.build
      depends_on:
      - materialize_z7_1k_seq
      - materialize_z20_1k_seq
      params:
        sample: atlas_context_sample
        view: z20_1k_seq
        strategy: stratified
        group_by: design_family
        n: 20000
        seed: 17
        reference_set: promoter_wt_core
    - id: project_z7_60
      op: projection.fit
      depends_on:
      - sample_anchor_atlas
      params:
        projection_id: umap_z7_60
        view: z7_60
        sample: atlas_anchor_sample
        metric: cosine
        seed: 17
    - id: project_z20_60
      op: projection.fit
      depends_on:
      - sample_anchor_atlas
      params:
        projection_id: umap_z20_60
        view: z20_60
        sample: atlas_anchor_sample
        metric: cosine
        seed: 17
    - id: project_z7_1k_seq
      op: projection.fit
      depends_on:
      - sample_context_atlas
      params:
        projection_id: umap_z7_1k_seq
        view: z7_1k_seq
