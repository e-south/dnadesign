    where:
      - column: usr_label__primary
        regex: '^(aceBp|alaSp|aldAp|araBADp|argCBHp|cpxPp|fadEp|inaAp|katGp|marRABp|micFp|phoAp|ppcp|pspAp|pspGp|spyp|sulAp|umuDCp)(?:_context1kb_(?:forward|rc))?$'
