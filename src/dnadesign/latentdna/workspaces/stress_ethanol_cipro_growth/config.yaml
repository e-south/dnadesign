            - {reference_set_id: reference_spyp_sulap_core60, aggregation: rows}
            - {reference_set_id: reference_native_mg1655, aggregation: centroid}
            - {reference_set_id: reference_native_mg1655_core60, aggregation: centroid}
            - {reference_set_id: reference_anderson_igem, aggregation: centroid}
            - {reference_set_id: reference_anderson_igem_core60, aggregation: centroid}
            - {reference_set_id: reference_w_collection, aggregation: centroid}
            - {reference_set_id: reference_w_collection_core60, aggregation: centroid}
          candidates:
            - {view_id: intermediate_embedding_7b_anchor_60bp, sample_id: scorecard_sample_intermediate_embedding_7b_anchor_60bp}
            - {view_id: intermediate_embedding_7b_full_context_anchor_mean, sample_id: scorecard_sample_intermediate_embedding_7b_full_context_anchor_mean}
            - {view_id: intermediate_embedding_7b_context_anchor_mean_bidir_concat, sample_id: scorecard_sample_intermediate_embedding_7b_context_anchor_mean_bidir_concat}
