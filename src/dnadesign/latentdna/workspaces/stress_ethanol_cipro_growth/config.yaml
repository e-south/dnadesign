      display_labels:
        background_only: Background only
        ethanol: Ethanol
        ciprofloxacin: Ciprofloxacin
        ethanol_ciprofloxacin: Ethanol + ciprofloxacin
        control: Control
      compact_display_labels:
        background_only: Bg
        ethanol: Eth
        ciprofloxacin: Cipro
        ethanol_ciprofloxacin: Dual
        control: Ctrl
      category_colors:
        background_only: "#56B4E9"
        ethanol: "#E69F00"
        ciprofloxacin: "#009E73"
        ethanol_ciprofloxacin: "#CC79A7"
        control: "#111111"
    sigma35:
      column: sig35_variant
      label: Sigma-35 variant
      kind: categorical
      category_order: [f, e, d, c, b, control]
      ordinal_subset: [f, e, d, c, b]
      display_labels:
        f: TTGACA (f)
        e: TAGACA (e)
        d: TTTACA (d)
        c: TTGTGA (c)
        b: CTGACA (b)
        control: Control
      compact_display_labels:
        f: "f\nTTGACA"
        e: "e\nTAGACA"
        d: "d\nTTTACA"
        c: "c\nTTGTGA"
        b: "b\nCTGACA"
        control: Control
      category_colors:
        f: "#B2182B"
        e: "#D6604D"
        d: "#F4A582"
        c: "#92C5DE"
        b: "#2166AC"
        control: "#7F8894"
      metric_labels:
        sig35_ordinal_spearman: Sigma-35 ordinal Spearman
        sig35_ordinal_kendall: Sigma-35 ordinal Kendall
        sig35_balanced_ordinal_spearman: Balanced Sigma-35 ordinal Spearman
        sig35_within_family_mean_spearman: Within-family Sigma-35 Spearman
        sig35_label_permutation_pvalue: Sigma-35 permutation p-value
        sig35_margin_f_vs_b: Sigma-35 F-vs-B margin
      noncanonical_policy:
        bucket: __latentdna_reference_or_other__
        label: Reference/other
        include_in_legend: false
        canonical_row_match: any
        canonical_row_selectors:
          - {column: source_class, in_values: [densegen]}
          - {column: source_family, in_values: [densegen_generated]}
    spacer_length:
      column: spacer_length
      label: Spacer length
      kind: ordinal
      category_order: ["16", "17", "18"]
      category_colors:
        "16": "#2C7BB6"
        "17": "#FEE090"
        "18": "#D73027"
metric_definitions:
  sig35_variant_separation_ratio:
    display_name: Sigma-35 separation ratio
    mathematical_definition: Mean between-centroid cosine distance divided by mean within-centroid cosine distance for configured Sigma-35 cohorts.
    metric_family: cohort_structure
    evidence_tier: primary
    unit: ratio
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_ordinal_spearman:
    display_name: Sigma-35 ordinal Spearman
    mathematical_definition: Spearman correlation between configured Sigma-35 rank gaps and observed centroid cosine-distance gaps.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_ordinal_kendall:
    display_name: Sigma-35 ordinal Kendall
    mathematical_definition: Kendall tau correlation between configured Sigma-35 rank gaps and observed centroid cosine-distance gaps.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_balanced_ordinal_spearman:
    display_name: Balanced Sigma-35 ordinal Spearman
    mathematical_definition: Spearman correlation between configured Sigma-35 rank gaps and observed centroid cosine-distance gaps after config-declared cohort balancing.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_within_family_mean_spearman:
    display_name: Within-family Sigma-35 Spearman
    mathematical_definition: Mean within-design-family Spearman correlation between configured Sigma-35 rank gaps and observed centroid cosine-distance gaps.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_within_regulator_mean_spearman:
    display_name: Within-regulator Sigma-35 Spearman
    mathematical_definition: Mean within-regulator-composition Spearman correlation between configured Sigma-35 rank gaps and observed centroid cosine-distance gaps.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  sig35_label_permutation_pvalue:
    display_name: Sigma-35 permutation p-value
    mathematical_definition: Two-sided permutation p-value for the global Sigma-35 ordinal Spearman statistic under shuffled configured Sigma-35 ranks.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: p_value
    direction: lower_is_better
    aggregation_level: candidate_summary
  sig35_variant_retention_correlation:
    display_name: Sigma-35 retention
    mathematical_definition: Pearson correlation between aligned anchor and context centroid-distance vectors for configured Sigma-35 cohorts.
    metric_family: context_stability
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
