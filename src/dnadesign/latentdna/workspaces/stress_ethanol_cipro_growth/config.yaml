      - z20_1k_anchor
      - z7_1k_seq
      - z20_1k_seq
      - logits7_60
      - logits20_60
      - logits7_1k_anchor
      - logits20_1k_anchor
      - logits7_1k_seq
      - logits20_1k_seq
      cohorts:
      - design_family
    outputs:
      samples:
      - atlas_anchor_sample
      - atlas_context_sample
      projections:
      - umap_z7_60
      - umap_z20_60
      - umap_z7_1k_anchor
      - umap_z20_1k_anchor
      - umap_z7_1k_seq
      - umap_z20_1k_seq
      - umap_logits7_60
