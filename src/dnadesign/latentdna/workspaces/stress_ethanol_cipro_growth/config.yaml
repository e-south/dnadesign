schema_version: latentdna.workspace.v1
workspace:
  id: stress_ethanol_cipro_growth
  title: Stress / ethanol / ciprofloxacin growth promoter study
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - pdf
    - png
  neighbor_backend: auto
sources:
  anchor_60bp:
    kind: usr
    root: ../../../usr/datasets
    dataset: promoter/stress_ethanol_cipro_anchor_set
    record_key: id
    subject_key: id
  full_context_1kb:
    kind: usr
    root: ../../../usr/datasets
    dataset: promoter/stress_ethanol_cipro_construct_contexts
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id
metadata:
  include:
    - design_family
    - design_regulator_composition
    - sig35_variant
    - spacer_length
    - source_class
    - is_control
    - campaign_prior
    - construct_template_id
alignments:
  intermediate_embedding_20b_anchor_to_full_context:
    left: intermediate_embedding_20b_full_context_1kb
    right: intermediate_embedding_20b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
  intermediate_embedding_7b_anchor_to_full_context:
    left: intermediate_embedding_7b_full_context_1kb
    right: intermediate_embedding_7b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
  pooled_logits_20b_anchor_to_full_context:
    left: pooled_logits_20b_full_context_1kb
    right: pooled_logits_20b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
  pooled_logits_7b_anchor_to_full_context:
    left: pooled_logits_7b_full_context_1kb
    right: pooled_logits_7b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
views:
  intermediate_embedding_20b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags: {encoder: evo2, model: 20b, family: intermediate_embedding, scope: anchor_60bp}
  intermediate_embedding_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags: {encoder: evo2, model: 20b, family: intermediate_embedding, scope: full_context_1kb}
  intermediate_embedding_7b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags: {encoder: evo2, model: 7b, family: intermediate_embedding, scope: anchor_60bp}
  intermediate_embedding_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags: {encoder: evo2, model: 7b, family: intermediate_embedding, scope: full_context_1kb}
  pooled_logits_20b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags: {encoder: evo2, model: 20b, family: pooled_logits, scope: anchor_60bp}
  pooled_logits_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags: {encoder: evo2, model: 20b, family: pooled_logits, scope: full_context_1kb}
  pooled_logits_7b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags: {encoder: evo2, model: 7b, family: pooled_logits, scope: anchor_60bp}
  pooled_logits_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags: {encoder: evo2, model: 7b, family: pooled_logits, scope: full_context_1kb}
landmarks:
  spyp:
    source: anchor_60bp
    where: {column: usr_label__primary, equals: spyp}
    representation: {mode: centroid}
  sulap:
    source: anchor_60bp
    where: {column: usr_label__primary, equals: sulAp}
    representation: {mode: centroid}
  j23105:
    source: anchor_60bp
    where: {column: usr_label__primary, equals: J23105}
    representation: {mode: centroid}
cohorts:
  design_family:
    kind: promoter_metadata
    source: anchor_60bp
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: anchor_60bp
    derive: design_regulator_composition
  sig35_variant:
    kind: promoter_metadata
    source: anchor_60bp
    derive: sig35_variant
  spacer_length:
    kind: promoter_metadata
    source: anchor_60bp
    derive: spacer_length
  campaign_prior:
    kind: promoter_metadata
    source: anchor_60bp
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: anchor_60bp
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: anchor_60bp
    derive: source_class
reference_sets:
  promoter_wildtype_primary:
    ids: [spyp, sulAp, J23105]
    match_column: usr_label__primary
    label_column: usr_label__primary
    display_labels:
      spyp: spyp
      sulAp: sulap
      J23105: j23105
plots:
  dataset_overview:
    kind: categorical_count
    visibility_tier: primary
    scalar: dataset_overview_counts
    category_column: dimension
    label_column: category_label
    value_column: fraction
    panel_column: dimension_label
    semantics_ref: plot_semantics/dataset_overview.yaml
  representation_health_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: representation_health_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: health_status
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/representation_health_summary.yaml
  design_structure_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: design_structure_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    ci_lower_column: ci_lower
    ci_upper_column: ci_upper
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/design_structure_summary.yaml
  sigma35_ordinal_audit:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: sigma35_ordinal_audit_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    ci_lower_column: ci_lower
    ci_upper_column: ci_upper
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/sigma35_ordinal_audit.yaml
  context_robustness_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: context_robustness_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/context_robustness_summary.yaml
  design_centroid_margin_gallery:
    kind: xy_scatter_grid
    visibility_tier: appendix
    scalars: &design_centroid_scalars
      - design_centroid_margins_intermediate_embedding_7b_anchor_60bp
      - design_centroid_margins_pooled_logits_7b_anchor_60bp
      - design_centroid_margins_intermediate_embedding_7b_full_context_1kb
      - design_centroid_margins_pooled_logits_7b_full_context_1kb
      - design_centroid_margins_intermediate_embedding_20b_anchor_60bp
      - design_centroid_margins_pooled_logits_20b_anchor_60bp
      - design_centroid_margins_intermediate_embedding_20b_full_context_1kb
      - design_centroid_margins_pooled_logits_20b_full_context_1kb
    panel_titles: &candidate_panel_titles
      - Evo 2 7B · 60 bp anchor · Intermediate block mean
      - Evo 2 7B · 60 bp anchor · Pooled logits
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Pooled logits
      - Evo 2 20B · 60 bp anchor · Intermediate block mean
      - Evo 2 20B · 60 bp anchor · Pooled logits
      - Evo 2 20B · 1 kb construct context · Intermediate block mean
      - Evo 2 20B · 1 kb construct context · Pooled logits
    x_column: synthetic_margin_ethanol_vs_background
    y_column: synthetic_margin_cipro_vs_background
    default_hue: design_family
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: continuous}
    semantics_ref: plot_semantics/design_centroid_margin_gallery.yaml
  reference_alignment_summary:
    kind: metric_panel_grid
    visibility_tier: appendix
    scalar: reference_alignment_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/reference_alignment_summary.yaml
  representation_scree_diagnostic:
    kind: curve_grid
    visibility_tier: appendix
    reducers: &candidate_reducers
      - pca_intermediate_embedding_7b_anchor_60bp
      - pca_pooled_logits_7b_anchor_60bp
      - pca_intermediate_embedding_7b_full_context_1kb
      - pca_pooled_logits_7b_full_context_1kb
      - pca_intermediate_embedding_20b_anchor_60bp
      - pca_pooled_logits_20b_anchor_60bp
      - pca_intermediate_embedding_20b_full_context_1kb
      - pca_pooled_logits_20b_full_context_1kb
    panel_titles: *candidate_panel_titles
    semantics_ref: plot_semantics/representation_scree_diagnostic.yaml
  appendix_umap_gallery:
    kind: projection_grid
    visibility_tier: appendix
    projections: &candidate_projections
      - umap_intermediate_embedding_7b_anchor_60bp
      - umap_pooled_logits_7b_anchor_60bp
      - umap_intermediate_embedding_7b_full_context_1kb
      - umap_pooled_logits_7b_full_context_1kb
      - umap_intermediate_embedding_20b_anchor_60bp
      - umap_pooled_logits_20b_anchor_60bp
      - umap_intermediate_embedding_20b_full_context_1kb
      - umap_pooled_logits_20b_full_context_1kb
    panel_titles: *candidate_panel_titles
    default_hue: design_family
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: continuous}
    annotation:
      reference_set: promoter_wildtype_primary
    semantics_ref: plot_semantics/appendix_umap_gallery.yaml
  context_delta_distributions:
    kind: distribution_grid
    visibility_tier: debug
    scalars:
      - context_delta_distribution_intermediate_embedding_7b
      - context_delta_distribution_pooled_logits_7b
      - context_delta_distribution_intermediate_embedding_20b
      - context_delta_distribution_pooled_logits_20b
    metric_columns:
      - context_self_cosine
      - context_shift_l2
    color_column: design_family
    render_mode: violin_box
    semantics_ref: plot_semantics/context_delta_distributions.yaml
exports: {}
notebooks:
  latent_geometry_browser:
    kind: workspace
    title: Latent geometry browser
    description: Read-only QC browser for pre-assay representation triage across the canonical eight-space inventory.
    default_deliverable: representation_health_summary
    default_surface: plots
    ordered_plots:
      - dataset_overview
      - representation_health_summary
      - design_structure_summary
      - sigma35_ordinal_audit
      - context_robustness_summary
      - design_centroid_margin_gallery
      - reference_alignment_summary
      - representation_scree_diagnostic
      - appendix_umap_gallery
recipes:
  dataset_overview_recipe:
    steps:
      - &build_dataset_overview_counts
        id: build_dataset_overview_counts
        op: scalar.build
        params:
          scalar: dataset_overview_counts
          kind: dataset_overview
          source_ids: [anchor_60bp, full_context_1kb]
          reference_set_id: promoter_wildtype_primary
      - &render_dataset_overview
        id: render_dataset_overview
        op: plot.render
        depends_on: [build_dataset_overview_counts]
        params: {plot_id: dataset_overview}
  pre_assay_representation_triage_recipe:
    steps:
      - &materialize_ie20_anchor {id: materialize_intermediate_embedding_20b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_20b_anchor_60bp}}
      - &materialize_ie20_full {id: materialize_intermediate_embedding_20b_full_context_1kb, op: view.materialize, params: {view: intermediate_embedding_20b_full_context_1kb}}
      - &materialize_ie7_anchor {id: materialize_intermediate_embedding_7b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_7b_anchor_60bp}}
      - &materialize_ie7_full {id: materialize_intermediate_embedding_7b_full_context_1kb, op: view.materialize, params: {view: intermediate_embedding_7b_full_context_1kb}}
      - &materialize_pl20_anchor {id: materialize_pooled_logits_20b_anchor_60bp, op: view.materialize, params: {view: pooled_logits_20b_anchor_60bp}}
      - &materialize_pl20_full {id: materialize_pooled_logits_20b_full_context_1kb, op: view.materialize, params: {view: pooled_logits_20b_full_context_1kb}}
      - &materialize_pl7_anchor {id: materialize_pooled_logits_7b_anchor_60bp, op: view.materialize, params: {view: pooled_logits_7b_anchor_60bp}}
      - &materialize_pl7_full {id: materialize_pooled_logits_7b_full_context_1kb, op: view.materialize, params: {view: pooled_logits_7b_full_context_1kb}}
      - &align_ie20 {id: build_alignment_intermediate_embedding_20b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_intermediate_embedding_20b_anchor_60bp, materialize_intermediate_embedding_20b_full_context_1kb], params: {alignment: intermediate_embedding_20b_anchor_to_full_context}}
      - &align_ie7 {id: build_alignment_intermediate_embedding_7b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp, materialize_intermediate_embedding_7b_full_context_1kb], params: {alignment: intermediate_embedding_7b_anchor_to_full_context}}
      - &align_pl20 {id: build_alignment_pooled_logits_20b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_pooled_logits_20b_anchor_60bp, materialize_pooled_logits_20b_full_context_1kb], params: {alignment: pooled_logits_20b_anchor_to_full_context}}
      - &align_pl7 {id: build_alignment_pooled_logits_7b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_pooled_logits_7b_anchor_60bp, materialize_pooled_logits_7b_full_context_1kb], params: {alignment: pooled_logits_7b_anchor_to_full_context}}
      - &score_sample_ie20_anchor {id: build_scorecard_sample_intermediate_embedding_20b_anchor_60bp, op: sample.build, depends_on: [materialize_intermediate_embedding_20b_anchor_60bp], params: {sample: scorecard_sample_intermediate_embedding_20b_anchor_60bp, view: intermediate_embedding_20b_anchor_60bp, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_ie20_full {id: build_scorecard_sample_intermediate_embedding_20b_full_context_1kb, op: sample.build, depends_on: [materialize_intermediate_embedding_20b_full_context_1kb], params: {sample: scorecard_sample_intermediate_embedding_20b_full_context_1kb, view: intermediate_embedding_20b_full_context_1kb, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_ie7_anchor {id: build_scorecard_sample_intermediate_embedding_7b_anchor_60bp, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp], params: {sample: scorecard_sample_intermediate_embedding_7b_anchor_60bp, view: intermediate_embedding_7b_anchor_60bp, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_ie7_full {id: build_scorecard_sample_intermediate_embedding_7b_full_context_1kb, op: sample.build, depends_on: [materialize_intermediate_embedding_7b_full_context_1kb], params: {sample: scorecard_sample_intermediate_embedding_7b_full_context_1kb, view: intermediate_embedding_7b_full_context_1kb, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_pl20_anchor {id: build_scorecard_sample_pooled_logits_20b_anchor_60bp, op: sample.build, depends_on: [materialize_pooled_logits_20b_anchor_60bp], params: {sample: scorecard_sample_pooled_logits_20b_anchor_60bp, view: pooled_logits_20b_anchor_60bp, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_pl20_full {id: build_scorecard_sample_pooled_logits_20b_full_context_1kb, op: sample.build, depends_on: [materialize_pooled_logits_20b_full_context_1kb], params: {sample: scorecard_sample_pooled_logits_20b_full_context_1kb, view: pooled_logits_20b_full_context_1kb, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_pl7_anchor {id: build_scorecard_sample_pooled_logits_7b_anchor_60bp, op: sample.build, depends_on: [materialize_pooled_logits_7b_anchor_60bp], params: {sample: scorecard_sample_pooled_logits_7b_anchor_60bp, view: pooled_logits_7b_anchor_60bp, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &score_sample_pl7_full {id: build_scorecard_sample_pooled_logits_7b_full_context_1kb, op: sample.build, depends_on: [materialize_pooled_logits_7b_full_context_1kb], params: {sample: scorecard_sample_pooled_logits_7b_full_context_1kb, view: pooled_logits_7b_full_context_1kb, strategy: stratified, n: 2048, group_column: design_family, seed: 17, reference_set_id: promoter_wildtype_primary}}
      - &pca_ie20_anchor {id: reduce_pca_intermediate_embedding_20b_anchor_60bp, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_20b_anchor_60bp], params: {view: intermediate_embedding_20b_anchor_60bp, run_id: pca_intermediate_embedding_20b_anchor_60bp, reduced_view_id: intermediate_embedding_20b_anchor_60bp_reduced, sample: scorecard_sample_intermediate_embedding_20b_anchor_60bp, dims: 16}}
      - &pca_ie20_full {id: reduce_pca_intermediate_embedding_20b_full_context_1kb, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_20b_full_context_1kb], params: {view: intermediate_embedding_20b_full_context_1kb, run_id: pca_intermediate_embedding_20b_full_context_1kb, reduced_view_id: intermediate_embedding_20b_full_context_1kb_reduced, sample: scorecard_sample_intermediate_embedding_20b_full_context_1kb, dims: 16}}
      - &pca_ie7_anchor {id: reduce_pca_intermediate_embedding_7b_anchor_60bp, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_7b_anchor_60bp], params: {view: intermediate_embedding_7b_anchor_60bp, run_id: pca_intermediate_embedding_7b_anchor_60bp, reduced_view_id: intermediate_embedding_7b_anchor_60bp_reduced, sample: scorecard_sample_intermediate_embedding_7b_anchor_60bp, dims: 16}}
      - &pca_ie7_full {id: reduce_pca_intermediate_embedding_7b_full_context_1kb, op: view.reduce, depends_on: [build_scorecard_sample_intermediate_embedding_7b_full_context_1kb], params: {view: intermediate_embedding_7b_full_context_1kb, run_id: pca_intermediate_embedding_7b_full_context_1kb, reduced_view_id: intermediate_embedding_7b_full_context_1kb_reduced, sample: scorecard_sample_intermediate_embedding_7b_full_context_1kb, dims: 16}}
      - &pca_pl20_anchor {id: reduce_pca_pooled_logits_20b_anchor_60bp, op: view.reduce, depends_on: [build_scorecard_sample_pooled_logits_20b_anchor_60bp], params: {view: pooled_logits_20b_anchor_60bp, run_id: pca_pooled_logits_20b_anchor_60bp, reduced_view_id: pooled_logits_20b_anchor_60bp_reduced, sample: scorecard_sample_pooled_logits_20b_anchor_60bp, dims: 16}}
