schema_version: latentdna.workspace.v1
workspace:
  id: stress_ethanol_cipro_growth
  title: Stress / ethanol / ciprofloxacin growth promoter study
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - pdf
    - png
  neighbor_backend: auto
sources:
  merged_anchor_insert:
    kind: usr
    root: ../../../usr/datasets
    dataset: usr_prom_eth_cip_anchor
    record_key: id
    subject_key: id
    metadata_include: &study_anchor_metadata
      - sfxi_ref__reference_instance_id
      - sfxi_ref__collection_id
      - sfxi_ref__batch_id
      - sfxi_ref__campaign_id
      - sfxi_ref__metric_id
      - sfxi_ref__metric_value
      - sfxi_ref__metric_provenance
      - derived__parent_id
      - derived__parent_dataset
      - derived__product_kind
      - derived__analysis_only
      - regulondb__release
      - regulondb__primary_source
      - regulondb__source_strata_set
      - regulondb__primary_promoter_id
      - regulondb__primary_promoter_name
      - regulondb__metadata_completeness_class
    sequence_scope: source_insert
    source_interval_length_bp: mixed
    pooling_span_bp: full_sequence
    window_selection_rule: mixed_length_anchor_handoff
  anchor_7b_seq_mean_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_prom_eth_cip_anchor
    record_key: alias_id
    subject_key: id
    metadata_include: *study_anchor_metadata
    sequence_scope: merged_anchor_insert_seq_mean
    source_interval_length_bp: mixed
    pooling_span_bp: full_sequence
    window_selection_rule: mixed_length_anchor_handoff
    where:
      model_name: evo2_7b
      representation_kind: intermediate_embedding
      layer_name: block26_mlp_out
      pooling_operation: seq_mean
      orientation: forward
  anchor_7b_seq_mean_output_layer_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_prom_eth_cip_anchor
    record_key: alias_id
    subject_key: id
    metadata_include: *study_anchor_metadata
    sequence_scope: merged_anchor_insert_seq_mean
    source_interval_length_bp: mixed
    pooling_span_bp: full_sequence
    window_selection_rule: mixed_length_anchor_handoff
    where:
      model_name: evo2_7b
      representation_kind: output_layer_mean
      pooling_operation: seq_mean
      orientation: forward
  anchor_7b_seq_mean_log_likelihood_mean:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_prom_eth_cip_anchor
    record_key: alias_id
    subject_key: id
    metadata_include: *study_anchor_metadata
    sequence_scope: merged_anchor_insert_seq_mean
    source_interval_length_bp: mixed
    pooling_span_bp: full_sequence
    window_selection_rule: mixed_length_anchor_handoff
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__mean_per_token
      orientation: forward
  anchor_7b_seq_mean_log_likelihood_total:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_prom_eth_cip_anchor
    record_key: alias_id
    subject_key: id
    metadata_include: *study_anchor_metadata
    sequence_scope: merged_anchor_insert_seq_mean
    source_interval_length_bp: mixed
    pooling_span_bp: full_sequence
    window_selection_rule: mixed_length_anchor_handoff
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__total
      orientation: forward
  full_context_1kb:
    kind: usr
    root: ../../../usr/datasets
    dataset: construct_prom_eth_cip_context
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id
