recipes:
  dataset_overview_recipe:
    steps:
      - &build_dataset_overview_counts
        id: build_dataset_overview_counts
        op: scalar.build
        params:
          scalar: dataset_overview_counts
          kind: dataset_overview
          source_ids: [merged_anchor_insert]
          reference_set_id: reference_scorecard_preserve_all
          dimensions:
            - dimension: provenance
              label: Provenance
              column: source_class
              category_order: [densegen, manual_or_wildtype, native_regulondb]
            - dimension: generation_plan
              label: Generation plan
              column: design_family
              category_order: [background_only, ethanol, ciprofloxacin, ethanol_ciprofloxacin, control]
            - dimension: sig35_variant
              label: Sigma-35 variant
              column: sig35_variant
              category_order: [f, e, d, c, b]
              include_unlisted_categories: false
              category_labels:
                f: Variant f
                e: Variant e
                d: Variant d
                c: Variant c
                b: Variant b
      - &render_dataset_overview
        id: render_dataset_overview
        op: plot.render
        depends_on: [build_dataset_overview_counts]
        params: {plot_id: dataset_overview}
