deliverables:
  atlas_2x2_intermediate_main:
    title: 2x2 intermediate geometry
    summary: Four-panel anchor-versus-1 kb expanded-context projection colored by design family with required WT and reference promoter labels.
    question: Do pooled anchor-only and 1 kb expanded-context views separate the promoter design families in a structured way?
    section: Appendix
    recipe: atlas_2x2_recipe
    requires:
      views:
      - z7_60
      - z20_60
      - z7_1k_seq
      - z20_1k_seq
      cohorts:
      - design_family
    outputs:
      samples:
      - atlas_anchor_sample
      - atlas_context_sample
      projections:
      - umap_z7_60
      - umap_z20_60
      - umap_z7_1k_seq
      - umap_z20_1k_seq
      plots:
      - atlas_2x2_intermediate_main
      notebooks:
      - browser
    docs_refs:
    - study:stress_ethanol_cipro_growth/deliverables/geometry_switchboard_20b
    - study:stress_ethanol_cipro_growth/figures/atlas_2x2_intermediate_main
    acceptance_checks:
    - kind: required_plot_kind
      value: projection_grid
    - kind: required_reference_set
      value: promoter_wt_core
    - kind: require_reference_set_in_every_panel
      value: true
  control_pca_explained_variance_curve:
    title: Control PCA explained variance curve
    summary: PCA explained-variance scree curve for the primary 20B anchor-only view.
    question: How much anchor-only variance does each principal component explain in the primary 20B view?
    section: QC
    recipe: control_pca_curve_recipe
    requires:
      views:
      - z20_60
    outputs:
      reducers:
      - z20_60_pca
      plots:
      - control_pca_explained_variance_curve
    docs_refs: []
    acceptance_checks:
    - kind: required_plot_kind
      value: curve
  reference_alignment_primary_20b:
    title: Reference alignment primary 20B
    summary: Score centered WT-reference margins for the 20B anchor-only and 1 kb expanded-context pooled spaces.
    question: Do the pooled 20B representations move toward the expected WT references when the 1 kb expanded-context is used?
    section: Reference alignment
    recipe: reference_alignment_primary_20b_recipe
    requires:
      views:
      - z20_60
      - z20_1k_seq
      landmarks:
      - spyp
      - sulap
      - soxsp
      - j23105
    outputs:
      distances:
      - anchor20_reference_distances
      - seq20_reference_distances
      scalars:
      - anchor20_ref_margins
      - seq20_ref_margins
      plots:
      - reference_alignment_anchor20b
      - reference_alignment_seq20b
    docs_refs:
    - study:stress_ethanol_cipro_growth/deliverables/reference_alignment_primary_20b
    - study:stress_ethanol_cipro_growth/reference_sets/promoter_wt_core
    acceptance_checks:
    - kind: required_plot_kind
      value: xy_scatter
    - kind: required_reference_set
      value: promoter_wt_core
    - kind: require_reference_set_in_every_panel
      value: true
  context_shift_primary:
    title: Context shift primary
    summary: Primary 20B shift summary from the 60 bp anchor lane to the 1 kb expanded-context pooled sequence lane.
    question: Does replacing the 60 bp anchor with the full 1 kb construct materially shift promoter representation?
    section: Context shift
    recipe: context_shift_primary_recipe
    requires:
      views:
      - z20_60
      - z20_1k_seq
      alignments:
      - anchor_ctx_seq_20b
    outputs:
      views:
      - construct_shift20
      scalars:
      - construct_shift20_norm
      plots:
      - context_shift_primary_distribution
    docs_refs: []
    acceptance_checks: []
  geometry_switchboard_20b:
    title: Geometry switchboard multiview
    summary: Materialize the core 7B and 20B intermediate and pooled-logit projections that drive the browser geometry views and appendix comparison tab.
    question: Can the browser switch across the core 7B and 20B geometries without requiring one static plot per hue?
