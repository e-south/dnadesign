reference_sets:
  reference_scorecard_preserve_all:
    label: Scorecard preserved rows
    match_column: usr_label__primary
    label_column: usr_label__primary
    notebook_exposed: false
    where:
      - column: usr_label__primary
  reference_sfxi_archive:
    label: SFXI archive
    match_column: usr_label__primary
    label_column: usr_label__primary
    label_mode: highlight_only
    where:
      - column: usr_label__primary
        regex: '^pDual-10-ES[0-9]+p(?:_context1kb_(?:forward|rc))?$'
  reference_spyp_sulap:
    label: spyP / sulAp
    match_column: usr_label__primary
    label_column: usr_label__primary
    where:
      - column: usr_label__primary
        in_values: [spyp, sulAp, spyp_context1kb_rc, sulAp_context1kb_rc]
    display_labels:
      spyp: spyP
      sulAp: sulAp
      spyp_context1kb_rc: spyP
      sulAp_context1kb_rc: sulAp
  reference_spyp_sulap_core60:
    label: spyP / sulAp core60
    match_column: usr_label__primary
    label_column: usr_label__primary
    where:
      - column: usr_label__primary
        in_values:
          - spyp_core60
          - sulAp_core60
          - spyp_core60_context1kb_forward
          - sulAp_core60_context1kb_forward
          - spyp_core60_context1kb_rc
          - sulAp_core60_context1kb_rc
