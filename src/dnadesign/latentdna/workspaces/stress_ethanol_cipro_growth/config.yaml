  native_tf_axis_orientation_audit_recipe:
    steps:
      - id: materialize_tf_centroid_context_forward_anchor_mean
        op: view.materialize
        params: {view: intermediate_embedding_7b_full_context_anchor_mean}
      - id: materialize_tf_centroid_context_reverse_complement_anchor_mean
        op: view.materialize
        params: {view: intermediate_embedding_7b_reverse_complement_context_anchor_mean}
      - id: derive_tf_centroid_context_anchor_mean_bidir_concat
        op: view.derive
        depends_on:
          - materialize_tf_centroid_context_forward_anchor_mean
          - materialize_tf_centroid_context_reverse_complement_anchor_mean
        params: {view: intermediate_embedding_7b_context_anchor_mean_bidir_concat}
      - id: build_native_tf_axis_orientation_audit
        op: scalar.build
        depends_on:
          - derive_tf_centroid_context_anchor_mean_bidir_concat
        params:
          scalar: native_tf_axis_orientation_audit
          kind: tf_axis_orientation_audit
          view_id: intermediate_embedding_7b_context_anchor_mean_bidir_concat
          cohort_column: design_family
          centroid_groups:
            background: [background_only]
            ethanol: [ethanol]
            cipro: [ciprofloxacin]
          tf_columns:
            ethanol: [has_BaeR, has_CpxR]
            cipro: [has_LexA]
          embedding_view: pdual10_core60_bidir
          association_overlay:
            path: ../../../usr/datasets/usr_regulondb_native_promoters/_relations/regulatory_interactions.parquet
            row_key: derived__parent_id
            relation_key: usr_id
            regulator_column: regulator_abbrev
            tf_aliases:
              has_BaeR: [BaeR]
              has_CpxR: [CpxR]
              has_LexA: [LexA]
          output_filter: {column: derived__parent_dataset, equals: usr_regulondb_native_promoters}
          output_columns:
            - alias_id
            - construct__anchor_id
            - derived__parent_id
            - derived__parent_dataset
            - regulondb__primary_promoter_id
            - regulondb__primary_promoter_name
            - source_class
            - has_BaeR
            - has_CpxR
            - has_LexA
            - tf_bin
            - embedding_view
            - ethanolness
            - ciproness
            - distance_to_ethanol_centroid
            - distance_to_cipro_centroid
            - distance_to_background_centroid
      - id: build_native_tf_axis_orientation_tests
        op: scalar.build
        depends_on: [build_native_tf_axis_orientation_audit]
        params:
          scalar: native_tf_axis_orientation_tests
          kind: tf_axis_orientation_tests
          source_scalar: native_tf_axis_orientation_audit
          where: {column: derived__parent_dataset, equals: usr_regulondb_native_promoters}
      - id: render_native_tf_axis_orientation_audit
        op: plot.render
        depends_on: [build_native_tf_axis_orientation_tests]
        params: {plot_id: native_tf_axis_orientation_audit}
deliverables:
  dataset_overview:
    title: Dataset overview
    section: Dataset
    question: What promoter population and annotation inventory does LatentDNA compare downstream?
    summary: Shared denominator and trusted annotation inventory for the active promoter population.
    recipe: dataset_overview_recipe
    requires:
      sources: [merged_anchor_insert, full_context_1kb]
    outputs:
      plots: [dataset_overview]
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/dataset_overview
    acceptance_checks: []
  representation_health_summary:
    title: Representation health summary
    section: Gate
    question: Which candidate mean-pooled Evo2 spaces are healthy enough to survive pre-assay triage?
    summary: Collapse gate across the canonical candidate inventory.
    recipe: pre_assay_representation_triage_recipe
    requires:
      views: &canonical_view_ids
        - intermediate_embedding_7b_anchor_60bp
        - intermediate_embedding_7b_full_context_1kb
        - intermediate_embedding_7b_full_context_anchor_mean
        - intermediate_embedding_7b_context_anchor_mean_bidir_concat
        - intermediate_embedding_7b_reverse_complement_context_1kb
        - intermediate_embedding_7b_reverse_complement_context_anchor_mean
    outputs:
      plots: [representation_health_summary]
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/representation_health_summary
    acceptance_checks: []
  design_structure_summary:
    title: Design-structure summary
    section: Structure
    question: Which candidate spaces preserve trusted synthetic-design structure?
    summary: Annotation-aligned geometry across design family, regulator composition, Sigma-35, and spacer length.
    recipe: pre_assay_representation_triage_recipe
    requires:
      views: *canonical_view_ids
    outputs:
      plots:
        - design_structure_summary
        - balanced_design_family_margin_gallery
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/design_structure_summary
    acceptance_checks: []
  sigma35_ordinal_audit:
    title: Sigma-35 ordinal audit
    section: Sigma-35
    question: Do candidate spaces preserve a coherent ordered Sigma-35 axis?
    summary: Ordered Sigma-35 structure with bootstrap and permutation checks.
    recipe: pre_assay_representation_triage_recipe
    requires:
      views: *canonical_view_ids
    outputs:
      plots:
        - sigma35_ordinal_audit
        - sigma35_margin_ladder_gallery
        - sigma35_stress_margin_gallery
        - sigma35_centroid_distance_gallery
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/sigma35_ordinal_audit
    acceptance_checks: []
  context_robustness_summary:
    title: Context robustness summary
    section: Context
    question: Does added construct context preserve useful design geometry?
    summary: Anchor-vs-context stability and cohort-retention summary across the representation families.
    recipe: pre_assay_representation_triage_recipe
    requires:
      alignments:
        - intermediate_embedding_7b_anchor_to_anchor_mean
    outputs:
      plots:
        - context_robustness_summary
        - context_pair_summary
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/context_robustness_summary
    acceptance_checks: []
  candidate_decision_frontier:
    title: Representation tradeoff
    section: Synthesis
    question: Which healthy candidate best balances design structure and ordered Sigma-35 signal after the health and context checks?
    summary: Cross-panel synthesis of the pre-assay ladder for choosing a working X without relying on UMAP aesthetics.
    recipe: pre_assay_representation_triage_recipe
    requires:
      views: *canonical_view_ids
      alignments:
        - intermediate_embedding_7b_anchor_to_anchor_mean
    outputs:
      plots: [candidate_decision_frontier]
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/candidate_decision_frontier
    acceptance_checks: []
  candidate_x_selection_scorecard:
    title: Candidate X selection scorecard
    section: Synthesis
    question: Which small, biologically motivated candidate set best supports a working pre-assay X?
    summary: Compact scorecard plus reference-to-plan and reference-strength support plots for the three candidate-X views.
    recipe: pre_assay_representation_triage_recipe
    requires:
      views:
        - intermediate_embedding_7b_anchor_60bp
        - intermediate_embedding_7b_full_context_anchor_mean
        - intermediate_embedding_7b_context_anchor_mean_bidir_concat
    outputs:
