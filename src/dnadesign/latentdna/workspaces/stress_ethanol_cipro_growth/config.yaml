              - {value: background_only, label: Background}
              - {value: ethanol, label: Ethanol}
              - {value: ciprofloxacin, label: Ciprofloxacin}
              - {value: ethanol_ciprofloxacin, label: Dual}
          reference_sets: &reference_to_plan_sets
