schema_version: latentdna.workspace.v1
workspace:
  id: regulondb_native_promoter_panel
  title: RegulonDB native promoter panel
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - png
  neighbor_backend: auto
  memory_policy:
    warn_fraction_of_system_ram: 0.5
    fail_fraction_of_system_ram: 0.75
    require_override_above_fail: true
study_binding:
  study_id: regulondb_native_promoter_panel
  record_root: docs/studies/regulondb_native_promoter_panel
  deliverable_docs_root: src/dnadesign/studies/regulondb_native_promoter_panel
sources:
  native_records:
    kind: usr
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoters
    record_key: id
    subject_key: id
    sequence_scope: native_source_record
    emitted_length_bp: 81
    pooling_span_bp: full_sequence
  native_7b_seq_mean_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoters
    record_key: alias_id
    subject_key: id
    sequence_scope: native_source_record_seq_mean
    emitted_length_bp: 81
    pooling_span_bp: full_sequence
    where:
      model_name: evo2_7b
      representation_kind: intermediate_embedding
      layer_name: block26_mlp_out
      pooling_operation: seq_mean
      orientation: unknown
  native_7b_seq_mean_output_layer_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoters
    record_key: alias_id
    subject_key: id
    sequence_scope: native_source_record_seq_mean
    emitted_length_bp: 81
    pooling_span_bp: full_sequence
    where:
      model_name: evo2_7b
      representation_kind: output_layer_mean
      pooling_operation: seq_mean
      orientation: unknown
  native_7b_seq_mean_log_likelihood_mean:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoters
    record_key: alias_id
    subject_key: id
    sequence_scope: native_source_record_seq_mean
    emitted_length_bp: 81
    pooling_span_bp: full_sequence
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__mean_per_token
      orientation: unknown
  native_7b_seq_mean_log_likelihood_total:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoters
    record_key: alias_id
    subject_key: id
    sequence_scope: native_source_record_seq_mean
    emitted_length_bp: 81
    pooling_span_bp: full_sequence
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__total
      orientation: unknown
  core60_tss_upstream:
    kind: usr
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoter_core60
    record_key: id
    subject_key: id
    sequence_scope: analysis_window
    emitted_length_bp: 60
    source_interval_length_bp: 60
    pooling_span_bp: 60
    focal_rule: tss_offset_60
    window_selection_rule: upstream_of_focal
  core60_tss_upstream_7b_core60_mean_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoter_core60
    record_key: alias_id
    subject_key: alias_id
    sequence_scope: core60_tss_upstream
    emitted_length_bp: 60
    source_interval_length_bp: 60
    pooling_span_bp: 60
    focal_rule: tss_offset_60
    window_selection_rule: upstream_of_focal
    where:
      model_name: evo2_7b
      representation_kind: intermediate_embedding
      layer_name: block26_mlp_out
      pooling_operation: core60_mean
      orientation: forward
  core60_tss_upstream_7b_core60_mean_output_layer_features:
    kind: infer_feature_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoter_core60
    record_key: alias_id
    subject_key: alias_id
    sequence_scope: core60_tss_upstream
    emitted_length_bp: 60
    source_interval_length_bp: 60
    pooling_span_bp: 60
    focal_rule: tss_offset_60
    window_selection_rule: upstream_of_focal
    where:
      model_name: evo2_7b
      representation_kind: output_layer_mean
      pooling_operation: core60_mean
      orientation: forward
  core60_tss_upstream_7b_core60_mean_log_likelihood_mean:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoter_core60
    record_key: alias_id
    subject_key: alias_id
    sequence_scope: core60_tss_upstream
    emitted_length_bp: 60
    source_interval_length_bp: 60
    pooling_span_bp: 60
    focal_rule: tss_offset_60
    window_selection_rule: upstream_of_focal
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__mean_per_token
      orientation: forward
  core60_tss_upstream_7b_core60_mean_log_likelihood_total:
    kind: infer_feature_scalar_sidecar
    root: ../../../usr/datasets
    dataset: usr_regulondb_native_promoter_core60
    record_key: alias_id
    subject_key: alias_id
    sequence_scope: core60_tss_upstream
    emitted_length_bp: 60
    source_interval_length_bp: 60
    pooling_span_bp: 60
    focal_rule: tss_offset_60
    window_selection_rule: upstream_of_focal
    where:
      model_name: evo2_7b
      scalar_kind: log_likelihood__total
      orientation: forward
metadata:
  include:
    - alignment_parent_sequence_id
    - emitted_length_bp
    - regulondb__sigma_factor_set
    - regulondb__sigma_factor_count
    - regulondb__confidence_level_set
    - regulondb__regulator_composition
    - regulondb__box_pattern
    - regulondb__metadata_completeness_class
    - regulondb__source_strata_set
    - regulondb__primary_promoter_name
  derivations:
    emitted_length_bp: {kind: copy, source: length}
    alignment_parent_sequence_id:
      kind: coalesce
      sources: [parent_sequence_id, id]
    regulondb__sigma_factor_set:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__sigma_factor_set
    regulondb__sigma_factor_count:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__sigma_factor_count
    regulondb__confidence_level_set:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__confidence_level_set
    regulondb__regulator_composition:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__regulator_composition
    regulondb__box_pattern:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__box_pattern
    regulondb__metadata_completeness_class:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__metadata_completeness_class
    regulondb__source_strata_set:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__source_strata_set
    regulondb__primary_promoter_name:
      kind: lookup
      source: native_records
      left_key: parent_sequence_id
      right_key: id
      value_column: regulondb__primary_promoter_name
alignments:
  intermediate_embedding_7b_native_to_core60:
    left: intermediate_embedding_7b_native_source_record_seq_mean
    right: intermediate_embedding_7b_core60_tss_upstream
    left_on: [alignment_parent_sequence_id]
    right_on: [alignment_parent_sequence_id]
  output_layer_mean_7b_native_to_core60:
    left: output_layer_mean_7b_native_source_record_seq_mean
    right: output_layer_mean_7b_core60_tss_upstream
    left_on: [alignment_parent_sequence_id]
    right_on: [alignment_parent_sequence_id]
views:
  intermediate_embedding_7b_native_source_record_seq_mean:
    source: native_7b_seq_mean_features
    vector:
      kind: column
      name: value
    coordinate_space_id: evo2_7b_native_source_record_seq_mean
    tags:
      model: evo2_7b
      family: intermediate_embedding
      scope: native_source_record
      pooling: seq_mean
  output_layer_mean_7b_native_source_record_seq_mean:
    source: native_7b_seq_mean_output_layer_features
    vector:
      kind: column
      name: value
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      model: evo2_7b
      family: output_layer_mean
      scope: native_source_record
      pooling: seq_mean
  intermediate_embedding_7b_core60_tss_upstream:
    source: core60_tss_upstream_7b_core60_mean_features
    vector:
      kind: column
      name: value
    coordinate_space_id: evo2_7b_core60_tss_upstream_core60_mean
    tags:
      model: evo2_7b
      family: intermediate_embedding
      scope: core60_tss_upstream
      pooling: core60_mean
  output_layer_mean_7b_core60_tss_upstream:
    source: core60_tss_upstream_7b_core60_mean_output_layer_features
    vector:
      kind: column
      name: value
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      model: evo2_7b
      family: output_layer_mean
      scope: core60_tss_upstream
      pooling: core60_mean
candidate_sets:
  native_core60_7b_representations:
    label: Native/core60 7B representation views
    description: Native 81 bp source-record and TSS-upstream core60 views across intermediate and output-layer feature families.
    views:
      - intermediate_embedding_7b_native_source_record_seq_mean
      - output_layer_mean_7b_native_source_record_seq_mean
      - intermediate_embedding_7b_core60_tss_upstream
      - output_layer_mean_7b_core60_tss_upstream
    panel_titles:
      intermediate_embedding_7b_native_source_record_seq_mean: Native source-record intermediate
      output_layer_mean_7b_native_source_record_seq_mean: Native source-record output layer
      intermediate_embedding_7b_core60_tss_upstream: Core60 TSS-upstream intermediate
      output_layer_mean_7b_core60_tss_upstream: Core60 TSS-upstream output layer
plots:
  representation_health_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: representation_health_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/representation_health_summary.yaml
  native_core60_shift_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: native_core60_shift_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: comparison_label
    value_column: metric_value
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/native_core60_shift_summary.yaml
  sigma_factor_structure_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: sigma_factor_structure_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/sigma_factor_structure_summary.yaml
  sigma_umap_intermediate_embedding_7b_native_source_record_seq_mean:
    kind: projection_scatter
    visibility_tier: appendix
    projection: umap_intermediate_embedding_7b_native_source_record_seq_mean
    panel_title: Native source-record sigma UMAP
    default_hue: regulondb__sigma_factor_set
    hue_options:
      - {column: regulondb__sigma_factor_set, label: Sigma factor set, type: categorical}
    semantics_ref: plot_semantics/sigma_umap_intermediate_embedding_7b_native_source_record_seq_mean.yaml
  sigma_umap_intermediate_embedding_7b_core60_tss_upstream:
    kind: projection_scatter
    visibility_tier: appendix
    projection: umap_intermediate_embedding_7b_core60_tss_upstream
    panel_title: Core60 TSS-upstream sigma UMAP
    default_hue: regulondb__sigma_factor_set
    hue_options:
      - {column: regulondb__sigma_factor_set, label: Sigma factor set, type: categorical}
    semantics_ref: plot_semantics/sigma_umap_intermediate_embedding_7b_core60_tss_upstream.yaml
notebooks:
  latent_geometry_browser:
    kind: workspace
    title: RegulonDB latent geometry browser
    description: Read-only QC browser for native and TSS-upstream core60 RegulonDB promoter representation views.
    default_deliverable: representation_health_summary
    default_surface: plots
    candidate_sets:
      - native_core60_7b_representations
    default_candidate_set: native_core60_7b_representations
    geometry_order:
      - intermediate_embedding_7b_native_source_record_seq_mean
      - output_layer_mean_7b_native_source_record_seq_mean
      - intermediate_embedding_7b_core60_tss_upstream
      - output_layer_mean_7b_core60_tss_upstream
    candidate_grid_views:
      - intermediate_embedding_7b_native_source_record_seq_mean
      - intermediate_embedding_7b_core60_tss_upstream
    candidate_grid_panel_titles:
      - Native source-record intermediate
      - Core60 TSS-upstream intermediate
    preferred_hues:
      - regulondb__sigma_factor_set
      - regulondb__confidence_level_set
      - regulondb__metadata_completeness_class
    preferred_hue_kinds:
      regulondb__sigma_factor_set: categorical
      regulondb__confidence_level_set: categorical
      regulondb__metadata_completeness_class: categorical
    default_layout: candidate_grid
    default_compare_views:
      - intermediate_embedding_7b_native_source_record_seq_mean
      - intermediate_embedding_7b_core60_tss_upstream
    ordered_plots:
      - representation_health_summary
      - native_core60_shift_summary
      - sigma_factor_structure_summary
      - sigma_umap_intermediate_embedding_7b_native_source_record_seq_mean
      - sigma_umap_intermediate_embedding_7b_core60_tss_upstream
recipes:
  regulondb_review_recipe:
    steps:
      - id: materialize_native_source_record_seq_mean
        op: view.materialize
        params: {view: intermediate_embedding_7b_native_source_record_seq_mean}
      - id: materialize_native_source_record_output_layer
        op: view.materialize
        params: {view: output_layer_mean_7b_native_source_record_seq_mean}
      - id: materialize_core60_tss_upstream
        op: view.materialize
        params: {view: intermediate_embedding_7b_core60_tss_upstream}
      - id: materialize_core60_tss_upstream_output_layer
        op: view.materialize
        params: {view: output_layer_mean_7b_core60_tss_upstream}
      - id: build_alignment_intermediate_embedding_7b_native_to_core60
        op: alignment.build
        depends_on:
          - materialize_native_source_record_seq_mean
          - materialize_core60_tss_upstream
        params: {alignment: intermediate_embedding_7b_native_to_core60}
      - id: build_alignment_output_layer_mean_7b_native_to_core60
        op: alignment.build
        depends_on:
          - materialize_native_source_record_output_layer
          - materialize_core60_tss_upstream_output_layer
        params: {alignment: output_layer_mean_7b_native_to_core60}
      - id: build_health_sample_native_source_record_seq_mean
        op: sample.build
        depends_on: [materialize_native_source_record_seq_mean]
        params: {sample: scorecard_sample_intermediate_embedding_7b_native_source_record_seq_mean, view: intermediate_embedding_7b_native_source_record_seq_mean, strategy: all, seed: 17}
      - id: build_health_sample_native_source_record_output_layer
        op: sample.build
        depends_on: [materialize_native_source_record_output_layer]
        params: {sample: scorecard_sample_output_layer_mean_7b_native_source_record_seq_mean, view: output_layer_mean_7b_native_source_record_seq_mean, strategy: all, seed: 17}
      - id: build_health_sample_core60_tss_upstream
        op: sample.build
        depends_on: [materialize_core60_tss_upstream]
        params: {sample: scorecard_sample_intermediate_embedding_7b_core60_tss_upstream, view: intermediate_embedding_7b_core60_tss_upstream, strategy: all, seed: 17}
      - id: build_health_sample_core60_tss_upstream_output_layer
        op: sample.build
        depends_on: [materialize_core60_tss_upstream_output_layer]
        params: {sample: scorecard_sample_output_layer_mean_7b_core60_tss_upstream, view: output_layer_mean_7b_core60_tss_upstream, strategy: all, seed: 17}
      - id: reduce_pca_intermediate_embedding_7b_native_source_record_seq_mean
        op: view.reduce
        depends_on: [build_health_sample_native_source_record_seq_mean]
        params: {view: intermediate_embedding_7b_native_source_record_seq_mean, run_id: pca_intermediate_embedding_7b_native_source_record_seq_mean, reduced_view_id: intermediate_embedding_7b_native_source_record_seq_mean_reduced, sample: scorecard_sample_intermediate_embedding_7b_native_source_record_seq_mean, dims: 16}
      - id: reduce_pca_output_layer_mean_7b_native_source_record_seq_mean
        op: view.reduce
        depends_on: [build_health_sample_native_source_record_output_layer]
        params: {view: output_layer_mean_7b_native_source_record_seq_mean, run_id: pca_output_layer_mean_7b_native_source_record_seq_mean, reduced_view_id: output_layer_mean_7b_native_source_record_seq_mean_reduced, sample: scorecard_sample_output_layer_mean_7b_native_source_record_seq_mean, dims: 16}
      - id: reduce_pca_intermediate_embedding_7b_core60_tss_upstream
        op: view.reduce
        depends_on: [build_health_sample_core60_tss_upstream]
        params: {view: intermediate_embedding_7b_core60_tss_upstream, run_id: pca_intermediate_embedding_7b_core60_tss_upstream, reduced_view_id: intermediate_embedding_7b_core60_tss_upstream_reduced, sample: scorecard_sample_intermediate_embedding_7b_core60_tss_upstream, dims: 16}
      - id: reduce_pca_output_layer_mean_7b_core60_tss_upstream
        op: view.reduce
        depends_on: [build_health_sample_core60_tss_upstream_output_layer]
        params: {view: output_layer_mean_7b_core60_tss_upstream, run_id: pca_output_layer_mean_7b_core60_tss_upstream, reduced_view_id: output_layer_mean_7b_core60_tss_upstream_reduced, sample: scorecard_sample_output_layer_mean_7b_core60_tss_upstream, dims: 16}
      - id: build_representation_health_summary_metrics
        op: scalar.build
        depends_on:
          - reduce_pca_intermediate_embedding_7b_native_source_record_seq_mean
          - reduce_pca_output_layer_mean_7b_native_source_record_seq_mean
          - reduce_pca_intermediate_embedding_7b_core60_tss_upstream
          - reduce_pca_output_layer_mean_7b_core60_tss_upstream
        params:
          scalar: representation_health_summary_metrics
          kind: representation_health_summary
          collapse_rules:
            effective_rank_min: 2.0
            pc1_fraction_max: 0.80
            pairwise_distance_iqr_min: 0.01
          pairwise_max_rows: 4096
          pairwise_seed: 17
          candidates:
            - {view_id: intermediate_embedding_7b_native_source_record_seq_mean, sample_id: scorecard_sample_intermediate_embedding_7b_native_source_record_seq_mean, reducer_id: pca_intermediate_embedding_7b_native_source_record_seq_mean}
            - {view_id: output_layer_mean_7b_native_source_record_seq_mean, sample_id: scorecard_sample_output_layer_mean_7b_native_source_record_seq_mean, reducer_id: pca_output_layer_mean_7b_native_source_record_seq_mean}
            - {view_id: intermediate_embedding_7b_core60_tss_upstream, sample_id: scorecard_sample_intermediate_embedding_7b_core60_tss_upstream, reducer_id: pca_intermediate_embedding_7b_core60_tss_upstream}
            - {view_id: output_layer_mean_7b_core60_tss_upstream, sample_id: scorecard_sample_output_layer_mean_7b_core60_tss_upstream, reducer_id: pca_output_layer_mean_7b_core60_tss_upstream}
      - id: build_sigma_factor_structure_summary_metrics
        op: scalar.build
        depends_on:
          - build_health_sample_native_source_record_seq_mean
          - build_health_sample_native_source_record_output_layer
          - build_health_sample_core60_tss_upstream
          - build_health_sample_core60_tss_upstream_output_layer
        params:
          scalar: sigma_factor_structure_summary_metrics
          kind: cohort_structure_summary
          axes:
            - {axis_id: regulondb_sigma_factor_set, label: "Sigma-factor set", column: regulondb__sigma_factor_set, min_group_size: 5}
          candidates:
            - {view_id: intermediate_embedding_7b_native_source_record_seq_mean, sample_id: scorecard_sample_intermediate_embedding_7b_native_source_record_seq_mean}
            - {view_id: output_layer_mean_7b_native_source_record_seq_mean, sample_id: scorecard_sample_output_layer_mean_7b_native_source_record_seq_mean}
            - {view_id: intermediate_embedding_7b_core60_tss_upstream, sample_id: scorecard_sample_intermediate_embedding_7b_core60_tss_upstream}
            - {view_id: output_layer_mean_7b_core60_tss_upstream, sample_id: scorecard_sample_output_layer_mean_7b_core60_tss_upstream}
      - id: build_intermediate_native_core60_alignment_metrics
        op: scalar.build
        depends_on: [build_alignment_intermediate_embedding_7b_native_to_core60]
        params:
          scalar: intermediate_embedding_7b_native_core60_alignment_metrics
          kind: alignment_metrics
          alignment_id: intermediate_embedding_7b_native_to_core60
          left_view_id: intermediate_embedding_7b_native_source_record_seq_mean
          right_view_id: intermediate_embedding_7b_core60_tss_upstream
          metadata_view_id: intermediate_embedding_7b_native_source_record_seq_mean
          margin_deltas: []
          sample_size: 2000
          sample_group_column: regulondb__sigma_factor_set
          table_sample_only: false
      - id: build_output_layer_native_core60_alignment_metrics
        op: scalar.build
        depends_on: [build_alignment_output_layer_mean_7b_native_to_core60]
        params:
          scalar: output_layer_mean_7b_native_core60_alignment_metrics
          kind: alignment_metrics
          alignment_id: output_layer_mean_7b_native_to_core60
          left_view_id: output_layer_mean_7b_native_source_record_seq_mean
          right_view_id: output_layer_mean_7b_core60_tss_upstream
          metadata_view_id: output_layer_mean_7b_native_source_record_seq_mean
          margin_deltas: []
          sample_size: 2000
          sample_group_column: regulondb__sigma_factor_set
          table_sample_only: false
      - id: build_native_core60_shift_summary_metrics
        op: scalar.build
        depends_on:
          - build_intermediate_native_core60_alignment_metrics
          - build_output_layer_native_core60_alignment_metrics
        params:
          scalar: native_core60_shift_summary_metrics
          kind: context_pair_summary
          comparisons:
            - {comparison_id: intermediate_embedding_7b_native_vs_core60, comparison_label: "7B intermediate: native vs core60", comparison_role: native_core60_shift, scalar_id: intermediate_embedding_7b_native_core60_alignment_metrics}
            - {comparison_id: output_layer_mean_7b_native_vs_core60, comparison_label: "7B output layer: native vs core60", comparison_role: native_core60_shift, scalar_id: output_layer_mean_7b_native_core60_alignment_metrics}
      - id: build_umap_sample_native_source_record_seq_mean
        op: sample.build
        depends_on: [materialize_native_source_record_seq_mean]
        params: {sample: umap_sample_native_source_record_seq_mean, view: intermediate_embedding_7b_native_source_record_seq_mean, strategy: all, seed: 17}
      - id: build_umap_sample_core60_tss_upstream
        op: sample.build
        depends_on: [materialize_core60_tss_upstream]
        params: {sample: umap_sample_core60_tss_upstream, view: intermediate_embedding_7b_core60_tss_upstream, strategy: all, seed: 17}
      - id: fit_umap_native_source_record_seq_mean
        op: projection.fit
        depends_on: [build_umap_sample_native_source_record_seq_mean]
        params: {view: intermediate_embedding_7b_native_source_record_seq_mean, sample: umap_sample_native_source_record_seq_mean, run_id: umap_intermediate_embedding_7b_native_source_record_seq_mean, seed: 17}
      - id: fit_umap_core60_tss_upstream
        op: projection.fit
        depends_on: [build_umap_sample_core60_tss_upstream]
        params: {view: intermediate_embedding_7b_core60_tss_upstream, sample: umap_sample_core60_tss_upstream, run_id: umap_intermediate_embedding_7b_core60_tss_upstream, seed: 17}
      - id: render_native_sigma_umap
        op: plot.render
        depends_on: [fit_umap_native_source_record_seq_mean]
        params: {plot_id: sigma_umap_intermediate_embedding_7b_native_source_record_seq_mean}
      - id: render_core60_sigma_umap
        op: plot.render
        depends_on: [fit_umap_core60_tss_upstream]
        params: {plot_id: sigma_umap_intermediate_embedding_7b_core60_tss_upstream}
      - id: render_representation_health_summary
        op: plot.render
        depends_on: [build_representation_health_summary_metrics]
        params: {plot_id: representation_health_summary}
      - id: render_native_core60_shift_summary
        op: plot.render
        depends_on: [build_native_core60_shift_summary_metrics]
        params: {plot_id: native_core60_shift_summary}
      - id: render_sigma_factor_structure_summary
        op: plot.render
        depends_on: [build_sigma_factor_structure_summary_metrics]
        params: {plot_id: sigma_factor_structure_summary}
      - id: generate_latent_geometry_browser
        op: notebook.generate
        depends_on:
          - render_representation_health_summary
          - render_native_core60_shift_summary
          - render_sigma_factor_structure_summary
          - render_native_sigma_umap
          - render_core60_sigma_umap
        params: {notebook_id: latent_geometry_browser}
