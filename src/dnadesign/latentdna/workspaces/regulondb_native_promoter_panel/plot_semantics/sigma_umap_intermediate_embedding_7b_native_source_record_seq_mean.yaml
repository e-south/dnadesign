plot_id: sigma_umap_intermediate_embedding_7b_native_source_record_seq_mean
question: Do native RegulonDB promoter records form visible neighborhoods by annotated sigma factor in the Evo 2 7B intermediate sequence-mean space?
decision_role: appendix
encoding: UMAP projection scatter of native source-record embeddings colored by RegulonDB sigma factor annotation.
scope: Native RegulonDB promoter source records with completed Evo 2 7B intermediate embedding sidecars.
guardrails:
  - Treat UMAP as an exploratory projection, not as proof of biological separation.
  - Multi-sigma labels are categorical overlays and should not be interpreted as ordinal values.
  - Use the persisted projection manifest for fit parameters and row-count checks.
caption: Native RegulonDB promoter UMAP colored by sigma factor annotation.
alt_text: UMAP projection scatter plot of 3,182 native RegulonDB promoter embeddings colored by sigma factor category, showing broad category structure for exploratory inspection.
preprocessing_md: Uses the materialized native source-record sequence-mean intermediate embedding view. Row metadata are copied from the RegulonDB native USR records.
math_md: |
  The plotted coordinates are the persisted two-dimensional UMAP embedding of the Evo 2 7B block26 intermediate sequence-mean vectors.
  Colors encode the categorical `regulondb__sigma_factor_set` metadata column.
rationale_md: Provides an orientation plot for checking whether native promoter annotations are visibly organized in the latent representation before downstream scalar summaries are trusted.
limitations_md: UMAP distorts distances and densities; apparent clusters can change with fit parameters and should be checked against high-dimensional metrics before being used for decisions.
failure_modes_md: Stale metadata, mixed sigma annotations, or projection overinterpretation can create misleading visual separation.
docs_refs:
  - src/dnadesign/latentdna/docs/concepts/coordinate-spaces.md
  - src/dnadesign/latentdna/docs/reference/artifact-manifests.md
