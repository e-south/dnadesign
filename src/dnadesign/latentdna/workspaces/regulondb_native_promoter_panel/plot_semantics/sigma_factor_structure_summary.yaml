plot_id: sigma_factor_structure_summary
question: Do RegulonDB sigma-factor labels show high-dimensional cohort structure before UMAP orientation?
decision_role: primary
encoding: Candidate-by-cohort-axis bar panel for sigma-factor set separation ratio across native/core60 representation views.
scope: Native source-record and TSS-upstream core60 RegulonDB promoter views across intermediate embedding and output-layer mean feature families.
guardrails:
  - Use this high-dimensional cohort summary before interpreting UMAP clusters.
  - The sigma-factor set column can encode multi-label sets; do not collapse it into single-factor biology without a separate policy.
  - Low separation is evidence about this Evo2-derived X, not evidence that sigma factors are biologically irrelevant.
caption: Sigma-factor set cohort-structure summary for RegulonDB representation views.
alt_text: Bar panel compares sigma-factor set separation ratio for native and core60 intermediate embedding and output-layer mean representation views.
preprocessing_md: |
  Uses all-row candidate samples and the shared standardize-then-L2-normalize
  geometry contract before computing cohort centroids. Candidate rows are
  already pooled Infer outputs: native source-record `seq_mean` over the full
  81 bp emitted sequence and core60 mean over the derived 60 bp TSS-upstream
  analysis window. For Evo 2, both are summaries of causal,
  prefix-conditioned token states.
math_md: |
  The separation ratio is
  $$
  \frac{\mathrm{mean\ between\ cohort\ centroid\ distance}}
       {\mathrm{mean\ within\ cohort\ centroid\ distance} + \epsilon}.
  $$
  Values above one indicate between-cohort distances exceed within-cohort distances under this summary.
rationale_md: Provides a projection-independent check for whether sigma-factor metadata has visible structure in each candidate X representation.
limitations_md: This is a coarse centroid metric and can be sensitive to imbalanced or rare sigma-factor sets. It should be read with metadata completeness and source strata when diagnosing failures.
failure_modes_md: Rare labels below the configured minimum group size are excluded; if fewer than two usable groups remain, the metric is reported as missing.
docs_refs:
  - src/dnadesign/latentdna/docs/concepts/coordinate-spaces.md
