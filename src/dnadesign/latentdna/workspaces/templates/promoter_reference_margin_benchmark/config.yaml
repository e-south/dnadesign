  dataset_overview:
    title: Dataset overview
    section: Dataset
    question: What is in the dataset?
    summary: Symmetric dataset inventory across anchor and full-context scopes.
    recipe: dataset_overview_recipe
    requires:
      sources:
        - anchor_60bp
        - full_context_1kb
    outputs:
      plots:
        - dataset_overview
    docs_refs: []
    acceptance_checks: []
  reference_margin_analysis:
    title: Reference margin analysis
    section: Biology
    question: Do candidate representations move the right designs toward the right references relative to J23105?
    summary: Reference-relative biology and high-dimensional wildtype-neighbor evidence.
    recipe: reference_margin_analysis_recipe
    requires:
      views:
        - intermediate_embedding_20b_anchor_60bp
        - intermediate_embedding_20b_full_context_1kb
        - intermediate_embedding_7b_anchor_60bp
        - intermediate_embedding_7b_full_context_1kb
        - pooled_logits_20b_anchor_60bp
        - pooled_logits_20b_full_context_1kb
        - pooled_logits_7b_anchor_60bp
        - pooled_logits_7b_full_context_1kb
    outputs:
      plots:
        - reference_margin_gallery_wildtype
        - reference_neighbor_evidence
    docs_refs: []
    acceptance_checks: []
  context_geometry_audit:
    title: Context geometry audit
    section: Context
    question: Does adding full vector context change geometry coherently without hiding the pairing structure?
    summary: Paired context-shift plane, subgroup distributions, and honest context summary metrics.
    recipe: context_geometry_audit_recipe
    requires:
      alignments:
        - intermediate_embedding_20b_anchor_to_full_context
        - intermediate_embedding_7b_anchor_to_full_context
        - pooled_logits_20b_anchor_to_full_context
        - pooled_logits_7b_anchor_to_full_context
    outputs:
      plots:
        - context_shift_reference_plane
        - context_delta_distributions
        - context_geometry_summary
    docs_refs: []
    acceptance_checks: []
  representation_comparison:
    title: Representation comparison
    section: Comparison
    question: Which candidate representations look strongest on the unsupervised evidence suite?
    summary: Transparent tradeoff scatter across biology, context stability, and reference-neighbor evidence.
    recipe: representation_comparison_recipe
    requires:
      views:
        - intermediate_embedding_20b_anchor_60bp
        - intermediate_embedding_20b_full_context_1kb
        - intermediate_embedding_7b_anchor_60bp
        - intermediate_embedding_7b_full_context_1kb
        - pooled_logits_20b_anchor_60bp
        - pooled_logits_20b_full_context_1kb
        - pooled_logits_7b_anchor_60bp
        - pooled_logits_7b_full_context_1kb
    outputs:
      plots:
        - representation_tradeoff_scatter
    docs_refs: []
    acceptance_checks: []
  representation_health_diagnostic:
    title: Representation health diagnostic
    section: Health
    question: Is the pooled representation space healthy or pathologically low-rank after pooling?
    summary: Scree-style representation-health diagnostics across the canonical candidate inventory.
    recipe: representation_health_diagnostic_recipe
    requires:
      views:
        - intermediate_embedding_20b_anchor_60bp
