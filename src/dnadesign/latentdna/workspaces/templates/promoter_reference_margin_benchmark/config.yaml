schema_version: latentdna.workspace.v1
workspace:
  id: promoter_reference_margin_workspace
  title: Promoter representation-comparison workspace
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - pdf
    - png
  neighbor_backend: auto
sources:
  merged_anchor_insert:
    kind: parquet
    path: inputs/merged_anchor_insert.parquet
    record_key: id
    subject_key: id
  full_context_1kb:
    kind: parquet
    path: inputs/full_context_1kb.parquet
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id
metadata:
  include:
    - design_family
    - design_regulator_composition
    - sig35_variant
    - spacer_length
    - source_class
    - is_control
    - campaign_prior
    - construct_template_id
    - log_likelihood_per_token_7b
  derivations:
    log_likelihood_per_token_7b:
      kind: coalesce
      sources:
        - infer__evo2_7b__anchor_only_7b_features__log_likelihood__mean_per_token
        - infer__evo2_7b__template_1kb_7b_features__log_likelihood__mean_per_token
alignments:
  intermediate_embedding_7b_anchor_to_full_context:
    left: intermediate_embedding_7b_full_context_1kb
    right: intermediate_embedding_7b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
  intermediate_embedding_7b_anchor_to_anchor_mean:
    left: intermediate_embedding_7b_full_context_anchor_mean
    right: intermediate_embedding_7b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
  output_layer_mean_7b_anchor_to_full_context:
    left: output_layer_mean_7b_full_context_1kb
    right: output_layer_mean_7b_anchor_60bp
    left_on: [construct__anchor_id]
    right_on: [id]
views:
  intermediate_embedding_20b_anchor_60bp:
    source: merged_anchor_insert
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags: {encoder: evo2, model: 20b, family: intermediate_embedding, scope: merged_anchor_insert_seq_mean}
    role: hidden
  intermediate_embedding_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags: {encoder: evo2, model: 20b, family: intermediate_embedding, scope: full_context_1kb}
    role: hidden
  intermediate_embedding_7b_anchor_60bp:
    source: merged_anchor_insert
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags: {encoder: evo2, model: 7b, family: intermediate_embedding, scope: merged_anchor_insert_seq_mean}
    role: primary
  intermediate_embedding_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags: {encoder: evo2, model: 7b, family: intermediate_embedding, scope: full_context_1kb}
    role: primary
  intermediate_embedding_7b_full_context_anchor_mean:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__anchor_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags: {encoder: evo2, model: 7b, family: intermediate_embedding, scope: full_context_anchor_mean}
    role: primary
  output_layer_mean_20b_anchor_60bp:
    source: merged_anchor_insert
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags: {encoder: evo2, model: 20b, family: output_layer_mean, scope: merged_anchor_insert_seq_mean}
    role: hidden
  output_layer_mean_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags: {encoder: evo2, model: 20b, family: output_layer_mean, scope: full_context_1kb}
    role: hidden
  output_layer_mean_7b_anchor_60bp:
    source: merged_anchor_insert
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags: {encoder: evo2, model: 7b, family: output_layer_mean, scope: merged_anchor_insert_seq_mean}
    role: appendix
  output_layer_mean_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags: {encoder: evo2, model: 7b, family: output_layer_mean, scope: full_context_1kb}
    role: appendix
candidate_sets:
  five_view_7b_triage:
    label: Five-view 7B triage candidates
    description: Intermediate and output-layer-mean 7B views used by the promoter-reference margin benchmark template.
    views:
      - intermediate_embedding_7b_anchor_60bp
      - output_layer_mean_7b_anchor_60bp
      - intermediate_embedding_7b_full_context_1kb
      - output_layer_mean_7b_full_context_1kb
      - intermediate_embedding_7b_full_context_anchor_mean
    panel_titles:
      intermediate_embedding_7b_anchor_60bp: Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      output_layer_mean_7b_anchor_60bp: Evo 2 7B · Mixed-length anchor-source insert · Output-layer mean
      intermediate_embedding_7b_full_context_1kb: Evo 2 7B · 1 kb construct context · Intermediate block mean
      output_layer_mean_7b_full_context_1kb: Evo 2 7B · 1 kb construct context · Output-layer mean
      intermediate_embedding_7b_full_context_anchor_mean: Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
landmarks:
  spyp:
    source: merged_anchor_insert
    where: {column: usr_label__primary, equals: spyP}
    representation: {mode: centroid}
  sulap:
    source: merged_anchor_insert
    where: {column: usr_label__primary, equals: sulAp}
    representation: {mode: centroid}
  j23105:
    source: merged_anchor_insert
    where: {column: usr_label__primary, equals: J23105}
    representation: {mode: centroid}
cohorts:
  design_family:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: design_regulator_composition
  sig35_variant:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: sig35_variant
  spacer_length:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: spacer_length
  campaign_prior:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: merged_anchor_insert
    derive: source_class
reference_sets:
  reference_spyp_sulap:
    label: spyP / sulAp
    ids: [spyP, sulAp]
    match_column: usr_label__primary
    label_column: usr_label__primary
    display_labels:
      spyP: spyP
      sulAp: sulAp
plots:
  dataset_overview:
    kind: categorical_count
    visibility_tier: primary
    scalar: dataset_overview_counts
    category_column: dimension
    label_column: category_label
    value_column: fraction
    panel_column: dimension_label
    semantics_ref: plot_semantics/dataset_overview.yaml
  representation_health_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: representation_health_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/representation_health_summary.yaml
  design_structure_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: design_structure_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    ci_lower_column: ci_lower
    ci_upper_column: ci_upper
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/design_structure_summary.yaml
  balanced_design_family_margin_gallery:
    kind: xy_scatter_grid
    visibility_tier: primary
    scalars:
      - balanced_design_family_margins_intermediate_embedding_7b_anchor_60bp
      - balanced_design_family_margins_intermediate_embedding_7b_full_context_1kb
      - balanced_design_family_margins_intermediate_embedding_7b_full_context_anchor_mean
    panel_titles:
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
    x_column: synthetic_margin_ethanol_vs_background
    y_column: synthetic_margin_cipro_vs_background
    x_axis_label: '$m_{\mathrm{eth}}(x)=\cos(z_x,c_{\mathrm{eth}})-\cos(z_x,c_{\mathrm{bg}})$'
    y_axis_label: '$m_{\mathrm{cipro}}(x)=\cos(z_x,c_{\mathrm{cipro}})-\cos(z_x,c_{\mathrm{bg}})$'
    default_hue: sig35_variant
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: ordinal}
      - {column: log_likelihood_per_token_7b, label: 7B log likelihood / token, type: continuous}
    semantics_ref: plot_semantics/balanced_design_family_margin_gallery.yaml
  sigma35_ordinal_audit:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: sigma35_ordinal_audit_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    ci_lower_column: ci_lower
    ci_upper_column: ci_upper
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/sigma35_ordinal_audit.yaml
  sigma35_margin_ladder_gallery:
    kind: distribution_grid
    visibility_tier: primary
    scalars:
      - sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
      - sigma35_stress_margins_intermediate_embedding_7b_full_context_1kb
      - sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
    metric_columns: [sig35_margin_f_vs_b]
    x_axis_label: Sigma-35 variant
    y_axis_label: '$m_{\sigma35}(x)=\cos(z_x,c_f)-\cos(z_x,c_b)$'
    color_column: sig35_variant
    render_mode: violin_box
    panel_titles:
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
    semantics_ref: plot_semantics/sigma35_margin_ladder_gallery.yaml
  sigma35_stress_margin_gallery:
    kind: xy_scatter_grid
    visibility_tier: primary
    scalars:
      - sigma35_stress_margins_intermediate_embedding_7b_anchor_60bp
      - sigma35_stress_margins_intermediate_embedding_7b_full_context_1kb
      - sigma35_stress_margins_intermediate_embedding_7b_full_context_anchor_mean
    panel_titles:
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
    x_column: sig35_margin_f_vs_b
    y_column: synthetic_best_stress_margin
    x_axis_label: '$m_{\sigma35}(x)=\cos(z_x,c_f)-\cos(z_x,c_b)$'
    y_axis_label: '$m_{\mathrm{stress}}(x)=\max\{m_{\mathrm{eth}}(x),m_{\mathrm{cipro}}(x)\}$'
    default_hue: sig35_variant
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: ordinal}
      - {column: log_likelihood_per_token_7b, label: 7B log likelihood / token, type: continuous}
    semantics_ref: plot_semantics/sigma35_stress_margin_gallery.yaml
  sigma35_centroid_distance_gallery:
    kind: heatmap_grid
    visibility_tier: appendix
    scalars:
      - sigma35_centroid_distance_intermediate_embedding_7b_anchor_60bp
      - sigma35_centroid_distance_intermediate_embedding_7b_full_context_1kb
      - sigma35_centroid_distance_intermediate_embedding_7b_full_context_anchor_mean
    panel_titles:
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
    row_column: row_variant
    column_column: column_variant
    value_column: metric_value
    x_axis_label: Sigma-35 variant $h$
    y_axis_label: Sigma-35 variant $g$
    colorbar_label: '$d_{\mathrm{emb}}(g,h)=1-\cos(c_g,c_h)$'
    row_order:
      - TTGACA (f)
      - TAGACA (e)
      - TTTACA (d)
      - TTGTGA (c)
      - CTGACA (b)
    column_order:
      - TTGACA (f)
      - TAGACA (e)
      - TTTACA (d)
      - TTGTGA (c)
      - CTGACA (b)
    color_scale: sequential
    semantics_ref: plot_semantics/sigma35_centroid_distance_gallery.yaml
  context_robustness_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: context_robustness_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/context_robustness_summary.yaml
  candidate_decision_frontier:
    kind: xy_scatter
    visibility_tier: primary
    scalar: candidate_decision_frontier_metrics
    x_column: design_family_balanced_separation_ratio
    y_column: sig35_ordinal_spearman
    size_column: effective_rank
    size_range: [140, 260]
    label_column: frontier_label
    label_values:
      - Anchor-source insert
      - 1 kb seq mean
      - 1 kb anchor mean
    semantics_ref: plot_semantics/candidate_decision_frontier.yaml
  design_centroid_margin_gallery:
    kind: xy_scatter_grid
    visibility_tier: appendix
    scalars: &design_centroid_scalars
      - design_centroid_margins_intermediate_embedding_7b_anchor_60bp
      - design_centroid_margins_intermediate_embedding_7b_full_context_anchor_mean
      - design_centroid_margins_intermediate_embedding_7b_full_context_1kb
      - design_centroid_margins_output_layer_mean_7b_anchor_60bp
      - design_centroid_margins_output_layer_mean_7b_full_context_1kb
    panel_titles: &candidate_panel_titles
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · Mixed-length anchor-source insert · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
    x_column: synthetic_margin_ethanol_vs_background
    y_column: synthetic_margin_cipro_vs_background
    default_hue: design_family
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: ordinal}
      - {column: log_likelihood_per_token_7b, label: 7B log likelihood / token, type: continuous}
    semantics_ref: plot_semantics/design_centroid_margin_gallery.yaml
  reference_alignment_summary:
    kind: metric_panel_grid
    visibility_tier: appendix
    scalar: reference_alignment_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/reference_alignment_summary.yaml
  representation_scree_diagnostic:
    kind: curve_grid
    visibility_tier: appendix
    reducers: &candidate_reducers
      - pca_intermediate_embedding_7b_anchor_60bp
      - pca_intermediate_embedding_7b_full_context_anchor_mean
      - pca_intermediate_embedding_7b_full_context_1kb
      - pca_output_layer_mean_7b_anchor_60bp
      - pca_output_layer_mean_7b_full_context_1kb
    panel_titles: *candidate_panel_titles
    semantics_ref: plot_semantics/representation_scree_diagnostic.yaml
  appendix_umap_gallery:
    kind: projection_grid
    visibility_tier: appendix
    projections: &candidate_projections
      - umap_intermediate_embedding_7b_anchor_60bp
      - umap_intermediate_embedding_7b_full_context_anchor_mean
      - umap_intermediate_embedding_7b_full_context_1kb
      - umap_output_layer_mean_7b_anchor_60bp
      - umap_output_layer_mean_7b_full_context_1kb
    panel_titles: *candidate_panel_titles
    default_hue: design_family
    hue_options:
      - {column: design_family, label: Design family, type: categorical}
      - {column: design_regulator_composition, label: Regulator composition, type: categorical}
      - {column: sig35_variant, label: Sigma-35 variant, type: categorical}
      - {column: spacer_length, label: Spacer length, type: ordinal}
      - {column: log_likelihood_per_token_7b, label: 7B log likelihood / token, type: continuous}
    annotation:
      reference_set: reference_spyp_sulap
    semantics_ref: plot_semantics/appendix_umap_gallery.yaml
  context_pair_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: context_pair_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: label
    value_column: metric_value
    color_column: comparison_role
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/context_pair_summary.yaml
exports: {}
notebooks:
  latent_geometry_browser:
    kind: workspace
    title: Latent geometry browser
    description: Read-only QC browser for pre-assay representation triage across the five-view 7B notebook candidate inventory.
    default_deliverable: representation_health_summary
    default_surface: plots
    candidate_sets:
      - five_view_7b_triage
    default_candidate_set: five_view_7b_triage
    default_reference_set: reference_spyp_sulap
    context_audit_scalar_ids:
      - context_delta_distribution_intermediate_embedding_7b_anchor_mean
      - context_delta_distribution_intermediate_embedding_7b
    geometry_order: &browser_geometry_order
      - intermediate_embedding_7b_anchor_60bp
      - output_layer_mean_7b_anchor_60bp
      - intermediate_embedding_7b_full_context_1kb
      - output_layer_mean_7b_full_context_1kb
      - intermediate_embedding_7b_full_context_anchor_mean
    candidate_grid_views: *browser_geometry_order
    candidate_grid_panel_titles: &browser_candidate_panel_titles
      - Evo 2 7B · Mixed-length anchor-source insert · Intermediate block mean
      - Evo 2 7B · Mixed-length anchor-source insert · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
      - Evo 2 7B · 1 kb context anchor mean · Intermediate block mean
    default_compare_views:
      - intermediate_embedding_7b_anchor_60bp
      - intermediate_embedding_7b_full_context_anchor_mean
    ordered_plots:
      - dataset_overview
      - representation_health_summary
      - design_structure_summary
      - balanced_design_family_margin_gallery
      - sigma35_ordinal_audit
      - sigma35_margin_ladder_gallery
      - sigma35_stress_margin_gallery
      - context_robustness_summary
      - context_pair_summary
      - candidate_decision_frontier
      - sigma35_centroid_distance_gallery
      - design_centroid_margin_gallery
      - reference_alignment_summary
      - representation_scree_diagnostic
      - appendix_umap_gallery
recipes:
  dataset_overview_recipe:
    steps:
      - &build_dataset_overview_counts
        id: build_dataset_overview_counts
        op: scalar.build
        params:
          scalar: dataset_overview_counts
          kind: dataset_overview
          source_ids: [merged_anchor_insert, full_context_1kb]
          reference_set_id: reference_spyp_sulap
      - &render_dataset_overview
        id: render_dataset_overview
        op: plot.render
        depends_on: [build_dataset_overview_counts]
        params: {plot_id: dataset_overview}
  pre_assay_representation_triage_recipe:
    steps:
      - &materialize_ie7_anchor {id: materialize_intermediate_embedding_7b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_7b_anchor_60bp}}
      - &materialize_ie7_full {id: materialize_intermediate_embedding_7b_full_context_1kb, op: view.materialize, params: {view: intermediate_embedding_7b_full_context_1kb}}
      - &materialize_ie7_anchor_mean {id: materialize_intermediate_embedding_7b_full_context_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_full_context_anchor_mean}}
      - &materialize_olm7_anchor {id: materialize_output_layer_mean_7b_anchor_60bp, op: view.materialize, params: {view: output_layer_mean_7b_anchor_60bp}}
      - &materialize_olm7_full {id: materialize_output_layer_mean_7b_full_context_1kb, op: view.materialize, params: {view: output_layer_mean_7b_full_context_1kb}}
      - &align_ie7 {id: build_alignment_intermediate_embedding_7b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp, materialize_intermediate_embedding_7b_full_context_1kb], params: {alignment: intermediate_embedding_7b_anchor_to_full_context}}
      - &align_ie7_anchor_mean {id: build_alignment_intermediate_embedding_7b_anchor_to_anchor_mean, op: alignment.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp, materialize_intermediate_embedding_7b_full_context_anchor_mean], params: {alignment: intermediate_embedding_7b_anchor_to_anchor_mean}}
