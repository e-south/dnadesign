schema_version: latentdna.workspace.v1
workspace:
  id: promoter_reference_margin_workspace
  title: Promoter representation-comparison workspace
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - pdf
    - png
  neighbor_backend: auto
sources:
  anchor_60bp:
    kind: parquet
    path: inputs/anchor_60bp.parquet
    record_key: id
    subject_key: id
  full_context_1kb:
    kind: parquet
    path: inputs/full_context_1kb.parquet
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id
metadata:
  include:
    - design_family
    - design_regulator_composition
    - sig35_variant
    - source_class
    - is_control
    - construct_template_id
alignments:
  intermediate_embedding_20b_anchor_to_full_context:
    left: intermediate_embedding_20b_full_context_1kb
    right: intermediate_embedding_20b_anchor_60bp
    left_on:
      - construct__anchor_id
    right_on:
      - id
  intermediate_embedding_7b_anchor_to_full_context:
    left: intermediate_embedding_7b_full_context_1kb
    right: intermediate_embedding_7b_anchor_60bp
    left_on:
      - construct__anchor_id
    right_on:
      - id
  pooled_logits_20b_anchor_to_full_context:
    left: pooled_logits_20b_full_context_1kb
    right: pooled_logits_20b_anchor_60bp
    left_on:
      - construct__anchor_id
    right_on:
      - id
  pooled_logits_7b_anchor_to_full_context:
    left: pooled_logits_7b_full_context_1kb
    right: pooled_logits_7b_anchor_60bp
    left_on:
      - construct__anchor_id
    right_on:
      - id
views:
  intermediate_embedding_20b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_embedding
    tags:
      encoder: evo2
      model: 20b
      family: intermediate_embedding
      scope: anchor_60bp
  intermediate_embedding_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_embedding
    tags:
      encoder: evo2
      model: 20b
      family: intermediate_embedding
      scope: full_context_1kb
  intermediate_embedding_7b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_embedding
    tags:
      encoder: evo2
      model: 7b
      family: intermediate_embedding
      scope: anchor_60bp
  intermediate_embedding_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_embedding
    tags:
      encoder: evo2
      model: 7b
      family: intermediate_embedding
      scope: full_context_1kb
  pooled_logits_20b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_pooled_logits
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      scope: anchor_60bp
  pooled_logits_20b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_pooled_logits
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      scope: full_context_1kb
  pooled_logits_7b_anchor_60bp:
    source: anchor_60bp
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_pooled_logits
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      scope: anchor_60bp
  pooled_logits_7b_full_context_1kb:
    source: full_context_1kb
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_pooled_logits
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      scope: full_context_1kb
landmarks:
  spyp:
    source: anchor_60bp
    where:
      column: usr_label__primary
      equals: spyP
    representation:
      mode: centroid
  sulap:
    source: anchor_60bp
    where:
      column: usr_label__primary
      equals: sulAp
    representation:
      mode: centroid
  j23105:
    source: anchor_60bp
    where:
      column: usr_label__primary
      equals: J23105
    representation:
      mode: centroid
reference_sets:
  promoter_wildtype_primary:
    ids:
      - spyP
      - sulAp
      - J23105
    match_column: usr_label__primary
    label_column: usr_label__primary
    display_labels:
      spyP: spyp
      sulAp: sulap
      J23105: j23105
cohorts:
  design_family:
    kind: promoter_metadata
    source: anchor_60bp
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: anchor_60bp
    derive: design_regulator_composition
  sig35_variant:
    kind: promoter_metadata
    source: anchor_60bp
    derive: sig35_variant
  campaign_prior:
    kind: promoter_metadata
    source: anchor_60bp
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: anchor_60bp
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: anchor_60bp
    derive: source_class
plots:
  dataset_overview:
    kind: categorical_count
    visibility_tier: primary
    scalar: dataset_overview_counts
    category_column: dimension
    label_column: category_label
    value_column: fraction
    panel_column: dimension_label
    semantics_ref: plot_semantics/dataset_overview.yaml
  reference_margin_gallery_wildtype:
    kind: xy_scatter_grid
    visibility_tier: primary
    scalars:
      - wildtype_reference_margins_intermediate_embedding_7b_anchor_60bp
      - wildtype_reference_margins_pooled_logits_7b_anchor_60bp
      - wildtype_reference_margins_intermediate_embedding_7b_full_context_1kb
      - wildtype_reference_margins_pooled_logits_7b_full_context_1kb
      - wildtype_reference_margins_intermediate_embedding_20b_anchor_60bp
      - wildtype_reference_margins_pooled_logits_20b_anchor_60bp
      - wildtype_reference_margins_intermediate_embedding_20b_full_context_1kb
      - wildtype_reference_margins_pooled_logits_20b_full_context_1kb
    panel_titles:
      - Evo 2 7B · 60 bp anchor · Intermediate block mean
      - Evo 2 7B · 60 bp anchor · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
      - Evo 2 20B · 60 bp anchor · Intermediate block mean
      - Evo 2 20B · 60 bp anchor · Output-layer mean
      - Evo 2 20B · 1 kb construct context · Intermediate block mean
      - Evo 2 20B · 1 kb construct context · Output-layer mean
    x_column: wildtype_margin_ethanol_vs_control
    y_column: wildtype_margin_cipro_vs_control
    default_hue: design_family
    hue_options:
      - column: design_family
        label: Design family
        type: categorical
      - column: sig35_variant
        label: Sigma-35 variant
        type: categorical
    annotation:
      reference_set: promoter_wildtype_primary
    semantics_ref: plot_semantics/reference_margin_gallery_wildtype.yaml
  reference_neighbor_evidence:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: reference_neighbor_evidence_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/reference_neighbor_evidence.yaml
  context_shift_reference_plane:
    kind: paired_xy_scatter_grid
    visibility_tier: primary
    scalars:
      - context_geometry_metrics_intermediate_embedding_7b
      - context_geometry_metrics_pooled_logits_7b
      - context_geometry_metrics_intermediate_embedding_20b
      - context_geometry_metrics_pooled_logits_20b
    panel_titles:
      - Evo 2 7B · Intermediate block mean
      - Evo 2 7B · Output-layer mean
      - Evo 2 20B · Intermediate block mean
      - Evo 2 20B · Output-layer mean
    x_column: context_margin_delta_ethanol
    y_column: context_margin_delta_cipro
    default_hue: design_family
    hue_options:
      - column: design_family
        label: Design family
        type: categorical
      - column: sig35_variant
        label: Sigma-35 variant
        type: categorical
      - column: context_self_cosine
        label: Context self-cosine
        type: continuous
      - column: context_shift_l2
        label: Context-shift L2 distance
        type: continuous
    semantics_ref: plot_semantics/context_shift_reference_plane.yaml
  context_delta_distributions:
    kind: distribution_grid
    visibility_tier: primary
    scalars:
      - context_geometry_metrics_intermediate_embedding_7b
      - context_geometry_metrics_pooled_logits_7b
      - context_geometry_metrics_intermediate_embedding_20b
      - context_geometry_metrics_pooled_logits_20b
    metric_columns:
      - context_self_cosine
      - context_shift_l2
      - context_margin_delta_ethanol
      - context_margin_delta_cipro
    color_column: design_family
    render_mode: violin_box
    semantics_ref: plot_semantics/context_delta_distributions.yaml
  context_geometry_summary:
    kind: metric_panel_grid
    visibility_tier: primary
    scalar: context_geometry_summary_metrics
    facet_column: category
    panel_title_column: display_name
    category_column: label
    label_column: candidate_label
    value_column: metric_value
    color_column: candidate_family
    direction_column: direction
    unit_column: unit
    sort_rule: panel_direction
    measure_kind: metric
    value_kind: score
    value_label: Metric value
    semantics_ref: plot_semantics/context_geometry_summary.yaml
  representation_tradeoff_scatter:
    kind: xy_scatter_grid
    visibility_tier: primary
    scalars:
      - tradeoff_ethanol_context
      - tradeoff_cipro_context
      - tradeoff_dual_context
      - tradeoff_reference_neighbor_context
    panel_titles:
      - Ethanol
      - Ciprofloxacin
      - Dual
      - Reference-neighborhood
    x_column: x_metric_value
    y_column: y_metric_value
    color_column: candidate_family
    semantics_ref: plot_semantics/representation_tradeoff_scatter.yaml
  representation_scree_diagnostic:
    kind: curve_grid
    visibility_tier: primary
    reducers:
      - pca_intermediate_embedding_7b_anchor_60bp
      - pca_pooled_logits_7b_anchor_60bp
      - pca_intermediate_embedding_7b_full_context_1kb
      - pca_pooled_logits_7b_full_context_1kb
      - pca_intermediate_embedding_20b_anchor_60bp
      - pca_pooled_logits_20b_anchor_60bp
      - pca_intermediate_embedding_20b_full_context_1kb
      - pca_pooled_logits_20b_full_context_1kb
    panel_titles:
      - Evo 2 7B · 60 bp anchor · Intermediate block mean
      - Evo 2 7B · 60 bp anchor · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
      - Evo 2 20B · 60 bp anchor · Intermediate block mean
      - Evo 2 20B · 60 bp anchor · Output-layer mean
      - Evo 2 20B · 1 kb construct context · Intermediate block mean
      - Evo 2 20B · 1 kb construct context · Output-layer mean
    semantics_ref: plot_semantics/representation_scree_diagnostic.yaml
  reference_margin_gallery_synthetic_centroids:
    kind: xy_scatter_grid
    visibility_tier: appendix
    scalars:
      - synthetic_centroid_margins_intermediate_embedding_7b_anchor_60bp
      - synthetic_centroid_margins_pooled_logits_7b_anchor_60bp
      - synthetic_centroid_margins_intermediate_embedding_7b_full_context_1kb
      - synthetic_centroid_margins_pooled_logits_7b_full_context_1kb
      - synthetic_centroid_margins_intermediate_embedding_20b_anchor_60bp
      - synthetic_centroid_margins_pooled_logits_20b_anchor_60bp
      - synthetic_centroid_margins_intermediate_embedding_20b_full_context_1kb
      - synthetic_centroid_margins_pooled_logits_20b_full_context_1kb
    panel_titles:
      - Evo 2 7B · 60 bp anchor · Intermediate block mean
      - Evo 2 7B · 60 bp anchor · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
      - Evo 2 20B · 60 bp anchor · Intermediate block mean
      - Evo 2 20B · 60 bp anchor · Output-layer mean
      - Evo 2 20B · 1 kb construct context · Intermediate block mean
      - Evo 2 20B · 1 kb construct context · Output-layer mean
    x_column: synthetic_margin_ethanol_vs_background
    y_column: synthetic_margin_cipro_vs_background
    default_hue: design_family
    hue_options:
      - column: design_family
        label: Design family
        type: categorical
      - column: sig35_variant
        label: Sigma-35 variant
        type: categorical
    semantics_ref: plot_semantics/reference_margin_gallery_synthetic_centroids.yaml
  appendix_umap_gallery:
    kind: projection_grid
    visibility_tier: appendix
    projections:
      - umap_intermediate_embedding_7b_anchor_60bp
      - umap_pooled_logits_7b_anchor_60bp
      - umap_intermediate_embedding_7b_full_context_1kb
      - umap_pooled_logits_7b_full_context_1kb
      - umap_intermediate_embedding_20b_anchor_60bp
      - umap_pooled_logits_20b_anchor_60bp
      - umap_intermediate_embedding_20b_full_context_1kb
      - umap_pooled_logits_20b_full_context_1kb
    panel_titles:
      - Evo 2 7B · 60 bp anchor · Intermediate block mean
      - Evo 2 7B · 60 bp anchor · Output-layer mean
      - Evo 2 7B · 1 kb construct context · Intermediate block mean
      - Evo 2 7B · 1 kb construct context · Output-layer mean
      - Evo 2 20B · 60 bp anchor · Intermediate block mean
      - Evo 2 20B · 60 bp anchor · Output-layer mean
      - Evo 2 20B · 1 kb construct context · Intermediate block mean
      - Evo 2 20B · 1 kb construct context · Output-layer mean
    default_hue: design_family
    hue_options:
      - column: design_family
        label: Design family
        type: categorical
      - column: sig35_variant
        label: Sigma-35 variant
        type: categorical
      - column: context_self_cosine
        label: Context self-cosine
        type: continuous
      - column: context_shift_l2
        label: Context-shift L2 distance
        type: continuous
    annotation:
      reference_set: promoter_wildtype_primary
    semantics_ref: plot_semantics/appendix_umap_gallery.yaml
exports: {}
notebooks:
  latent_geometry_browser:
    kind: workspace
    title: Latent geometry browser
    description: Read-only QC browser for the canonical eight-space inventory.
    default_deliverable: reference_margin_analysis
    default_surface: plots
    ordered_plots:
      - dataset_overview
      - reference_margin_gallery_wildtype
      - reference_neighbor_evidence
      - context_shift_reference_plane
      - context_delta_distributions
      - context_geometry_summary
      - representation_tradeoff_scatter
      - representation_scree_diagnostic
      - reference_margin_gallery_synthetic_centroids
      - appendix_umap_gallery
recipes:
  dataset_overview_recipe:
    steps:
      - id: build_dataset_overview_counts
        op: scalar.build
        params:
          scalar: dataset_overview_counts
          kind: dataset_overview
          source_ids:
            - anchor_60bp
            - full_context_1kb
          reference_set_id: promoter_wildtype_primary
      - id: render_dataset_overview
        op: plot.render
        depends_on:
          - build_dataset_overview_counts
        params:
          plot_id: dataset_overview
  reference_margin_analysis_recipe:
    steps:
      - &materialize_ie20_anchor {id: materialize_intermediate_embedding_20b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_20b_anchor_60bp}}
      - &materialize_ie20_full {id: materialize_intermediate_embedding_20b_full_context_1kb, op: view.materialize, params: {view: intermediate_embedding_20b_full_context_1kb}}
      - &materialize_ie7_anchor {id: materialize_intermediate_embedding_7b_anchor_60bp, op: view.materialize, params: {view: intermediate_embedding_7b_anchor_60bp}}
      - &materialize_ie7_full {id: materialize_intermediate_embedding_7b_full_context_1kb, op: view.materialize, params: {view: intermediate_embedding_7b_full_context_1kb}}
      - &materialize_pl20_anchor {id: materialize_pooled_logits_20b_anchor_60bp, op: view.materialize, params: {view: pooled_logits_20b_anchor_60bp}}
      - &materialize_pl20_full {id: materialize_pooled_logits_20b_full_context_1kb, op: view.materialize, params: {view: pooled_logits_20b_full_context_1kb}}
      - &materialize_pl7_anchor {id: materialize_pooled_logits_7b_anchor_60bp, op: view.materialize, params: {view: pooled_logits_7b_anchor_60bp}}
      - &materialize_pl7_full {id: materialize_pooled_logits_7b_full_context_1kb, op: view.materialize, params: {view: pooled_logits_7b_full_context_1kb}}
      - &align_ie20 {id: build_alignment_intermediate_embedding_20b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_intermediate_embedding_20b_anchor_60bp, materialize_intermediate_embedding_20b_full_context_1kb], params: {alignment: intermediate_embedding_20b_anchor_to_full_context}}
      - &align_ie7 {id: build_alignment_intermediate_embedding_7b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_intermediate_embedding_7b_anchor_60bp, materialize_intermediate_embedding_7b_full_context_1kb], params: {alignment: intermediate_embedding_7b_anchor_to_full_context}}
      - &align_pl20 {id: build_alignment_pooled_logits_20b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_pooled_logits_20b_anchor_60bp, materialize_pooled_logits_20b_full_context_1kb], params: {alignment: pooled_logits_20b_anchor_to_full_context}}
      - &align_pl7 {id: build_alignment_pooled_logits_7b_anchor_to_full_context, op: alignment.build, depends_on: [materialize_pooled_logits_7b_anchor_60bp, materialize_pooled_logits_7b_full_context_1kb], params: {alignment: pooled_logits_7b_anchor_to_full_context}}
      - &wt_ie20_anchor
        id: build_wildtype_reference_margins_intermediate_embedding_20b_anchor_60bp
        op: scalar.build
        depends_on: [materialize_intermediate_embedding_20b_anchor_60bp]
        params:
          scalar: wildtype_reference_margins_intermediate_embedding_20b_anchor_60bp
          kind: similarity_margin
          view_id: intermediate_embedding_20b_anchor_60bp
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_ie20_full
        id: build_wildtype_reference_margins_intermediate_embedding_20b_full_context_1kb
        op: scalar.build
        depends_on: [build_alignment_intermediate_embedding_20b_anchor_to_full_context]
        params:
          scalar: wildtype_reference_margins_intermediate_embedding_20b_full_context_1kb
          kind: similarity_margin
          view_id: intermediate_embedding_20b_full_context_1kb
          alignment_id: intermediate_embedding_20b_anchor_to_full_context
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_ie7_anchor
        id: build_wildtype_reference_margins_intermediate_embedding_7b_anchor_60bp
        op: scalar.build
        depends_on: [materialize_intermediate_embedding_7b_anchor_60bp]
        params:
          scalar: wildtype_reference_margins_intermediate_embedding_7b_anchor_60bp
          kind: similarity_margin
          view_id: intermediate_embedding_7b_anchor_60bp
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_ie7_full
        id: build_wildtype_reference_margins_intermediate_embedding_7b_full_context_1kb
        op: scalar.build
        depends_on: [build_alignment_intermediate_embedding_7b_anchor_to_full_context]
        params:
          scalar: wildtype_reference_margins_intermediate_embedding_7b_full_context_1kb
          kind: similarity_margin
          view_id: intermediate_embedding_7b_full_context_1kb
          alignment_id: intermediate_embedding_7b_anchor_to_full_context
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_pl20_anchor
        id: build_wildtype_reference_margins_pooled_logits_20b_anchor_60bp
        op: scalar.build
        depends_on: [materialize_pooled_logits_20b_anchor_60bp]
        params:
          scalar: wildtype_reference_margins_pooled_logits_20b_anchor_60bp
          kind: similarity_margin
          view_id: pooled_logits_20b_anchor_60bp
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_pl20_full
        id: build_wildtype_reference_margins_pooled_logits_20b_full_context_1kb
        op: scalar.build
        depends_on: [build_alignment_pooled_logits_20b_anchor_to_full_context]
        params:
          scalar: wildtype_reference_margins_pooled_logits_20b_full_context_1kb
          kind: similarity_margin
          view_id: pooled_logits_20b_full_context_1kb
          alignment_id: pooled_logits_20b_anchor_to_full_context
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
            - {target_landmark: sulap, control_landmark: j23105, output_column: wildtype_margin_cipro_vs_control}
      - &wt_pl7_anchor
        id: build_wildtype_reference_margins_pooled_logits_7b_anchor_60bp
        op: scalar.build
        depends_on: [materialize_pooled_logits_7b_anchor_60bp]
        params:
          scalar: wildtype_reference_margins_pooled_logits_7b_anchor_60bp
          kind: similarity_margin
          view_id: pooled_logits_7b_anchor_60bp
          margin_pairs:
            - {target_landmark: spyp, control_landmark: j23105, output_column: wildtype_margin_ethanol_vs_control}
