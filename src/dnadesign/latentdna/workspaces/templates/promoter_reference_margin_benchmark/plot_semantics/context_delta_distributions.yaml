plot_id: context_delta_distributions
question: How broad are row-level anchor-vs-context shifts inside each representation family?
decision_role: debug
encoding: Distribution grid of anchor-vs-context self cosine and normalized L2 shift grouped by design family.
scope: Aligned anchor/context pairs for the representation families with persisted row-level context metrics.
guardrails:
  - Use this debug surface for row-level context shifts.
  - Keep candidate comparison on the summarized context-retention metrics.
caption: Debug distribution view of anchor-vs-context row shifts.
alt_text: Distribution grid showing self-cosine stability and normalized L2 shift for aligned anchor-context promoter pairs.
preprocessing_md: Anchor and context vectors are standardized by view and row-normalized before self cosine and shift magnitudes are computed.
math_md: The plotted columns are cos(z_anchor, z_context) and ||z_anchor - z_context||_2 for each aligned pair.
rationale_md: Preserves a row-level audit surface for debugging context behavior without cluttering the scientific decision ladder.
limitations_md: Distribution shape is harder to summarize and easier to over-interpret than the cohort-retention metrics.
failure_modes_md: Heavy tails or design-family imbalance can distract from the pair-level summaries that actually drive candidate triage.
