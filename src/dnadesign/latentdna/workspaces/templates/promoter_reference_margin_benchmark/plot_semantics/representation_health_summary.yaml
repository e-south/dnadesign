plot_id: representation_health_summary
question: Which candidate Evo 2 spaces are healthy enough to survive pre-assay triage?
decision_role: gate
encoding: Candidate-by-metric bar panels for effective rank, PC1 variance fraction, median pairwise cosine distance, and pairwise cosine-distance spread, read directly from the metric values rather than a pass/fail hue.
scope: Candidate reducer summaries and sampled candidate rows used for representation-health diagnostics.
guardrails:
  - Higher effective rank means variance is spread across more directions.
  - Candidate choice still depends on design structure and context robustness.
caption: Representation-health gate across the canonical candidate inventory.
alt_text: Bar-panel summary comparing effective rank, PC1 variance fraction, and cosine-distance spread for each candidate representation without pass/fail color coding.
preprocessing_md: Pairwise cosine metrics use view-level standardization followed by row L2 normalization with the study builder's collapse-tolerant policy; zero-variance columns are set to 0.0 after scaling, zero-norm rows remain 0.0, and PCA-derived metrics use the persisted reducer summaries for the sampled candidate tables.
math_md: Effective rank is exp(-sum p_i log p_i), PC1 variance fraction is lambda_1 divided by total retained variance, and cosine-distance spread is summarized by the pairwise median and interquartile range.
rationale_md: Filters out collapsed or near-degenerate spaces before the study compares design structure or ordered Sigma-35 signal.
limitations_md: Reducer summaries are sample-based and low-dimensional, so this is a health diagnostic rather than the full original spectrum.
failure_modes_md: A space can pass health checks while still encoding nuisance structure such as spacer length or context dilution.
