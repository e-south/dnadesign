schema_version: latentdna.workspace.v1

workspace:
  id: stress_ethanol_cipro_latent_atlas
  output_root: ./outputs/latentdna

defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats: [svg, png]
  neighbor_backend: auto

sources:
  anchor60:
    kind: usr
    root: /abs/usr_root
    dataset: promoter/stress_ethanol_cipro_anchor_set
    record_key: id
    subject_key: id
  ctx1k:
    kind: usr
    root: /abs/usr_root
    dataset: promoter/stress_ethanol_cipro_construct_contexts
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id

metadata:
  include:
    - usr_label__primary
    - densegen__plan
    - densegen__required_regulators
    - construct__template_id
    - template_id
    - construct__template_id

alignments:
  anchor_ctx_20b:
    left: z20_1k_anchor
    right: z20_60
    'on': subject_key
    support: intersection
  anchor_ctx_7b:
    left: z7_1k_anchor
    right: z7_60
    'on': subject_key
    support: intersection

views:
  z7_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 60bp
    role: committee_member
  z20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 60bp
    role: primary
  z7_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__anchor_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 1kb_anchor
    role: committee_member
  z20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__anchor_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_anchor
    role: primary
  z20_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_seq
    role: challenger
  logits20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 60bp
    role: challenger
  logits20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__anchor_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 1kb_anchor
    role: challenger
  delta20:
    derive:
      kind: vector_difference
      left: z20_1k_anchor
      right: z20_60
      alignment: anchor_ctx_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: primary
  delta7:
    derive:
      kind: vector_difference
      left: z7_1k_anchor
      right: z7_60
      alignment: anchor_ctx_7b
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: committee_member

scalars:
  delta7_norm:
    derive:
      kind: vector_norm
      view: delta7
      norm: l2
  delta20_norm:
    derive:
      kind: vector_norm
      view: delta20
      norm: l2
  ethanol_vs_cipro:
    derive:
      kind: column_expression
      source: primary_landmark_distances
      expression: d_sulap - d_spyp
      output_column: ethanol_vs_cipro

landmarks:
  spyp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: spyP
    representation:
      mode: centroid
  sulap:
    source: anchor60
    where:
      column: usr_label__primary
      equals: sulAp
    representation:
      mode: centroid
  soxsp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: soxSp
    representation:
      mode: centroid
  j23105:
    source: anchor60
    where:
      column: usr_label__primary
      equals: J23105
    representation:
      mode: centroid

cohorts:
  plan:
    kind: column
    source: anchor60
    column: densegen__plan
  design_family:
    kind: promoter_metadata
    source: anchor60
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: anchor60
    derive: design_regulator_composition
  sigma70_variant:
    kind: promoter_metadata
    source: anchor60
    derive: sigma70_variant
  campaign_prior:
    kind: promoter_metadata
    source: anchor60
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: anchor60
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: anchor60
    derive: source_class

plots:
  atlas_2x2_intermediate_main:
    kind: projection_grid
    projections: [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor]
    panel_titles:
      - 7B anchor-only (60 bp)
      - 20B anchor-only (60 bp)
      - 7B context-aware (1 kb anchor)
      - 20B context-aware (1 kb anchor)
    color_column: design_family
    label_column: usr_label__primary
    label_values: [spyP, sulAp, soxSp, J23105]
  control_neighborhood_enrichment_curve_family:
    kind: curve
    reducer: z20_60_pca
  cluster_correspondence_primary:
    kind: correspondence_heatmap
    left_cluster: leiden_z20_60
    right_cluster: leiden_z20_1k_anchor
  agreement_7b_vs_20b_summary:
    kind: agreement_summary
    agreement: agreement_7b_vs_20b
  context_shift_primary_distribution:
    kind: distribution
    scalar: delta20_norm
    value_column: delta20_norm
    color_column: design_family
    render_mode: ecdf

exports:
  x0_primary_20b:
    row_basis: z20_60_pc32
    blocks:
      - kind: reduced_view
        block_id: z20_60_pc
        source: z20_60_pc32
        feature_prefix: z20_60
      - kind: table_columns
        block_id: landmark_distances
        source: primary_landmark_distances
        columns: [d_spyp, d_sulap, d_soxsp, d_j23105]
  x1_primary_20b:
    row_basis: delta20_pc32
    blocks:
      - kind: reduced_view
        block_id: delta20_pc
        source: delta20_pc32
        feature_prefix: delta20
      - kind: table_columns
        block_id: delta20_scalars
        source: delta20_norm
        columns: [delta20_norm]
  x2_primary_20b:
    row_basis: anchor_ctx_20b
    blocks:
      - kind: reduced_view
        block_id: z20_60_pc
        source: z20_60_pc32
        feature_prefix: z20_60
        alignment: anchor_ctx_20b
      - kind: reduced_view
        block_id: delta20_pc
        source: delta20_pc32
        feature_prefix: delta20
      - kind: table_columns
        block_id: landmark_distances
        source: primary_landmark_distances
        columns: [d_spyp, d_sulap, d_soxsp, d_j23105]
        alignment: anchor_ctx_20b
      - kind: table_columns
        block_id: delta20_scalars
        source: delta20_norm
        columns: [delta20_norm]
  x3_ablation_7b:
    row_basis: anchor_ctx_7b
    blocks:
      - kind: reduced_view
        block_id: z7_60_pc
        source: z7_60_pc32
        feature_prefix: z7_60
        alignment: anchor_ctx_7b
      - kind: reduced_view
        block_id: delta7_pc
        source: delta7_pc32
        feature_prefix: delta7

notebooks:
  browser:
    kind: workspace_browser
    title: Promoter atlas browser
    description: Consolidated read-only browser for promoter atlas artifacts.
    default_deliverable: atlas_2x2_intermediate_main

recipes:
  atlas_2x2_recipe:
    steps:
      - id: materialize_z7_60
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_z20_60
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_z7_1k_anchor
        op: view.materialize
        params:
          view: z7_1k_anchor
      - id: materialize_z20_1k_anchor
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: sample_anchor_atlas
        op: sample.build
        depends_on: [materialize_z7_60, materialize_z20_60]
        params:
          sample: atlas_anchor_sample
          view: z20_60
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
      - id: sample_context_atlas
        op: sample.build
        depends_on: [materialize_z7_1k_anchor, materialize_z20_1k_anchor]
        params:
          sample: atlas_context_sample
          view: z20_1k_anchor
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
      - id: project_z7_60
        op: projection.fit
        depends_on: [sample_anchor_atlas]
        params:
          projection_id: umap_z7_60
          view: z7_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_z20_60
        op: projection.fit
        depends_on: [sample_anchor_atlas]
        params:
          projection_id: umap_z20_60
          view: z20_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_z7_1k_anchor
        op: projection.fit
        depends_on: [sample_context_atlas]
        params:
          projection_id: umap_z7_1k_anchor
          view: z7_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_z20_1k_anchor
        op: projection.fit
        depends_on: [sample_context_atlas]
        params:
          projection_id: umap_z20_1k_anchor
          view: z20_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: render_atlas_grid
        op: plot.render
        depends_on: [project_z7_60, project_z20_60, project_z7_1k_anchor, project_z20_1k_anchor]
        params:
          plot_id: atlas_2x2_intermediate_main
      - id: generate_browser
        op: notebook.generate
        depends_on: [render_atlas_grid]
        params:
          notebook: browser
  control_plan_heatmap_recipe:
    steps:
      - id: materialize_anchor_view
        op: view.materialize
        params:
          view: z20_60
      - id: reduce_anchor_view
        op: view.reduce
        depends_on: [materialize_anchor_view]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
      - id: render_control_curve
        op: plot.render
        depends_on: [reduce_anchor_view]
        params:
          plot_id: control_neighborhood_enrichment_curve_family
  context_shift_primary_recipe:
    steps:
      - id: materialize_primary_anchor
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_primary_context
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: build_primary_alignment
        op: alignment.build
        depends_on: [materialize_primary_anchor, materialize_primary_context]
        params:
          alignment: anchor_ctx_20b
      - id: derive_primary_delta
        op: view.derive
        depends_on: [build_primary_alignment]
        params:
          view: delta20
      - id: derive_primary_delta_norm
        op: scalar.derive
        depends_on: [derive_primary_delta]
        params:
          scalar: delta20_norm
      - id: reduce_primary_anchor
        op: view.reduce
        depends_on: [materialize_primary_anchor]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
          reduced_view_id: z20_60_pc32
      - id: reduce_primary_delta
        op: view.reduce
        depends_on: [derive_primary_delta_norm]
        params:
          view: delta20
          run_id: delta20_pca
          dims: 32
          reduced_view_id: delta20_pc32
      - id: render_primary_delta_distribution
        op: plot.render
        depends_on: [derive_primary_delta_norm]
        params:
          plot_id: context_shift_primary_distribution
  drag_qc_recipe:
    steps:
      - id: materialize_qc_anchor
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_qc_context
        op: view.materialize
        params:
          view: z7_1k_anchor
      - id: build_qc_alignment
        op: alignment.build
        depends_on: [materialize_qc_anchor, materialize_qc_context]
        params:
          alignment: anchor_ctx_7b
      - id: derive_qc_delta
        op: view.derive
        depends_on: [build_qc_alignment]
        params:
          view: delta7
      - id: derive_qc_delta_norm
        op: scalar.derive
        depends_on: [derive_qc_delta]
        params:
          scalar: delta7_norm
      - id: reduce_qc_anchor
        op: view.reduce
        depends_on: [materialize_qc_anchor]
        params:
          view: z7_60
          run_id: z7_60_pca
          dims: 32
          reduced_view_id: z7_60_pc32
      - id: reduce_qc_delta
        op: view.reduce
        depends_on: [derive_qc_delta_norm]
        params:
          view: delta7
          run_id: delta7_pca
          dims: 32
          reduced_view_id: delta7_pc32
  agreement_7b_vs_20b_recipe:
    steps:
      - id: materialize_agreement_z7
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_agreement_z20
        op: view.materialize
        params:
          view: z20_60
      - id: sample_agreement_anchor
        op: sample.build
        depends_on: [materialize_agreement_z7, materialize_agreement_z20]
        params:
          sample: agreement_anchor_sample
          view: z20_60
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
      - id: fit_agreement_neighbors_z7
        op: neighbors.fit
        depends_on: [sample_agreement_anchor]
        params:
          neighbors: z7_60_knn
          view: z7_60
          sample: agreement_anchor_sample
          k: 15
          backend: auto
      - id: fit_agreement_neighbors_z20
        op: neighbors.fit
        depends_on: [sample_agreement_anchor]
        params:
          neighbors: z20_60_knn
          view: z20_60
          sample: agreement_anchor_sample
          k: 15
          backend: auto
      - id: fit_agreement_clusters_z7
        op: cluster.fit
        depends_on: [sample_agreement_anchor]
        params:
          cluster: z7_60_kmeans
          view: z7_60
          sample: agreement_anchor_sample
          method: kmeans
          n_clusters: 8
          seed: 17
      - id: fit_agreement_clusters_z20
        op: cluster.fit
        depends_on: [sample_agreement_anchor]
        params:
          cluster: z20_60_kmeans
          view: z20_60
          sample: agreement_anchor_sample
          method: kmeans
          n_clusters: 8
          seed: 17
      - id: compare_agreement_committee
        op: agreement.compare
        depends_on:
          [fit_agreement_neighbors_z7, fit_agreement_neighbors_z20, fit_agreement_clusters_z7, fit_agreement_clusters_z20]
        params:
          agreement: agreement_7b_vs_20b
          left_neighbors: z7_60_knn
          right_neighbors: z20_60_knn
          left_clusters: z7_60_kmeans
          right_clusters: z20_60_kmeans
      - id: render_agreement_summary
        op: plot.render
        depends_on: [compare_agreement_committee]
        params:
          plot_id: agreement_7b_vs_20b_summary
  cluster_correspondence_recipe:
    steps:
      - id: render_cluster_correspondence
        op: plot.render
        params:
          plot_id: cluster_correspondence_primary
  x0_primary_20b_recipe:
    steps:
      - id: materialize_x0_primary
        op: view.materialize
        params:
          view: z20_60
      - id: reduce_x0_primary
        op: view.reduce
        depends_on: [materialize_x0_primary]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
          reduced_view_id: z20_60_pc32
      - id: export_x0_primary
        op: export.matrix
        depends_on: [reduce_x0_primary]
        params:
          export: x0_primary_20b
  x1_primary_20b_recipe:
    steps:
      - id: materialize_x1_anchor
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_x1_context
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: build_x1_alignment
        op: alignment.build
        depends_on: [materialize_x1_anchor, materialize_x1_context]
        params:
          alignment: anchor_ctx_20b
      - id: derive_x1_delta
        op: view.derive
        depends_on: [build_x1_alignment]
        params:
          view: delta20
      - id: derive_x1_delta_norm
        op: scalar.derive
        depends_on: [derive_x1_delta]
        params:
          scalar: delta20_norm
      - id: reduce_x1_delta
        op: view.reduce
        depends_on: [derive_x1_delta_norm]
        params:
          view: delta20
          run_id: delta20_pca
          dims: 32
          reduced_view_id: delta20_pc32
      - id: export_x1_primary
        op: export.matrix
        depends_on: [reduce_x1_delta]
        params:
          export: x1_primary_20b
  x2_primary_20b_recipe:
    steps:
      - id: materialize_x2_anchor
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_x2_context
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: build_x2_alignment
        op: alignment.build
        depends_on: [materialize_x2_anchor, materialize_x2_context]
        params:
          alignment: anchor_ctx_20b
      - id: derive_x2_delta
        op: view.derive
        depends_on: [build_x2_alignment]
        params:
          view: delta20
      - id: derive_x2_delta_norm
        op: scalar.derive
        depends_on: [derive_x2_delta]
        params:
          scalar: delta20_norm
      - id: reduce_x2_primary
        op: view.reduce
        depends_on: [materialize_x2_anchor]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
          reduced_view_id: z20_60_pc32
      - id: reduce_x2_delta
        op: view.reduce
        depends_on: [derive_x2_delta_norm]
        params:
          view: delta20
          run_id: delta20_pca
          dims: 32
          reduced_view_id: delta20_pc32
      - id: export_x2_primary
        op: export.matrix
        depends_on: [reduce_x2_primary, reduce_x2_delta]
        params:
          export: x2_primary_20b
  x3_ablation_7b_recipe:
    steps:
      - id: materialize_x3_anchor
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_x3_context
        op: view.materialize
        params:
          view: z7_1k_anchor
      - id: build_x3_alignment
        op: alignment.build
        depends_on: [materialize_x3_anchor, materialize_x3_context]
        params:
          alignment: anchor_ctx_7b
      - id: derive_x3_delta
        op: view.derive
        depends_on: [build_x3_alignment]
        params:
          view: delta7
      - id: reduce_x3_primary
        op: view.reduce
        depends_on: [materialize_x3_anchor]
        params:
          view: z7_60
          run_id: z7_60_pca
          dims: 32
          reduced_view_id: z7_60_pc32
      - id: reduce_x3_delta
        op: view.reduce
        depends_on: [derive_x3_delta]
        params:
          view: delta7
          run_id: delta7_pca
          dims: 32
          reduced_view_id: delta7_pc32
      - id: export_x3_ablation
        op: export.matrix
        depends_on: [reduce_x3_primary, reduce_x3_delta]
        params:
          export: x3_ablation_7b

deliverables:
  atlas_2x2_intermediate:
    kind: projection_grid
    description: Render the committee atlas across 7B/20B anchor and context intermediate views.
    question: Do the four promoter design families separate in latent space at all?
    section: Atlas
    recipe: atlas_2x2_recipe
    requires:
      views: [z7_60, z20_60, z7_1k_anchor, z20_1k_anchor]
      cohorts: [design_family]
    outputs:
      samples: [atlas_anchor_sample, atlas_context_sample]
      projections: [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor]
      plots: [atlas_2x2_intermediate_main]
      notebooks: [browser]
  atlas_2x2_intermediate_main:
    kind: projection_grid
    description: Primary manuscript-facing atlas across 20B and 7B intermediate views.
    question: Do the four promoter design families separate in latent space at all?
    section: Atlas
    recipe: atlas_2x2_recipe
    requires:
      views: [z7_60, z20_60, z7_1k_anchor, z20_1k_anchor]
      cohorts: [design_family]
    outputs:
      samples: [atlas_anchor_sample, atlas_context_sample]
      projections: [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor]
      plots: [atlas_2x2_intermediate_main]
      notebooks: [browser]
  control_neighborhood_enrichment:
    kind: enrichment_curve
    description: Persist WT-neighborhood family enrichment summaries.
    question: Do WT neighborhoods recover expected design families?
    section: Landmarks
    recipe: control_plan_heatmap_recipe
    requires:
      views: [z20_60]
      landmarks: [spyp, sulap, soxsp, j23105]
      cohorts: [design_family]
    outputs:
      reducers: [z20_60_pca]
      plots: [control_neighborhood_enrichment_curve_family]
  control_neighborhood_enrichment_curve_family:
    kind: enrichment_curve
    description: Enrichment-versus-neighborhood-size family summary.
    question: Do WT neighborhoods recover expected design families?
    section: Landmarks
    recipe: control_plan_heatmap_recipe
    requires:
      views: [z20_60]
      landmarks: [spyp, sulap, soxsp, j23105]
