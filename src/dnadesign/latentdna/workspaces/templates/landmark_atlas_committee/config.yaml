deliverables:
  atlas_2x2_intermediate_main:
    title: Atlas 2x2 intermediate main
    summary: Four-panel aligned projection colored by design family with required WT and reference promoter labels.
    question: Do the four promoter design families separate in latent space at all?
    section: Atlas
    recipe: atlas_2x2_recipe
    requires:
      views: [z7_60, z20_60, z7_1k_anchor, z20_1k_anchor]
      cohorts: [design_family]
    outputs:
      samples: [atlas_anchor_sample, atlas_context_sample]
      projections: [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor]
      plots: [atlas_2x2_intermediate_main]
      notebooks: [browser]
    docs_refs:
      - study:stress_ethanol_cipro_growth/deliverables/atlas_2x2_intermediate_main
      - study:stress_ethanol_cipro_growth/figures/atlas_2x2_intermediate_main
    acceptance_checks:
      - kind: required_plot_kind
        value: projection_grid
      - kind: required_reference_set
        value: promoter_wt_core
      - kind: require_reference_set_in_every_panel
        value: true
  control_pca_explained_variance_curve:
    title: Control PCA explained variance curve
    summary: PCA explained-variance scree curve for the primary 20B anchor-only view.
    question: How much anchor-only variance does each principal component explain in the primary 20B view?
    section: Reduction
    recipe: control_pca_curve_recipe
    requires:
      views: [z20_60]
    outputs:
      reducers: [z20_60_pca]
      plots: [control_pca_explained_variance_curve]
    docs_refs: []
    acceptance_checks:
      - kind: required_plot_kind
        value: curve
  context_shift_primary:
    title: Context shift primary
    summary: Primary 20B context-shift view, scalar summary, and low-rank delta artifacts.
    question: Does anchor-plus-context materially shift promoter representation?
    section: Context
    recipe: context_shift_primary_recipe
    requires:
      views: [z20_60, z20_1k_anchor]
      alignments: [anchor_ctx_20b]
    outputs:
      views: [delta20]
      scalars: [delta20_norm]
      reducers: [z20_60_pca, delta20_pca]
      reduced_views: [z20_60_pc32, delta20_pc32]
      plots: [context_shift_primary_distribution]
    docs_refs: []
    acceptance_checks: []
  geometry_switchboard_20b:
    title: Geometry switchboard multiview
    summary: Materialize the core 7B and 20B intermediate and pooled-logit projections that drive the browser atlas viewer and comparison tab.
    question: Can the browser switch across the core 7B and 20B geometries without requiring one static plot per hue?
    section: Atlas
    recipe: geometry_switchboard_20b_recipe
    requires:
      views:
        [z7_60, z20_60, z7_1k_anchor, z20_1k_anchor, z7_1k_seq, z20_1k_seq, logits7_60, logits20_60, logits7_1k_anchor, logits20_1k_anchor]
      cohorts: [design_family]
    outputs:
      samples: [atlas_anchor_sample, atlas_context_sample]
      projections:
        [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor, umap_z7_1k_seq, umap_z20_1k_seq, umap_logits7_60, umap_logits20_60, umap_logits7_1k_anchor, umap_logits20_1k_anchor]
      plots: [atlas_2x3_model_family]
      notebooks: [browser]
    docs_refs: []
    acceptance_checks: []
  drag_qc:
    title: Drag QC
    summary: 20B full-context drag scalar that measures how much the full 1 kb sequence departs from anchor-aware pooling.
    question: Does full 1 kb context add drag beyond anchor-aware context in the primary 20B lane?
    section: Context
    recipe: drag_qc_recipe
    requires:
      views: [z20_1k_anchor, z20_1k_seq]
      alignments: [anchor_seq_20b]
    outputs:
      views: [drag20]
      scalars: [drag20_norm]
      plots: [drag_qc_distribution]
    docs_refs: []
    acceptance_checks: []
  context_audit_primary_20b:
    title: Context audit primary 20B
    summary: Persist the 20B context audit surfaces needed to decide whether delta20 remains a primary export feature or gets demoted behind drag-aware QC.
    question: Should delta20 remain in x2_primary_20b, or be demoted because full-context drag carries the stronger signal?
    section: Context
    recipe: context_audit_primary_20b_recipe
    requires:
      views: [z20_60, z20_1k_anchor, z20_1k_seq]
      alignments: [anchor_ctx_20b, anchor_seq_20b]
    outputs:
      views: [delta20, drag20]
      scalars: [delta20_norm, drag20_norm, context_audit_20b]
      plots: [context_shift_vs_drag_primary]
    docs_refs: []
    acceptance_checks: []
  agreement_7b_vs_20b:
    title: Agreement 7B vs 20B
    summary: Compare 7B and 20B anchor-only structure on a shared sampled support.
    question: Is 7B adding specialist signal beyond 20B, or mostly redundancy?
    section: Agreement
    recipe: agreement_7b_vs_20b_recipe
    requires:
      views: [z7_60, z20_60]
      cohorts: [design_family]
    outputs:
      samples: [agreement_anchor_sample]
      neighbors: [z7_60_knn, z20_60_knn]
      clusters: [z7_60_kmeans, z20_60_kmeans]
      agreements: [agreement_7b_vs_20b]
      plots: [agreement_7b_vs_20b_summary]
    docs_refs: []
    acceptance_checks: []
  cluster_correspondence_primary:
    title: Cluster correspondence primary
    summary: Compare aligned Leiden cluster assignments between anchor-only and anchor-aware 20B views.
    question: Does anchor-plus-context change promoter organization?
    section: Clusters
    recipe: cluster_correspondence_recipe
    requires:
      clusters: [leiden_z20_60, leiden_z20_1k_anchor]
    outputs:
      plots: [cluster_correspondence_primary]
    docs_refs: []
    acceptance_checks:
      - kind: required_plot_kind
        value: correspondence_heatmap
  x0_primary_20b:
    title: X0 primary 20B
    summary: Export the primary 20B low-rank bundle plus landmark distances.
    question: Is the anchor-only 20B view a useful baseline export?
    section: Exports
    recipe: x0_primary_20b_recipe
    requires:
      views: [z20_60]
      exports: [x0_primary_20b]
    outputs:
      reducers: [z20_60_pca]
      reduced_views: [z20_60_pc32]
      exports: [x0_primary_20b]
    docs_refs: []
    acceptance_checks: []
  x1_primary_20b:
    title: X1 primary 20B
    summary: Export the primary 20B delta-only low-rank bundle.
    question: Is the delta-only 20B export stable enough to stand on its own?
    section: Exports
    recipe: x1_primary_20b_recipe
    requires:
      views: [z20_60, z20_1k_anchor]
      alignments: [anchor_ctx_20b]
      exports: [x1_primary_20b]
    outputs:
      views: [delta20]
      scalars: [delta20_norm]
      reducers: [delta20_pca]
      reduced_views: [delta20_pc32]
      exports: [x1_primary_20b]
    docs_refs: []
    acceptance_checks: []
  x2_primary_20b:
    title: X2 primary 20B
    summary: Export the aligned primary 20B multiblock bundle for downstream supervised learning, while keeping the delta block explicitly provisional pending the context audit.
    question: Does x2_primary_20b remain the deterministic primary supervised export once the context audit is complete?
    section: Exports
    recipe: x2_primary_20b_recipe
    requires:
      views: [z20_60, z20_1k_anchor]
      alignments: [anchor_ctx_20b]
      exports: [x2_primary_20b]
    outputs:
      views: [delta20]
      scalars: [delta20_norm]
      reducers: [z20_60_pca, delta20_pca]
      reduced_views: [z20_60_pc32, delta20_pc32]
      exports: [x2_primary_20b]
    docs_refs: []
    acceptance_checks: []
  x3_ablation_7b:
    title: X3 ablation 7B
    summary: Export the aligned 7B ablation bundle for challenger comparisons.
    question: Does the 7B committee member add useful ablation structure?
    section: Exports
    recipe: x3_ablation_7b_recipe
    requires:
      views: [z7_60, z7_1k_anchor]
      alignments: [anchor_ctx_7b]
      exports: [x3_ablation_7b]
    outputs:
      views: [delta7]
      reducers: [z7_60_pca, delta7_pca]
      reduced_views: [z7_60_pc32, delta7_pc32]
      exports: [x3_ablation_7b]
    docs_refs: []
    acceptance_checks: []
study_binding:
  study_id: stress_ethanol_cipro_growth
