        params:
          view: z20_1k_anchor
          run_id: z20_1k_anchor_anchor_ctx_pca
          alignment: anchor_ctx_20b
          dims: 32
          reduced_view_id: z20_1k_anchor_anchor_ctx_pc32
      - id: fit_cluster_neighbors_anchor
        op: neighbors.fit
        depends_on: [reduce_cluster_anchor]
        params:
          neighbors: leiden_z20_60_knn
          reduced_view: z20_60_anchor_ctx_pc32
          k: 15
          backend: approximate
      - id: fit_cluster_neighbors_context
        op: neighbors.fit
        depends_on: [reduce_cluster_context]
        params:
          neighbors: leiden_z20_1k_anchor_knn
          reduced_view: z20_1k_anchor_anchor_ctx_pc32
          k: 15
          backend: approximate
      - id: fit_cluster_leiden_anchor
        op: cluster.fit
        depends_on: [fit_cluster_neighbors_anchor]
        params:
          cluster: leiden_z20_60
          reduced_view: z20_60_anchor_ctx_pc32
          method: leiden
          neighbor_set: leiden_z20_60_knn
          k: 15
          resolution: 0.6
      - id: fit_cluster_leiden_context
        op: cluster.fit
        depends_on: [fit_cluster_neighbors_context]
        params:
          cluster: leiden_z20_1k_anchor
          reduced_view: z20_1k_anchor_anchor_ctx_pc32
          method: leiden
          neighbor_set: leiden_z20_1k_anchor_knn
          k: 15
          resolution: 1.0
      - id: render_cluster_correspondence
        op: plot.render
        depends_on: [fit_cluster_leiden_anchor, fit_cluster_leiden_context]
        params:
          plot_id: cluster_correspondence_primary
