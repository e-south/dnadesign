schema_version: latentdna.workspace.v1

workspace:
  id: stress_ethanol_cipro_latent_atlas
  title: Stress / ethanol / ciprofloxacin growth promoter study
  output_root: ./outputs

defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats: [svg, pdf, png]
  neighbor_backend: auto
  memory_policy:
    warn_fraction_of_system_ram: 0.5
    fail_fraction_of_system_ram: 0.75
    require_override_above_fail: true

sources:
  anchor60:
    kind: usr
    root: /abs/usr_root
    dataset: promoter/stress_ethanol_cipro_anchor_set
    record_key: id
    subject_key: id
  ctx1k:
    kind: usr
    root: /abs/usr_root
    dataset: promoter/stress_ethanol_cipro_construct_contexts
    record_key: id
    subject_key: construct__anchor_id
    context_key: construct__context_id

metadata:
  include:
    - usr_label__primary
    - densegen__plan
    - densegen__required_regulators
    - construct__template_id
    - template_id
    - construct__template_id
    - infer__evo2_7b__anchor_only_7b_features__log_likelihood__mean_per_token
    - infer__evo2_7b__template_1kb_7b_features__log_likelihood__mean_per_token
    - infer__evo2_20b__anchor_only_20b_features__log_likelihood__mean_per_token
    - infer__evo2_20b__template_1kb_20b_features__log_likelihood__mean_per_token

alignments:
  anchor_ctx_20b:
    left: z20_1k_anchor
    right: z20_60
    left_on:
      - construct__anchor_id
    right_on:
      - id
    support: intersection
  anchor_ctx_7b:
    left: z7_1k_anchor
    right: z7_60
    left_on:
      - construct__anchor_id
    right_on:
      - id
    support: intersection
  anchor_seq_20b:
    left: z20_1k_seq
    right: z20_1k_anchor
    "on": subject_key
    support: intersection
  anchor_seq_7b:
    left: z7_1k_seq
    right: z7_1k_anchor
    "on": subject_key
    support: intersection

views:
  z7_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 60bp
    role: committee_member
  z20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 60bp
    role: primary
  z7_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__anchor_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 1kb_anchor
    role: committee_member
  z20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__anchor_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_anchor
    role: primary
  z20_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__intermediate_embedding__block23_mlp_out__seq_mean
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      encoder: evo2
      model: 20b
      family: intermediate
      context: 1kb_seq
    role: challenger
  z7_1k_seq:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__intermediate_embedding__block26_mlp_out__seq_mean
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      encoder: evo2
      model: 7b
      family: intermediate
      context: 1kb_seq
    role: challenger
  logits20_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_20b__anchor_only_20b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 60bp
    role: challenger
  logits7_60:
    source: anchor60
    vector:
      kind: column
      name: infer__evo2_7b__anchor_only_7b_features__output_layer_mean__seq_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      context: 60bp
    role: challenger
  logits20_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_20b__template_1kb_20b_features__output_layer_mean__anchor_mean
    coordinate_space_id: evo2_20b_output_layer_mean
    tags:
      encoder: evo2
      model: 20b
      family: pooled_logits
      context: 1kb_anchor
    role: challenger
  logits7_1k_anchor:
    source: ctx1k
    vector:
      kind: column
      name: infer__evo2_7b__template_1kb_7b_features__output_layer_mean__anchor_mean
    coordinate_space_id: evo2_7b_output_layer_mean
    tags:
      encoder: evo2
      model: 7b
      family: pooled_logits
      context: 1kb_anchor
    role: challenger
  delta20:
    derive:
      kind: vector_difference
      left: z20_1k_anchor
      right: z20_60
      alignment: anchor_ctx_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: primary
  delta7:
    derive:
      kind: vector_difference
      left: z7_1k_anchor
      right: z7_60
      alignment: anchor_ctx_7b
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      operation: difference
      family: intermediate
    role: committee_member
  drag20:
    derive:
      kind: vector_difference
      left: z20_1k_seq
      right: z20_1k_anchor
      alignment: anchor_seq_20b
    coordinate_space_id: evo2_20b_intermediate_block23_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 1kb_drag
    role: challenger
  drag7:
    derive:
      kind: vector_difference
      left: z7_1k_seq
      right: z7_1k_anchor
      alignment: anchor_seq_7b
    coordinate_space_id: evo2_7b_intermediate_block26_mlp_out
    tags:
      operation: difference
      family: intermediate
      context: 1kb_drag
    role: challenger

scalars:
  delta7_norm:
    derive:
      kind: vector_norm
      view: delta7
      norm: l2
  delta20_norm:
    derive:
      kind: vector_norm
      view: delta20
      norm: l2
  drag7_norm:
    derive:
      kind: vector_norm
      view: drag7
      norm: l2
  drag20_norm:
    derive:
      kind: vector_norm
      view: drag20
      norm: l2
  drag20_norm_for_context_audit:
    derive:
      kind: select_columns
      source: drag20_norm
      columns:
        - construct__anchor_id
        - drag20_norm
  context_audit_20b:
    derive:
      kind: join_tables
      sources:
        - delta20_norm
        - drag20_norm_for_context_audit
      "on":
        - construct__anchor_id
  ethanol_vs_cipro:
    derive:
      kind: column_expression
      source: primary_landmark_distances
      expression: d_sulap - d_spyp
      output_column: ethanol_vs_cipro

landmarks:
  spyp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: spyp
    representation:
      mode: centroid
  sulap:
    source: anchor60
    where:
      column: usr_label__primary
      equals: sulAp
    representation:
      mode: centroid
  soxsp:
    source: anchor60
    where:
      column: usr_label__primary
      equals: soxSp
    representation:
      mode: centroid
  j23105:
    source: anchor60
    where:
      column: usr_label__primary
      equals: J23105
    representation:
      mode: centroid

cohorts:
  plan:
    kind: column
    source: anchor60
    column: densegen__plan
  design_family:
    kind: promoter_metadata
    source: anchor60
    derive: design_family
  design_regulator_composition:
    kind: promoter_metadata
    source: anchor60
    derive: design_regulator_composition
  sigma70_variant:
    kind: promoter_metadata
    source: anchor60
    derive: sigma70_variant
  campaign_prior:
    kind: promoter_metadata
    source: anchor60
    derive: campaign_prior
  is_control:
    kind: promoter_metadata
    source: anchor60
    derive: is_control
  source_class:
    kind: promoter_metadata
    source: anchor60
    derive: source_class

reference_sets:
  promoter_wt_core:
    ids: [spyp, sulAp, soxSp, J23105]
    match_column: usr_label__primary
    label_column: usr_label__primary
    label_mode: label_and_highlight

plots:
  atlas_2x2_intermediate_main:
    kind: projection_grid
    projections: [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor]
    panel_titles:
      - 7B anchor-only (60 bp)
      - 20B anchor-only (60 bp)
      - 7B context-aware (1 kb anchor)
      - 20B context-aware (1 kb anchor)
    color_column: design_family
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  atlas_2x3_model_family:
    kind: projection_grid
    projections:
      [umap_z7_60, umap_z20_60, umap_z7_1k_anchor, umap_z20_1k_anchor, umap_logits7_1k_anchor, umap_logits20_1k_anchor]
    panel_titles:
      - 7B anchor-only intermediate
      - 20B anchor-only intermediate
      - 7B anchor-aware intermediate
      - 20B anchor-aware intermediate
      - 7B anchor-aware pooled logits
      - 20B anchor-aware pooled logits
    color_column: design_family
    annotation:
      reference_set: promoter_wt_core
      require_in_every_panel: true
      missing_policy: fail
      collision_policy: repel_then_callout
  control_pca_explained_variance_curve:
    kind: curve
    reducer: z20_60_pca
  cluster_correspondence_primary:
    kind: correspondence_heatmap
    left_cluster: leiden_z20_60
    right_cluster: leiden_z20_1k_anchor
  agreement_7b_vs_20b_summary:
    kind: agreement_summary
    agreement: agreement_7b_vs_20b
  context_shift_primary_distribution:
    kind: distribution
    scalar: delta20_norm
    value_column: delta20_norm
    color_column: design_family
    render_mode: ecdf
  drag_qc_distribution:
    kind: distribution
    scalar: drag20_norm
    value_column: drag20_norm
    color_column: design_family
    render_mode: ecdf
  context_shift_vs_drag_primary:
    kind: xy_scatter
    scalar: context_audit_20b
    x_column: delta20_norm
    y_column: drag20_norm
    color_column: design_family
    render_mode: hexbin

exports:
  x0_primary_20b:
    row_basis: z20_60_pc32
    blocks:
      - kind: reduced_view
        block_id: z20_60_pc
        source: z20_60_pc32
        feature_prefix: z20_60
      - kind: table_columns
        block_id: landmark_distances
        source: primary_landmark_distances
        columns: [d_spyp, d_sulap, d_soxsp, d_j23105]
  x1_primary_20b:
    row_basis: delta20_pc32
    blocks:
      - kind: reduced_view
        block_id: delta20_pc
        source: delta20_pc32
        feature_prefix: delta20
      - kind: table_columns
        block_id: delta20_scalars
        source: delta20_norm
        columns: [delta20_norm]
  x2_primary_20b:
    row_basis: anchor_ctx_20b
    blocks:
      - kind: reduced_view
        block_id: z20_60_pc
        source: z20_60_pc32
        feature_prefix: z20_60
        alignment: anchor_ctx_20b
      - kind: reduced_view
        block_id: delta20_pc
        source: delta20_pc32
        feature_prefix: delta20
      - kind: table_columns
        block_id: landmark_distances
        source: primary_landmark_distances
        columns: [d_spyp, d_sulap, d_soxsp, d_j23105]
        alignment: anchor_ctx_20b
      - kind: table_columns
        block_id: delta20_scalars
        source: delta20_norm
        columns: [delta20_norm]
  x3_ablation_7b:
    row_basis: anchor_ctx_7b
    blocks:
      - kind: reduced_view
        block_id: z7_60_pc
        source: z7_60_pc32
        feature_prefix: z7_60
        alignment: anchor_ctx_7b
      - kind: reduced_view
        block_id: delta7_pc
        source: delta7_pc32
        feature_prefix: delta7

notebooks:
  browser:
    kind: workspace
    title: Promoter atlas browser
    description: Consolidated read-only browser for promoter atlas artifacts.
    default_deliverable: atlas_2x2_intermediate_main

recipes:
  atlas_2x2_recipe:
    steps:
      - id: materialize_z7_60
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_z20_60
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_z7_1k_anchor
        op: view.materialize
        params:
          view: z7_1k_anchor
      - id: materialize_z20_1k_anchor
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: sample_anchor_atlas
        op: sample.build
        depends_on: [materialize_z7_60, materialize_z20_60]
        params:
          sample: atlas_anchor_sample
          view: z20_60
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
          reference_set: promoter_wt_core
      - id: sample_context_atlas
        op: sample.build
        depends_on: [materialize_z7_1k_anchor, materialize_z20_1k_anchor]
        params:
          sample: atlas_context_sample
          view: z20_1k_anchor
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
          reference_set: promoter_wt_core
      - id: project_z7_60
        op: projection.fit
        depends_on: [sample_anchor_atlas]
        params:
          projection_id: umap_z7_60
          view: z7_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_z20_60
        op: projection.fit
        depends_on: [sample_anchor_atlas]
        params:
          projection_id: umap_z20_60
          view: z20_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_z7_1k_anchor
        op: projection.fit
        depends_on: [sample_context_atlas]
        params:
          projection_id: umap_z7_1k_anchor
          view: z7_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_z20_1k_anchor
        op: projection.fit
        depends_on: [sample_context_atlas]
        params:
          projection_id: umap_z20_1k_anchor
          view: z20_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: render_atlas_grid
        op: plot.render
        depends_on: [project_z7_60, project_z20_60, project_z7_1k_anchor, project_z20_1k_anchor]
        params:
          plot_id: atlas_2x2_intermediate_main
      - id: generate_browser
        op: notebook.generate
        depends_on: [render_atlas_grid]
        params:
          notebook: browser
  geometry_switchboard_20b_recipe:
    steps:
      - id: materialize_switchboard_z7_60
        op: view.materialize
        params:
          view: z7_60
      - id: materialize_switchboard_z20_60
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_switchboard_z7_1k_anchor
        op: view.materialize
        params:
          view: z7_1k_anchor
      - id: materialize_switchboard_z20_1k_anchor
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: materialize_switchboard_z7_1k_seq
        op: view.materialize
        params:
          view: z7_1k_seq
      - id: materialize_switchboard_z20_1k_seq
        op: view.materialize
        params:
          view: z20_1k_seq
      - id: materialize_switchboard_logits7_60
        op: view.materialize
        params:
          view: logits7_60
      - id: materialize_switchboard_logits20_60
        op: view.materialize
        params:
          view: logits20_60
      - id: materialize_switchboard_logits7_1k_anchor
        op: view.materialize
        params:
          view: logits7_1k_anchor
      - id: materialize_switchboard_logits20_1k_anchor
        op: view.materialize
        params:
          view: logits20_1k_anchor
      - id: sample_switchboard_anchor
        op: sample.build
        depends_on: [materialize_switchboard_z20_60]
        params:
          sample: atlas_anchor_sample
          view: z20_60
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
          reference_set: promoter_wt_core
      - id: sample_switchboard_context
        op: sample.build
        depends_on: [materialize_switchboard_z20_1k_anchor]
        params:
          sample: atlas_context_sample
          view: z20_1k_anchor
          strategy: stratified
          group_by: design_family
          n: 20000
          seed: 17
          reference_set: promoter_wt_core
      - id: project_switchboard_z20_60
        op: projection.fit
        depends_on: [sample_switchboard_anchor]
        params:
          projection_id: umap_z20_60
          view: z20_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_z7_60
        op: projection.fit
        depends_on: [sample_switchboard_anchor]
        params:
          projection_id: umap_z7_60
          view: z7_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_z7_1k_anchor
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_z7_1k_anchor
          view: z7_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_z20_1k_anchor
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_z20_1k_anchor
          view: z20_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_z7_1k_seq
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_z7_1k_seq
          view: z7_1k_seq
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_z20_1k_seq
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_z20_1k_seq
          view: z20_1k_seq
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_logits7_60
        op: projection.fit
        depends_on: [sample_switchboard_anchor]
        params:
          projection_id: umap_logits7_60
          view: logits7_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_logits20_60
        op: projection.fit
        depends_on: [sample_switchboard_anchor]
        params:
          projection_id: umap_logits20_60
          view: logits20_60
          sample: atlas_anchor_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_logits7_1k_anchor
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_logits7_1k_anchor
          view: logits7_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: project_switchboard_logits20_1k_anchor
        op: projection.fit
        depends_on: [sample_switchboard_context]
        params:
          projection_id: umap_logits20_1k_anchor
          view: logits20_1k_anchor
          sample: atlas_context_sample
          metric: cosine
          seed: 17
      - id: render_switchboard_atlas_2x3
        op: plot.render
        depends_on:
          [
            project_switchboard_z7_60,
            project_switchboard_z20_60,
            project_switchboard_z7_1k_anchor,
            project_switchboard_z20_1k_anchor,
            project_switchboard_logits7_1k_anchor,
            project_switchboard_logits20_1k_anchor,
          ]
        params:
          plot_id: atlas_2x3_model_family
      - id: generate_switchboard_browser
        op: notebook.generate
        depends_on:
          [
            render_switchboard_atlas_2x3,
            project_switchboard_z7_60,
            project_switchboard_z20_60,
            project_switchboard_z7_1k_anchor,
            project_switchboard_z20_1k_anchor,
            project_switchboard_z7_1k_seq,
            project_switchboard_z20_1k_seq,
            project_switchboard_logits7_60,
            project_switchboard_logits20_60,
            project_switchboard_logits7_1k_anchor,
            project_switchboard_logits20_1k_anchor,
          ]
        params:
          notebook: browser
          force: true
  control_pca_curve_recipe:
    steps:
      - id: materialize_anchor_view
        op: view.materialize
        params:
          view: z20_60
      - id: reduce_anchor_view
        op: view.reduce
        depends_on: [materialize_anchor_view]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
      - id: render_control_curve
        op: plot.render
        depends_on: [reduce_anchor_view]
        params:
          plot_id: control_pca_explained_variance_curve
  context_shift_primary_recipe:
    steps:
      - id: materialize_primary_anchor
        op: view.materialize
        params:
          view: z20_60
      - id: materialize_primary_context
        op: view.materialize
        params:
          view: z20_1k_anchor
      - id: build_primary_alignment
        op: alignment.build
        depends_on: [materialize_primary_anchor, materialize_primary_context]
        params:
          alignment: anchor_ctx_20b
      - id: derive_primary_delta
        op: view.derive
        depends_on: [build_primary_alignment]
        params:
          view: delta20
      - id: derive_primary_delta_norm
        op: scalar.derive
        depends_on: [derive_primary_delta]
        params:
          scalar: delta20_norm
      - id: reduce_primary_anchor
        op: view.reduce
        depends_on: [materialize_primary_anchor]
        params:
          view: z20_60
          run_id: z20_60_pca
          dims: 32
