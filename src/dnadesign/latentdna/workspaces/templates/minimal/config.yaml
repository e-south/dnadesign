schema_version: latentdna.workspace.v1

workspace:
  id: latentdna_workspace
  output_root: ./outputs/latentdna

defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats: [svg, png]
  neighbor_backend: auto

sources:
  anchor60:
    kind: parquet
    path: inputs/anchor60.parquet
    record_key: id
    subject_key: subject_id

metadata:
  include:
    - cohort

views:
  z20_60:
    source: anchor60
    vector:
      kind: column
      name: embedding
    coordinate_space_id: demo_space
    tags:
      model: demo
      context: anchor_only
    role: primary
