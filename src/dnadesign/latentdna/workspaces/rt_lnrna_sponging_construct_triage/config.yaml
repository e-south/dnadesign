      - id: derive_intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        op: view.derive
        depends_on:
          - materialize_intermediate_embedding_7b_dual_cassette_2000bp_seq_mean
          - materialize_intermediate_embedding_7b_dual_cassette_2000bp_reverse_complement_seq_mean
        params: {view: intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat}
      - id: derive_intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        op: view.derive
