schema_version: latentdna.workspace.v1
workspace:
  id: rt_lnrna_sponging_construct_triage
  title: RT-lnRNA sponging construct triage
  output_root: ./outputs
defaults:
  analysis_dtype: float32
  metric: cosine
  random_seed: 17
  plot_formats:
    - svg
    - png
  neighbor_backend: auto
sources:
  dual_cassette_2000bp_seq_mean_intermediate:
    kind: infer_feature_sidecar
    root: ../../../../../workspaces/studies/rt_lnrna_sponging_construct_triage/usr
    dataset: rt_lnrna_sponging_construct_triage_construct_contexts_2000bp_v1
    record_key: construct_subject__id
    subject_key: construct_subject__id
    role: primary
    sequence_scope: dual_cassette_2000bp_seq_mean
    emitted_length_bp: 2000
    pooling_span_bp: full_sequence
    where:
      model_name: evo2_7b
      representation_kind: intermediate_embedding
