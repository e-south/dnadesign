    mathematical_definition: Spearman correlation between source-scoped Khan PAGE RT-DNA abundance group rank gaps and observed centroid cosine-distance gaps after config-declared cohort balancing.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  khan_abundance_label_permutation_pvalue:
