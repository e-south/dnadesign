        - rt_lnrna_abundance_ladder_rows_intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        - rt_lnrna_abundance_ladder_rows_intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - rt_lnrna_abundance_ladder_rows_intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - rt_lnrna_abundance_ladder_rows_intermediate_embedding_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
        - rt_lnrna_abundance_ladder_rows_output_layer_mean_7b_dual_cassette_2000bp_fwd_rc_concat
        - rt_lnrna_abundance_ladder_rows_output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - rt_lnrna_abundance_ladder_rows_output_layer_mean_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - rt_lnrna_abundance_ladder_rows_output_layer_mean_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
    docs_refs:
      - study:rt_lnrna_sponging_construct_triage/deliverables/primary/rt_lnrna_overlay_ordinal_audit
    acceptance_checks: []
  rt_lnrna_slot_context_robustness_summary:
    title: RT-lnRNA span and context robustness summary
    section: primary
    question: How stable are aligned full-construct, lnRNA span, RT CDS span, paired-span, forward/RC, and output-layer relationships?
    summary: Aligned representation robustness metrics for the span-structured RT-lnRNA construct population.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      alignments:
