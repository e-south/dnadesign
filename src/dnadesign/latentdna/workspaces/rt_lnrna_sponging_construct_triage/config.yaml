metadata:
  include:
    - candidate_source
    - construct_projection_status
    - template_name
    - target_context_source_id
    - target_context_region_start_0
    - target_context_region_end_0
    - target_context_variable_length_policy
    - khan_abundance_overlay_status
    - khan_abundance_raw_value
    - khan_abundance_normalized_value
    - khan_abundance_ordinal_bin
    - crawford_abundance_overlay_status
    - crawford_abundance_raw_value
    - crawford_abundance_normalized_value
    - crawford_abundance_ordinal_bin
    - crawford_design_reference_status
  derivations:
    candidate_source:
      kind: constant
      value: lab_anchor_control
      value_type: string
    construct_projection_status:
      kind: constant
      value: representable
      value_type: string
    template_name:
      kind: constant
      value: dual_cassette_rt_lnrna_expression_template_v1
      value_type: string
    target_context_source_id:
      kind: constant
      value: genbank:1600bp-region.gb#record
      value_type: string
    target_context_region_start_0:
      kind: constant
      value: 56
      value_type: int64
    target_context_region_end_0:
      kind: constant
      value: 1656
      value_type: int64
    target_context_variable_length_policy:
      kind: constant
      value: symmetric_flank_trim_from_lnrna_center
      value_type: string
    khan_abundance_overlay_status:
      kind: constant
      value: planned_unresolved
      value_type: string
    khan_abundance_raw_value:
      kind: constant
      value: null
      value_type: float64
    khan_abundance_normalized_value:
      kind: constant
      value: null
      value_type: float64
    khan_abundance_ordinal_bin:
      kind: constant
      value: null
      value_type: string
    crawford_abundance_overlay_status:
      kind: constant
      value: planned_unresolved
      value_type: string
    crawford_abundance_raw_value:
      kind: constant
      value: null
      value_type: float64
    crawford_abundance_normalized_value:
      kind: constant
      value: null
      value_type: float64
    crawford_abundance_ordinal_bin:
      kind: constant
      value: null
      value_type: string
    crawford_design_reference_status:
      kind: constant
      value: planned_unresolved
      value_type: string
  axes:
    khan_abundance_ordinal_bin:
      column: khan_abundance_ordinal_bin
      label: Khan RT-DNA abundance prior bin
      kind: ordinal
      category_order: [nondetect, low, medium, high, very_high]
      display_labels:
        nondetect: Nondetect
        low: Low
        medium: Medium
        high: High
        very_high: Very high
      metric_labels:
        khan_abundance_ordinal_spearman: Khan abundance ordinal Spearman
        khan_abundance_ordinal_kendall: Khan abundance ordinal Kendall
        khan_abundance_balanced_ordinal_spearman: Khan abundance balanced ordinal Spearman
        khan_abundance_label_permutation_pvalue: Khan abundance permutation p-value
    crawford_abundance_ordinal_bin:
      column: crawford_abundance_ordinal_bin
      label: Crawford msDNA abundance prior bin
      kind: ordinal
      category_order: [very_low, low, medium, high, very_high]
      display_labels:
        very_low: Very low
        low: Low
        medium: Medium
        high: High
        very_high: Very high
      metric_labels:
        crawford_abundance_ordinal_spearman: Crawford abundance ordinal Spearman
        crawford_abundance_ordinal_kendall: Crawford abundance ordinal Kendall
        crawford_abundance_balanced_ordinal_spearman: Crawford abundance balanced ordinal Spearman
        crawford_abundance_label_permutation_pvalue: Crawford abundance permutation p-value
