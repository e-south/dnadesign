recipes:
  rt_lnrna_representation_review_recipe:
    steps:
      - {id: materialize_intermediate_embedding_7b_dual_cassette_2000bp_seq_mean, op: view.materialize, params: {view: intermediate_embedding_7b_dual_cassette_2000bp_seq_mean}}
      - {id: materialize_intermediate_embedding_7b_dual_cassette_2000bp_reverse_complement_seq_mean, op: view.materialize, params: {view: intermediate_embedding_7b_dual_cassette_2000bp_reverse_complement_seq_mean}}
      - {id: materialize_intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean}}
      - {id: materialize_intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean}}
      - {id: materialize_intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean}}
      - {id: materialize_intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_reverse_complement_anchor_mean, op: view.materialize, params: {view: intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_reverse_complement_anchor_mean}}
      - {id: materialize_output_layer_mean_7b_dual_cassette_2000bp_seq_mean, op: view.materialize, params: {view: output_layer_mean_7b_dual_cassette_2000bp_seq_mean}}
      - {id: materialize_output_layer_mean_7b_dual_cassette_2000bp_reverse_complement_seq_mean, op: view.materialize, params: {view: output_layer_mean_7b_dual_cassette_2000bp_reverse_complement_seq_mean}}
      - {id: materialize_output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean, op: view.materialize, params: {view: output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean}}
      - {id: materialize_output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean, op: view.materialize, params: {view: output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean}}
      - {id: materialize_output_layer_mean_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean, op: view.materialize, params: {view: output_layer_mean_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean}}
