deliverables:
  rt_lnrna_dataset_overview:
    title: RT-lnRNA dataset overview
    section: primary
    question: What RT-native source families, promotion states, abundance affiliations, projection states, label readiness states, and source-window cases make up the LatentDNA denominator?
    summary: Dataset inventory for the materialized 2,000 bp RT-lnRNA construct population.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      sources:
        - dual_cassette_2000bp_seq_mean_intermediate
    outputs:
      plots: [rt_lnrna_dataset_overview]
      scalars: [rt_lnrna_dataset_overview_counts]
    docs_refs:
      - study:rt_lnrna_sponging_construct_triage/deliverables/primary/rt_lnrna_dataset_overview
    acceptance_checks:
      - {kind: required_plot_kind, value: categorical_count}
  representation_health_summary:
    title: RT-lnRNA representation health summary
    section: gates
    question: Do the planned intermediate and output-layer representation views avoid obvious collapse after Evo2 sidecars exist?
    summary: PCA-rank and pairwise-distance health gate for the RT-lnRNA candidate gallery.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      views:
        - intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        - intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
        - output_layer_mean_7b_dual_cassette_2000bp_fwd_rc_concat
        - output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - output_layer_mean_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - output_layer_mean_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
    outputs:
      plots: [representation_health_summary]
      scalars: [representation_health_summary_metrics]
    docs_refs:
      - study:rt_lnrna_sponging_construct_triage/deliverables/gates/representation_health_summary
    acceptance_checks:
      - {kind: required_plot_kind, value: metric_panel_grid}
  rt_lnrna_source_structure_summary:
    title: RT-lnRNA source and design-structure summary
    section: primary
    question: Do the four intermediate candidate-X views preserve RT-native source-family, GenBank variant, abundance overlay, compiler, RT-DMS, and source-regime structure?
    summary: Generic design/source-structure separation metrics over RT-native metadata axes.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      views:
        - intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        - intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
    outputs:
      plots: [rt_lnrna_source_structure_summary]
      scalars: [rt_lnrna_source_structure_summary_metrics]
    docs_refs:
      - study:rt_lnrna_sponging_construct_triage/deliverables/primary/rt_lnrna_source_structure_summary
    acceptance_checks:
      - {kind: required_plot_kind, value: metric_panel_grid}
  representation_scree_diagnostic:
    title: RT-lnRNA representation scree diagnostic
    section: appendix
    question: How concentrated is retained PCA variance for each intermediate and output-layer RT-lnRNA view?
    summary: Appendix scree curves for the PCA reducers that feed the representation-health collapse gate.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      views:
        - intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        - intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
        - output_layer_mean_7b_dual_cassette_2000bp_fwd_rc_concat
        - output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - output_layer_mean_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - output_layer_mean_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
    outputs:
      plots: [representation_scree_diagnostic]
    docs_refs:
      - study:rt_lnrna_sponging_construct_triage/deliverables/appendix/representation_scree_diagnostic
    acceptance_checks:
      - {kind: required_plot_kind, value: curve_grid}
  rt_lnrna_overlay_ordinal_audit:
    title: RT-lnRNA overlay ordinal audit
    section: primary
    question: Do Khan and Crawford source-scoped abundance groups form coherent ordered axes in each representation view?
    summary: Ordered metadata-axis audit for Khan PAGE RT-DNA abundance and Crawford Fig2 Eco1 msDNA scores.
    recipe: rt_lnrna_representation_review_recipe
    requires:
      views:
        - intermediate_embedding_7b_dual_cassette_2000bp_fwd_rc_concat
        - intermediate_embedding_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_rt_cds_fixed_1600bp_window_in_construct_anchor_mean_bidir_concat
        - intermediate_embedding_7b_lnrna_384bp_rt_cds_1600bp_anchor_window_pair_concat
    outputs:
      plots:
        - rt_lnrna_overlay_ordinal_audit
        - rt_lnrna_abundance_margin_ladder_gallery
        - rt_lnrna_abundance_margin_scatter_gallery
