reference_sets:
  reference_genbank_catalog_rows:
    label: GenBank catalog rows
    match_column: construct_subject__id
    label_column: source_variant_id
    label_limit: 24
    where_all:
      - column: candidate_source
        equals: genbank_variant_catalog
      - column: source_variant_id
        not_regex: '^no_source_variant$'
  reference_source_family_anchors:
    label: Source-family anchors
    match_column: construct_subject__id
    label_column: candidate_source
    label_mode: highlight_only
    label_limit: 0
    where:
      - column: candidate_source
        in_values:
          - genbank_variant_catalog
          - khan_abundance_affiliated_rt_lnrna_reference
          - crawford_eco1_lnrna_fixed_wt_rt
          - compiler_generated_msd_lnrna_variant
  reference_msd_compiler_landmarks:
    label: MSD compiler landmarks
    match_column: construct_subject__id
    label_column: compiler_msd_design_id
    label_limit: 12
    where_all:
      - column: candidate_source
        equals: compiler_generated_msd_lnrna_variant
      - column: compiler_msd_design_id
        not_regex: '^no_compiler_design$'
  reference_crawford_design_affiliated_rows:
    label: Crawford design-affiliated rows
    match_column: construct_subject__id
    label_column: construct_subject__crawford_reference_record_ids
    label_mode: highlight_only
    label_limit: 0
    where_all:
      - column: crawford_design_reference_status
        equals: design_reference_affiliated
  reference_khan_abundance_rows:
    label: Khan abundance-affiliated rows
    match_column: construct_subject__id
    label_column: source_variant_id
    label_limit: 12
    where_all:
      - column: khan_abundance_overlay_status
        equals: abundance_affiliated
  reference_crawford_high_abundance_examples:
    label: Crawford high-abundance examples
    match_column: construct_subject__id
    label_column: construct_subject__crawford_abundance_observation_ids
    label_limit: 12
