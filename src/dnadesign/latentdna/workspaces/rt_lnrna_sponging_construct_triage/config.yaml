metadata:
  include:
    - source_family
    - candidate_source
    - source_collection_id
    - source_literature_id
    - source_variant_id
    - source_regime
    - source_promotion_status
    - source_window_case
    - abundance_affiliation
    - construct_projection_status
    - label_readiness_status
    - template_name
    - target_context_source_id
    - target_context_region_start_0
    - target_context_region_end_0
    - target_context_variable_length_policy
    - rt_variant_class
    - rt_dms_mutation_class
    - compiler_msd_cap_id
    - compiler_msd_design_id
    - compiler_msd_stem_profile
    - khan_abundance_overlay_status
    - khan_abundance_raw_value
    - khan_abundance_normalized_value
    - khan_abundance_ordinal_bin
    - crawford_abundance_overlay_status
    - crawford_abundance_raw_value
    - crawford_abundance_ordinal_bin
    - crawford_design_reference_status
  derivations:
    source_family:
      kind: copy
      source: construct_subject__source_basis
      value_type: string
    candidate_source:
      kind: copy
      source: construct_subject__source_basis
      value_type: string
    source_collection_id:
      kind: coalesce
      sources: [construct_subject__source_collection_id]
      default: no_source_collection
      value_type: string
    source_literature_id:
      kind: coalesce
      sources: [construct_subject__source_literature_id]
      default: study_owned_or_unresolved
      value_type: string
    source_variant_id:
      kind: coalesce
      sources: [construct_subject__source_variant_id]
      default: no_source_variant
      value_type: string
    source_regime:
      kind: coalesce
      sources: [construct_subject__source_regime]
      default: source_regime_unassigned
      value_type: string
    source_promotion_status:
      kind: token_presence
      source: construct_subject__source_collection_id
      present_value: source_promoted
      absent_value: provenance_only
      value_type: string
    source_window_case:
      kind: map_values
      source: construct_subject__construct_projection_status
      mapping:
        representable: within_window_materialized
      default: over_window_or_unresolved
      value_type: string
    abundance_affiliation:
      kind: token_presence
      sources:
        - construct_subject__khan_abundance_observation_ids
        - construct_subject__crawford_abundance_observation_ids
      present_value: abundance_affiliated
      absent_value: not_abundance_affiliated
      value_type: string
    construct_projection_status:
      kind: copy
      source: construct_subject__construct_projection_status
      value_type: string
    label_readiness_status:
      kind: constant
      value: reader_spop_labels_not_materialized
      value_type: string
    template_name:
      kind: constant
      value: dual_cassette_rt_lnrna_expression_template_v1
      value_type: string
    target_context_source_id:
      kind: constant
      value: genbank:2000bp-region.gb#record
      value_type: string
    target_context_region_start_0:
      kind: constant
      value: 56
      value_type: int64
    target_context_region_end_0:
      kind: constant
      value: 1656
      value_type: int64
    target_context_variable_length_policy:
      kind: constant
      value: symmetric_flank_trim_from_lnrna_center
      value_type: string
    rt_variant_class:
      kind: coalesce
      sources: [construct_subject__variant_class]
      default: variant_class_unassigned
      value_type: string
    rt_dms_mutation_class:
      kind: token_presence
      source: construct_subject__dms_slot
      present_value: rt_cds_point_mutation
      absent_value: not_rt_cds_point_mutation
      value_type: string
    compiler_msd_cap_id:
      kind: coalesce
      sources: [construct_subject__msd_cap_id]
      default: no_compiler_cap
      value_type: string
    compiler_msd_design_id:
      kind: coalesce
      sources: [construct_subject__msd_design_id]
      default: no_compiler_design
      value_type: string
    compiler_msd_stem_profile:
      kind: coalesce
      sources: [construct_subject__msd_profile_s3s2s1s0]
      default: no_compiler_stem_profile
      value_type: string
    khan_abundance_overlay_status:
      kind: token_presence
      source: construct_subject__khan_abundance_observation_ids
      present_value: abundance_affiliated
      absent_value: not_abundance_affiliated
      value_type: string
    khan_abundance_raw_value:
      kind: delimited_numeric_mean
      source: construct_subject__khan_abundance_raw_values
      value_type: float64
    khan_abundance_normalized_value:
      kind: delimited_numeric_mean
      source: construct_subject__khan_abundance_normalized_values
      value_type: float64
    khan_abundance_ordinal_bin:
      kind: single_categorical_token
      source: construct_subject__khan_abundance_ordinal_bins
      value_type: string
    crawford_abundance_overlay_status:
      kind: token_presence
      source: construct_subject__crawford_abundance_observation_ids
      present_value: abundance_affiliated
      absent_value: not_abundance_affiliated
      value_type: string
    crawford_abundance_raw_value:
      kind: delimited_numeric_mean
      source: construct_subject__crawford_abundance_raw_values
      value_type: float64
    crawford_abundance_ordinal_bin:
      kind: numeric_quantile_bin
      source: construct_subject__crawford_abundance_raw_values
      edges: [8.90033258134951, 95.97675900112976, 212.83370392895753, 380.6567556708186]
      labels: [very_low, low, medium, high, very_high]
      value_type: string
    crawford_design_reference_status:
      kind: token_presence
      source: construct_subject__crawford_reference_record_ids
      present_value: design_reference_affiliated
      absent_value: not_design_reference_affiliated
      value_type: string
  axes:
    khan_abundance_ordinal_bin:
      column: khan_abundance_ordinal_bin
      label: Khan PAGE RT-DNA abundance group
      kind: ordinal
      category_order: [nondetect, low, medium, high, very_high]
      display_labels:
        nondetect: Nondetect
        low: Low
        medium: Medium
        high: High
        very_high: Very high
      metric_labels:
        khan_abundance_ordinal_spearman: Khan abundance ordinal Spearman
        khan_abundance_ordinal_kendall: Khan abundance ordinal Kendall
