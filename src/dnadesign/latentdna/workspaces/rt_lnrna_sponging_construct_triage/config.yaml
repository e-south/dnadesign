metric_definitions:
  khan_abundance_ordinal_spearman:
    display_name: Khan abundance ordinal Spearman
    mathematical_definition: Spearman correlation between source-scoped Khan PAGE RT-DNA abundance group rank gaps and observed centroid cosine-distance gaps.
    metric_family: ordinal_structure
    evidence_tier: primary
    unit: correlation
    direction: higher_is_better
    aggregation_level: candidate_summary
  khan_abundance_ordinal_kendall:
    display_name: Khan abundance ordinal Kendall
    mathematical_definition: Kendall tau correlation between source-scoped Khan PAGE RT-DNA abundance group rank gaps and observed centroid cosine-distance gaps.
