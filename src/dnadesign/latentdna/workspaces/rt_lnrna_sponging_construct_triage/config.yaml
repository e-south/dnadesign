            - {pair_id: output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat, label: "Output layer: lnRNA span vs full 2,000 bp", alignment_id: rt_lnrna_output_full_to_lnrna_slot, anchor_view_id: output_layer_mean_7b_lnrna_fixed_384bp_window_in_construct_anchor_mean_bidir_concat, context_view_id: output_layer_mean_7b_dual_cassette_2000bp_fwd_rc_concat}
