plot_id: rt_lnrna_candidate_decision_frontier
question: Which intermediate candidate-X view best balances RT-native source structure and Crawford abundance ordinal signal?
decision_role: primary
encoding: Single-panel tradeoff scatter with source-family separation on x, Crawford ordinal Spearman on y, effective rank as size, and candidate label as shape.
scope: The four intermediate OPAL X candidate views only.
guardrails:
  - Do not choose the largest concat by default; dimensional cost is reviewed in the scorecard.
  - Read this after health, source-structure, abundance, and context panels.
caption: RT-lnRNA candidate-X decision frontier across the four intermediate views.
alt_text: Scatter plot comparing source-family separation and Crawford abundance ordinal Spearman for full construct, lnRNA slot, RT slot, and slot-pair candidate-X views.
preprocessing_md: Reuses persisted scalar summaries for representation health, source structure, abundance ordinal audit, and context robustness.
math_md: |
  The x axis is a centroid separation ratio. The y axis is Spearman correlation between source-scoped Crawford abundance rank gaps and observed centroid-distance gaps. Point size is retained-component effective rank.
rationale_md: Synthesizes the decision path without promoting UMAP aesthetics or vector dimensionality alone.
limitations_md: A two-axis frontier compresses a multi-panel decision and must be read with the scorecard.
failure_modes_md: Missing descriptor rows or stale scalar inputs can hide a candidate or put it on the wrong frontier.
