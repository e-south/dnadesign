plot_id: rt_lnrna_candidate_x_scorecard
question: How do the four intermediate candidate-X views score across health, source structure, abundance signal, context robustness, and dimensional cost?
decision_role: primary
encoding: Metric-panel scorecard over candidate-X sections.
scope: The four intermediate OPAL X candidate views only.
guardrails:
  - The scorecard is a review surface, not an automatic selector.
  - Dimensional cost is lower-is-better and should prevent defaulting to the largest concat.
caption: RT-lnRNA candidate-X scorecard for intermediate representation candidates.
alt_text: Metric panel grid comparing representation health, source structure, abundance ordinal signal, context robustness, and dimensional cost for four RT-lnRNA candidate-X views.
preprocessing_md: Reuses scalar summaries from the current LatentDNA workspace recipe without recomputing vectors.
math_md: |
  Metrics are carried from their source scalar tables; dimensional cost is the candidate input dimension reported by the representation-health reducer.
rationale_md: Makes candidate-X tradeoffs explicit before OPAL consumes a fixed-size vector.
limitations_md: It does not include reporter-response profiles or OPAL assay outcomes.
failure_modes_md: If context or ordinal scalar rows are stale, the scorecard can appear complete while mixing old evidence.
