plot_id: rt_lnrna_trait_axis_view_scorecard
question: Which candidate-X views preserve source-value order along fitted Crawford and Khan trait axes?
decision_role: primary
encoding: Metric-panel grid of source-value Spearman correlation by trait, endpoint definition, and candidate-X view.
scope: Trait-axis summary rows for the four intermediate OPAL candidate-X views.
guardrails:
  - This is a review scorecard, not an automatic OPAL X selector.
  - Crawford and Khan remain separate source-scoped traits with separate fitted axes.
caption: Candidate-X view scorecard for source-value ordering along fitted trait axes.
alt_text: Bar panels comparing source-value Spearman correlations across candidate-X views for Crawford and Khan abundance axes.
preprocessing_md: Reads only the trait_axis_projection_summary scalar table emitted by the recipe.
math_md: |
  Spearman correlation is computed between finite source assay values and row-level axis_projection values for fit and eval source rows.
rationale_md: Promotes the trait-axis summary into the notebook decision funnel instead of relying on older source-family or ordinal proxies.
limitations_md: Source-value correlation does not establish causal abundance performance and does not replace study-owned reporter-response evidence derived from Reader measurement records.
failure_modes_md: Low finite-pair counts or stale source scalar inputs can make a view look weak or strong for the wrong reason.
