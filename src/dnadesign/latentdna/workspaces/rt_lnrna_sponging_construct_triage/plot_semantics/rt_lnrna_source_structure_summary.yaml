plot_id: rt_lnrna_source_structure_summary
question: Do the four intermediate candidate-X views preserve RT-native source and design structure?
decision_role: primary
encoding: Metric-panel grid of centroid separation ratios over RT-native source, overlay, compiler, RT-DMS, and regime cohorts.
scope: >-
  The four intermediate candidate-X views: full construct, lnRNA span, RT CDS
  span, and lnRNA + RT CDS pair.
guardrails:
  - These axes are source/design overlays, not assay labels.
  - Khan and Crawford overlay statuses remain separate source-scoped cohorts.
caption: RT-native source and design-structure preservation across candidate-X views.
alt_text: Metric grid comparing source-family, variant-class, overlay-status, compiler, RT-DMS, and source-regime separation ratios across four intermediate RT-lnRNA views.
preprocessing_md: Candidate samples are view-standardized and row L2-normalized before cosine centroid distances are summarized.
math_md: |
  Each separation ratio is \(\operatorname{mean}(d_\mathrm{between})/\operatorname{mean}(d_\mathrm{within})\) for the configured cohort axis.
rationale_md: Checks whether candidate representations preserve RT-native source/design structure before OPAL X selection.
limitations_md: Separation can be driven by source-size imbalance or provenance artifacts; read alongside representation health and context robustness.
failure_modes_md: Sparse cohorts can yield unstable or non-finite separation ratios.
