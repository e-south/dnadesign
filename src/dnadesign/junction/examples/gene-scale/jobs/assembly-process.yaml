version: 4
contract:
  kind: three_way_junction_review_render_v1
bundle:
  path: reviews/assembly-process
input:
  kind: json
  path: design-bundle/views/three_way_junction_review.v1.json
  adapter:
    kind: three_way_junction_review_v1
  alphabet: DNA
render:
