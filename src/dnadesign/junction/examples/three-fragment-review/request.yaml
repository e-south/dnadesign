# Compact documentation request for the expanded nucleotide audit.
schema: dnadesign.junction.request.v2
seed: 20260809

planning:
  # The pooled Sidewinder paper used L=96, b=22, t=10, and R=15. Here those
  # values define software geometry; they are not a laboratory protocol.
  nominal_fragment_oligo_length: 96
  barcode_length: 22
  toehold_length: 10
  search_range: 15

  # Deterministic search budgets. Exhaustion fails instead of weakening a rule.
  toehold_search_iterations: 1000
  barcode_pool_factor: 5
  barcode_generation_attempts: 500000
  barcode_subset_iterations: 100
  matching_iterations: 100

  # Junction's explicit string-screening policy, separate from the paper's
  # experimental validation.
  barcode_toehold_k: 5
  barcode_pair_k: 9
  barcode_gc_min: 0.30
  barcode_gc_max: 0.70
  barcode_max_homopolymer: 3

targets:
  - id: synthetic-three-fragment-target
    assembly_group_id: compact-review-example

    # Exact synthetic 170 bp target with no asserted biological meaning.
    sequence: TCATTCTAGGCTAGCTGAGTGCGCTATAAGCGTAGAACTACTACATCACATCCGCTACGCTCTCACCGTAGAGGGACTAGGGTCTATCAGATGATGCTTAGCGGAATAAGGTACAGGTATAATCCGAAACGCTTTGAATTTTGGGGACGCCTGATTAACGTAGTCTGATG

    recovery_primers:
      # Junction validates caller-supplied primers; it does not design them.
      mode: target_specific
      forward:
        binding_sequence: TCATTCTAGGCTAGCTGAGT
        five_prime_extension: ""
      reverse:
        binding_sequence: CATCAGACTACGTTAATCAG
        five_prime_extension: ""

order_policy:
  # Vendor-neutral review labels; replace them in an owned ordering workflow.
  synthesis_scale: review-required
  barcode_bearing_purification: review-required
  complement_purification: review-required
  primer_purification: review-required
  complement_end_preparation: vendor_5_prime_phosphate

  # This example remains within the paper-scale 96 nt nominal geometry while
  # allowing terminal fragments to vary under the selected loci.
  minimum_fragment_oligo_length: 45
  max_oligo_length: 110
