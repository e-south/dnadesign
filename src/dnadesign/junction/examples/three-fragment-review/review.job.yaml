version: 4
contract:
  kind: three_way_junction_review_render_v1
bundle:
  # BaseRender publishes create-only output relative to this job file.
  path: .tmp/review-bundle
input:
  kind: json
  path: .tmp/design-bundle/views/three_way_junction_review.v1.json
  adapter:
    kind: three_way_junction_review_v1
  alphabet: DNA
render:
  renderer: three_way_junction_review
  style:
    preset: null
    overrides: {}
outputs:
  - kind: images
    dir: images
    fmt: svg
run:
  strict: true
  fail_on_skips: true
