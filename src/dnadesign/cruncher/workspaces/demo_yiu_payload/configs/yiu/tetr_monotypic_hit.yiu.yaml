yiu:
  schema_version: 1
  contract: split_yiu_payload_rendering_v4
  name: tetr_monotypic_hit

input:
  kind: sample_hit
  sample_hit:
    hit_id: demo_monotypic_tetr_elite_c4c42365d66b
    sample_name: tetr
    payload_sequence: CTCTATATCTGATATAGAG
    metadata:
      tf_name: tetR
      motif_name: tetr_demo
      site_label: tetr_site
      payload_label: tetr_payload

optimization:
  junction:
    mode: explicit_window
    start: 8
    end: 12
    overhang_length: 4
    max_payload_body_length: 12
  mismatches:
    count: 2
    candidate_positions: [1, 2]
    allowed_strands: [complement, payload]
    strand_mode: per_position
    default_strand_preference: complement
  pwm:
    mode: none
    source:
      kind: none
    objective:
      primary: maximin
      secondary:
        - total_loss
        - midpoint_proximity
        - body_length_balance
        - terminal_position_avoidance
        - default_strand_preference
        - lexical_stability

output:
  bundle_dir: bundles/tetr_monotypic_hit
  emit_render_jobs_debug: false
