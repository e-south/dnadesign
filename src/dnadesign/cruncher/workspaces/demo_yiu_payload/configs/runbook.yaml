runbook:
  schema_version: 1
  name: demo_yiu_payload
  steps:
  - id: yiu_validate
    description: Validate the checked-in user-sequence YIU demo spec.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/example_payload.yiu.yaml
  - id: yiu_render
    description: Publish the deterministic user-sequence YIU v4 payload bundle and render the canonical views.
    run:
    - yiu
    - render
    - --spec
    - configs/yiu/example_payload.yiu.yaml
    - --force-overwrite
    - --emit-renders
  - id: yiu_show
    description: Inspect the published user-sequence payload bundle and integrity checks.
    run:
    - yiu
    - show
    - --bundle
    - bundles/example_payload
  - id: tetr_validate
    description: Validate the checked-in sample-hit YIU demo spec.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/tetr_monotypic_hit.yiu.yaml
  - id: tetr_render
    description: Publish the sample-hit bundle and render the canonical views.
    run:
    - yiu
    - render
    - --spec
    - configs/yiu/tetr_monotypic_hit.yiu.yaml
    - --force-overwrite
    - --emit-renders
  - id: tetr_show
    description: Inspect the published sample-hit bundle and integrity checks.
    run:
    - yiu
    - show
    - --bundle
    - bundles/tetr_monotypic_hit
