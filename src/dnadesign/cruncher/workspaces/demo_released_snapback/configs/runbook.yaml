runbook:
  schema_version: 1
  name: demo_released_snapback
  steps:
  - id: snapback_released_target_search
    description: Search the demo dual-enzyme 0/3/3 geometry against explicit nickase presets and a BspQI-pinned Type IIS release policy.
    run:
    - snapback
    - released-target-search
    - --workspace-root
    - .
    - --nick-preset
    - neb_nicking_v1
    - --nick-additional-preset
    - thermo_nicking_v1
    - --release-preset
    - type_iis_release_v1
    - --release-variant-id
    - BspQI
    - --nick-boundary
    - '0'
    - --paired-bp
    - '3'
    - --cap-nt
    - '3'
    - --allow-top-active-routes
    - --allow-precut-footprint-outside-active-product
    - --json
  - id: snapback_released_solve
    description: Materialize BspQI-pinned 0/3/3 exact or bounded near released-product hits and emit one rendered triptych per hit.
    run:
    - snapback
    - released-solve
    - --workspace-root
    - .
    - --nick-preset
    - neb_nicking_v1
    - --nick-additional-preset
    - thermo_nicking_v1
    - --release-preset
    - type_iis_release_v1
    - --release-variant-id
    - BspQI
    - --nick-boundary
    - '0'
    - --paired-bp
    - '3'
    - --cap-nt
    - '3'
    - --allow-top-active-routes
    - --allow-precut-footprint-outside-active-product
    - --run-dir
    - outputs/released_solve
    - --materialize-top-k
    - '16'
    - --render-format
    - pdf
    - --emit-renders
    - --force-overwrite
    - --json
