runbook:
  schema_version: 1
  name: de033
  steps:
  - id: snapback_released_target_search
    description: Search the operational dual-enzyme 0/3/3 lane against explicit nickase and release-enzyme presets under the default no-frequent-cutter policy.
    run:
    - snapback
    - released-target-search
    - --workspace-root
    - .
    - --nick-preset
    - neb_nicking_v1
    - --nick-additional-preset
    - thermo_nicking_v1
    - --release-preset
    - type_iis_release_v1
    - --nick-boundary
    - '0'
    - --paired-bp
    - '3'
    - --cap-nt
    - '3'
    - --json
  - id: snapback_released_solve
    description: Materialize whole-catalog allowed 0/3/3 exact or bounded near released-product hits and emit one rendered triptych per hit.
    run:
    - snapback
    - released-solve
    - --workspace-root
    - .
    - --nick-preset
    - neb_nicking_v1
    - --nick-additional-preset
    - thermo_nicking_v1
    - --release-preset
    - type_iis_release_v1
    - --nick-boundary
    - '0'
    - --paired-bp
    - '3'
    - --cap-nt
    - '3'
    - --run-dir
    - outputs/released_solve
    - --materialize-top-k
    - '8'
    - --render-format
    - pdf
    - --emit-renders
    - --force-overwrite
    - --json
