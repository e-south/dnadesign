runbook:
  schema_version: 1
  name: demo_monotypic_cpxr
  steps:
  - id: reset_workspace
    run:
    - workspaces
    - reset
    - --root
    - .
    - --confirm
  - id: config_summary
    run:
    - config
    - summary
    - -c
    - configs/config.yaml
  - id: fetch_sites_demo_local_meme
    run:
    - fetch
    - sites
    - --source
    - demo_local_meme
    - --tf
    - cpxR
    - --update
    - -c
    - configs/config.yaml
  - id: fetch_sites_regulondb
    run:
    - fetch
    - sites
    - --source
    - regulondb
    - --tf
    - cpxR
    - --update
    - -c
    - configs/config.yaml
  - id: discover_motifs
    run:
    - discover
    - motifs
    - --set
    - '1'
    - --tool
    - meme
    - --meme-mod
    - oops
    - --source-id
    - demo_cpxr_multiplicity_meme_oops
    - -c
    - configs/config.yaml
  - id: lock_targets
    run:
    - lock
    - -c
    - configs/config.yaml
  - id: parse_run
    run:
    - parse
    - --force-overwrite
    - -c
    - configs/config.yaml
  - id: sample_run
    run:
    - sample
    - --force-overwrite
    - -c
    - configs/config.yaml
  - id: analyze_summary
    description: Analyze the occurrence-aware run and render the standard static plot suite, including the multi-offset elite showcase.
    run:
    - analyze
    - --summary
    - -c
    - configs/config.yaml
  - id: show_sample_outputs
    description: Show the occurrence-aware run manifest and artifact inventory for the workspace root run.
    run:
    - runs
    - show
    - outputs
    - -c
    - configs/config.yaml
  - id: render_logos
    run:
    - catalog
    - logos
    - --source
    - demo_cpxr_multiplicity_meme_oops
    - --set
    - '1'
    - -c
    - configs/config.yaml
  - id: yiu_validate
    description: Validate the sample-backed YIU payload handoff against the selected occurrence-aware elite.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/cpxr_monotypic_hit.yiu.yaml
  - id: yiu_render
    description: Publish the YIU payload bundle under outputs/ and mirror the composite PDF into outputs/plots.
    run:
    - yiu
    - render
    - --spec
    - configs/yiu/cpxr_monotypic_hit.yiu.yaml
    - --force-overwrite
    - --emit-renders
  - id: yiu_show
    description: Inspect the published YIU payload bundle and integrity checks.
    run:
    - yiu
    - show
    - --bundle
    - outputs/yiu__cpxr_monotypic_hit
