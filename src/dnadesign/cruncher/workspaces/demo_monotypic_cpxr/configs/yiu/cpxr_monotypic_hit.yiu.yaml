yiu:
  contract: split_yiu_payload_rendering_v4
  schema_version: 1
  name: cpxr_monotypic_hit

input:
  kind: sample_hit
  sample_hit:
    hit_id: demo_monotypic_cpxr_elite_2656f6680d87
    sample_name: demo_monotypic_cpxr
    source_artifact_path: outputs/optimize/tables/elites.parquet
    metadata:
      site_label: cpxr_site
      payload_label: cpxr_payload

optimization:
  junction:
    mode: optimize
    overhang_length: 4
    max_payload_body_length: 12
  mismatches:
    count: 2
    candidate_positions: [1, 2]
    allowed_strands: [complement, payload]
    strand_mode: per_position
    default_strand_preference: complement
  pwm:
    mode: require
    source:
      kind: sample_context
    objective:
      primary: maximin
      secondary:
        - total_loss
        - midpoint_proximity
        - body_length_balance
        - terminal_position_avoidance
        - default_strand_preference
        - lexical_stability

output:
  bundle_dir: outputs/plots/yiu__cpxr_monotypic_hit
  emit_render_jobs_debug: false
