runbook:
  schema_version: 1
  name: demo_yiu_circularized
  steps:
  - id: yiu_validate
    description: Validate the checked-in split-payload circularized YIU demo spec.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/example_split_payload_circularized.yiu.yaml
  - id: yiu_design
    description: Materialize the explicit YIU bundle and published visual contracts.
    run:
    - yiu
    - design
    - --spec
    - configs/yiu/example_split_payload_circularized.yiu.yaml
    - --force-overwrite
  - id: yiu_trace
    description: Re-materialize the explicit bundle under trace intent for QA parity.
    run:
    - yiu
    - trace
    - --spec
    - configs/yiu/example_split_payload_circularized.yiu.yaml
    - --force-overwrite
  - id: yiu_solve
    description: Run the paired solve spec and materialize the top accepted hit bundles.
    run:
    - yiu
    - solve
    - --spec
    - configs/yiu/example_split_payload_circularized.yiu.solve.yaml
    - --force-overwrite
