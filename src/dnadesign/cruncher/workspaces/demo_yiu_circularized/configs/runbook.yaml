runbook:
  schema_version: 1
  name: demo_yiu_circularized
  steps:
  - id: yiu_validate
    description: Validate the checked-in circularized YIU demo spec.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/example_reference_circularized.yiu.yaml
  - id: yiu_trace
    description: Materialize the explicit YIU bundle and render its published BaseRender
      jobs.
    run:
    - yiu
    - trace
    - --spec
    - configs/yiu/example_reference_circularized.yiu.yaml
    - --force-overwrite
    - --emit-renders
  - id: yiu_solve
    description: Run the paired solve spec, materialize the selected solution bundle,
      and render solve-level visuals.
    run:
    - yiu
    - solve
    - --spec
    - configs/yiu/example_reference_circularized.yiu.solve.yaml
    - --force-overwrite
    - --emit-renders
