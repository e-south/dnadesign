yiu:
  schema_version: 2
  family: yiu
  protocol_template: yiu_adapter_hairpin_v1
  workflow_scope: core_insert_generation
  name: example_adapter_hairpin
  source_oligo:
    sequence: AAAAGGTCTCACGTTTAAGGGGCCGGGGTCTCACGTTTTT
    annotations:
      primer_binding_cores:
      - id: source_fwd_core
        start: 0
        end: 4
        strand: primary
      - id: source_rev_core
        start: 36
        end: 40
        strand: complement
      primer_tails:
      - id: source_fwd_tail
        primer_binding_core_id: source_fwd_core
        sequence: GG
      - id: source_rev_tail
        primer_binding_core_id: source_rev_core
        sequence: CC
      nickase_sites:
      - id: nick_1
        enzyme: Nt.Mock
        recognition_sequence: GGGG
        start: 18
        orientation: forward
        top_cut_offset: 2
      payload_windows:
      - id: payload_left
        start: 14
        end: 18
        projection_mode: compound_required
      - id: payload_right
        start: 22
        end: 26
        projection_mode: compound_required
      homology_windows:
      - id: stem_left
        start: 14
        end: 18
        projection_mode: compound_allowed
      - id: stem_right
        start: 22
        end: 26
        projection_mode: compound_allowed
      retained_regions:
      - id: retained_left
        start: 14
        end: 18
        projection_mode: compound_allowed
      - id: retained_right
        start: 22
        end: 26
        projection_mode: compound_allowed
      sacrificial_regions:
      - id: sacrificial_center
        start: 18
        end: 22
        projection_mode: atomic_required
  steps:
    source_pcr:
      forward_primer_id: oES790
      reverse_primer_id: oES791
    double_nicking_digest:
      enzymes:
      - Nt.Mock
    heat_cleanup:
      enabled: true
      min_retained_nt: 8
    adapter_anneal:
      adapter_id: oES792
      compatibility_mode: partial_complement
      partial_complement:
        min_paired_nt: 4
        allow_left_tail: true
        allow_right_tail: true
    hairpin_ligation:
      ligase: T4_DNA_ligase
      require_5p_phosphate: true
      compatibility_mode: partial_complement
      partial_complement:
        min_paired_nt: 4
        allow_left_tail: true
        allow_right_tail: true
    hairpin_pcr:
      forward_primer_id: oES793
      reverse_primer_id: oES794
    insert_cleanup:
      enabled: false
    backbone_pcr:
      enabled: false
    golden_gate_assembly:
      enabled: false
  payload_goal:
    assembled_payload_pattern: TTAACCGG
    left_half_ref: payload_left
    right_half_ref: payload_right
    assembly_space: post_ligation
    evidence_policy: require_guaranteed
  catalogs:
    enzymes: catalogs/enzymes.yaml
    oligo_parts: catalogs/oligo_parts.yaml
    backbones: catalogs/backbones.yaml
  output:
    run_dir: outputs/yiu/explicit
    emit_view_contracts: true
    publish_contract_version: 2
