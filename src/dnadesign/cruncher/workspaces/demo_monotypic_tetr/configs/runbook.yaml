runbook:
  schema_version: 1
  name: demo_monotypic_tetr
  steps:
  - id: reset_workspace
    run:
    - workspaces
    - reset
    - --root
    - .
    - --confirm
  - id: config_summary
    run:
    - config
    - summary
    - -c
    - configs/config.yaml
  - id: fetch_motifs_westmann
    run:
    - fetch
    - motifs
    - --source
    - westmann_tetr_mitomi
    - --tf
    - tetR
    - --update
    - -c
    - configs/config.yaml
  - id: lock_targets
    run:
    - lock
    - -c
    - configs/config.yaml
  - id: parse_run
    run:
    - parse
    - --force-overwrite
    - -c
    - configs/config.yaml
  - id: sample_run
    run:
    - sample
    - --force-overwrite
    - -c
    - configs/config.yaml
  - id: analyze_summary
    description: Analyze the occurrence-aware run and render the standard static plot suite, including the multi-offset elite showcase.
    run:
    - analyze
    - --summary
    - -c
    - configs/config.yaml
  - id: show_sample_outputs
    description: Show the occurrence-aware run manifest and artifact inventory for the workspace root run.
    run:
    - runs
    - show
    - outputs
    - -c
    - configs/config.yaml
  - id: render_logos
    run:
    - catalog
    - logos
    - --source
    - westmann_tetr_mitomi
    - --set
    - '1'
    - -c
    - configs/config.yaml
  - id: export_meme
    description: Export the normalized TetR PWM as a minimal MEME artifact under outputs/artifacts/meme for downstream motif-tool interoperability.
    run:
    - catalog
    - export-meme
    - --set
    - '1'
    - --source
    - westmann_tetr_mitomi
    - -c
    - configs/config.yaml
  - id: yiu_validate
    description: Validate the sample-backed YIU payload handoff against the selected occurrence-aware elite.
    run:
    - yiu
    - validate
    - --spec
    - configs/yiu/tetr_monotypic_hit.yiu.yaml
  - id: yiu_render
    description: Publish the YIU payload bundle under outputs/plots without a redundant workspace-level mirror.
    run:
    - yiu
    - render
    - --spec
    - configs/yiu/tetr_monotypic_hit.yiu.yaml
    - --force-overwrite
    - --emit-renders
  - id: yiu_show
    description: Inspect the published YIU payload bundle and integrity checks.
    run:
    - yiu
    - show
    - --bundle
    - outputs/plots/yiu__tetr_monotypic_hit
