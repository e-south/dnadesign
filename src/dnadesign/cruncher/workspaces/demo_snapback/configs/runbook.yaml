runbook:
  schema_version: 1
  name: demo_snapback
  steps:
  - id: snapback_validate
    description: Validate the checked-in explicit snapback demo spec.
    run:
    - snapback
    - validate
    - --spec
    - configs/snapback/demo_teto_bpu10i_cap.snapback.yaml
  - id: snapback_design
    description: Materialize the checked-in explicit snapback demo bundle.
    run:
    - snapback
    - design
    - --spec
    - configs/snapback/demo_teto_bpu10i_cap.snapback.yaml
    - --force-overwrite
  - id: snapback_show_design
    description: Inspect the explicit snapback bundle and integrity checks.
    run:
    - snapback
    - show
    - --run
    - outputs/design
  - id: snapback_released_design
    description: Materialize the checked-in released-product precursor demo bundle.
    run:
    - snapback
    - released-design
    - --spec
    - configs/snapback/demo_released_origin_033.released.snapback.yaml
    - --force-overwrite
  - id: snapback_released_show
    description: Inspect the released-product bundle and projection integrity checks.
    run:
    - snapback
    - released-show
    - --run
    - outputs/released_design
  - id: snapback_released_target_search
    description: Search paired nickase plus release-enzyme placements against the checked-in demo overlays.
    run:
    - snapback
    - released-target-search
    - --workspace-root
    - .
    - --nick-additional-path
    - inputs/nickases/local.nickases.yaml
    - --release-additional-path
    - inputs/release_enzymes/local.release.yaml
    - --nick-boundary
    - '0'
    - --paired-bp
    - '3'
    - --cap-nt
    - '3'
    - --json
  - id: snapback_solve
    description: Run the broader catalog-scan solve demo.
    run:
    - snapback
    - solve
    - --spec
    - configs/snapback/demo_teto_catalog_scan.snapback.solve.yaml
    - --force-overwrite
  - id: snapback_show_solve
    description: Inspect the solve bundle, frontier, and materialized hit paths.
    run:
    - snapback
    - show
    - --run
    - outputs/solve
