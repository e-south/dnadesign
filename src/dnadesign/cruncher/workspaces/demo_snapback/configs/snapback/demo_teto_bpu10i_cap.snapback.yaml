snapback:
  schema_version: 2
  contract: single_nick_snapback_v2
  name: demo_teto_bpu10i_cap
input:
  canonical_top_strand:
    sequence: CCTCAGCA
    protected_region:
      start: 0
      end: 8
    pre_nick_duplex_window:
      start: 0
      end: 8
design:
  nickase:
    variant_id: Nt.Bpu10I
    catalog:
      additional_paths:
      - inputs/nickases/local.nickases.yaml
  orientation_policy:
    normalize_to_top_strand_nick: true
    release_direction: left_to_right_from_nick
  single_nick_goal:
    nick_boundary_window:
      min: 2
      max: 2
  topology:
    retained_homology_window:
      start: 2
      end: 6
    cap_sequence: T
    foldback_arm: CTGA
    homology_policy:
      max_mismatches: 0
      min_paired_bp: 4
      max_paired_bp: 4
  constraints:
    terminal_ligatable_duplex_bp:
      min: 4
      max: 4
    max_uninterrupted_duplex_bp: 4
    max_added_nt: 5
    forbid_additional_target_strand_nicks: false
    forbid_any_additional_nicks: false
  sequence_quality:
    gc_fraction:
      min: 0.25
      max: 0.75
    max_homopolymer_run: 2
output:
  run_dir: outputs/design
  emit_visual_contracts: true
  emit_baserender_jobs: true
  render_format: png
