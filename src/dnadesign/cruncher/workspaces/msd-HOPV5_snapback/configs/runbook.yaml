runbook:
  schema_version: 1
  name: msd-HOPV5_snapback
  steps:
  - id: msd-HOPV5_visual
    description: Render the explicit MSD-HOPV5 Nt.Bpu10I snapback example as a visual-only comparison artifact.
    run:
    - snapback
    - visual
    - --spec
    - configs/snapback/msd-HOPV5.visual.snapback.yaml
    - --force-overwrite
    - --json
