study_id: <study-id>
usr_remotes_path: <path-to-remotes.yaml-or-n/a>
datasets:
  - role: densegen_anchor
    dataset: <dataset-id>
    usr_root: <usr-root>
    lifecycle: source
    owner_tool: densegen
    onboard_mode: existing_local|existing_remote|existing_both|create_new
    authority: local|remote|shared
    sync:
      enabled: true
      remote_name: bu-scc
      remote_dataset: <dataset-id>
      default_direction: pull|push|bidirectional|none
      audit_json: docs/studies/promoter/<study-id>/audits/<dataset-id>--bu-scc-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: wildtype_manual
    dataset: <dataset-id>
    usr_root: <usr-root>
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local|existing_remote|existing_both|create_new
    authority: local|remote|shared
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: feature_matrix
    dataset: <feature-dataset-id>
    usr_root: <usr-root>
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: create_new
    authority: shared
    sync:
      enabled: true
      remote_name: bu-scc
      remote_dataset: <feature-dataset-id>
      default_direction: bidirectional
      audit_json: docs/studies/promoter/<study-id>/audits/<feature-dataset-id>--bu-scc-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
