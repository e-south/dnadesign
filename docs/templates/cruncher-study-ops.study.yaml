version: 2
study_id: <study-id>
title: <study title>

ops_surfaces:
  status_kind: cruncher-study-status
  preflight_kind: cruncher-study-preflight

record_sources:
  narrative_ref: manifest:status.md
  datasets_ref: manifest:datasets.yaml
  pipeline_ref: manifest:pipeline.yaml
  campaign_ref: manifest:campaign.yaml
  routes_ref: manifest:routes.md
  skill_ref: repo:.agents/skills/<study-skill>/SKILL.md

lifecycle:
  phase_order:
    - context_consolidation
    - <current-phase>
    - <next-phase>
  current_phase:
    strategy: explicit
    id: <current-phase>

phases:
  - id: context_consolidation
    status: complete
    next_surface: manifest:status.md
  - id: <current-phase>
    status: in_progress
    next_surface: manifest:routes.md
  - id: <next-phase>
    status: planned
    next_surface: <repo-path-to-next-doc-or-runbook>

artifacts:
  status_note:
    artifact_type: file
    ref: manifest:status.md
  routes_doc:
    artifact_type: file
    ref: manifest:routes.md
  pipeline_doc:
    artifact_type: file
    ref: manifest:pipeline.yaml
  repo_local_skill:
    artifact_type: file
    ref: repo:.agents/skills/<study-skill>/SKILL.md

execution_surfaces:
  primary_workspace:
    surface_type: workspace
    workspace_ref: <repo-path-to-workspace>
  primary_probe:
    surface_type: command
    cwd_ref: <repo-path-to-workspace>
    argv:
      - uv
      - run
      - cruncher
      - <command>

snapshot:
  summary_scope: repo

preflight:
  default_scope: next
  scopes:
    next:
      include_phases: [current_phase]
    full:
      include_phases: [all]
  group_phase_bindings:
    study_record: context_consolidation
    primary_workspace: <current-phase>
    primary_probe: <current-phase>
  checks:
    context_consolidation:
      - kind: path_exists
        check_id: study.status.present
        check_group: study_record
        summary: Study status note is present.
        required: true
        artifact: status_note
      - kind: path_exists
        check_id: study.skill.present
        check_group: study_record
        summary: Repo-local study skill is present.
        required: true
        artifact: repo_local_skill
    <current-phase>:
      - kind: workspace_layout
        check_id: primary.workspace
        check_group: primary_workspace
        summary: Primary workspace is present.
        required: true
        surface: primary_workspace
      - kind: command
        check_id: primary.probe
        check_group: primary_probe
        summary: Primary read-only probe completed.
        required: true
        surface: primary_probe
  next_scope:
    target_phase_groups:
      context_consolidation: [study_record]
      <current-phase>: [study_record, primary_workspace, primary_probe]
      <next-phase>: [study_record]
    runtime_phase_groups: []
    runtime_shared_groups: []
