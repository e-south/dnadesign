version: 1
study_id: regulondb_native_promoter_panel

intent:
  primary_goal: Build one provenance-qualified native RegulonDB promoter USR dataset with one canonical sequence row per deduplicated promoter sequence and relation sidecars for source-specific metadata.
  primary_lane: native_regulondb_promoter_source
  operator_question: Does the fixed promoter superset pass local generated-dataset validation for sequence uniqueness, strict DNA content, retained metadata completeness, sigma annotation, skipped/excluded-row provenance, and fuzzy name-review signals?
  non_goals:
    - production live sync
    - pDual context construction before native/full and core60 validation
    - changes to stress_ethanol_cipro_growth
    - sparse source-specific columns on USR base records
    - treating computational prediction rows as curated promoter truth
  context_refs:
    - docs/studies/regulondb_native_promoter_panel/status.md
  decision_refs:
    - docs/studies/regulondb_native_promoter_panel/routes.md

command_groups:
  - id: usr_dry_run
    purpose: Validate a fixed Cruncher promoter export without writing a USR dataset.
    workspace_ref: src/dnadesign/usr
    validation_role: read_only_probe
    commands:
      - uv run python src/dnadesign/usr/scripts/create_regulondb_native_promoters.py --export-dir <cruncher-promoter-export-dir>
  - id: usr_committed_import
    purpose: Create local usr_regulondb_native_promoters after the dry-run report passes; keep the generated dataset root out of git.
    workspace_ref: src/dnadesign/usr
    validation_role: mutating_import
    commands:
      - uv run python src/dnadesign/usr/scripts/create_regulondb_native_promoters.py --export-dir <cruncher-promoter-export-dir> --write
      - uv run usr validate usr_regulondb_native_promoters --strict
  - id: construct_core60_tss_upstream
    purpose: Derive one analysis-only 60 bp upstream window per native RegulonDB source record using the declared TSS offset 60.
    workspace_ref: src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
    validation_role: generated_dataset_derivation
    commands:
      - uv run construct workspace doctor --workspace src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
      - uv run construct workspace validate-project --workspace src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel --project native_tss_upstream_core60
      - uv run construct workspace run-project --workspace src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel --project native_tss_upstream_core60 --dry-run
      - uv run construct workspace run-project --workspace src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel --project native_tss_upstream_core60 --format json
      - uv run usr validate usr_regulondb_native_promoter_core60 --strict
  - id: infer_fill_remaining_7b
    purpose: Inspect all checked-in Infer runbooks for this study, skip completed lanes, block lanes with missing sequence products or stale sidecars, and plan or execute only lanes with missing sequence-view vectors/scalars.
    workspace_ref: src/dnadesign/ops
    validation_role: control_plane_fill_remaining
    commands:
      - uv run ops runbook fill-infer --study-dir docs/studies/regulondb_native_promoter_panel
      - uv run ops runbook fill-infer --study-dir docs/studies/regulondb_native_promoter_panel --execute
      - uv run ops runbook fill-infer --study-dir docs/studies/regulondb_native_promoter_panel --submit
  - id: infer_native_full_7b
    purpose: Extract Evo2 7B intermediate embeddings, output-layer means, and log-likelihood scalars for native source-record sequence views; run only in a suitable GPU batch environment.
    workspace_ref: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel
    validation_role: preflight_then_batch
    commands:
      - uv run infer validate config --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
      - uv run infer validate sequence-view-completion --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml --format json --mode inventory
      - uv run notify setup resolve-events --tool infer --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml --json
  - id: infer_core60_tss_upstream_7b
    purpose: Extract the same Evo2 7B vector and scalar sidecars for Construct-derived core60 TSS-upstream sequence views after the core60 dataset exists.
    workspace_ref: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel
    validation_role: post_construct_preflight_then_batch
    commands:
      - uv run infer validate config --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
      - uv run infer validate sequence-view-completion --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml --format json --mode inventory
      - uv run notify setup resolve-events --tool infer --config src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml --json
  - id: latentdna_native_workspace
    purpose: Validate the downstream RegulonDB LatentDNA workspace and planned native plus core60 feature-source contract.
    workspace_ref: src/dnadesign/latentdna/workspaces/regulondb_native_promoter_panel
    validation_role: planned_feature_consumer
    commands:
      - MPLCONFIGDIR=/tmp/dnadesign_mpl uv run latentdna validate workspace --workspace regulondb_native_promoter_panel --deep --json
      - MPLCONFIGDIR=/tmp/dnadesign_mpl uv run latentdna workspace snapshot --workspace regulondb_native_promoter_panel --json

execution_surfaces:
  construct_workspace: src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
  infer_workspace: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel
  infer_batch_7b_with_notify:
    native_full: src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_native_full_7b_batch_with_notify.yaml
    core60_tss_upstream: src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_core60_tss_upstream_7b_batch_with_notify.yaml

infer:
  preferred_model_family: evo2_7b
  configs:
    native_full_7b: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
    core60_tss_upstream_7b: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
    native_full_plus_tss_upstream_core60_7b: src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full_plus_tss_upstream_core60.evo2_7b.yaml
  batch_readiness:
    last_checked: 2026-04-30
    runtime_target: BU SCC SGE Blackwell lane
    notify_secret_contract:
      required_env:
        - NOTIFY_WEBHOOK_FILE
        - SSL_CERT_FILE
        - REQUESTS_CA_BUNDLE
      tls_bundle_example: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
      profile_secret_policy: file_backed_secret_ref_only
    sge_resource_contract:
      pe_omp: 4
      h_rt: "12:00:00"
      mem_per_core: 8G
      gpus: 1
      gpu_capability: "12.0"
      gpu_type: RTXP6000
      gpu_memory_gib: 80.0
    no_submit_smoke:
      status: passed_representative_lanes
      representative_runbooks:
        - src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_native_full_7b_batch_with_notify.yaml
      evidence:
        - qsub -verify passed for notify-watch.qsub and evo2-gpu-infer.qsub
        - infer validate sequence-view-completion passed with max missing products/stale vectors/stale scalars set to 0
        - infer run --dry-run passed
        - notify profile smoke passed in dry-run mode
    live_submit_shape:
      per_lane: one notify watcher qsub plus one infer GPU qsub
      two_lane_fanout: 4 qsub commands
      advisor: prefer array_or_dependency_chain if submitting both lanes as one fanout

native_agent_bootstrap:
  open_first:
    - manifest:status.md
    - manifest:routes.md
    - manifest:pipeline.yaml
  pair_with:
    - code-change-discipline
  must_preserve:
    - Cruncher exports normalized source records only.
    - USR imports from a fixed export and defaults to dry-run.
    - Native RegulonDB imports never write sig35_variant.
    - TSS-upstream core60 is a source-window contract over offset 60, not an inferred -10/-35 box-centered view.
    - The native_full_plus_tss_upstream_core60 config is additive dogfood evidence unless a runbook promotes it into the default fill quota.
    - usr_regulondb_native_promoters remains the single USR dataset for the strict deduplicated native promoter superset.
    - Generated USR parquet artifacts remain untracked; study docs record provenance and validation evidence.
    - Source provenance remains visible for RegulonDB 13, live RegulonDB 14.5, RegulonDB 13 sigmulon, RegulonDB 11 curated/HT/prediction, and EcoCyc 28 rows.
