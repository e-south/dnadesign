version: 2
study_id: regulondb_native_promoter_panel
family: promoter
title: RegulonDB native promoter panel

record_sources:
  narrative_ref: manifest:status.md
  datasets_ref: manifest:datasets.yaml
  pipeline_ref: manifest:pipeline.yaml
  campaign_ref: manifest:campaign.yaml
  routes_ref: manifest:routes.md

lifecycle:
  phase_order:
    - regulondb_source_inventory
    - cruncher_promoter_export
    - usr_ingest_dry_run
    - usr_native_promoter_import
    - metadata_overlay_validation
    - core60_view_definition
    - native_full_infer_7b
    - core60_infer_7b
    - latentdna_native_audit
  current_phase:
    strategy: explicit
    id: latentdna_native_audit

phases:
  - id: regulondb_source_inventory
    status: complete
    output_dataset: usr_regulondb_native_promoters
    next_surface: repo:src/dnadesign/cruncher/src/ingest/promoters.py
  - id: cruncher_promoter_export
    status: complete
    output_dataset: usr_regulondb_native_promoters
    next_surface: repo:src/dnadesign/cruncher/src/ingest/promoters.py
  - id: usr_ingest_dry_run
    status: complete
    output_dataset: usr_regulondb_native_promoters
    next_surface: repo:src/dnadesign/usr/scripts/create_regulondb_native_promoters.py
  - id: usr_native_promoter_import
    status: complete
    output_dataset: usr_regulondb_native_promoters
    next_surface: repo:src/dnadesign/usr/scripts/create_regulondb_native_promoters.py
  - id: metadata_overlay_validation
    status: complete
    output_dataset: usr_regulondb_native_promoters
    next_surface: repo:src/dnadesign/usr/docs/reference/overlay-and-registry.md
  - id: core60_view_definition
    status: complete
    output_dataset: usr_regulondb_native_promoter_core60
    next_surface: repo:src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel/README.md
  - id: native_full_infer_7b
    status: complete
    output_dataset: infer_regulondb_native_promoter_views_7b
    next_surface: repo:src/dnadesign/infer/docs/reference/feature-schema.md
  - id: core60_infer_7b
    status: complete
    output_dataset: infer_regulondb_native_promoter_core60_views_7b
    next_surface: repo:src/dnadesign/infer/docs/reference/feature-schema.md
  - id: latentdna_native_audit
    status: in_progress
    next_surface: repo:src/dnadesign/latentdna/docs/workflows/promoter-study-representation-comparison.md

artifacts:
  status_note:
    artifact_type: file
    ref: manifest:status.md
  routes_doc:
    artifact_type: file
    ref: manifest:routes.md
  datasets_registry:
    artifact_type: file
    ref: manifest:datasets.yaml
  cruncher_promoter_contract:
    artifact_type: file
    ref: repo:src/dnadesign/cruncher/src/ingest/promoters.py
  usr_import_script:
    artifact_type: file
    ref: repo:src/dnadesign/usr/scripts/create_regulondb_native_promoters.py
  usr_registry:
    artifact_type: file
    ref: repo:src/dnadesign/usr/datasets/registry.yaml
  native_promoter_dataset:
    artifact_type: dataset
    dataset_id: usr_regulondb_native_promoters
    ref: repo:src/dnadesign/usr/datasets/usr_regulondb_native_promoters
  construct_workspace_root:
    artifact_type: file
    ref: repo:src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
  construct_core60_config:
    artifact_type: file
    ref: repo:src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel/config.core60.yaml
  construct_core60_dataset:
    artifact_type: dataset
    dataset_id: usr_regulondb_native_promoter_core60
    ref: repo:src/dnadesign/usr/datasets/usr_regulondb_native_promoter_core60
  infer_native_full_config_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
  infer_native_full_runbook_7b:
    artifact_type: file
    ref: repo:src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_native_full_7b_batch_with_notify.yaml
  infer_core60_config_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
  infer_core60_runbook_7b:
    artifact_type: file
    ref: repo:src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_core60_tss_upstream_7b_batch_with_notify.yaml
  infer_native_full_dataset_7b:
    artifact_type: dataset
    dataset_id: infer_regulondb_native_promoter_views_7b
    ref: repo:src/dnadesign/usr/datasets/usr_regulondb_native_promoters/_derived/infer
  infer_core60_dataset_7b:
    artifact_type: dataset
    dataset_id: infer_regulondb_native_promoter_core60_views_7b
    ref: repo:src/dnadesign/usr/datasets/usr_regulondb_native_promoter_core60/_derived/infer
  infer_workspace_root:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel
  notify_native_full_profile_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/outputs/notify/infer/native_full_7b/profile.json
  notify_core60_profile_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/outputs/notify/infer/core60_tss_upstream_7b/profile.json
  latentdna_binding:
    artifact_type: file
    ref: manifest:latentdna_binding.yaml
  latentdna_workspace_root:
    artifact_type: file
    ref: repo:src/dnadesign/latentdna/workspaces/regulondb_native_promoter_panel

execution_surfaces:
  construct_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
  infer_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel
  latentdna_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/latentdna/workspaces/regulondb_native_promoter_panel
  infer_batch_native_full_7b:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_native_full_7b_batch_with_notify.yaml
  infer_batch_core60_7b:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_regulondb_native_promoter_core60_tss_upstream_7b_batch_with_notify.yaml
  infer_fill_remaining_7b:
    surface_type: command
    argv:
      - uv
      - run
      - ops
      - runbook
      - fill-infer
      - --study-dir
      - docs/studies/regulondb_native_promoter_panel
  usr_validate_native_dataset:
    surface_type: command
    argv:
      - uv
      - run
      - usr
      - validate
      - usr_regulondb_native_promoters
      - --strict
  construct_workspace_doctor:
    surface_type: command
    argv:
      - uv
      - run
      - construct
      - workspace
      - doctor
      - --workspace
      - src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
  construct_validate_core60:
    surface_type: command
    argv:
      - uv
      - run
      - construct
      - workspace
      - validate-project
      - --workspace
      - src/dnadesign/construct/workspaces/study_regulondb_native_promoter_panel
      - --project
      - native_tss_upstream_core60
  infer_validate_native_full_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
  infer_validate_core60_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
  infer_completion_native_full_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - sequence-view-completion
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
      - --format
      - json
      - --mode
      - inventory
  infer_completion_core60_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - sequence-view-completion
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
      - --format
      - json
      - --mode
      - inventory
  notify_resolve_events_native_full_7b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - setup
      - resolve-events
      - --tool
      - infer
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.native_full.evo2_7b.yaml
      - --json
  notify_resolve_events_core60_7b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - setup
      - resolve-events
      - --tool
      - infer
      - --config
      - src/dnadesign/infer/workspaces/study_regulondb_native_promoter_panel/config.sequence_views.core60_tss_upstream.evo2_7b.yaml
      - --json
  latentdna_validate_workspace:
    surface_type: command
    argv:
      - uv
      - run
      - latentdna
      - validate
      - workspace
      - --workspace
      - regulondb_native_promoter_panel
      - --deep
      - --json

snapshot:
  summary_scope: repo

preflight:
  default_scope: next
  scopes:
    next:
      include_phases: [current_phase]
    full:
      include_phases: [all]
  group_phase_bindings:
    study_record: regulondb_source_inventory
    cruncher_contract: regulondb_source_inventory
    usr_import_contract: regulondb_source_inventory
    usr_validation: metadata_overlay_validation
    construct: core60_view_definition
    infer: native_full_infer_7b
    notify: native_full_infer_7b
    latentdna: latentdna_native_audit
  checks:
    regulondb_source_inventory:
      - kind: path_exists
        check_id: study.status.present
        check_group: study_record
        summary: Draft study status note is present.
        required: true
        artifact: status_note
      - kind: path_exists
        check_id: study.routes.present
        check_group: study_record
        summary: Draft route map is present.
        required: true
        artifact: routes_doc
      - kind: path_exists
        check_id: cruncher.promoter.contract.present
        check_group: cruncher_contract
        summary: Cruncher promoter export contract is present.
        required: true
        artifact: cruncher_promoter_contract
      - kind: path_exists
        check_id: usr.import.script.present
        check_group: usr_import_contract
        summary: USR native promoter import script is present.
        required: true
        artifact: usr_import_script
      - kind: path_exists
        check_id: usr.regulondb.registry.present
        check_group: usr_import_contract
        summary: USR registry declares the regulondb overlay namespace.
        required: true
        artifact: usr_registry
    metadata_overlay_validation:
      - kind: path_exists
        check_id: usr.native.dataset.present
        check_group: usr_validation
        summary: Native RegulonDB promoter USR dataset is present in the canonical USR root.
        required: true
        artifact: native_promoter_dataset
      - kind: command
        check_id: usr.native.validation.command.declared
        check_group: usr_validation
        summary: Native dataset validation command is declared for after committed import.
        required: true
        surface: usr_validate_native_dataset
    native_full_infer_7b:
      - kind: path_exists
        check_id: infer.workspace.layout
        check_group: infer
        summary: RegulonDB Infer workspace root is present.
        required: true
        artifact: infer_workspace_root
      - kind: path_exists
        check_id: infer.config.native_full_7b.present
        check_group: infer
        summary: Native/full 7B Infer sequence-view config is present.
        required: true
        artifact: infer_native_full_config_7b
      - kind: path_exists
        check_id: infer.runbook.native_full_7b.present
        check_group: infer
        summary: Native/full 7B Infer batch runbook is present.
        required: true
        artifact: infer_native_full_runbook_7b
      - kind: command
        check_id: infer.config.native_full_7b.validates
        check_group: infer
        summary: Native/full 7B Infer config validates without loading Evo2.
        required: true
        surface: infer_validate_native_full_7b
      - kind: command
        check_id: infer.native_full_7b.completion.inventory
        check_group: infer
        summary: Native/full 7B sequence-view completion inventory is inspectable and resumable.
        required: true
        surface: infer_completion_native_full_7b
      - kind: command
        check_id: notify.events.native_full_7b.resolve
        check_group: notify
        summary: Notify can resolve the native/full 7B Infer event path from the config.
        required: true
        surface: notify_resolve_events_native_full_7b
    core60_infer_7b:
      - kind: path_exists
        check_id: infer.config.core60_7b.present
        check_group: infer
        summary: Core60 TSS-upstream 7B Infer sequence-view config is present.
        required: true
        artifact: infer_core60_config_7b
      - kind: path_exists
        check_id: infer.runbook.core60_7b.present
        check_group: infer
        summary: Core60 TSS-upstream 7B Infer batch runbook is present.
        required: true
        artifact: infer_core60_runbook_7b
      - kind: command
        check_id: infer.config.core60_7b.validates
        check_group: infer
        summary: Core60 TSS-upstream 7B Infer config validates without loading Evo2.
        required: true
        surface: infer_validate_core60_7b
      - kind: command
        check_id: infer.core60_7b.completion.inventory
        check_group: infer
        summary: Core60 TSS-upstream 7B sequence-view completion inventory is inspectable after Construct materializes the dataset.
        required: false
        surface: infer_completion_core60_7b
      - kind: command
        check_id: notify.events.core60_7b.resolve
        check_group: notify
        summary: Notify can resolve the core60 7B Infer event path after the core60 dataset exists.
        required: false
        surface: notify_resolve_events_core60_7b
    core60_view_definition:
      - kind: path_exists
        check_id: construct.workspace.layout
        check_group: construct
        summary: RegulonDB Construct workspace root is present.
        required: true
        artifact: construct_workspace_root
      - kind: path_exists
        check_id: construct.core60.config.present
        check_group: construct
        summary: Native promoter TSS-upstream core60 Construct config is present.
        required: true
        artifact: construct_core60_config
      - kind: command
        check_id: construct.workspace.doctor
        check_group: construct
        summary: RegulonDB Construct workspace registry and config are aligned.
        required: true
        surface: construct_workspace_doctor
      - kind: command
        check_id: construct.core60.contract.validates
        check_group: construct
        summary: TSS-upstream core60 project validates before generated dataset materialization.
        required: true
        surface: construct_validate_core60
      - kind: path_exists
        check_id: construct.core60.dataset.present
        check_group: construct
        summary: Native promoter TSS-upstream core60 derived dataset is present after Construct run.
        required: false
        artifact: construct_core60_dataset
    latentdna_native_audit:
      - kind: path_exists
        check_id: latentdna.binding.present
        check_group: latentdna
        summary: RegulonDB LatentDNA study binding is present.
        required: true
        artifact: latentdna_binding
      - kind: path_exists
        check_id: latentdna.workspace.layout
        check_group: latentdna
        summary: RegulonDB LatentDNA workspace root is present.
        required: true
        artifact: latentdna_workspace_root
      - kind: path_exists
        check_id: latentdna.input.native_full_7b.present
        check_group: latentdna
        summary: Native/full 7B Infer sidecar features are present for LatentDNA after batch execution.
        required: false
        artifact: infer_native_full_dataset_7b
      - kind: path_exists
        check_id: latentdna.input.core60_7b.present
        check_group: latentdna
        summary: Core60 7B Infer sidecar features are present for LatentDNA after Construct and batch execution.
        required: false
        artifact: infer_core60_dataset_7b
      - kind: command
        check_id: latentdna.workspace.deep.validates
        check_group: latentdna
        summary: RegulonDB LatentDNA workspace validates against sidecar-backed native/full and core60 feature views.
        required: true
        surface: latentdna_validate_workspace
  next_scope:
    target_phase_groups:
      regulondb_source_inventory: [study_record, cruncher_contract, usr_import_contract]
      cruncher_promoter_export: [study_record, cruncher_contract]
      usr_ingest_dry_run: [study_record, usr_import_contract]
      usr_native_promoter_import: [study_record, usr_import_contract]
      metadata_overlay_validation: [study_record, usr_validation]
      native_full_infer_7b: [study_record, infer, notify]
      core60_view_definition: [study_record, construct]
      core60_infer_7b: [study_record, infer, notify]
      latentdna_native_audit: [study_record, latentdna]
    runtime_phase_groups: []
    runtime_shared_groups: []
