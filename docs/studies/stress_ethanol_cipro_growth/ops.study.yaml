version: 2
study_id: stress_ethanol_cipro_growth
family: promoter
title: Stress / ethanol / ciprofloxacin growth study

record_sources:
  narrative_ref: manifest:status.md
  datasets_ref: manifest:datasets.yaml
  pipeline_ref: manifest:pipeline.yaml
  campaign_ref: manifest:campaign.yaml

lifecycle:
  phase_order:
    - densegen_growth
    - merged_anchor_set
    - construct_context_expansion
    - infer_batch_preparation
    - infer_anchor_only_20b
    - infer_anchor_plus_template_20b
    - infer_anchor_only_7b
    - infer_anchor_plus_template_7b
  current_phase:
    strategy: explicit
    id: infer_batch_preparation

phases:
  - id: densegen_growth
    status: parallel_optional
    primary_dataset: densegen/study_stress_ethanol_cipro
    next_surface: repo:src/dnadesign/ops/runbooks/presets/densegen_stress_ethanol_cipro_batch_with_notify.yaml
  - id: merged_anchor_set
    status: complete
    output_dataset: promoter/stress_ethanol_cipro_anchor_set
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: construct_context_expansion
    status: complete
    output_dataset: promoter/stress_ethanol_cipro_construct_contexts
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: infer_batch_preparation
    status: in_progress
    next_surface: repo:src/dnadesign/usr/docs/operations/promoter-study-preflight.md
  - id: infer_anchor_only_20b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_20b_batch_with_notify.yaml
  - id: infer_anchor_plus_template_20b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_20b_batch_with_notify.yaml
  - id: infer_anchor_only_7b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_7b_batch_with_notify.yaml
  - id: infer_anchor_plus_template_7b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_7b_batch_with_notify.yaml

artifacts:
  densegen_anchor_source:
    artifact_type: dataset
    dataset_id: densegen/study_stress_ethanol_cipro
    ref: repo:src/dnadesign/usr/datasets/densegen/study_stress_ethanol_cipro
  merged_anchor_dataset:
    artifact_type: dataset
    dataset_id: promoter/stress_ethanol_cipro_anchor_set
    ref: repo:src/dnadesign/usr/datasets/promoter/stress_ethanol_cipro_anchor_set
  construct_context_dataset:
    artifact_type: dataset
    dataset_id: promoter/stress_ethanol_cipro_construct_contexts
    ref: repo:src/dnadesign/usr/datasets/promoter/stress_ethanol_cipro_construct_contexts
  feature_matrix_dataset:
    artifact_type: dataset
    dataset_id: promoter/stress_ethanol_cipro_feature_matrix
    ref: repo:src/dnadesign/usr/datasets/promoter/stress_ethanol_cipro_feature_matrix

execution_surfaces:
  construct_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10
  infer_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro
  densegen_batch:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/densegen_stress_ethanol_cipro_batch_with_notify.yaml
  infer_batch_20b_anchor_only:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_20b_batch_with_notify.yaml
  infer_batch_20b_anchor_plus_template:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_20b_batch_with_notify.yaml
  infer_batch_7b_anchor_only:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_7b_batch_with_notify.yaml
  infer_batch_7b_anchor_plus_template:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_7b_batch_with_notify.yaml

snapshot:
  summary_scope: repo
  summary_inputs:
    - kind: dataset_rows
      artifact: densegen_anchor_source
      target_rows: 100000

preflight:
  default_scope: next
  scopes:
    next:
      include_phases: [current_phase, next_in_progress_phase]
    full:
      include_phases: [all]
  group_phase_bindings:
    densegen: densegen_growth
    construct: construct_context_expansion
    notify_environment: infer_batch_preparation
  checks:
    densegen_growth:
      - kind: runbook_plan
        check_id: densegen.batch.plan
        summary: DenseGen batch runbook renders cleanly.
        required: true
        surface: densegen_batch
      - kind: dataset_snapshot
        check_id: densegen.anchor.rows
        summary: DenseGen anchor dataset row count is visible.
        required: true
        artifact: densegen_anchor_source
        target_rows: 100000
    construct_context_expansion:
      - kind: path_exists
        check_id: construct.anchor.dataset
        summary: Merged anchor dataset is materialized.
        required: true
        artifact: merged_anchor_dataset
      - kind: workspace_layout
        check_id: construct.workspace.layout
        summary: Construct workspace root is present.
        required: true
        surface: construct_workspace
    infer_batch_preparation:
      - kind: path_exists
        check_id: infer.construct.contexts
        summary: Construct contexts are present for infer.
        required: true
        artifact: construct_context_dataset
      - kind: environment
        check_id: notify.environment.contract
        summary: Notify environment variables are present before infer batch planning.
        required: false
        vars: [SLACK_WEBHOOK_URL, SLACK_BOT_TOKEN]
      - kind: gpu_availability
        check_id: infer.local_gpu.visibility
        summary: At least one compatible GPU is visible on the current host.
        required: false
        min_visible: 1
      - kind: runbook_plan
        check_id: infer.batch.20b.anchor_only.plan
        summary: Anchor-only 20B infer runbook renders cleanly.
        required: false
        surface: infer_batch_20b_anchor_only
      - kind: runbook_plan
        check_id: infer.batch.20b.anchor_plus_template.plan
        summary: Anchor-plus-template 20B infer runbook renders cleanly.
        required: false
        surface: infer_batch_20b_anchor_plus_template
      - kind: runbook_plan
        check_id: infer.batch.7b.anchor_only.plan
        summary: Anchor-only 7B infer runbook renders cleanly.
        required: false
        surface: infer_batch_7b_anchor_only
      - kind: runbook_plan
        check_id: infer.batch.7b.anchor_plus_template.plan
        summary: Anchor-plus-template 7B infer runbook renders cleanly.
        required: false
        surface: infer_batch_7b_anchor_plus_template
  next_scope:
    target_phase_groups:
      densegen_growth: [densegen]
      merged_anchor_set: []
      construct_context_expansion: [construct]
      infer_batch_preparation: [infer, notify_environment, notify, infer_batch_plan]
    runtime_phase_groups: [infer, notify, infer_batch_plan]
    runtime_shared_groups: [notify_environment]
