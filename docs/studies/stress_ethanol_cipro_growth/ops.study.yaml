version: 2
study_id: stress_ethanol_cipro_growth
family: promoter
title: Stress / ethanol / ciprofloxacin growth study

record_sources:
  narrative_ref: manifest:status.md
  datasets_ref: manifest:datasets.yaml
  pipeline_ref: manifest:pipeline.yaml
  campaign_ref: manifest:campaign.yaml

lifecycle:
  phase_order:
    - densegen_growth
    - merged_anchor_set
    - construct_context_expansion
    - infer_batch_preparation
    - infer_anchor_only_20b
    - infer_anchor_plus_template_20b
    - infer_anchor_only_7b
    - infer_anchor_plus_template_7b
  current_phase:
    strategy: explicit
    id: infer_batch_preparation

phases:
  - id: densegen_growth
    status: parallel_optional
    primary_dataset: densegen_prom_eth_cip_source
    next_surface: repo:src/dnadesign/ops/runbooks/presets/densegen_stress_ethanol_cipro_batch_with_notify.yaml
  - id: merged_anchor_set
    status: complete
    output_dataset: usr_prom_eth_cip_anchor
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: construct_context_expansion
    status: complete
    output_dataset: construct_prom_eth_cip_context
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: infer_batch_preparation
    status: in_progress
    next_surface: repo:src/dnadesign/usr/docs/operations/promoter-study-preflight.md
  - id: infer_anchor_only_20b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_20b_batch_with_notify.yaml
  - id: infer_anchor_plus_template_20b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_20b_batch_with_notify.yaml
  - id: infer_anchor_only_7b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_7b_batch_with_notify.yaml
  - id: infer_anchor_plus_template_7b
    status: planned
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_7b_batch_with_notify.yaml

artifacts:
  densegen_anchor_source:
    artifact_type: dataset
    dataset_id: densegen_prom_eth_cip_source
    ref: repo:src/dnadesign/usr/datasets/densegen_prom_eth_cip_source
  densegen_config:
    artifact_type: file
    ref: repo:src/dnadesign/densegen/workspaces/study_stress_ethanol_cipro/config.yaml
  merged_anchor_dataset:
    artifact_type: dataset
    dataset_id: usr_prom_eth_cip_anchor
    ref: repo:src/dnadesign/usr/datasets/usr_prom_eth_cip_anchor
  construct_context_dataset:
    artifact_type: dataset
    dataset_id: construct_prom_eth_cip_context
    ref: repo:src/dnadesign/usr/datasets/construct_prom_eth_cip_context
  feature_matrix_dataset:
    artifact_type: dataset
    dataset_id: usr_prom_eth_cip_matrix
    ref: repo:src/dnadesign/usr/datasets/usr_prom_eth_cip_matrix
  infer_config_anchor_only_20b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_20b.yaml
  infer_config_anchor_plus_template_20b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_20b.yaml
  infer_config_anchor_only_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_7b.yaml
  infer_config_anchor_plus_template_7b:
    artifact_type: file
    ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_7b.yaml

execution_surfaces:
  construct_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10
  infer_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/infer/workspaces/study_stress_ethanol_cipro
  densegen_batch:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/densegen_stress_ethanol_cipro_batch_with_notify.yaml
  infer_batch_20b_anchor_only:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_20b_batch_with_notify.yaml
  infer_batch_20b_anchor_plus_template:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_20b_batch_with_notify.yaml
  infer_batch_7b_anchor_only:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_only_7b_batch_with_notify.yaml
  infer_batch_7b_anchor_plus_template:
    surface_type: runbook
    runbook_ref: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_anchor_plus_template_7b_batch_with_notify.yaml
  scheduler_default:
    surface_type: scheduler
    backend: sge
  densegen_probe_solver:
    surface_type: command
    argv:
      - uv
      - run
      - dense
      - validate-config
      - --probe-solver
      - -c
      - src/dnadesign/densegen/workspaces/study_stress_ethanol_cipro/config.yaml
  construct_workspace_doctor:
    surface_type: command
    argv:
      - uv
      - run
      - construct
      - workspace
      - doctor
      - --workspace
      - src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10
  construct_runtime_forward_anchor_window:
    surface_type: command
    argv:
      - uv
      - run
      - construct
      - workspace
      - validate-project
      - --workspace
      - src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10
      - --project
      - forward_anchor_window
      - --runtime
  infer_validate_anchor_only_20b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_20b.yaml
  infer_validate_anchor_plus_template_20b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_20b.yaml
  infer_validate_anchor_only_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_7b.yaml
  infer_validate_anchor_plus_template_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - validate
      - config
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_7b.yaml
  infer_dry_run_anchor_only_20b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - run
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_20b.yaml
      - --dry-run
  infer_dry_run_anchor_plus_template_20b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - run
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_20b.yaml
      - --dry-run
  infer_dry_run_anchor_only_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - run
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_7b.yaml
      - --dry-run
  infer_dry_run_anchor_plus_template_7b:
    surface_type: command
    argv:
      - uv
      - run
      - infer
      - run
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_plus_template.evo2_7b.yaml
      - --dry-run
  notify_profile_doctor_anchor_only_20b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - profile
      - doctor
      - --profile
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_only_20b/profile.json
      - --json
  notify_profile_doctor_anchor_plus_template_20b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - profile
      - doctor
      - --profile
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_plus_template_20b/profile.json
      - --json
  notify_profile_doctor_anchor_only_7b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - profile
      - doctor
      - --profile
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_only_7b/profile.json
      - --json
  notify_profile_doctor_anchor_plus_template_7b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - profile
      - doctor
      - --profile
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/outputs/notify/infer/anchor_plus_template_7b/profile.json
      - --json
  notify_resolve_events_anchor_only_20b:
    surface_type: command
    argv:
      - uv
      - run
      - notify
      - setup
      - resolve-events
      - --tool
      - infer
      - --config
      - src/dnadesign/infer/workspaces/study_stress_ethanol_cipro/config.anchor_only.evo2_20b.yaml
      - --json
  notify_resolve_events_anchor_plus_template_20b:
    surface_type: command
    argv:
      - uv
      - run
