version: 2
study_id: stress_ethanol_cipro_growth
title: Stress / ethanol / ciprofloxacin growth study

ops_surfaces:
  status_kind: stress-ethanol-cipro-growth-status
  preflight_kind: stress-ethanol-cipro-growth-preflight

record_sources:
  narrative_ref: manifest:record/status.md
  datasets_ref: manifest:record/datasets.yaml
  pipeline_ref: manifest:operations/pipeline.yaml
  campaign_ref: manifest:record/campaign.yaml

lifecycle:
  phase_order:
    - densegen_growth
    - merged_anchor_set
    - construct_context_expansion
    - infer_batch_preparation
    - infer_sequence_views_anchor_construct_insert_7b
    - infer_sequence_views_context_forward_seq_and_anchor_mean_7b
    - infer_sequence_views_context_reverse_complement_seq_and_anchor_mean_7b
    - genbank_reference_import
    - reference_annotation_overlay
    - reference_core60_normalization
    - reference_context_forward
    - reference_context_reverse_complement
    - infer_reference_analysis_window_core60_7b
    - infer_reference_context_forward_seq_and_anchor_mean_7b
    - infer_reference_context_reverse_complement_seq_and_anchor_mean_7b
    - infer_reference_views_7b
    - latentdna_reference_normalization_audit
    - infer_anchor_only_20b
    - infer_anchor_plus_template_20b
  current_phase:
    strategy: explicit
    id: latentdna_reference_normalization_audit

phases:
  - id: densegen_growth
    status: parallel_optional
    primary_dataset: densegen_prom_eth_cip_source
    next_surface: repo:src/dnadesign/ops/runbooks/presets/densegen_stress_ethanol_cipro_batch_with_notify.yaml
  - id: merged_anchor_set
    status: complete
    output_dataset: usr_prom_eth_cip_anchor
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: construct_context_expansion
    status: complete
    output_dataset: construct_prom_eth_cip_context
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/runbook.md
  - id: infer_batch_preparation
    status: complete
    next_surface: repo:docs/studies/stress_ethanol_cipro_growth/contracts/preflight.md
  - id: infer_sequence_views_anchor_construct_insert_7b
    status: complete
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_anchor_construct_insert_7b_batch_with_notify.yaml
  - id: infer_sequence_views_context_forward_seq_and_anchor_mean_7b
    status: complete
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_context_forward_seq_and_anchor_mean_7b_batch_with_notify.yaml
  - id: infer_sequence_views_context_reverse_complement_seq_and_anchor_mean_7b
    status: complete
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_context_reverse_complement_seq_and_anchor_mean_7b_batch_with_notify.yaml
  - id: genbank_reference_import
    status: complete
    required_for_main_study_state: false
    output_dataset: usr_promoter_references
    next_surface: repo:src/dnadesign/usr/scripts/port_mg1655_promoter_references.py
  - id: reference_annotation_overlay
    status: complete
    required_for_main_study_state: false
    output_dataset: usr_promoter_references
    next_surface: repo:src/dnadesign/usr/docs/reference/overlay-and-registry.md
  - id: reference_core60_normalization
    status: complete
    required_for_main_study_state: false
    output_dataset: construct_prom_eth_cip_reference_core60
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/config.reference_core60.yaml
  - id: reference_context_forward
    status: complete
    required_for_main_study_state: false
    output_dataset: construct_prom_eth_cip_reference_contexts
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/config.reference_core60_contexts.forward_rc.yaml
  - id: reference_context_reverse_complement
    status: complete
    required_for_main_study_state: false
    output_dataset: construct_prom_eth_cip_reference_contexts
    next_surface: repo:src/dnadesign/construct/workspaces/study_stress_ethanol_cipro_pdual10/config.reference_core60_contexts.forward_rc.yaml
  - id: infer_reference_analysis_window_core60_7b
    status: complete
    required_for_main_study_state: false
    output_dataset: infer_prom_eth_cip_reference_views_7b
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_reference_analysis_window_core60_7b_batch_with_notify.yaml
  - id: infer_reference_context_forward_seq_and_anchor_mean_7b
    status: complete
    required_for_main_study_state: false
    output_dataset: infer_prom_eth_cip_reference_views_7b
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_reference_context_forward_seq_and_anchor_mean_7b_batch_with_notify.yaml
  - id: infer_reference_context_reverse_complement_seq_and_anchor_mean_7b
    status: complete
    required_for_main_study_state: false
    output_dataset: infer_prom_eth_cip_reference_views_7b
    next_surface: repo:src/dnadesign/ops/runbooks/presets/infer_stress_ethanol_cipro_sequence_views_reference_context_reverse_complement_seq_and_anchor_mean_7b_batch_with_notify.yaml
  - id: infer_reference_views_7b
    status: complete
    required_for_main_study_state: false
    output_dataset: infer_prom_eth_cip_reference_views_7b
    next_surface: repo:src/dnadesign/infer/docs/reference/feature-schema.md
    notes: Logical planning surface only; materialized payloads live under the reference core60/context dataset `_derived/infer/` sidecars.
  - id: latentdna_reference_normalization_audit
    status: in_progress
    required_for_main_study_state: false
    next_surface: repo:src/dnadesign/latentdna/docs/workflows/stress-ethanol-cipro-representation-comparison.md
  - id: infer_anchor_only_20b
    status: planned
    required_for_main_study_state: false
