checks:
  infer_batch_preparation:
  - kind: path_exists
    check_id: infer.construct.contexts
    check_group: infer
    summary: Construct contexts are present for infer.
    required: true
    artifact: construct_context_dataset
  - kind: sequence_view_contract
    check_id: infer.sequence_views.anchor_contract
    check_group: infer
    summary: Merged anchor sequence views satisfy the generic construct-insert contract.
    required: true
    artifact: merged_anchor_dataset
    expected:
      total_records: 160460
      total_views: 160460
      counts_by_product_kind:
        construct_insert: 160460
      counts_by_orientation:
        forward: 160460
      counts_by_context_kind:
        anchor_only: 160460
      counts_by_recommended_pooling:
        seq_mean: 160460
  - kind: sequence_view_contract
    check_id: infer.sequence_views.context_contract
    check_group: infer
    summary: Construct context sequence views satisfy the generic realized-context orientation and pooling
      contract.
    required: true
    artifact: construct_context_dataset
    expected:
      total_records: 320920
      total_views: 320920
      counts_by_product_kind:
        realized_context: 320920
      counts_by_orientation:
        forward: 160460
        reverse_complement: 160460
      counts_by_context_kind:
        template_1kb: 320920
      counts_by_recommended_pooling:
        anchor_mean: 320920
      exact_lengths_by_product_kind:
        realized_context: 1000
  - kind: sequence_view_contract
    check_id: infer.sequence_views.reference_core60_contract
    check_group: infer
    summary: Reference core60 sequence views satisfy the generic analysis-window contract.
    required: false
    artifact: reference_core60_dataset
    expected:
      total_records: 48
      total_views: 48
      counts_by_product_kind:
        analysis_window: 48
      counts_by_orientation:
        forward: 48
      counts_by_context_kind:
        analysis_window: 48
      counts_by_recommended_pooling:
        core60_mean: 48
      exact_lengths_by_product_kind:
        analysis_window: 60
  - kind: sequence_view_contract
    check_id: infer.sequence_views.reference_context_contract
    check_group: infer
    summary: Reference context sequence views satisfy the generic realized-context orientation and pooling
      contract.
    required: false
    artifact: reference_context_dataset
    expected:
      total_records: 96
      total_views: 96
      counts_by_product_kind:
        realized_context: 96
      counts_by_orientation:
        forward: 48
        reverse_complement: 48
      counts_by_context_kind:
        template_1kb: 96
      counts_by_recommended_pooling:
        anchor_mean: 96
      exact_lengths_by_product_kind:
        realized_context: 1000
