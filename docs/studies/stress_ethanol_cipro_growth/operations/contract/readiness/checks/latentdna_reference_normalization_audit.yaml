checks:
  latentdna_reference_normalization_audit:
  - kind: path_exists
    check_id: latentdna.binding.present
    check_group: latentdna
    summary: Stress LatentDNA binding is present.
    required: true
    artifact: latentdna_binding
  - kind: workspace_layout
    check_id: latentdna.workspace.layout
    check_group: latentdna
    summary: Stress LatentDNA workspace root is present.
    required: true
    surface: latentdna_workspace
  - kind: command
    check_id: latentdna.workspace.snapshot
    check_group: latentdna
    summary: Stress LatentDNA workspace snapshot completed.
    required: true
    surface: latentdna_workspace_snapshot
