opal_selection_set_show_json:
  surface_type: command
  argv:
  - uv
  - run
  - opal
  - selection-set
  - show
  - -c
  - src/dnadesign/opal/campaigns/secg_rmf_greedy/configs/campaign.yaml
  - --view
  - <selection_view_id>
  - --round
  - <as_of_round>
  - --json
opal_selection_set_export_csv_json:
  surface_type: command
  writes_artifacts: true
  argv:
  - uv
  - run
  - opal
  - selection-set
  - export
  - -c
  - src/dnadesign/opal/campaigns/secg_rmf_greedy/configs/campaign.yaml
  - --view
  - <selection_view_id>
  - --round
  - <as_of_round>
  - --out
  - <selection-set.csv>
  - --format
  - csv
  - --json
