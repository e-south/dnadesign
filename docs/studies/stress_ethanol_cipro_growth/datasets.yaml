study_id: stress_ethanol_cipro_growth
usr_remotes_path: src/dnadesign/usr/remotes.yaml
datasets:
  - role: densegen_anchor
    dataset: densegen/study_stress_ethanol_cipro
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_both
    authority: shared
    notes: Shared study copy written directly by DenseGen to the shared USR root and used for downstream status, construct, infer, and cluster handoff.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: densegen/study_stress_ethanol_cipro
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/densegen_study_stress_ethanol_cipro--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: wildtype_manual
    dataset: mg1655_promoters
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: Curated wildtype promoter source set to carry into the promoter study.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: construct_template_seed
    dataset: plasmids
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: Curated plasmid/template source set for construct-context expansion.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: merged_anchor_source
    dataset: promoter/stress_ethanol_cipro_anchor_set
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: existing_both
    authority: shared
    notes: Study-owned merged anchor set materialized from mg1655_promoters plus densegen/study_stress_ethanol_cipro and used as the shared anchor-only Infer handoff. Canonical shared copies now exist both locally and on the SCC cluster root.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: promoter/stress_ethanol_cipro_anchor_set
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/promoter_stress_ethanol_cipro_anchor_set--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: construct_context
    dataset: promoter/stress_ethanol_cipro_construct_contexts
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_both
    authority: shared
    notes: Study-owned 1 kb pDual-10 contexts materialized by Construct from the merged anchor set and plasmids template dataset for template-backed Infer lanes. Canonical shared copies now exist both locally and on the SCC cluster root.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: promoter/stress_ethanol_cipro_construct_contexts
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/promoter_stress_ethanol_cipro_construct_contexts--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: feature_matrix
    dataset: promoter/stress_ethanol_cipro_feature_matrix
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: planned
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: create_new
    authority: shared
    notes: Planned shared downstream feature dataset. The current Infer full-lane configs keep anchor-only and template-backed planes explicit until a later shared consolidation step.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: promoter/stress_ethanol_cipro_feature_matrix
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/promoter_stress_ethanol_cipro_feature_matrix--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
