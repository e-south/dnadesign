study_id: stress_ethanol_cipro_growth
usr_remotes_path: src/dnadesign/usr/remotes.yaml
datasets:
  - role: densegen_anchor
    dataset: densegen_prom_eth_cip_source
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: densegen
    onboard_mode: existing_both
    authority: shared
    notes: Shared study copy written directly by DenseGen to the shared USR root and used for downstream status, construct, infer, and cluster handoff.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: densegen_prom_eth_cip_source
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/densegen_prom_eth_cip_source--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: promoter_references
    dataset: usr_promoter_references
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Unified promoter-reference source set for the study: 19 primer-flank-stripped
      GenBank-projected promoter inserts from the archived MG1655 noncoding set plus
      29 source-backed synthetic promoter standards. J23105 is refreshed from the
      synthetic GenBank source instead of being duplicated. `seq_annot`, `derived`,
      `promoter_standard`, and `_views/sequence_views.parquet` retain source
      annotations, strength metadata, and projection lineage.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: sfxi_pdual10_densegen_promoters
    dataset: usr_sfxi_pdual10_densegen_promoters
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Reader-backed pDual-10 SFXI promoter subset ported from the archived 60 bp
      dual-promoter DenseGen dataset. These 23 rows are pDual-only, archive-backed,
      and carry modern `densegen` plus `usr_label` overlays for study anchor
      convergence. They are source rows for the merged anchor/context handoff, not
      a replacement for the GenBank promoter-reference branch.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: construct_template_seed
    dataset: usr_pdual10_plasmid_template
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: Curated plasmid/template source set for construct-context expansion.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: merged_anchor_source
    dataset: usr_prom_eth_cip_anchor
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: existing_both
    authority: shared
    notes: Study-owned merged anchor set materialized from densegen_prom_eth_cip_source, native usr_promoter_references, usr_sfxi_pdual10_densegen_promoters, and construct_prom_eth_cip_reference_core60. Native reference rows keep their source lengths; core60 rows are analysis-only 60 bp comparability views selected by fail-fast -35/-10 checks. The local dataset sequence-view sidecar uses one construct_insert anchor-only view per row with seq_mean recommended pooling; native or designed exact-60 rows are not duplicated or relabeled as analysis_window in this merged handoff. Record data exists locally and on the SCC cluster root; the generic sequence-view sidecar migration must be covered by the next USR sync audit before assuming remote parity.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: usr_prom_eth_cip_anchor
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr_prom_eth_cip_anchor--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: construct_context
    dataset: construct_prom_eth_cip_context
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_both
    authority: shared
    notes: Study-owned paired 1 kb pDual-10 forward and whole-output reverse-complement contexts materialized by Construct from the merged anchor set and usr_pdual10_plasmid_template template dataset for template-backed Infer lanes. The local context handoff now covers DenseGen, native promoter-reference, reference core60, and SFXI pDual-10 source cohorts with dataset-local realized_context sequence views for both orientations. Record data exists locally and on the SCC cluster root; the generic sequence-view sidecar migration must be covered by the next USR sync audit before assuming remote parity.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: construct_prom_eth_cip_context
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/construct_prom_eth_cip_context--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: feature_matrix
    dataset: usr_prom_eth_cip_matrix
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: planned
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: create_new
    authority: shared
    notes: Planned shared downstream feature dataset. The current Infer full-lane configs keep anchor-only and template-backed planes explicit until a later shared consolidation step.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: usr_prom_eth_cip_matrix
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr_prom_eth_cip_matrix--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: native_reference_records
    dataset: usr_promoter_references
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: Present GenBank-backed promoter-reference/control source surface for the study. Base rows are primer-flank-stripped promoter inserts, not full primer-flanked GenBank records. Sequence-view manifests live as dataset-local `_views/sequence_views.parquet` sidecars rather than a standalone sequence-view dataset.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_analysis_window
    dataset: construct_prom_eth_cip_reference_core60
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_local
    authority: local
    notes: Present 48-row 60 bp matched analysis-core reference view dataset derived from usr_promoter_references. Construct uses explicit GenBank -35/-10 annotation-pair midpoint selection, fails on missing or ambiguous sigma-70 sites, expands under-length references by replacing the pDual-10 anchor cassette interval, and emits analysis-only sequence views with core60_mean recommended pooling.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_construct_contexts
    dataset: construct_prom_eth_cip_reference_contexts
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_local
    authority: local
    notes: Present 96-row paired forward and whole-output reverse-complement 1 kb pDual context dataset derived from construct_prom_eth_cip_reference_core60. Construct stores emitted-orientation anchor bounds so Infer can compute anchor_mean for both forward and reverse-complement contexts without a second coordinate transform.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_view_features
    dataset: infer_prom_eth_cip_reference_views_7b
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: planned
    lifecycle: shared_handoff
    owner_tool: infer
    onboard_mode: create_new
    authority: shared
    notes: Planned 7B reference-view feature surface for native/core/context comparison and later LatentDNA reference-normalization audits.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
