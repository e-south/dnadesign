    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_both
    authority: shared
    notes: Study-owned 1 kb pDual-10 contexts materialized by Construct from the merged anchor set and usr_pdual10_plasmid_template template dataset for template-backed Infer lanes. Canonical shared copies now exist both locally and on the SCC cluster root.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: construct_prom_eth_cip_context
      remote_root_kind: shared
      default_direction: bidirectional
