version: 3
study_id: stress_ethanol_cipro_growth
record_kind: synthesis_handoff_lifecycle
owner: dnadesign-maintainers
last_verified: 2026-07-20
authority: checked_in_study_record
generated_artifact_policy:
  outputs_are_generated: true
  generated_outputs_are_not_committed_by_default: true
  accepted_handoff_requires_manifest_sha256: true
  accepted_handoff_requires_vendor_workbook_sha256: true
  accepted_handoff_requires_genbank_dir_sha256: true
  accepted_handoff_requires_genbank_feature_table_sha256: true
  accepted_handoff_requires_workbook_readback_pass: true
  accepted_handoff_requires_genbank_readback_pass: true
  measured_round_materialization_requires_input_sha256_receipts: true
  measured_round_materialization_requires_exact_alias_candidate_core_bindings: true
operator_preview_command: >-
  uv run python -m dnadesign.studies.units.stress_ethanol_cipro_growth.decision.opal.synthesis_handoff
  --handoff-id <handoff_id> --json
canonical_contract:
  selected_set_authorities:
    pre_assay_seed: study_batch0_selector
    opal_model_round: opal_selection_batch
  common_identity_fields:
    - handoff_id
    - campaign_slug
    - selection_epoch
    - assay_batch_index
    - model_as_of_round
    - run_id
    - strategy_id
    - manifest_path
    - vendor_workbook_path
    - genbank_dir_path
    - genbank_feature_table_path
    - manifest_sha256
    - vendor_workbook_sha256
    - genbank_dir_sha256
    - genbank_feature_table_sha256
  measured_round_identity_fields:
    - selection_view_ids
    - selection_memberships
    - expected_selection_views
    - materialization_contract
    - campaign_config
    - selection_batch
    - candidate_records
    - promoter_alias_registry
    - cloning_strategy
    - expected_candidates
    - expected_artifact
  measured_round_record_rules:
    - source_authority must be opal_selection_batch
    - selection_epoch must be opal_model_round
    - model_as_of_round must be the OPAL round used for selection
    - assay_batch_index must be the physical order batch index
    - campaign_slug and run_id identify one unified OPAL learning lifecycle
    - expected_selection_views records each target view and its logical membership count
    - materialization_contract binds the five repository inputs by path and SHA-256
    - candidate_records binds the table used to annotate the generated GenBank records
    - expected_candidates binds every stable study alias to one candidate id and promoter-core SHA-256
    - write mode resolves the lifecycle record, campaign config, alias registry, and cloning strategy only from their canonical paths in the active source checkout
    - every materialization input and generated artifact path must resolve inside the active checkout, including through symlinks
    - expected_artifact records the deduplicated selection-batch artifact set
    - operators should invoke measured rounds by --handoff-id after adding the record row
    - alias assignment alone does not mean a sequence was accepted, ordered, received, or assayed
  pre_assay_seed_record_rules:
    - campaign_slug identifies the digest-pinned source directory for one SFXI selection view
    - source_campaign_slug is the exact campaign identity embedded in the digest-pinned manifest
    - neither source campaign slug is an executable OPAL campaign route
  lifecycle_status_values:
    - authorized_for_materialization
    - generated_pending_acceptance
    - accepted_for_order
    - ordered
    - received
    - assayed
    - superseded
