authority: checked_in_study_record
generated_artifact_policy:
  outputs_are_generated: true
  generated_outputs_are_not_committed_by_default: true
  accepted_handoff_requires_manifest_sha256: true
  accepted_handoff_requires_vendor_workbook_sha256: true
  accepted_handoff_requires_genbank_dir_sha256: true
  accepted_handoff_requires_genbank_feature_table_sha256: true
  accepted_handoff_requires_workbook_readback_pass: true
  accepted_handoff_requires_genbank_readback_pass: true
operator_preview_command: >-
  uv run python -m dnadesign.studies.units.stress_ethanol_cipro_growth.decision.opal.synthesis_handoff
  --handoff-id <handoff_id> --json
canonical_contract:
  selected_set_authorities:
    pre_assay_seed: study_batch0_selector
    opal_model_round: opal_selection_set
  required_identity_fields:
    - handoff_id
    - campaign_slug
    - selection_epoch
    - assay_batch_index
    - model_as_of_round
    - run_id or expected_campaigns[].run_id
    - strategy_id
    - manifest_path
    - vendor_workbook_path
    - genbank_dir_path
    - genbank_feature_table_path
    - manifest_sha256
    - vendor_workbook_sha256
    - genbank_dir_sha256
    - genbank_feature_table_sha256
  measured_round_record_rules:
    - source_authority must be opal_selection_set
    - selection_epoch must be opal_model_round
    - model_as_of_round must be the OPAL round used for selection
    - assay_batch_index must be the physical order batch index
    - each expected campaign must have an explicit run_id unless one top-level run_id applies to all campaigns
    - operators should invoke measured rounds by --handoff-id after adding the record row
  lifecycle_status_values:
    - generated_pending_acceptance
    - accepted_for_order
    - ordered
    - received
    - assayed
    - superseded
