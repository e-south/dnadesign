study_id: stress_ethanol_cipro_growth
usr_remotes_path: src/dnadesign/usr/remotes.yaml
datasets:
  - role: densegen_anchor
    dataset: densegen_prom_eth_cip_source
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: densegen
    onboard_mode: existing_both
    authority: shared
    notes: >-
      Shared study copy written directly by DenseGen to the shared USR root and
      used for downstream status, construct, infer, and cluster handoff. The
      local dataset now carries generic `source_record` sequence views with
      mutable view semantics; these source views clarify provenance but are not
      the construct-ready merged-anchor contract.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: densegen_prom_eth_cip_source
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr-sync/densegen/densegen_prom_eth_cip_source--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: promoter_references
    dataset: usr_promoter_references
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Unified promoter-reference source set for the study: 19 primer-flank-stripped
      GenBank-projected promoter inserts from the archived MG1655 noncoding set plus
      29 source-backed synthetic promoter standards. J23105 is refreshed from the
      synthetic GenBank source instead of being duplicated. `seq_annot`, `derived`,
      `promoter_standard`, and `_views/sequence_views.parquet` retain source
      annotations, strength metadata, and projection lineage.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: sfxi_pdual10_densegen_promoters
    dataset: usr_sfxi_pdual10_densegen_promoters
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Reader-backed pDual-10 SFXI promoter subset ported from the archived 60 bp
      dual-promoter DenseGen dataset. These 23 rows are pDual-only, archive-backed,
      and carry modern `densegen` plus `usr_label` overlays for study anchor
      convergence. They are source rows for the merged anchor/context handoff, not
      a replacement for the GenBank promoter-reference branch. The local dataset
      now carries generic `source_record` sequence views with SFXI source-family
      semantics; non-unique reader-experiment batch labels stay in overlays and
      are not promoted to globally unique view aliases.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: regulondb_native_promoters
    dataset: usr_regulondb_native_promoters
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      RegulonDB native promoter source dataset for the small BaeR/CpxR/LexA
      axis-orientation audit. It is not a broad native-promoter EDA input for
      the stress study. The `_relations/regulatory_interactions.parquet`
      sidecar is the required TF-association join surface and must be
      refreshed/populated before the LatentDNA audit is rendered. BioCyc KB
      29.6 GO sidecars under `_relations/` provide source-backed functional
      terms for interacting regulators; they are appendix interpretation
      sidecars, not OPAL/candidate-selection inputs.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: regulondb_native_core60_source
    dataset: usr_regulondb_native_promoter_core60
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Existing 60 bp TSS-upstream RegulonDB native promoter view. For the TF
      axis audit, these rows are planned as an append-only source cohort into
      `usr_prom_eth_cip_anchor`; Construct should then reuse the existing
      pDual-10 `forward_anchor_window` handoff into
      `construct_prom_eth_cip_context`.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: construct_template_seed
    dataset: usr_pdual10_plasmid_template
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: >-
      Curated plasmid/template source set for construct-context expansion. The
      local dataset now carries a generic `source_record` sequence view with
      template-source semantics; Construct still reads this as a template seed,
      not as an Infer anchor product.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: merged_anchor_source
    dataset: usr_prom_eth_cip_anchor
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: existing_both
    authority: shared
    notes: >-
      Study-owned merged anchor set materialized from
      densegen_prom_eth_cip_source, native usr_promoter_references,
      usr_sfxi_pdual10_densegen_promoters, and
      construct_prom_eth_cip_reference_core60. Native reference rows keep their
      source lengths; core60 rows are analysis-only 60 bp comparability views
      selected by fail-fast -35/-10 checks. The planned RegulonDB TF-axis audit
      appends `usr_regulondb_native_promoter_core60` here as an analysis-only
      source cohort with `derived__parent_id` pointing back to
      `usr_regulondb_native_promoters`. The local dataset sequence-view sidecar
      uses one construct_insert anchor-only view per row with seq_mean
      recommended pooling; native or designed exact-60 rows are not duplicated
      or relabeled as analysis_window in this merged handoff. Record data exists
      locally and on the SCC cluster root; the local sidecar migration is
      complete, but the next USR sync audit must verify remote parity before
      assuming the SCC root has the same `_views` artifacts.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: usr_prom_eth_cip_anchor
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr-sync/usr/usr_prom_eth_cip_anchor--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: construct_context
    dataset: construct_prom_eth_cip_context
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_both
    authority: shared
    notes: >-
      Study-owned paired 1 kb pDual-10 forward and whole-output
      reverse-complement contexts materialized by Construct from the merged
      anchor set and usr_pdual10_plasmid_template template dataset for
      template-backed Infer lanes. The local context handoff now covers
      DenseGen, native promoter-reference, reference core60, and SFXI pDual-10
      source cohorts with dataset-local realized_context sequence views for
      both orientations. The planned RegulonDB TF-axis audit should append
      contexts here through the same Construct project after the native core60
      rows are merged into `usr_prom_eth_cip_anchor`; it should not materialize
      a separate native context dataset. Record data exists locally and on the
      SCC cluster root; the local sidecar migration is complete, but the next USR
      sync audit must verify remote parity before assuming the SCC root has the
      same `_views` artifacts.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: construct_prom_eth_cip_context
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr-sync/construct/construct_prom_eth_cip_context--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: opal_candidate_feature_table
    dataset: usr_prom_eth_cip_opal_candidates
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: usr
    onboard_mode: create_new
    authority: shared
    notes: >-
      Materialized shared OPAL candidate feature table for the unified RMF
      campaign. This is a USR `records.parquet` candidate universe
      with 157185 rows: 157160 generated promoter rows from the four declared
      DenseGen plans (`background_only`, `ethanol`, `ciprofloxacin`, and
      `ethanol_ciprofloxacin`), 23 measured pDual-10 SFXI source rows, and
      2 measured pDual-10 control rows. Native/reference audit rows remain
      LatentDNA review context unless explicitly added to this contract. The
      materializer resolves DenseGen plan/run/hash fields from
      `usr_prom_eth_cip_anchor/_derived/densegen.parquet` by stable `id` so the
      generated OPAL table is self-contained for candidate provenance. The
      table carries self-auditing `opal_candidate__source_class`,
      `opal_candidate__design_family`, and `opal_candidate__sfxi_ref__collection_id`
      provenance columns plus one fixed-length vector-valued X column named
      `latentdna__evo2_7b__context_anchor_mean_bidir_concat`. SFXI source
      labels remain at `_opal/observed_labels.parquet`; the unified RMF campaign
      reads `_opal/response_window_labels_v4/observed_labels.parquet`. Shared
      predictions, view-specific selections, and the logical selection batch
      remain OPAL runtime artifacts. The X value is the Fwd+RC 1 kb context-anchor Evo2 7B
      intermediate embedding vector; it is not UMAP, centroid distance, an
      assay label, or a phenotype claim. Do not fork this into one USR dataset
      per selection view unless the candidate universe, X, or validation contract
      diverges.
    sync:
      enabled: true
      remote_name: cluster
      remote_dataset: usr_prom_eth_cip_opal_candidates
      remote_root_kind: shared
      default_direction: bidirectional
      audit_json: docs/studies/stress_ethanol_cipro_growth/audits/usr-sync/usr/usr_prom_eth_cip_opal_candidates--cluster-diff.json
      strict_bootstrap_id: true
      remote_path: n/a
  - role: native_reference_records
    dataset: usr_promoter_references
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: source
    owner_tool: usr
    onboard_mode: existing_local
    authority: local
    notes: Present GenBank-backed promoter-reference/control source surface for the study. Base rows are primer-flank-stripped promoter inserts, not full primer-flanked GenBank records. Sequence-view manifests live as dataset-local `_views/sequence_views.parquet` sidecars rather than a standalone sequence-view dataset.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_analysis_window
    dataset: construct_prom_eth_cip_reference_core60
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_local
    authority: local
    notes: Present 48-row 60 bp matched analysis-core reference view dataset derived from usr_promoter_references. Construct uses explicit GenBank -35/-10 annotation-pair midpoint selection, fails on missing or ambiguous sigma-70 sites, expands under-length references by replacing the pDual-10 anchor cassette interval, and emits analysis-only sequence views with core60_mean recommended pooling.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_construct_contexts
    dataset: construct_prom_eth_cip_reference_contexts
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: present
    lifecycle: shared_handoff
    owner_tool: construct
    onboard_mode: existing_local
    authority: local
    notes: Present 96-row paired forward and whole-output reverse-complement 1 kb pDual context dataset derived from construct_prom_eth_cip_reference_core60. Construct stores emitted-orientation anchor bounds so Infer can compute anchor_mean for both forward and reverse-complement contexts without a second coordinate transform.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
  - role: reference_view_features
    dataset: infer_prom_eth_cip_reference_views_7b
    usr_root: src/dnadesign/usr/datasets
    root_kind: shared
    status: planned
    lifecycle: shared_handoff
    owner_tool: infer
    onboard_mode: create_new
    authority: shared
    notes: Planned 7B reference-view feature surface for native/core/context comparison and later LatentDNA reference-normalization audits.
    sync:
      enabled: false
      remote_name: n/a
      remote_dataset: n/a
      remote_root_kind: n/a
      default_direction: none
      audit_json: n/a
      strict_bootstrap_id: false
      remote_path: n/a
