    quota_deduplication:
      last_checked: 2026-04-30
      verdict: expected_semantic_overlap_no_fidelity_blocker
      invariant: Exact repeated Evo2 input sequences can exist across semantic lanes when the study intentionally materializes both merged-anchor and reference-local sidecars. Treat this as an explicit materialization policy choice, not as sequence collapse.
      source_local_diagnostic_sidecars:
        config: sequence_views_reference_source_and_sfxi_source_7b
        datasets:
          - usr_promoter_references
          - usr_sfxi_pdual10_densegen_promoters
        views_completed: 71
        vector_payloads: 142
        scalar_payloads: 142
        downstream_quota_policy: Diagnostic source-local sidecars do not replace or expand the official merged anchor/context and reference core/context completion quota.
      length_contracts_verified:
        native_reference_rows: 48 variable-length source inserts are preserved in usr_promoter_references and merged into usr_prom_eth_cip_anchor without normalization.
        reference_core60_rows: 48 derived analysis-window rows are all 60 bp.
        merged_anchor_core60_rows: The same 48 derived core60 rows are intentionally included in usr_prom_eth_cip_anchor as construct_insert/seq_mean anchor views with analysis_only=true.
        main_context_rows: 314558 construct_prom_eth_cip_context rows are all 1000 bp.
        reference_context_rows: 96 construct_prom_eth_cip_reference_contexts rows are all 1000 bp.
        reference_context_reverse_complement_pairs: 48 forward/reverse pairs validated as exact reverse complements with emitted-orientation anchor bounds.
      observed_cross_dataset_exact_sequence_overlaps:
        - main_lane: sequence_views_anchor_construct_insert_7b
          reference_lane: sequence_views_reference_analysis_window_core60_7b
          exact_unique_sequences: 48
          duplicate_forward_passes_if_both_run: 48
          expected_by_design: true
          note: The reference core60 sequences are deliberately present in usr_prom_eth_cip_anchor as construct_insert rows so the total anchor dataset includes normalized references.
        - main_lane: sequence_views_context_forward_seq_and_anchor_mean_7b
          reference_lane: sequence_views_reference_context_forward_seq_and_anchor_mean_7b
          exact_unique_sequences: 48
          duplicate_forward_passes_if_both_run: 48
          expected_by_design: true
          note: Forward reference contexts are also present in the shared construct_prom_eth_cip_context handoff because that handoff is built from the merged anchor set.
        - main_lane: sequence_views_context_reverse_complement_seq_and_anchor_mean_7b
          reference_lane: sequence_views_reference_context_reverse_complement_seq_and_anchor_mean_7b
          exact_unique_sequences: 48
          duplicate_forward_passes_if_both_run: 48
          expected_by_design: true
          note: Reverse-complement reference contexts are also present in the shared construct_prom_eth_cip_context handoff because that handoff is built from the merged anchor set.
      operator_decision_required:
        - Default study batch posture is dataset-local sidecar completeness, so running both main and reference lanes is allowed and preserves distinct dataset/view/alias identities.
        - If optimizing strictly for unique Evo2 forward passes, the 144 known overlapping inputs can be reused through an explicit cross-dataset materialization or skip policy, but that is an optimization rather than a fidelity fix.
