    - sequences/reverse_complement.gb
    - plots/secondary_structure.native.png
    - plots/composition_overview.svg
    - plots/composition_overview.png
missing_sequence_subcomponents: []
topology_blockers: []
expected_output:
  output_policy: transient_or_reader_snapshot
  bundle_contract: msd_single_unit_sequence_bundle_v1
  required_manifest: manifest/bundle/sequence_manifest.json
  required_index: manifest/indexes/sequence_index.tsv
  per_design_deliverables:
