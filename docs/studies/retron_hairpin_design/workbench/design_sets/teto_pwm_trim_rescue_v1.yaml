  payload_source_resolution_in_compiler: excluded_literal_payloads_only
  implicit_cap_stem_grid_expansion: excluded_bounded_matrix_only
  generated_outputs_as_truth: excluded_workbench_records_are_authoritative
selection_basis:
  - Test whether shorter cargo changes SPOP before larger cap/stem-base exploration.
  - Keep WT Eco1 RT fixed because RT fusions are viability-confounded.
  - Use retron26 only as a scaffold and binding control, not the optimization target.
  - Test retron43 and the pES-retron-180 C172/AGTG/CATG/XWMM context as the target scaffold space.
  - Encode dual-site PWM trims as exact literal payloads with source-backed span and information metadata.
  - Use the sample-backed monotypic TetR elite as the parent payload so the review panel can show one selected motif occurrence on each strand.
  - Select mild and stronger retained windows by a bounded sliding-window rule that maximizes retained information across both selected motif occurrences.
