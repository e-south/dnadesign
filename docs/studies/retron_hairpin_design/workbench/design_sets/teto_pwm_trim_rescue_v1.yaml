decision_logic:
  - id: trim_damages_binding_control
    condition: retron26 trim controls lose SPOP despite acceptable viability.
    interpretation: Treat the payload trim as binding/readout-limited before interpreting target-scaffold failures.
  - id: cargo_shortening_not_sufficient
    condition: retron26 trim controls retain SPOP, but retron43 and DE033-compatible trims remain near the failure floor.
    interpretation: Cap/stem-base/processability dominates over cargo length in this panel.
  - id: candidate_cargo_shortening_rescue
    condition: Any retron43 or DE033-compatible trim rises above the 43/177-186 failure floor with acceptable viability.
    interpretation: Expand the winning trim length across a bounded cap/stem-base grid.
  - id: viability_confounded_apparent_rescue
    condition: SPOP improves while viability drops below the acceptance gate.
    interpretation: Do not classify as rescue; demote before expansion.
outcome_bins:
  - no_call
  - inactive_or_failed_sponging
  - viability_confounded_apparent_rescue
  - product_abundance_limited
  - binding_or_payload_limited
  - candidate_cargo_shortening_rescue
  - confirmed_cargo_shortening_rescue
