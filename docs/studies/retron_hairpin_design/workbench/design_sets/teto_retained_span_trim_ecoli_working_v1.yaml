selection_basis:
  - Preserve the prior retained-span trim logic from the bidirectional TetR PWM elite trim pilot.
  - Change payload family from the Cruncher TetR PWM elite sequence to the Eco1 tetO sequence used by retron26 and retron43.
  - Keep retron26 as the scaffold control and retron43 plus retron180 as target scaffolds for the bounded payload-family contrast.
  - Do not encode retron26-specific semantics in code; payload family membership comes from the payload binding-site catalog.
