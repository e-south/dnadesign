decision_logic:
  - id: trim_logic_fails_in_working_payload_family
    condition: retron26 trim controls lose reporter response despite acceptable relative biomass.
    interpretation: Payload length/register may be limiting even when using the retron26/retron43 Eco1 tetO payload family.
  - id: ecoli_working_payload_improves_r180_trim
    condition: r180 Eco1 tetO retained-span trims rise above the 199/200 failure floor while retron26 controls remain active.
    interpretation: Prior 199/200 weakness may be partly payload-family sensitive rather than scaffold-only.
  - id: ecoli_working_payload_improves_r43_trim
    condition: r43 Eco1 tetO retained-span trims rise above the 197/198 failure floor while retron26 controls remain active.
    interpretation: Prior 197/198 weakness may be partly payload-family sensitive rather than scaffold-only.
  - id: scaffold_dominates_after_payload_family_swap
    condition: retron26 controls remain active but r43 and r180 Eco1 tetO retained-span trims remain near the failure floor.
    interpretation: scaffold/processability remains the leading limitation under the tested trims.
