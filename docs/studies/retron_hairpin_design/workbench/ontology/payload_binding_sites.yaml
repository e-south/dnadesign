contract: retron_payload_binding_site_catalog_v1
schema_version: 1
study_id: retron_hairpin_design
title: Payload binding-site families and motif-register references
default_motif_model_id: tetr_westmann
motif_models:
  tetr_westmann:
    source_ref: cruncher:westmann_tetr_mitomi:tetR
    meme_path: src/dnadesign/cruncher/workspaces/demo_monotypic_tetr/outputs/artifacts/meme/tetR__westmann_tetr_mitomi__tetR.meme
    congruence_threshold_fraction: 0.65
payload_families:
  tetO_ecoli_working:
    parent_payload_id: tetO_ecoli_working_w00_19
    label: Working Eco1 tetO-like payload
    source_variant_id: retron26
    source_construct_id: pES-retron-26
    motif_model_id: tetr_westmann
    primary_sequence_5to3: TCCCTATCAGTGATAGAGA
    members:
      tetO_ecoli_working_w00_19:
        retained_parent_span_0: {start: 0, end: 19}
        role: parent_payload
      tetO_ecoli_working_w02_17:
        retained_parent_span_0: {start: 2, end: 17}
        role: mild_edge_trim
      tetO_ecoli_working_w03_16:
        retained_parent_span_0: {start: 3, end: 16}
        role: stronger_edge_trim
  tetr_pwm_elite:
    parent_payload_id: TetR_w00_19
    label: Cruncher monotypic TetR PWM elite payload
    source_artifact_ref: src/dnadesign/cruncher/workspaces/demo_monotypic_tetr/outputs/optimize/tables/elites.parquet
    motif_model_id: tetr_westmann
    primary_sequence_5to3: CTCTATATCTGATATAGAG
    members:
      TetR_w00_19:
        retained_parent_span_0: {start: 0, end: 19}
        role: parent_payload
      TetR_w02_17:
        retained_parent_span_0: {start: 2, end: 17}
        role: mild_edge_trim
      TetR_w03_16:
        retained_parent_span_0: {start: 3, end: 16}
        role: stronger_edge_trim
reference_payloads:
  - reference_payload_id: tetO_ecoli_working_w00_19
    role: assay_positive_payload_reference
payload_classes:
  catalog_parent_payload: Exact match to a catalog parent payload.
  catalog_trim_payload: Exact match to a retained span from a catalog parent payload.
  motif_congruent_uncataloged_payload: Motif score passes the catalog threshold but the literal payload is not a registered member.
  uncataloged_payload: No catalog or motif-congruent assignment.
