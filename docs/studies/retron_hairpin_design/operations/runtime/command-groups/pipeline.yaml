version: 1
study_id: retron_hairpin_design
navigation:
  command_group_map: docs/studies/retron_hairpin_design/operations/runtime/command-groups/README.md
  lane_sidecars:
    compiler: docs/studies/retron_hairpin_design/operations/runtime/command-groups/lanes/compiler.yaml
    materialize: docs/studies/retron_hairpin_design/operations/runtime/command-groups/lanes/materialize.yaml
    snapback: docs/studies/retron_hairpin_design/operations/runtime/command-groups/lanes/snapback.yaml
    scar_nick: docs/studies/retron_hairpin_design/operations/runtime/command-groups/lanes/scar-nick.yaml
    yiu: docs/studies/retron_hairpin_design/operations/runtime/command-groups/lanes/yiu.yaml

intent:
  primary_goal: "Route Retron MSD product work from user-provided or study-selected parts into frozen design-reference catalogs, while released-product Snapback, scar-nick, and YIU remain primitive routes for missing constraints."
  primary_lane: "study-owned Retron MSD design-reference compilation"
  state_label: "product route"
  operator_question: "Do the provided parts compile directly, or which primitive owns the missing constraint?"
  non_goals:
    - Do not answer compiler-style requests by defaulting to study phase or preflight posture.
    - Do not treat YIU as a topology-aware bulge or scaffold designer.
    - Do not fold retron processivity heuristics directly into the Cruncher search contracts.
    - Do not collapse preserved-site Snapback and released-product Snapback into one flagged lane.
    - Do not collapse scar-nick base-junction feasibility into Snapback cap/shortening scoring.
    - Do not expose Retron MSD design-reference compilation as a top-level tool or persistent workspace family.
  context_refs:
    - repo:docs/studies/retron_hairpin_design/contexts/cruncher/scar-nick-base-junction.md
    - repo:docs/studies/retron_hairpin_design/contexts/composition/linear-ssdna-composition.md
    - repo:docs/studies/retron_hairpin_design/workbench/README.md
    - repo:docs/studies/retron_hairpin_design/workbench/ontology/directions.yaml
    - repo:docs/studies/retron_hairpin_design/workbench/design_sets/scar_nick_profile_panel_v1.yaml
    - repo:docs/studies/retron_hairpin_design/compiler/catalog/msd_design_registry.yaml
    - repo:docs/studies/retron_hairpin_design/compiler/catalog/msd_cap_sources.yaml
    - repo:docs/studies/retron_hairpin_design/compiler/inputs/msd_design_hit_labels.txt
    - repo:docs/studies/retron_hairpin_design/compiler/inputs/msd_design_177_194_cap_sources_spec.yaml
    - repo:docs/dev/plans/cross-tool/linear-ssdna-composition/2026-05-13-generic-linear-ssdna-composition.md
    - repo:docs/exec-plans/completed/2026-05-13-generic-linear-ssdna-composition.md
    - repo:src/dnadesign/cruncher/docs/dev/audits/2026-04-19-retron-p4-hairpin-variant.md
    - repo:src/dnadesign/cruncher/docs/guides/snapback_released_workflow.md
    - repo:src/dnadesign/cruncher/docs/guides/yiu_workflow.md
  decision_refs:
    - repo:src/dnadesign/cruncher/workspaces/de033/runbook.md
    - repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr/runbook.md

command_groups:
  - id: msd_design_reference_catalog
    purpose: Compile the workbench-backed lab-facing Retron MSD design set or typed retron_msd_compiler_spec_v1 inputs into a transient shallow design-reference bundle for Reader or ad hoc visual/sequence handoff without creating Construct or Folding workspaces.
    workspace_ref: repo:.
    mutates_outputs: true
    commands:
      - uv run python -m dnadesign.studies.studies.retron_hairpin_design.interfaces.cli.app lint --id "pES-retron-177-msd[TetR]; C172-LCGGT-RACAG-MXMM" --format json
      - uv run python -m dnadesign.studies.studies.retron_hairpin_design.interfaces.cli.app lint --spec path/to/retron_msd_compiler_spec.yaml --format json
      - uv run python -m dnadesign.studies.studies.retron_hairpin_design.interfaces.cli.app compile --input docs/studies/retron_hairpin_design/compiler/inputs/msd_design_hit_labels.txt --out-dir /tmp/dnadesign_retron_msd_design_references --format json
  - id: msd_single_unit_materialize
    purpose: Materialize the valid C172 Retron MSD labels into transient single-unit GenBank, FASTA/CSV, native secondary-structure PNG, composition-review SVG, and high-resolution composition-review PNG bundles from the typed TetR/C172 spec.
    workspace_ref: repo:.
    mutates_outputs: true
    commands:
      - uv run python -m dnadesign.studies.studies.retron_hairpin_design.interfaces.cli.app materialize --spec docs/studies/retron_hairpin_design/compiler/inputs/msd_design_177_194_cap_sources_spec.yaml --out-dir /tmp/dnadesign_retron_msd_sequences --render-format png --format json
  - id: snapback_released_probe
    purpose: Confirm the allowed-policy exact-hit versus near-hit posture for the released-product 0/3/3 lane against the real release-enzyme catalog with the Type IIS release enzyme pinned to BspQI before any mutating solve run.
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/de033
    validation_role: read_only_probe
    commands:
      - uv run cruncher snapback released-target-search --workspace-root . --nick-preset neb_nicking_v1 --nick-additional-preset thermo_nicking_v1 --release-preset type_iis_release_v1 --release-variant-id BspQI --nick-boundary 0 --paired-bp 3 --cap-nt 3 --allow-top-active-routes --allow-precut-footprint-outside-active-product --json
  - id: snapback_released_solve
    purpose: Materialize the BspQI-pinned released-product exact-hit bundle, or the bounded near-hit fallback when exact hits are absent, and emit one plot per hit after the read-only probe is clean.
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/de033
    mutates_outputs: true
    commands:
      - uv run cruncher snapback released-solve --workspace-root . --nick-preset neb_nicking_v1 --nick-additional-preset thermo_nicking_v1 --release-preset type_iis_release_v1 --release-variant-id BspQI --nick-boundary 0 --paired-bp 3 --cap-nt 3 --allow-top-active-routes --allow-precut-footprint-outside-active-product --run-dir outputs/released_solve --materialize-top-k 16 --render-format pdf --emit-renders --force-overwrite --json
  - id: snapback_released_invalid_bundle_audit
    purpose: Revalidate the checked-in downstream-BspQI explicit spec as a degenerate-prefix-aware nonnegative-origin audit fixture. This path is expected to report invalid_precursor rather than a green bundle.
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/de033
    mutates_outputs: true
    commands:
      - uv run cruncher snapback released-design --spec configs/snapback/de033.released.snapback.yaml --force-overwrite --json
      - uv run cruncher snapback released-show --run outputs/released_design --json
  - id: scar_nick_profile_panel
    purpose: Regenerate same-workspace BbsI-HF and PaqCI scar-nick profile-panel outputs for strict terminal-nick retained-scar review.
    workspace_ref: repo:.
    mutates_outputs: true
    commands:
      - uv run cruncher scar-nick design --spec src/dnadesign/cruncher/workspaces/scar_nick_teto/configs/scar_nick/teto_upstream_processing.bbsI_hf.scar_nick.yaml --force-overwrite
      - uv run cruncher scar-nick design --spec src/dnadesign/cruncher/workspaces/scar_nick_teto/configs/scar_nick/teto_upstream_processing.paqci_core_panel.scar_nick.yaml --force-overwrite
      - uv run baserender job run src/dnadesign/cruncher/workspaces/scar_nick_teto/outputs/scar_nick/teto_upstream_processing_bbsI_hf/baserender_jobs/scar_nick_terminal_nick.job.yaml
      - uv run baserender job run src/dnadesign/cruncher/workspaces/scar_nick_teto/outputs/scar_nick/teto_upstream_processing_paqci_core_panel/baserender_jobs/scar_nick_terminal_nick.job.yaml
  - id: yiu_boundary_check
    purpose: Keep the direct TetR/TetO YIU path available as a contrast check on boundary language, not as the shortening engine.
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr
    commands:
      - uv run cruncher yiu validate --spec configs/yiu/tetr_teto2_wt_direct.yiu.yaml
      - uv run cruncher yiu render --spec configs/yiu/tetr_teto2_wt_direct.yiu.yaml --force-overwrite --emit-renders
      - uv run cruncher yiu show --bundle outputs/plots/yiu__tetr_teto2_wt_direct

native_agent_bootstrap:
  open_first:
    - repo:.agents/skills/retron-hairpin-study/SKILL.md
    - manifest:routes/README.md
    - repo:docs/studies/retron_hairpin_design/workbench/README.md
    - repo:docs/studies/retron_hairpin_design/workbench/design_sets/scar_nick_profile_panel_v1.yaml
    - manifest:compiler/catalog/msd_design_registry.yaml
    - manifest:compiler/inputs/msd_design_hit_labels.txt
    - manifest:compiler/catalog/msd_cap_sources.yaml
    - manifest:compiler/inputs/msd_design_177_194_cap_sources_spec.yaml
    - repo:docs/studies/retron_hairpin_design/contexts/composition/linear-ssdna-composition.md
  pair_with:
    - harness-engineering
    - code-change-discipline
  must_preserve:
    - start compiler-style requests from provided parts and desired outputs, not study phase
    - complete Retron MSD labels compile directly into design-reference catalogs
    - persistent experimental meaning lives in workbench design-set and run-provenance records; msd_design_hit_labels.txt is only a convenience compiler input
    - Retron MSD design-reference compilation is study-owned, uses
      user-provided labels or typed compiler specs plus registry metadata, emits a shallow
      reference_index.tsv plus flat references bundle, and must not create
      stale Construct or Folding workspaces
    - compiler specs may select solved cap or stem-base primitives only through
      public Snapback and scar-nick APIs, and multi-rank selectors must fail
      fast unless an explicit expansion contract is added
    - Retron MSD sequence materialization emits one MSD unit per design, with
      5-prime flank plus left base, payload primary, a user-selected
      cap/foldback segment, payload complement, right base plus 3-prime flank;
      snapback subsection annotations are emitted only when topology is supplied
    - Retron MSD materialization has no repeat-count flag and must not chain
      complete MSD units together
    - GenBank/structure-review output writes manifest/bundle/sequence_manifest.json,
      manifest/indexes/sequence_index.tsv, manifest/configs/composition/ configs,
      GenBank/FASTA/CSV sidecars, and secondary_structure.native.png plus
      composition_overview.svg and composition_overview.png plot deliverables,
      and must fail before placeholders when payload or cap sequences are absent
    - released-product Snapback is the active shortening architecture
    - scar-nick owns base-junction retained-scar feasibility and top-or-bottom terminal nick context
    - strict scar-nick policy is exact terminal nick, zero protected downstream bases, downstream N only, and S0=M
    - default released-product policy excludes FREQUENT_CUTTER nickases unless explicitly opted in for comparison
    - YIU remains mismatch-centric and contrast-only for this effort
    - retron notes are framing context rather than hidden scoring rules
    - preserved-site Snapback and released-product Snapback remain separate contracts
    - linear ssDNA composition is a generic Construct follow-up,
      not Cruncher primitive-package behavior
    - scar-nick source refs project only the four-base left/right basal spans
      into the final ssDNA product unless a future public contract explicitly
      selects more sequence
