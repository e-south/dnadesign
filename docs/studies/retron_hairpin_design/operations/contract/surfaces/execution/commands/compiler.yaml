msd_design_reference_lint:
  surface_type: command
  cwd_ref: repo:.
  argv:
  - uv
  - run
  - python
  - -m
  - dnadesign.studies.units.retron_hairpin_design.interfaces.cli.app
  - lint
  - --id
  - pES-retron-177-msd[TetR]; C172-LCGGG-RACAG-MXMX
  - --allow-non-ligatable-s0
  - --format
  - json
msd_design_reference_compile:
  surface_type: command
  cwd_ref: repo:.
  argv:
  - uv
  - run
  - python
  - -m
  - dnadesign.studies.units.retron_hairpin_design.interfaces.cli.app
  - compile
  - --input
  - docs/studies/retron_hairpin_design/compiler/inputs/msd_design_hit_labels.txt
  - --allow-non-ligatable-s0
  - --out-dir
  - /tmp/dnadesign_retron_msd_design_references
  - --format
  - json
