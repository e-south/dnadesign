version: 2
study_id: retron_hairpin_design
family: cruncher
title: Retron hairpin design effort

record_sources:
  narrative_ref: manifest:status.md
  datasets_ref: manifest:datasets.yaml
  pipeline_ref: manifest:pipeline.yaml
  campaign_ref: manifest:campaign.yaml
  routes_ref: manifest:routes.md

lifecycle:
  phase_order:
    - context_consolidation
    - scar_nick_base_junction_context
    - snapback_released_probe
    - snapback_released_solve
    - yiu_boundary_check
    - sequence_trace_followup
  current_phase:
    strategy: explicit
    id: snapback_released_solve

phases:
  - id: context_consolidation
    status: complete
    next_surface: manifest:status.md
  - id: scar_nick_base_junction_context
    status: complete
    next_surface: manifest:scar-nick-base-junction.md
  - id: snapback_released_probe
    status: complete
    next_surface: manifest:routes.md
  - id: snapback_released_solve
    status: in_progress
    next_surface: repo:src/dnadesign/cruncher/workspaces/de033/runbook.md
  - id: yiu_boundary_check
    status: planned
    next_surface: repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr/runbook.md
  - id: sequence_trace_followup
    status: planned
    next_surface: repo:src/dnadesign/cruncher/docs/dev/2026-04-19-retron-p4-hairpin-variant-audit.md

artifacts:
  status_note:
    artifact_type: file
    ref: manifest:status.md
  routes_doc:
    artifact_type: file
    ref: manifest:routes.md
  pipeline_doc:
    artifact_type: file
    ref: manifest:pipeline.yaml
  scar_nick_base_junction_note:
    artifact_type: file
    ref: manifest:scar-nick-base-junction.md
  snapback_released_runbook:
    artifact_type: file
    ref: repo:src/dnadesign/cruncher/workspaces/de033/runbook.md
  yiu_direct_spec:
    artifact_type: file
    ref: repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr/configs/yiu/tetr_teto2_wt_direct.yiu.yaml
  retron_context_note:
    artifact_type: file
    ref: repo:src/dnadesign/cruncher/docs/dev/2026-04-19-retron-p4-hairpin-variant-audit.md
  yiu_boundary_note:
    artifact_type: file
    ref: repo:src/dnadesign/cruncher/docs/dev/2026-04-19-retron-p4-hairpin-variant-audit.md

execution_surfaces:
  de033_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/de033
  demo_monotypic_tetr_workspace:
    surface_type: workspace
    workspace_ref: repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr
  snapback_released_target_search:
    surface_type: command
    cwd_ref: repo:src/dnadesign/cruncher/workspaces/de033
    argv:
      - uv
      - run
      - cruncher
      - snapback
      - released-target-search
      - --workspace-root
      - .
      - --nick-preset
      - neb_nicking_v1
      - --nick-additional-preset
      - thermo_nicking_v1
      - --release-preset
      - type_iis_release_v1
      - --nick-boundary
      - '0'
      - --paired-bp
      - '3'
      - --cap-nt
      - '3'
      - --json
  yiu_direct_validate:
    surface_type: command
    cwd_ref: repo:src/dnadesign/cruncher/workspaces/demo_monotypic_tetr
    argv:
      - uv
      - run
      - cruncher
      - yiu
      - validate
      - --spec
      - configs/yiu/tetr_teto2_wt_direct.yiu.yaml

snapshot:
  summary_scope: repo

preflight:
  default_scope: next
  scopes:
    next:
      include_phases: [current_phase]
    full:
      include_phases: [all]
  group_phase_bindings:
    study_record: context_consolidation
    snapback_workspace: snapback_released_probe
    snapback_probe: snapback_released_probe
    yiu_workspace: yiu_boundary_check
    yiu_validate: yiu_boundary_check
  checks:
    context_consolidation:
      - kind: path_exists
        check_id: study.status.present
        check_group: study_record
        summary: Study status note is present.
        required: true
        artifact: status_note
      - kind: path_exists
        check_id: study.routes.present
        check_group: study_record
        summary: Study route map is present.
        required: true
        artifact: routes_doc
      - kind: path_exists
        check_id: study.pipeline.present
        check_group: study_record
        summary: Study pipeline context is present.
        required: true
        artifact: pipeline_doc
      - kind: path_exists
        check_id: study.retron_context.present
        check_group: study_record
        summary: Retron context note is present.
        required: true
        artifact: retron_context_note
      - kind: path_exists
        check_id: study.scar_nick_base_junction.present
        check_group: study_record
        summary: Scar-nick base-junction context note is present.
        required: true
        artifact: scar_nick_base_junction_note
      - kind: path_exists
        check_id: study.yiu_boundary_note.present
        check_group: study_record
        summary: YIU boundary note is present.
        required: true
        artifact: yiu_boundary_note
    snapback_released_probe:
      - kind: workspace_layout
        check_id: de033.workspace
        check_group: snapback_workspace
        summary: de033 workspace is present.
        required: true
        surface: de033_workspace
      - kind: path_exists
        check_id: de033.runbook
        check_group: snapback_workspace
        summary: Released-product Snapback runbook is present.
        required: true
        artifact: snapback_released_runbook
      - kind: command
        check_id: de033.released_target_search
        check_group: snapback_probe
        summary: Released-product target-search probe completed.
        required: true
        surface: snapback_released_target_search
    yiu_boundary_check:
      - kind: workspace_layout
        check_id: demo_monotypic_tetr.workspace
        check_group: yiu_workspace
        summary: demo_monotypic_tetr workspace is present.
        required: true
        surface: demo_monotypic_tetr_workspace
      - kind: path_exists
        check_id: demo_monotypic_tetr.yiu_spec
        check_group: yiu_workspace
        summary: Direct TetR/TetO YIU spec is present.
        required: true
        artifact: yiu_direct_spec
      - kind: command
        check_id: demo_monotypic_tetr.yiu_validate
        check_group: yiu_validate
        summary: Direct TetR/TetO YIU validate completed.
        required: true
        surface: yiu_direct_validate
  next_scope:
    target_phase_groups:
      context_consolidation: [study_record]
      scar_nick_base_junction_context: [study_record]
      snapback_released_probe: [study_record, snapback_workspace, snapback_probe]
      snapback_released_solve: [study_record, snapback_workspace, snapback_probe]
      yiu_boundary_check: [study_record, yiu_workspace, yiu_validate]
      sequence_trace_followup: [study_record]
    runtime_phase_groups: []
    runtime_shared_groups: []
