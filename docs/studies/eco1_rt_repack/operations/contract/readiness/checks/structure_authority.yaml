checks:
  phase0_scaffold:
    - kind: path_exists
      check_id: eco1_rt.structure.sources_declared
      check_group: structure_authority
      summary: Candidate structure-source inventory is present before residue mapping.
      required: true
      artifact: structure_sources
    - kind: path_exists
      check_id: eco1_rt.structure.numbering_audit_declared
      check_group: structure_authority
      summary: Residue-numbering audit surface is present before mutable residues are accepted.
      required: true
      artifact: residue_numbering_audit
  phase1_thread_contract:
    - kind: path_exists
      check_id: eco1_rt.structure.authority_selected
      check_group: structure_authority
      summary: Phase 1 must resolve exact structure source, chain id, retained context, and numbering origin.
      required: true
      artifact: structure_sources
      validator_intent:
        state: selected
        required_non_pending_fields:
          - source_id
          - source_ref
          - rt_chain_id
          - retained_context_chains
          - residue_numbering_origin
          - reference_sequence_hash
    - kind: path_exists
      check_id: eco1_rt.structure.residue_map_required
      check_group: structure_authority
      summary: No sampling plan is valid until residue_map.parquet records every canonical Eco1 RT position.
      required: true
      artifact: planned_residue_map
      validator_intent:
        required_state: materialized
        reference_sequence_length: 320
        mapped_residue_count: 309
        rejects_pending_numbering: true
        rejects_unmapped_mutable_residues: true
    - kind: path_exists
      check_id: eco1_rt.structure.materialized_backbone_bundle
      check_group: structure_authority
      summary: Runtime artifact chain starts with a materialized backbone_bundle.yaml.
      required: true
      artifact: planned_backbone_bundle
      validator_intent:
        required_state: materialized
        required_hashes:
          - reference_sequence_hash
          - selected_structure_hash
