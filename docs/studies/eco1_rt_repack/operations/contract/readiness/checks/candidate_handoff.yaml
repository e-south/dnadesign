checks:
  phase1_thread_contract:
    - kind: path_exists
      check_id: eco1_rt.thread.candidate_handoff_schema
      check_group: candidate_handoff
      summary: Candidate handoff schema stub is present.
      required: true
      artifact: thread_candidate_handoff_schema
    - kind: path_exists
      check_id: eco1_rt.thread.artifact_chain_schema
      check_group: candidate_handoff
      summary: Artifact chain schema declares upstream hash closure before candidate handoff.
      required: true
      artifact: thread_artifact_chain_schema
    - kind: path_exists
      check_id: eco1_rt.thread.synthesis_feasibility_policy
      check_group: candidate_handoff
      summary: Synthesis feasibility policy is present before candidate handoff decisions.
      required: true
      artifact: synthesis_feasibility_policy
    - kind: path_exists
      check_id: eco1_rt.thread.fold_validation_policy
      check_group: candidate_handoff
      summary: Fold-validation policy is present before candidate selection.
      required: true
      artifact: fold_validation_policy
  phase2_real_backend_ingest:
    - kind: path_exists
      check_id: eco1_rt.thread.materialized_candidate_table
      check_group: candidate_handoff
      summary: Real backend ingest requires candidate_table.parquet before selected ids can be handed off.
      required: true
      artifact: planned_candidate_table
      validator_intent:
        required_state: materialized
        rejects_duplicate_candidate_ids: true
        rejects_mask_violations_for_selected: true
    - kind: path_exists
      check_id: eco1_rt.thread.materialized_candidate_handoff
      check_group: candidate_handoff
      summary: Real backend ingest requires candidate_handoff.yaml with selected candidate ids and upstream hashes.
      required: true
      artifact: planned_candidate_handoff
      validator_intent:
        required_state: materialized
        required_upstream_hashes:
          - eco1_rt_v1_profile
          - planned_backbone_bundle
          - planned_residue_map
          - planned_conservation_profile
          - planned_contact_profile
          - planned_mask_set
          - planned_thread_plan
          - planned_sample_table
          - planned_candidate_table
          - planned_foldcheck_report
          - planned_feasibility_report
        rejects_construct_subject_id: true
