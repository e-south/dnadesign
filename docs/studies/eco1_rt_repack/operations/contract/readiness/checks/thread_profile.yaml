checks:
  phase0_scaffold:
    - kind: path_exists
      check_id: eco1_rt.thread.profile_fixture
      check_group: thread_profile
      summary: Eco1 RT profile fixture is present.
      required: true
      artifact: eco1_rt_profile_fixture
    - kind: path_exists
      check_id: eco1_rt.thread.profile_schema
      check_group: thread_profile
      summary: Eco1 RT profile schema is present and names the required policy sections.
      required: true
      artifact: eco1_rt_profile_schema
    - kind: path_exists
      check_id: eco1_rt.thread.conservative_mask_cases
      check_group: thread_profile
      summary: Conservative mask pass/fail cases are present.
      required: true
      artifact: conservative_mask_cases
    - kind: path_exists
      check_id: eco1_rt.thread.residue_mask_policy
      check_group: thread_profile
      summary: Residue-mask policy context is present before sampling.
      required: true
      artifact: residue_mask_policy
    - kind: path_exists
      check_id: eco1_rt.thread.implementation_roadmap
      check_group: thread_profile
      summary: Implementation roadmap declares code homes, artifact order, and negative paths.
      required: true
      artifact: implementation_roadmap
