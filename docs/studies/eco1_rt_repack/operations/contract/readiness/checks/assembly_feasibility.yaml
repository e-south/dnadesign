checks:
  phase1_thread_contract:
    - kind: path_exists
      check_id: eco1_rt.assembly.policy_context
      check_group: assembly_feasibility
      summary: Synthesis feasibility policy declares full-gene, bounded-window, and sparse-recombination gates.
      required: true
      artifact: synthesis_feasibility_policy
    - kind: path_exists
      check_id: eco1_rt.assembly.artifact_chain_schema
      check_group: assembly_feasibility
      summary: Artifact chain schema declares feasibility_report fields and handoff dependency.
      required: true
      artifact: thread_artifact_chain_schema
  phase2_real_backend_ingest:
    - kind: path_exists
      check_id: eco1_rt.assembly.materialized_feasibility_report
      check_group: assembly_feasibility
      summary: Real backend ingest requires feasibility_report rows before candidate_handoff.yaml.
      required: true
      artifact: planned_feasibility_report
      validator_intent:
        required_state: materialized
        required_columns:
          - candidate_id
          - sequence_hash
          - parent_sequence_id
          - parent_sequence_hash
          - mutation_count_total
          - mutation_count_mutable_region
          - mutation_count_protected_region
          - protected_mutation_violation_count
          - protected_mutation_violations_json
          - mutation_windows_json
          - max_mutation_window_length
          - max_mutation_window_mutation_count
          - mutation_window_density_max
          - nearest_parent_id
          - nearest_parent_distance_aa
          - nearest_parent_distance_fraction
          - parent_haplotype_id
          - parent_haplotype_distance_aa
          - synthesis_tier
          - synthesis_blockers_json
          - codon_policy_id
          - sequence_complexity_flags_json
          - feasibility_status
          - feasibility_reason
          - feasibility_policy_id
          - input_candidate_table_hash
          - input_mask_policy_hash
          - input_foldcheck_report_hash
          - created_at_utc
          - created_by
        rejects_unvalidated_cartesian_recombination: true
        rejects_generic_thread_synthesis_economics: true
