version: 1
study_id: eco1_rt_repack
case_set_id: eco1_rt_conservative_mask_cases
status: scaffold
cases:
  - id: reject_pending_structure_authority_phase1
    expected: fail
    reason: Phase 1 contract validation must reject pending structure, chain, retained context, numbering origin, or sequence hash fields
  - id: reject_unmapped_mutable_residue
    expected: fail
    reason: every mutable residue must map to canonical Eco1 RT numbering
  - id: reject_protected_catalytic_residue
    expected: fail
    reason: catalytic residues are fixed in the conservative tier
  - id: reject_missing_contact_threshold
    expected: fail
    reason: contact-derived masks must declare distance thresholds
  - id: reject_missing_conservation_profile_hash
    expected: fail
    reason: conservation-derived masks must point to source profile hashes
  - id: reject_designable_from_missing_source
    expected: fail
    reason: missing evidence does not imply designability in the conservative tier
  - id: reject_fixture_foldcheck_for_materialized_handoff
    expected: fail
    reason: fixture fold-check rows cannot satisfy real candidate handoffs
  - id: reject_foldcheck_without_threshold_or_wt_baseline
    expected: fail
    reason: fold-check acceptance requires WT baseline artifact, runtime parameter hash, threshold id, and threshold values
  - id: reject_unvalidated_cartesian_recombination
    expected: fail
    reason: pooled-window recombination must preserve haplotype linkage or validate each full sequence
  - id: reject_candidate_handoff_without_hash_closure
    expected: fail
    reason: selected candidates must hash-link profile, residue map, mask set, plan, candidates, foldcheck, and feasibility artifacts
  - id: reject_downstream_construct_subject_preclaim
    expected: fail
    reason: RT-only handoffs cannot include construct-subject ids before downstream RT-lnRNA acceptance
  - id: accept_mapped_nonprotected_mutable_residue
    expected: pass
    reason: mapped, nonprotected residues can be sampled when all mask sources agree
  - id: accept_effector_interface_unfixed_when_not_retained
    expected: pass
    reason: effector-only interface residues are not automatically fixed when the profile does not retain the effector context
