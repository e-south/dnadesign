version: 1
schema_id: thread_artifact_chain_v1
status: scaffold
scope: study_local_until_thread_exists
artifact_order:
  - backbone_bundle
  - residue_map
  - conservation_profile
  - contact_profile
  - contact_geometry_profile
  - mask_set
  - thread_plan
  - proteinmpnn_request
  - sample_table
  - candidate_table
  - foldcheck_report
  - feasibility_report
  - candidate_handoff
shared_required_fields:
  - schema_id
  - schema_version
  - artifact_id
  - status
  - created_by
  - created_at
  - upstream_artifact_hashes
artifacts:
  backbone_bundle:
    required_fields:
      - structure_source_id
      - source_ref
      - source_format
      - source_hash
      - reference_sequence_hash
      - rt_chain_id
      - chain_inventory
      - retained_context_policy
      - residue_numbering_origin
      - upstream_artifact_hashes
  residue_map:
    required_columns:
      - canonical_position
      - wt_aa
      - structure_chain_id
      - structure_residue_id
      - pdb_insertion_code
      - cds_codon_index
      - design_position
      - mapping_status
      - mapping_issue
      - is_designable_initially
      - unresolved_policy
  conservation_profile:
    required_columns:
      - canonical_position
      - profile_id
      - non_gap_count
      - wt_frequency
      - plurality_aa
      - passes_threshold
      - source_hash
  contact_profile:
    required_columns:
      - canonical_position
      - retained_context_id
      - nearest_context_atom_distance_angstrom
      - contact_threshold_angstrom
      - passes_contact_mask
      - source_hash
    role: diagnostic_contact_review
  contact_geometry_profile:
    required_columns:
      - canonical_position
      - wt_aa
      - structure_chain_id
      - structure_residue_id
      - mapping_status
      - nearest_context_atom_distance_angstrom
      - nearest_sidechain_context_distance_angstrom
      - nearest_backbone_context_distance_angstrom
      - nearest_dna_distance_angstrom
      - nearest_rna_distance_angstrom
      - nearest_context_chain_id
      - nearest_context_molecule_type
      - nearest_context_atom_name
      - sidechain_atom_status
      - contact_atom_count_within_4a
      - contact_atom_count_within_6a
      - contact_atom_count_within_8a
      - contact_atom_count_within_10a
      - contact_atom_count_within_12a
      - contact_atom_count_within_15a
      - contact_atom_count_within_20a
      - retained_context_chain_count_within_8a
      - retained_context_chain_count_within_12a
      - retained_context_chain_count_within_15a
      - retained_context_chain_count_within_20a
    role: active_5a_mask_input
  mask_set:
    required_columns:
      - canonical_position
      - wt_aa
      - mapping_status
      - has_backbone_coordinates
      - min_distance_to_retained_dna_rna_angstrom
      - direct_contact_threshold_angstrom
      - direct_retained_dna_rna_contact_5a
      - motif_protected
      - wang_ec86_direct_contact_prior
      - evolutionarily_conserved_clade9_25pct_plurality
      - protected
      - non_fixed
      - non_fixed_missing_backbone
      - protection_reasons
      - conflict_status
      - conflict_reason
  thread_plan:
    required_fields:
      - backend_kind
      - backend_run_id
      - backend_request_manifest
      - request_hash
      - seed_set
      - temperature_schedule
      - fixed_position_source
      - expected_sample_count
      - fallback_policy
  proteinmpnn_request:
    required_fields:
      - request_hash
      - source_thread_plan
      - fixed_positions_jsonl
      - canonical_to_proteinmpnn_position
      - omit_aas
      - fallback_policy
      - sidecar_paths
  sample_table:
    required_columns:
      - sample_id
      - backend_kind
      - backend_run_id
      - seed
      - temperature
      - sequence_hash
      - request_hash
      - backend_result_hash
      - backend_score
      - status
  candidate_table:
    required_columns:
      - candidate_id
      - sequence_hash
      - parent_sample_ids
      - mutation_count
      - mutation_list
      - mutation_windows
      - mask_violation_count
      - rank
      - status
  foldcheck_report:
    required_columns:
      - candidate_id
      - runtime_kind
      - runtime_version
      - input_sequence_hash
      - reference_structure_id
      - wt_baseline_artifact_id
      - runtime_parameters_hash
      - threshold_id
      - threshold_values
      - plddt
      - pae_summary
      - wt_runtime_ca_rmsd
      - cryoem_mapped_ca_rmsd
      - cryoem_mapped_ca_rmsd_status
      - protected_contact_retention
      - status
      - rejection_reason
      - missing_metric_reason
  feasibility_report:
    required_columns:
      - candidate_id
      - sequence_hash
      - parent_sequence_id
      - parent_sequence_hash
      - mutation_count_total
      - mutation_count_mutable_region
      - mutation_count_protected_region
      - protected_mutation_violation_count
      - protected_mutation_violations_json
      - mutation_windows_json
      - max_mutation_window_length
      - max_mutation_window_mutation_count
      - mutation_window_density_max
      - nearest_parent_id
      - nearest_parent_distance_aa
      - nearest_parent_distance_fraction
      - parent_haplotype_id
      - parent_haplotype_distance_aa
      - synthesis_tier
      - synthesis_blockers_json
      - codon_policy_id
      - sequence_complexity_flags_json
      - feasibility_status
      - feasibility_reason
      - feasibility_policy_id
      - input_candidate_table_hash
      - input_mask_policy_hash
      - input_foldcheck_report_hash
      - created_at_utc
      - created_by
  candidate_handoff:
    required_fields:
      - handoff_id
      - handoff_kind
      - study_id
      - subject_kind
      - construct_subject_created
      - downstream_acceptance_required
      - source_artifacts
      - selection_policy
      - candidates
invariants:
  - artifact_order_is_linear_for_current_readiness_path
  - every_downstream_artifact_hashes_all_required_upstream_artifacts
  - candidate_handoff_hashes_backbone_residue_map_evidence_mask_plan_samples_candidates_foldcheck_feasibility_selection
  - candidate_handoff_is_rt_only_until_downstream_acceptance
  - fallback_policy_must_be_explicit_no_fallback_for_sampling
  - fixture_artifacts_cannot_satisfy_materialized_handoff
  - missing_metrics_require_reason_fields
  - no_candidate_handoff_without_foldcheck_and_feasibility_reports
