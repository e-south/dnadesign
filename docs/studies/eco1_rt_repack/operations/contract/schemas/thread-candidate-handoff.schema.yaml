version: 1
schema_id: thread_candidate_handoff_v1
status: scaffold
required_fields:
  - schema_id
  - schema_version
  - handoff_id
  - source_study_id
  - profile_id
  - design_set_id
  - candidate_table
  - foldcheck_report
  - feasibility_report
  - upstream_artifact_hashes
  - selected_candidate_ids
  - downstream_target
  - acceptance_summary
field_contract:
  root:
    required:
      - schema_id
      - schema_version
      - handoff_id
      - source_study_id
      - profile_id
      - design_set_id
      - candidate_table
      - foldcheck_report
      - feasibility_report
      - upstream_artifact_hashes
      - selected_candidate_ids
      - downstream_target
      - acceptance_summary
  candidate_table:
    required_columns:
      - candidate_id
      - sequence_hash
      - parent_sample_ids
      - mutation_count
      - mutation_list
      - mutation_windows
      - mask_violation_count
      - backend_kind
      - backend_run_id
      - rank
      - status
  foldcheck_report:
    required_columns:
      - candidate_id
      - runtime_kind
      - runtime_version
      - input_sequence_hash
      - reference_structure_id
      - wt_baseline_artifact_id
      - runtime_parameters_hash
      - threshold_id
      - threshold_values
      - plddt
      - pae_summary
      - backbone_rmsd_to_reference
      - protected_contact_retention
      - status
      - rejection_reason
      - missing_metric_reason
  feasibility_report:
    required_columns:
      - candidate_id
      - full_sequence_hash
      - mutation_count
      - mutation_windows
      - window_ids
      - window_haplotype_ids
      - nearest_parent_candidate_id
      - distance_to_nearest_parent
      - structural_coupling_flags
      - recommended_synthesis_tier
      - rejection_reason
invariants:
  - selected_candidate_ids_must_exist_in_candidate_table
  - selected_candidate_ids_must_have_zero_mask_violations
  - selected_candidate_ids_must_have_nonfixture_foldcheck_acceptance
  - selected_candidate_ids_must_have_full_sequence_feasibility_rows
  - upstream_artifact_hashes_must_cover_profile_backbone_residue_map_evidence_mask_plan_samples_candidates_foldcheck_feasibility
  - downstream_target_must_not_claim_construct_subject_before_downstream_acceptance
  - downstream_target_must_reference_rt_lnrna_candidate_acceptance_schema_or_successor
forbidden_fields:
  - permuter__var_id
  - construct_subject_id
notes:
  - This is a study-local schema stub until a reusable `thread` package owns the neutral contract.
  - The handoff is RT-only candidate evidence; downstream construct semantics remain out of scope.
