version: 1
study_id: eco1_rt_repack
status: selected
preprocessing_id: ec86_7v9u_protomer1_preprocessing_v1
raw_structure:
  source_ref: pdb:7v9u
  structure_format: mmcif
  assembly_state: cryo_em_dimer_complex
  cache_status: not_cached_in_dnadesign
  source_note: Raw RCSB 7V9U is a dimeric Ec86 RT-msDNA-msrRNA complex; this study consumes the selected ec86kit protomer-1 model as the hash-pinned preprocessed structure authority.
selected_protomer:
  source_id: ec86kit_7v9u_protomer1
  protomer_id: 1
  preprocessing_authority: ec86kit_manifest_2025-10-09T17-47-31Z
  preprocessing_backend: ec86kit_chimerax_pipeline
  selection_method: heavy_atom_contact_autopair_then_keep_protomer_1
  rt_chain_id: A
  retained_context_chains:
    - D
    - E
    - F
  excluded_context:
    - ec86kit_protomer2_assignment
  retained_context_policy: rt_with_msdna_msrna_no_effector
design_objectives:
  preserve_monomeric_rt_msdna_msrna_context: true
  preserve_paired_protomer_dimerization: false
  paired_protomer_interface_policy: not_mask_authoritative_unless_retained_context_manual_or_conserved
  pre_rt1_policy: Alpha-1 and other pre-RT1 residues may be designable when they pass retained RNA/DNA contact, manual-mask, and MSA conservation gates; dimerization loss is not a blocking objective for this study.
chain_inventory:
  - chain_id: A
    molecule_type: protein
    biological_role: Eco1 reverse transcriptase
    thread_role: design_backbone
    retention: retained
  - chain_id: D
    molecule_type: dna
    biological_role: msDNA context
    thread_role: retained_context
    retention: retained
  - chain_id: E
    molecule_type: rna
    biological_role: msrRNA context
    thread_role: retained_context
    retention: retained
  - chain_id: F
    molecule_type: rna
    biological_role: msrRNA context
    thread_role: retained_context
    retention: retained
upstream_refs:
  structure_sources_ref: docs/studies/eco1_rt_repack/workbench/provenance/structure-sources.yaml
  residue_numbering_policy_ref: docs/studies/eco1_rt_repack/workbench/provenance/residue-numbering-policy.yaml
  ec86kit_manifest_ref: sibling:../ec86kit/out/ec86_prot1/runs/2025-10-09T17-47-31Z/manifest.json
  ec86kit_model_ref: sibling:../ec86kit/out/ec86_prot1/runs/2025-10-09T17-47-31Z/artifacts/ec86_prot1_model.cif
acceptance_rules:
  selected_chain_inventory_must_match_backbone_bundle: true
  raw_dimer_source_must_remain_provenance_not_design_numbering: true
  residue_positions_must_join_through_residue_map: true
  no_sampling_from_raw_pdb_residue_ids: true
