    note: Broad retron RT clade work uses MAFFT/HMMER-derived RT0-RT7 alignments and labels region X/Y motif context.
  - id: eco1_rt_v1_profile_manual_mask_anchors
    note: Checked-in Eco1 profile declares YADD, RT1-RT7, retron X, and retron Y as hard manual mask classes.
notes:
