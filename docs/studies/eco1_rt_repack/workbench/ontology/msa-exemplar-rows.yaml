schema_id: dnadesign.aligner.msa.visualization.exemplar_rows
schema_version: 1
study_id: eco1_rt_repack
status: first_pass_display_exemplars
source_basis:
  - id: simon_et_al_2019_supplement_fig_s2
    note: Small validated retron RT MSA uses visible exemplar rows to ground conserved RT and retron-specific motif markings.
  - id: mestre_et_al_2020_s1_ii_a3_cluster_42_1
    note: Eco1-like rows come from the declared Mestre II-A3 cluster/domain 42_1 source group.
notes:
  - Exemplar rows are display context only; they do not change conservation counts, mask membership, or designability.
  - This first-pass set is not a phylogenetically optimized representative panel.
  - Keep broad and Eco1-like profile record ids explicit because source rows differ by profile prefix.
  - Simon-style cross-family references such as RT-Mxa1, RT-Sen2, Group II RT-RI, and DGR bRT are not rendered from the current Eco1-like alignment because they require a separate declared cross-family FASTA source bundle.
hallmark_reference_gap:
  status: deferred_to_cross_family_reference_bundle
  reason: The current source contract materializes broad retron RT and Eco1-like retron RT profiles for conservation masking; non-retron RT controls would be display references, not conservation evidence.
  examples_from_simon_style_figures:
    - RT-Eco1
    - RT-Mxa1
    - RT-Sen2
    - Group II RT-RI
    - DGR bRT
