schema_id: dnadesign.aligner.msa.visualization.panel_spec
schema_version: 1
study_id: eco1_rt_repack
status: full_alignment_audit_panel_spec
coordinate_space: target_ungapped_position
source_basis:
  - id: simon_et_al_2019_supplement_fig_s2
    note: Validated retron RT alignment figures show selected named rows with visible gaps and motif/region boxes.
  - id: mestre_et_al_2020_fig2_and_rt0_rt7_context
    note: Retron classification figures combine representative rows, RT-region overlays, and consensus/histogram-style summaries.
display_columns:
  coordinate_space: target_ungapped_position
  high_gap_trim_threshold: 0.9
  trim_policy: display_only_not_scoring
  note: High-gap trimming is declared for publication display only; conservation scoring must use the untrimmed accepted aligned FASTA.
overview:
  enabled: true
  row_source: all_records
  max_display_rows: all
  row_source_note: Whole-alignment overview renders every accepted aligned FASTA record; exemplar rows are used only for motif-window panels.
  note: Full-row display is an audit surface only. It does not change the conservation denominator, plurality calls, or mask membership.
consensus_histogram:
  enabled: true
  metric: plurality_frequency_and_gap_fraction_by_target_position
  note: Histogram is a visual audit of accepted aligned FASTA records, not a replacement for conservation_profile.parquet.
sidecar_note: Visualization sidecar only; not a conservation denominator, mask source, or designability rule.
profiles:
  ec86_clade9_conservation_v1:
    group: Mestre clade 9
    target_label: Eco1/Ec86 reference
    label_template: "c9 node {node} {accession}"
    label_max_chars: 48
    source_manifest_path: src/dnadesign/studies/units/eco1_rt_repack/workspaces/eco1_rt_conservative_v1/outputs/thread/conservation_sources/ec86_clade9_conservation_v1.source_manifest.yaml
  ec86_iia3_cluster42_1_conservation_v1:
    group: Mestre II-A3/42_1
    target_label: Eco1/Ec86 reference
    label_template: "II-A3/42_1 node {node} {accession}"
    label_max_chars: 56
    source_manifest_path: src/dnadesign/studies/units/eco1_rt_repack/workspaces/eco1_rt_conservative_v1/outputs/thread/conservation_sources/ec86_iia3_cluster42_1_conservation_v1.source_manifest.yaml
notes:
  - The current RT annotation track contains audited RT1-RT7 intervals and motif anchors: NAxxH, YADD, and VTG.
  - Any future publication panel may add or revise interval boxes only through the ontology surfaces, not renderer code.
