$schema: https://json-schema.org/draft/2020-12/schema
$id: rt_lnrna_reporter_response_profile.v3
title: RT-lnRNA reporter-response profile
description: >-
  Exact study-owned contract for descriptive, dose-wise reporter response and
  relative OD. It preserves Reader-derived measurement summaries, explicit
  control pairing, and immutable provenance without reducing the profile to a
  preference value.
type: object
additionalProperties: false
required:
  - contract_id
  - study_id
  - profile_id
  - subject_id
  - provenance
  - observation_policy
  - reduction
  - dose_grid_uM
  - measurements
  - pairing_policy
  - dose_responses
  - dose_uncertainties
  - comparability_key
  - eligibility
properties:
  contract_id:
    const: rt_lnrna_reporter_response_profile.v3
  study_id:
    const: rt_lnrna_sponging_construct_triage
  profile_id:
    $ref: '#/$defs/non_empty_string'
  subject_id:
    $ref: '#/$defs/non_empty_string'
  provenance:
    $ref: '#/$defs/provenance'
  observation_policy:
    $ref: '#/$defs/observation_policy'
  reduction:
    oneOf:
      - $ref: '#/$defs/endpoint_reduction'
      - $ref: '#/$defs/time_window_reduction'
  dose_grid_uM:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: number
      exclusiveMinimum: 0
    description: Strictly increasing dose order; runtime validation enforces order.
  measurements:
    type: array
    minItems: 3
    items:
      $ref: '#/$defs/condition_measurement'
  pairing_policy:
    $ref: '#/$defs/pairing_policy'
  dose_responses:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/dose_response'
  dose_uncertainties:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/dose_uncertainty'
  comparability_key:
    $ref: '#/$defs/sha256_digest'
    description: >-
      SHA-256 of canonical policy identity, including declared biological-replicate
      uncertainty thresholds and methods, pairing kind, within-acquisition and
      biological-replicate reduction semantics, reduction window or endpoint, and
      ordered dose grid. Cross-profile aggregation requires exact equality.
  eligibility:
    $ref: '#/$defs/eligibility'
$defs:
  non_empty_string:
    type: string
    minLength: 1
    pattern: '.*\S.*'
  sha256_digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  positive_integer:
    type: integer
    minimum: 1
  outputs_relative_path:
    allOf:
      - $ref: '#/$defs/non_empty_string'
      - pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$'
  provenance:
    type: object
    additionalProperties: false
    anyOf:
      - properties:
          raw_design_id:
            $ref: '#/$defs/non_empty_string'
      - properties:
          raw_assay_subject_id:
            $ref: '#/$defs/non_empty_string'
    required:
      - raw_design_id
      - raw_assay_subject_id
      - reader_experiment_id
      - reader_protocol_id
      - reader_record_id
      - reader_record_kind
      - reader_record_revision
      - reader_record_revision_digest
      - reader_record_content_digest
      - reader_record_schema_version
      - reader_record_contract_id
      - reader_record_path
      - evidence_binding_artifact_id
      - evidence_binding_artifact_digest
    properties:
      raw_design_id:
        anyOf:
          - $ref: '#/$defs/non_empty_string'
          - type: 'null'
      raw_assay_subject_id:
        anyOf:
          - $ref: '#/$defs/non_empty_string'
          - type: 'null'
      reader_experiment_id:
        $ref: '#/$defs/non_empty_string'
      reader_protocol_id:
        $ref: '#/$defs/non_empty_string'
      reader_record_id:
        $ref: '#/$defs/non_empty_string'
      reader_record_kind:
        const: dataframe_artifact
      reader_record_revision:
        $ref: '#/$defs/positive_integer'
      reader_record_revision_digest:
        $ref: '#/$defs/sha256_digest'
      reader_record_content_digest:
        $ref: '#/$defs/sha256_digest'
      reader_record_schema_version:
        const: 6
      reader_record_contract_id:
        $ref: '#/$defs/non_empty_string'
      reader_record_path:
        $ref: '#/$defs/outputs_relative_path'
      evidence_binding_artifact_id:
        $ref: '#/$defs/non_empty_string'
      evidence_binding_artifact_digest:
        $ref: '#/$defs/sha256_digest'
  observation_policy:
    type: object
    additionalProperties: false
    required:
      - policy_id
      - pairing_kind
      - within_acquisition_reduction_statistic
      - biological_replicate_uncertainty_policy
      - contract_id
      - normalized_reporter_formula
      - relative_od_formula
      - clipping_policy
      - digest
    properties:
      policy_id:
        $ref: '#/$defs/non_empty_string'
      pairing_kind:
        enum:
          - paired_by_design
          - pooled_controls_by_design
      within_acquisition_reduction_statistic:
        const: median
      biological_replicate_uncertainty_policy:
        $ref: '#/$defs/uncertainty_policy'
      contract_id:
        const: rt_lnrna_reporter_response_observation_policy.v3
      normalized_reporter_formula:
        const: (Z_d-Z_0)/(Z_positive-Z_0)
      relative_od_formula:
        const: OD600_d/OD600_0
      clipping_policy:
        const: forbidden
      digest:
        $ref: '#/$defs/sha256_digest'
  endpoint_reduction:
    type: object
    additionalProperties: false
    required:
      - recorded_time_h
      - estimated_elapsed_time_h
      - ratio_reduction_order
      - expected_cadence_h
      - temporal_policy
      - kind
    properties:
      recorded_time_h:
        type: number
        minimum: 0
      estimated_elapsed_time_h:
        oneOf:
          - type: number
            minimum: 0
          - type: 'null'
      ratio_reduction_order:
        const: reduce_channels_then_ratio
      expected_cadence_h:
        type: number
        exclusiveMinimum: 0
        description: Expected source sampling cadence recorded with the endpoint reduction.
      temporal_policy:
        $ref: '#/$defs/temporal_policy'
      kind:
        const: endpoint
  time_window_reduction:
    type: object
    additionalProperties: false
    required:
      - recorded_start_time_h
      - recorded_end_time_h
      - summary_statistic
      - ratio_reduction_order
      - estimated_elapsed_start_h
      - estimated_elapsed_end_h
      - expected_cadence_h
      - temporal_policy
      - kind
    properties:
      recorded_start_time_h:
        type: number
        minimum: 0
      recorded_end_time_h:
        type: number
        minimum: 0
      summary_statistic:
        const: median
      ratio_reduction_order:
        const: ratio_then_reduce
      estimated_elapsed_start_h:
        oneOf:
          - type: number
            minimum: 0
          - type: 'null'
      estimated_elapsed_end_h:
        oneOf:
          - type: number
            minimum: 0
          - type: 'null'
      expected_cadence_h:
        type: number
        exclusiveMinimum: 0
        description: Expected source sampling cadence from which interval support is derived.
      temporal_policy:
        $ref: '#/$defs/temporal_policy'
      kind:
        const: time_window
    oneOf:
      - properties:
          estimated_elapsed_start_h:
            type: 'null'
          estimated_elapsed_end_h:
            type: 'null'
      - properties:
          estimated_elapsed_start_h:
            type: number
            minimum: 0
          estimated_elapsed_end_h:
            type: number
            minimum: 0
  temporal_policy:
    type: object
    additionalProperties: false
    required:
      - selection
      - method
      - output_space
      - support
      - digest
    properties:
      selection:
        oneOf:
          - $ref: '#/$defs/endpoint_temporal_selection'
          - $ref: '#/$defs/interval_temporal_selection'
      method:
        enum: [identity, observed_median]
      output_space:
        const: linear
      support:
        $ref: '#/$defs/temporal_support'
      digest:
        $ref: '#/$defs/sha256_digest'
  endpoint_temporal_selection:
    type: object
    additionalProperties: false
    required: [time_h, kind, time_basis, mode, tolerance_h]
    properties:
      time_h:
        type: number
        minimum: 0
      kind:
        const: endpoint
      time_basis:
        const: absolute
      mode:
        const: exact
      tolerance_h:
        const: 0.0
  interval_temporal_selection:
    type: object
    additionalProperties: false
    required: [start_h, end_h, kind, time_basis, boundary]
    properties:
      start_h:
        type: number
        minimum: 0
      end_h:
        type: number
        minimum: 0
      kind:
        const: interval
      time_basis:
        const: absolute
      boundary:
        const: inclusive
  temporal_support:
    type: object
    additionalProperties: false
    required:
      - boundary_support
      - minimum_observations
      - maximum_interior_gap_h
      - positive_floor
      - positive_value_scope
      - censored_values
    properties:
      boundary_support:
        enum: [none, observed]
      minimum_observations:
        type: integer
        minimum: 1
      maximum_interior_gap_h:
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
      positive_floor:
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
      positive_value_scope:
        enum: [selected_support, entire_trace]
      censored_values:
        enum: [allow, reject]
  condition_measurement:
    type: object
    additionalProperties: false
    required:
      - observation_id
      - condition_id
      - source_condition_value
      - role
      - dose_uM
      - biological_replicate_id
      - acquisition_id
      - within_acquisition_observation_count
      - within_acquisition_reduction_statistic
      - rfp
      - od600
      - rfp_over_od600
    properties:
      observation_id:
        $ref: '#/$defs/non_empty_string'
      condition_id:
        $ref: '#/$defs/non_empty_string'
      source_condition_value:
        $ref: '#/$defs/non_empty_string'
      role:
        enum:
          - baseline
          - positive_control
          - dose
      dose_uM:
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - type: 'null'
      biological_replicate_id:
        oneOf:
          - $ref: '#/$defs/non_empty_string'
          - type: 'null'
      acquisition_id:
        $ref: '#/$defs/non_empty_string'
      within_acquisition_observation_count:
        $ref: '#/$defs/positive_integer'
      within_acquisition_reduction_statistic:
        const: median
      rfp:
        type: number
      od600:
        type: number
        exclusiveMinimum: 0
      rfp_over_od600:
        type: number
        description: >-
          For endpoint and reduce_channels_then_ratio summaries, runtime
          validation requires equality to rfp / od600 within numerical
          tolerance. For ratio_then_reduce windows, this is the independently
          reduced per-observation ratio and need not equal the ratio of the
          separately reduced channel summaries.
    allOf:
      - if:
          properties:
            role:
              const: dose
          required:
            - role
        then:
          properties:
            dose_uM:
              type: number
              exclusiveMinimum: 0
        else:
          properties:
            dose_uM:
              type: 'null'
  control_assignment:
    type: object
    additionalProperties: false
    required:
      - dose_observation_id
      - baseline_observation_ids
      - positive_control_observation_ids
    properties:
      dose_observation_id:
        $ref: '#/$defs/non_empty_string'
      baseline_observation_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/non_empty_string'
      positive_control_observation_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/non_empty_string'
  pairing_policy:
    type: object
    additionalProperties: false
    required:
      - kind
      - assignments
    properties:
      kind:
        enum:
          - paired_by_design
          - pooled_controls_by_design
      assignments:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/control_assignment'
    allOf:
      - if:
          properties:
            kind:
              const: paired_by_design
          required:
            - kind
        then:
          properties:
            assignments:
              items:
                allOf:
                  - $ref: '#/$defs/control_assignment'
                  - properties:
                      baseline_observation_ids:
                        maxItems: 1
                      positive_control_observation_ids:
                        maxItems: 1
  dose_response:
    type: object
    additionalProperties: false
    required:
      - dose_uM
      - dose_observation_id
      - biological_replicate_id
      - acquisition_id
      - baseline_observation_ids
      - positive_control_observation_ids
      - normalized_reporter_response
      - relative_od
    properties:
      dose_uM:
        type: number
        exclusiveMinimum: 0
      dose_observation_id:
        $ref: '#/$defs/non_empty_string'
      biological_replicate_id:
        oneOf:
          - $ref: '#/$defs/non_empty_string'
          - type: 'null'
      acquisition_id:
        $ref: '#/$defs/non_empty_string'
      baseline_observation_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/non_empty_string'
      positive_control_observation_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/non_empty_string'
      normalized_reporter_response:
        type: number
        description: Unbounded D = (Z_d - Z_0) / (Z_positive - Z_0).
      relative_od:
        type: number
        minimum: 0
        description: Uncapped G = OD600_d / OD600_0.
  uncertainty_policy:
    type: object
    additionalProperties: false
    required:
      - minimum_biological_replicates
      - biological_replicate_reduction_statistic
    properties:
      minimum_biological_replicates:
        type: integer
        minimum: 2
      biological_replicate_reduction_statistic:
        enum:
          - median
          - mean
  estimated_metric_uncertainty:
    type: object
    additionalProperties: false
    required:
      - estimate
      - interval_lower
      - interval_upper
      - confidence_level
      - method
      - resampling_unit
      - draws
      - status
    properties:
      estimate:
        type: number
      interval_lower:
        type: number
      interval_upper:
        type: number
      confidence_level:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      method:
        $ref: '#/$defs/non_empty_string'
      resampling_unit:
        enum:
          - biological_replicate
          - paired_biological_replicate
      draws:
        $ref: '#/$defs/positive_integer'
      status:
        const: estimated
  not_estimable_metric_uncertainty:
    type: object
    additionalProperties: false
    required:
      - estimate
      - reason
      - status
    properties:
      estimate:
        type: number
      reason:
        enum:
          - biological_replicate_identity_unknown
          - below_minimum_biological_replicates
          - insufficient_valid_resamples
      status:
        const: not_estimable
  metric_uncertainty:
    oneOf:
      - $ref: '#/$defs/estimated_metric_uncertainty'
      - $ref: '#/$defs/not_estimable_metric_uncertainty'
  dose_uncertainty:
    type: object
    additionalProperties: false
    required:
      - dose_uM
      - biological_replicate_count
      - normalized_reporter_response
      - relative_od
    properties:
      dose_uM:
        type: number
        exclusiveMinimum: 0
      biological_replicate_count:
        type: integer
        minimum: 0
      normalized_reporter_response:
        $ref: '#/$defs/metric_uncertainty'
      relative_od:
        allOf:
          - $ref: '#/$defs/metric_uncertainty'
          - properties:
              estimate:
                type: number
                minimum: 0
  eligibility:
    type: object
    additionalProperties: false
    required:
      - evidence_use
      - optimization_status
      - reasons
    properties:
      evidence_use:
        const: descriptive
      optimization_status:
        const: ineligible
      reasons:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/non_empty_string'
