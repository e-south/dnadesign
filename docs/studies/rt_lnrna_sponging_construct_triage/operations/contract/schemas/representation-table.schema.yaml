  label_status: blocked_until_sponging_assay_observations
source_overlay_inputs:
  - reference_overlay_id: khan_cross_retron_rt_dna_abundance_v1
    source_role: khan_abundance_prior_overlay
    integration_mode: abundance_prior_overlay
    allowed_as_opal_y: false
    join_basis: maps_to_reference_record_id
    required_numeric_fields:
      - raw_value
      - normalized_value
    notes: Preserve ordinal_bin as metadata only; numeric scale is source-scoped to Khan RT-DNA abundance.
  - reference_overlay_id: crawford_eco1_lnrna_msd_abundance_v1
    source_role: crawford_eco1_ncrna_abundance_observations
    integration_mode: abundance_prior_overlay
    allowed_as_opal_y: false
    join_basis: canonical_lnrna_sequence_id
    required_numeric_fields:
      - raw_value
      - normalized_value
    notes: Source abundance observations are not TF-sponging labels; numeric scale is source-scoped to Crawford Eco1 msDNA abundance.
  - reference_overlay_id: crawford_eco1_lnrna_msd_design_reference_v1
    source_role: crawford_eco1_lnrna_msd_design_references
    integration_mode: candidate_sequence_reference
    allowed_as_opal_y: false
    join_basis: lnrna_design_id
    required_sequence_fields:
      - lnrna_sequence
      - msr_sequence
      - msd_sequence
    notes: Rows require explicit RT plus lnRNA authority and affiliated abundance observation before Crawford construct promotion.
  - reference_overlay_id: reader_spop_endpoint_dose_mean_v1
    source_role: reader_spop_label_plan
    integration_mode: sponging_assay_observation
    allowed_as_opal_y: true
    allowed_as_latentdna_overlay: true
    join_basis: construct_subject_id
    required_numeric_fields:
      - raw_value
      - normalized_value
    notes: Reader SPOP is source-scoped to reader_experiment_normalized_tf_sponging and is not numerically comparable to Khan or Crawford abundance priors.
construct_subject_promotion:
  source_dataset: rt_lnrna_sponging_construct_triage_construct_slot_inputs_v1
  consolidated_construct_dataset: rt_lnrna_sponging_construct_triage_construct_contexts_2000bp_v1
  required_sequence_fields:
    - construct_subject__lnrna_sequence
    - construct_subject__rt_cds_sequence
  required_construct_views:
    - dual_cassette_2000bp_seq_mean
    - dual_cassette_2000bp_reverse_complement_seq_mean
    - lnrna_span_in_construct_anchor_mean
    - lnrna_span_in_construct_reverse_complement_anchor_mean
    - rt_cds_span_in_construct_anchor_mean
    - rt_cds_span_in_construct_reverse_complement_anchor_mean
  requires_explicit_rt_plus_lnrna_authority: true
  forbid_overlay_only_infer_rows: true
  notes: >-
    Khan and Crawford rows may color or ordinally audit latent views only after
    a resolver promotes them to construct-compatible construct subject rows
    with both lnRNA and RT CDS sequences. Crawford promotion requires an
    abundance-affiliated sequence and orientation QC; design-reference-only rows
    remain source provenance. Khan promotion requires explicit RT CDS DNA
    sequence authority.
    Promoted rows must enter the same Construct input dataset, consolidated
    2,000 bp Construct output dataset, and six Infer source-view lanes as the
    first-class GenBank catalog rows.
p4_stem_appendix_gate:
  status: blocked_until_construct_subject_owned_subspan_table
  required_schema: construct_subject_owned_lnrna_subspan_table_v1
  required_fields:
    - construct_subject_id
    - parent_view_name
    - subspan_id
    - subspan_kind
    - coordinate_basis
    - forward_span_0
    - reverse_complement_span_0
    - source_ref
    - confidence
