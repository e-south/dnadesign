schema_id: construct_projection_manifest_v1
study_id: rt_lnrna_sponging_construct_triage
purpose: Bind source-authority RT/lnRNA construct subject rows to Construct named slots before runtime materialization.
required_top_level_fields:
  manifest_id: string
  study_id: rt_lnrna_sponging_construct_triage
  construct_contract: dual_cassette_rt_lnrna_expression_v1
  representation_contract: dual_cassette_construct_context_embedding_v1
  strategy.strategy_id: construct_multi_slot_assembly_v1
  construct_template.construct_template_id: string
  construct_template.plasmid_context_source_id: string
  construct_template.target_context_source_id: string
  construct_template.target_context.length_nt: integer
  construct_template.target_context.coordinate_basis: zero_based_half_open
  construct_template.target_context.window_start_0: 56
  construct_template.target_context.window_end_0: 2056
  slots: list
  representation_views: list
  candidates: list
slot_contract:
  required_slot_ids:
    - lnrna
    - rt_cds
  required_fields:
    slot_id: string
    role: string
    sequence_field: string
    required: boolean
    template_span_0: zero_based_half_open_span
    placement_kind: controlled_string
    orientation: controlled_string
    guard.source_feature: string
    guard.replaced_span_bp: integer
candidate_slot_binding_contract:
  required_fields:
    construct_subject_id: string
    construct_projection_status: controlled_string
    slot_bindings.lnrna.sequence_id: string
    slot_bindings.lnrna.sequence_length_nt: integer
    slot_bindings.rt_cds.sequence_id: string
    slot_bindings.rt_cds.sequence_length_nt: integer
    emitted_slot_spans_0.lnrna: zero_based_half_open_span
    emitted_slot_spans_0.rt_cds: zero_based_half_open_span
    construct_context_view_declarations: list_string
representation_view_contract:
  required_fields:
    view_name: string
    product_kind: realized_context
    orientation: controlled_string
    pooling_operation: controlled_string
    required_slots: list_string
    construct_output_anchor_part: string_or_null
    anchor_window_size_bp: integer_or_null
    anchor_window_policy: string_or_null
  slot_pooling_rule: The lnRNA and RT CDS anchor-mean views map pooling_slot to Construct output_variants[].anchor_part for the same named slot and emit fixed-length pooling windows.
  transform_rule: Construct source views must not declare pre-Infer concat transforms; LatentDNA owns post-inference derived concat aliases.
  required_view_names:
    - dual_cassette_2000bp_seq_mean
    - dual_cassette_2000bp_reverse_complement_seq_mean
    - lnrna_fixed_384bp_window_in_construct_anchor_mean
    - lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean
    - rt_cds_fixed_1600bp_window_in_construct_anchor_mean
    - rt_cds_fixed_1600bp_window_in_construct_reverse_complement_anchor_mean
controlled_values:
  strategy_id:
    - construct_multi_slot_assembly_v1
  construct_projection_status:
    - representable
    - not_representable_too_long
    - not_representable_missing_constant
    - not_representable_invalid_sequence
    - not_representable_unresolved_slot
  placement_kind:
    - replace
    - insert
  orientation:
    - forward
    - reverse_complement
future_input_normalization:
  rule: Every future GenBank, compiler, Crawford, or Khan-derived candidate source must normalize into the same slot_binding shape before Construct placement.
  genbank_inputs: Parse through GenBank source authority and require unambiguous feature spans.
  msd_compiler_outputs: Require materialized sequence plus feature map; labels alone are not projectable.
  crawford_design_rows: May provide Eco1 lnRNA/MSD provenance only after projection-compatible feature mapping.
  khan_rows: Remain abundance/provenance overlays unless ncRNA sequence, RT CDS DNA sequence, affiliated abundance, and lane fit are all resolved.
validation_notes:
  - Reject precomposed single-anchor strategy ids.
  - Use `2000bp-region.gb`, mapped to pES-retron-26 `[56,2056)`, as the
    target context authority.
  - "The retron26 fixture region-relative spans are `lnrna: [130,303)` and `rt_cds: [468,1431)`."
  - Candidate lnRNA and RT length deltas shift the 2,000 bp window by
    symmetric prefix/suffix flank adjustment, preserving the constant
    interstitial between slots.
  - Reject arbitrary filler padding and any biological lnRNA or RT slot that
    cannot fit in the fixed context. Prefix/suffix flank trimming is allowed
    only when all required slots remain intact.
  - Reject missing forward or reverse-complement view declarations before Infer handoff.
  - Reject missing lnRNA or RT CDS slot span for anchor_mean pooling.
  - Reject anchor-mean views that do not declare which named slot supplies the
    sequence-view anchor bounds.
  - Reject lnRNA fixed-window views unless they use 384 bp pooling windows.
  - Reject RT CDS fixed-window views unless they use 1,600 bp pooling windows.
  - Treat working/failed lab-anchor names as source-history labels; Construct
    placement uses named slots.
