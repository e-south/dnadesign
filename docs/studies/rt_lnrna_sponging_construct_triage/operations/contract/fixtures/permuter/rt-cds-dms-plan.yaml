plan_id: rt_lnrna_sponging_construct_triage_rt_cds_dms_permuter_plan_v1
kind: permuter_rt_cds_dms_plan_v1
study_id: rt_lnrna_sponging_construct_triage
owner_boundary: study
execution_owner: study
variant_owner: permuter
construct_owner: construct
infer_owner: infer
base_construct_subject_id: rt_lnrna_pair__eco1_wt_rt__retron26_lnrna__tetO
source_dataset: rt_lnrna_sponging_construct_triage_construct_slot_inputs_v1
output_dataset: rt_lnrna_sponging_construct_triage_construct_contexts_2000bp_v1
permuter_request:
  request_type: CodingDnaDmsRequest
  ref_name_suffix: __rt_cds
  codon_table: ecoli
  codon_policy: top
  positions: all_rt_cds_codons
  max_variants:
  excluded_codon_positions: terminal_stop_or_codons_absent_from_codon_table
  expected_variant_count: 6080
  alternate_amino_acids: canonical_20_without_wildtype_at_each_position
  stop_codon_policy: never_generate_stop_codons
  codon_selection_rule: most_frequent_ecoli_codon_for_target_amino_acid
construct_subject_envelope:
  record_kind: construct_subject_envelope
  sequence_authority: overlay_only
  biological_sequence_fields:
    - construct_subject__lnrna_sequence
    - construct_subject__rt_cds_sequence
  semantic_identity: construct_subject__id
  usr_row_identity: canonical_sequence_id
construct_context:
  contract: dual_cassette_rt_lnrna_expression_v1
  representation_contract: dual_cassette_construct_context_embedding_v1
  context_id: dual_cassette_2000bp_context_v1
  required_slots:
    - lnrna
    - rt_cds
infer_handoff:
  source_owner: construct
  execution_owner: infer
  writeback_owner: infer
  feature_request_ref: rt-cds-dms-infer-handoff.yaml
  feature_bundle_ref: ../infer/evo2-7b-six-view-feature-bundle.yaml
  required_view_names:
    - dual_cassette_2000bp_seq_mean
    - dual_cassette_2000bp_reverse_complement_seq_mean
    - lnrna_fixed_384bp_window_in_construct_anchor_mean
    - lnrna_fixed_384bp_window_in_construct_reverse_complement_anchor_mean
    - rt_cds_fixed_1600bp_window_in_construct_anchor_mean
    - rt_cds_fixed_1600bp_window_in_construct_reverse_complement_anchor_mean
rejected_patterns:
  - permuter_writes_derived_infer
  - construct_subject_id_copied_to_usr_id
  - infer_selects_by_product_kind_only
  - rt_lnrna_semantics_added_to_permuter
