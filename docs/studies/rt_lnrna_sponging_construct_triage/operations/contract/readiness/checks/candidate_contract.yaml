id: candidate_contract
status: planned
owner: study
phase: phase_1_candidate_table
inputs:
  source_authority: repo:docs/studies/rt_lnrna_sponging_construct_triage/workbench/provenance/genbank-source-authority.yaml
  schema: repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/schemas/candidate-table.schema.yaml
  fixtures:
    - repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/fixtures/candidates/retron26-working-anchor.yaml
    - repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/fixtures/candidates/retron43-failed-anchor.yaml
rules:
  - Reject duplicate candidate_id values.
  - Reject unknown payload_program_id values.
  - Reject candidate core fields named perturbation_class, cloning_constraint_set, or representation_result.
  - Require sequence authorities to resolve through GenBank source authority or remain paired with explicit blockers.
  - Require USR candidate-envelope overlays to declare candidate__record_kind, candidate__sequence_authority, and candidate__biological_sequence_fields.
  - Require abundance_prior_overlay_ids and sponging_assay_observation_ids to remain separate.
