id: construct_subject_contract
status: planned
owner: study
phase: phase_1_construct_subject_table
inputs:
  source_authority: repo:docs/studies/rt_lnrna_sponging_construct_triage/workbench/provenance/genbank-source-authority.yaml
  schema: repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/schemas/construct-subject-table.schema.yaml
  fixtures:
    - repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/fixtures/construct-subjects/retron26-working-anchor.yaml
    - repo:docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/fixtures/construct-subjects/retron43-failed-anchor.yaml
rules:
  - Reject duplicate construct_subject_id values.
  - Reject unknown payload_program_id values.
  - Reject candidate core fields named perturbation_class, cloning_constraint_set, or representation_result.
  - Require sequence authorities to resolve through GenBank source authority or remain paired with explicit blockers.
  - Require USR construct-subject-envelope overlays to declare construct_subject__record_kind, construct_subject__sequence_authority, and construct_subject__biological_sequence_fields.
  - Require abundance_prior_overlay_ids and sponging_assay_observation_ids to remain separate.
