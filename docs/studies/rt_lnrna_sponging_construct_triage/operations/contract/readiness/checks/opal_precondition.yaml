checks:
  phase_7_opal_readiness:
    - kind: path_exists
      check_id: rt_lnrna.opal.selected_x_contract
      check_group: opal_precondition
      summary: OPAL requires one study-selected fixed-size X contract.
      required: true
      artifact: opal_selected_x_contract
    - kind: path_exists
      check_id: rt_lnrna.opal.label_projection_contract
      check_group: opal_precondition
      summary: OPAL requires a versioned study label projection with an ordered Y contract.
      required: true
      artifact: opal_label_projection_contract
    - kind: path_exists
      check_id: rt_lnrna.opal.comparable_profiles
      check_group: opal_precondition
      summary: OPAL requires comparable reporter-response profiles with supported biological-replicate uncertainty.
      required: true
      artifact: opal_comparable_profiles
    - kind: path_exists
      check_id: rt_lnrna.opal.objective_contract
      check_group: opal_precondition
      summary: OPAL requires a study-owned constrained objective contract.
      required: true
      artifact: opal_objective_contract
    - kind: path_exists
      check_id: rt_lnrna.opal.training_table
      check_group: opal_precondition
      summary: OPAL requires the joined study training table with admitted X and Y contracts.
      required: true
      artifact: opal_training_table
