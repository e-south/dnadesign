notes:
  - GenBank files are study-owned under workbench/provenance/genbank; do not rely on temporary transfer directories.
  - The 1,600 bp region GenBank is the target context authority; it maps to pES retron-26 [56,1656) in zero-based half-open coordinates.
  - The two tet operator features are required as primary plus complement placements.
  - Retron-179 is orientation evidence only; it is not a Phase 1 candidate source.
  - Left/right bases for retron26 and retron43 are derived from the adjacent flanking spans until explicit labels are added to those anchor GenBanks.
