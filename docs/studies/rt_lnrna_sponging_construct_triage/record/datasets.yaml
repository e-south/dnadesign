      - 20260529_retron_Eco1_26_43_177_186_benchmark
      - 20260705_retron_Eco1_26_195_196_180_199_200_197_198_benchmark
      - 20260720_retron_Eco1_26_180_201_202_203_204_benchmark
    notes: >-
      Reader-derived TF-sponging scalar labels from pES-retron plus
      pBbS2c-RFP experiments, materialized for LatentDNA GenBank overlays.
      Rows keep Reader assay subject identity separate from Construct subject
      identity; retron rows resolve through the
      variant GenBank catalog when explicit RT plus lnRNA sequence authority
      exists. The SPOP numeric scope is Reader experiment-normalized
      TF-sponging and is not comparable to Khan or Crawford abundance scales.
      Numeric scoring delegates to Reader's public score_spop_endpoint API.
      The 20251105 RT-variant Reader artifact is a single-point mid-log
      read recorded at artifact time 0 h but interpreted as approximately 10 h
      after seeding; the 20260507 retron176 wells are omitted because no actual
      strain was present. The 20260705 benchmark contributes retron195-200 plus
      retron26/retron180 observations and uses 200 nm aTc as its positive
      control condition. The 20260720 benchmark contributes retron201-204 plus
      repeat retron26/retron180 observations under the same positive-control
      convention.
