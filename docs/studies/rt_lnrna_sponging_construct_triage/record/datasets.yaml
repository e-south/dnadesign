  - role: construct_slot_inputs_usr_dataset
    owner_tool: study
    lifecycle: construct_materialization_input
    status: persistent_control_dataset_id
    dataset_id: rt_lnrna_sponging_construct_triage_construct_slot_inputs_v1
    path: src/dnadesign/usr/datasets/rt_lnrna_sponging_construct_triage_construct_slot_inputs_v1
    row_identity: usr_canonical_sequence_id
    semantic_identity: construct_subject__id
    notes: >-
      USR input dataset for Construct realization. Base row ids remain
      canonical sequence ids; the paired RT-lnRNA construct-subject id and slot
      sequences live in the construct_subject overlay. Construct-subject-envelope rows mark
      `construct_subject__sequence_authority=overlay_only`; consumers must read the
      fields named in `construct_subject__biological_sequence_fields` before treating a
      row as biological sequence authority.
    derived_lanes:
      - lane_id: registered_rt_lnrna_subjects
        owner_tool: study
        generator: dnadesign.studies.units.rt_lnrna_sponging_construct_triage.subject_bindings.load_resolved_registered_subject_bindings
        dependency_surface: docs/studies/rt_lnrna_sponging_construct_triage/workbench/provenance/subject_bindings/retron_subject_bindings_v1.yaml
        source_basis: rt_lnrna_subject_binding
        notes: >-
          Resolves independently available logical paired subjects and reports
          opaque provider-published RT parts as explicit byte blocks. Exact
          requests containing a blocked subject fail before writes. GenBank is
          component and placement provenance, not a second subject selector or
          fallback for private provider bytes.
      - lane_id: crawford_lnrna_msd_designs_fixed_wt_rt
        owner_tool: study
        generator: dnadesign.studies.units.rt_lnrna_sponging_construct_triage.source_promotions.resolve_source_construct_subject_promotions
        dependency_surface: dnadesign-data Crawford processed reference and abundance TSVs
        source_basis: crawford_eco1_lnrna_fixed_wt_rt
        notes: >-
          Promotes abundance-affiliated Crawford Eco1 lnRNA source sequences
          using fixed WT Eco1 RT. The gate requires an abundance-observation
          row, DNA4 sequence authority, Eco1 forward k-mer orientation QC, and
          reverse-complement rejection. Design-reference-only sequences remain
          source provenance and issue records. Exact MSD and short-flank
          matches are retained as QC annotations because abundance-bearing
          variants can intentionally alter those regions; duplicate source rows
          are retained as source-record counts and overlay provenance, not
          duplicate Construct subjects.
      - lane_id: khan_abundance_affiliated_rt_lnrna_reference
        owner_tool: study
        generator: dnadesign.studies.units.rt_lnrna_sponging_construct_triage.source_promotions.resolve_source_construct_subject_promotions
        dependency_surface: dnadesign-data Khan processed sequence-authority and abundance-prior TSVs
        source_basis: khan_abundance_affiliated_rt_lnrna_reference
        notes: >-
          Promotes only Khan rows with explicit source ncRNA sequence, source RT
          CDS DNA sequence, translation-exact RT CDS validation from the Mestre
          locus authority path, and an affiliated RT-DNA abundance prior. Rows
          that exceed the current fixed 2,000 bp Construct window remain blocked
          before Construct runtime.
      - lane_id: compiler_generated_msd_lnrna_variant
        owner_tool: study
        generator: dnadesign.studies.units.rt_lnrna_sponging_construct_triage.source_promotions.resolve_msd_compiler_promotions
        dependency_surface: docs/studies/rt_lnrna_sponging_construct_triage/operations/contract/fixtures/source-promotions/msd-compiler-pool.yaml
        source_basis: compiler_generated_msd_lnrna_variant
        notes: >-
          Compiles the YIU-compatible full combinatoric pool from five DE033
          Snapback cap ranks and sixteen scar-nick TetO stem-base ranks into
          5-prime to 3-prime MSD products, inserts their reverse complements
          into the retron26 template lnRNA after exact template MSD and flank
          checks, and pairs the generated lnRNA with fixed Eco1 WT RT. This
          lane is a study-owned sequence/design-reference source and does not
          create a pre-Infer concat.
      - lane_id: rt_cds_in_silico_dms
        owner_tool: study
        generator: dnadesign.studies.units.rt_lnrna_sponging_construct_triage.construct_materialization.materialize_rt_cds_dms_construct_contexts
        dependency_surface: dnadesign.permuter
        source_basis: in_silico_rt_cds_dms
        expected_overlay_columns:
          - construct_subject__record_kind
          - construct_subject__sequence_authority
          - construct_subject__biological_sequence_fields
          - construct_subject__study_id
          - construct_subject__construct_contract
          - construct_subject__representation_contract
          - construct_subject__payload_program_id
          - construct_subject__source_basis
          - construct_subject__variant_derivation
          - construct_subject__construct_projection_status
          - construct_subject__role
          - construct_subject__parent_id
          - construct_subject__dms_slot
          - construct_subject__permuter_request_id
          - construct_subject__permuter_variant_id
          - construct_subject__permuter_modifications
          - construct_subject__rt_cds_dms_aa_pos
          - construct_subject__rt_cds_dms_aa_wt
          - construct_subject__rt_cds_dms_aa_alt
          - construct_subject__rt_cds_dms_codon_index
          - construct_subject__rt_cds_dms_codon_wt
          - construct_subject__rt_cds_dms_codon_new
          - construct_subject__rt_cds_dms_codon_policy
        notes: >-
          Study-owned RT-CDS in silico DMS lane. It calls only the public
          `dnadesign.permuter` facade, then writes construct-slot input rows
          with explicit study, construct, representation, parent, and Permuter
          provenance in the construct_subject overlay.
